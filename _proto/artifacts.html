<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artifacts · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== Artifacts — 3-pane manager. Page-only styles, semantic tokens only ===== */
    .ar-wrap { container-type: inline-size; container-name: ar; height: 100%; }
    .ar { height: 100%; display: grid; grid-template-columns: 276px minmax(0, 1fr); position: relative; overflow: hidden; }
    .ar.meta-open { grid-template-columns: 276px minmax(0, 1fr) 300px; }
    .ph-c-initial { --ph: var(--phase-initial); --ph-fg: var(--brand-fg); }
    .ph-c-release { --ph: var(--phase-release); --ph-fg: var(--accent-purple); }
    .ph-c-sdlc { --ph: var(--phase-sdlc); --ph-fg: var(--accent-teal-fg); }

    /* ---- left list pane ---- */
    .lp { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--border-default); background: var(--bg-surface-2); }
    .lp-top { padding: var(--space-3) var(--space-3) 0; display: flex; flex-direction: column; gap: var(--space-3); background: var(--bg-surface); border-bottom: 1px solid var(--border-default); }
    .lp-actions { display: flex; gap: var(--space-2); }
    .lp-actions .btn { flex: 1; padding: 0 var(--space-2); }
    .lp .tabs { border-bottom: 0; gap: 0; margin: 0 -4px; }
    .lp .tab { flex: 1; justify-content: center; padding: 0 4px; font-size: 11.5px; white-space: nowrap; }
    .lp .tab .count { display: none; }
    .lp-list { flex: 1; overflow: auto; padding: var(--space-2) var(--space-2) var(--space-6); }
    .grp { margin-top: var(--space-2); }
    .grp-h { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; cursor: pointer; padding: 8px 8px 6px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); }
    .grp-h .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ph); }
    .grp-h .chev { margin-left: auto; transition: transform var(--dur-fast); }
    .grp.is-closed .chev { transform: rotate(-90deg); } .grp.is-closed .grp-items { display: none; }
    .grp-h .count { font-weight: var(--weight-medium); color: var(--fg-faint); }
    .it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent; background: none; cursor: pointer; padding: 8px; border-radius: var(--radius-md); }
    .it:hover { background: var(--bg-hover); }
    .it.is-active { background: var(--bg-surface); border-color: var(--border-default); box-shadow: var(--shadow-xs); }
    .it .file-tile { width: 28px; height: 28px; }
    .it .t { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); line-height: 1.3; }
    .it .s { font-size: var(--text-2xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .it.is-active .t { color: var(--brand-fg); }
    .it .new { margin-left: auto; }
    .st-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-faint); flex-shrink: 0; }
    .st-dot.approved { background: var(--success); } .st-dot.review { background: var(--warning); } .st-dot.draft { background: var(--fg-faint); }
    .src-it .file-tile { width: 34px; height: 34px; }
    .lp-sub { display: flex; align-items: center; gap: 8px; padding: 10px 8px 4px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); }
    .lp-sub span { font-weight: var(--weight-medium); color: var(--fg-faint); }
    .ar-empty { height: 100%; display: flex; align-items: center; justify-content: center; padding: var(--space-8); }
    .ar-empty .box { max-width: 460px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
    .ar-empty .rec { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); font-size: var(--text-sm); width: 100%; }
    .lp-empty { padding: var(--space-8) var(--space-4); text-align: center; color: var(--fg-subtle); font-size: var(--text-sm); }

    /* ---- center ---- */
    .cp { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-canvas); }
    .cp-head { padding: var(--space-3) var(--space-5) 0; border-bottom: 1px solid var(--border-default); background: var(--bg-surface); }
    .cp-title { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .cp-title .file-tile { width: 36px; height: 36px; }
    .cp-title h3 { font-size: var(--text-lg); line-height: 1.3; }
    .cp-sub { font-size: var(--text-xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .cp-tools { display: flex; align-items: center; gap: var(--space-2); padding: 10px 0; flex-wrap: wrap; }
    .cp-tools .sp { flex: 1; }
    .vbtn { gap: 6px; }
    .vbtn .by { color: var(--fg-subtle); font-weight: var(--weight-regular); }
    .ai-mark { color: var(--accent-purple); font-weight: var(--weight-semibold); }
    .cp-body { flex: 1; overflow: auto; min-height: 0; position: relative; }
    .banner { display: flex; align-items: center; gap: var(--space-3); padding: 8px var(--space-5); font-size: var(--text-xs); background: var(--warning-soft); border-bottom: 1px solid var(--border-subtle); color: var(--fg-default); }
    .banner.ai { background: var(--accent-purple-soft); }
    .banner .sp { flex: 1; }

    /* rendered document */
    .adoc { max-width: 780px; margin: 0 auto; padding: var(--space-8) var(--space-10) var(--space-16); font-size: 14px; line-height: 1.7; color: var(--fg-default); }
    .adoc h1 { font-size: 30px; margin-bottom: 6px; letter-spacing: -.02em; }
    .adoc h2 { font-size: 20px; margin: 32px 0 10px; padding-top: 4px; font-weight: var(--weight-semibold); }
    .adoc h3 { margin: 22px 0 6px; }
    .adoc p { margin: 0 0 12px; } .adoc ul, .adoc ol { margin: 0 0 14px; padding-left: 22px; } .adoc li { margin: 3px 0; }
    .adoc li::marker { color: var(--fg-faint); }
    .adoc code { font-size: 12px; padding: 1px 6px; border-radius: var(--radius-xs); background: var(--bg-surface-3); color: var(--fg-default); }
    .adoc .code { margin: 0 0 14px; }
    .adoc hr { margin: 24px 0; }
    .adoc .tbl { margin: 8px 0 18px; }
    .adoc table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); line-height: 1.5; }
    .adoc th { text-align: left; font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-subtle); background: var(--bg-surface-2); padding: 9px 12px; border-bottom: 1px solid var(--border-default); white-space: nowrap; }
    .adoc td { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
    .adoc tr:last-child td { border-bottom: 0; }
    .adoc td code { font-weight: var(--weight-medium); color: var(--brand-fg); background: var(--brand-soft); }
    .adoc .callout { display: flex; gap: 12px; padding: 12px 16px; margin: 0 0 16px; border-radius: var(--radius-md); border: 1px solid; font-size: var(--text-sm); line-height: 1.6; }
    .adoc .callout svg { margin-top: 2px; }
    .adoc .callout.note { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 25%, transparent); } .adoc .callout.note svg { color: var(--info-fg); }
    .adoc .callout.warning { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 30%, transparent); } .adoc .callout.warning svg { color: var(--warning-fg); }
    .adoc .callout.ai { background: linear-gradient(var(--bg-surface), var(--bg-surface)) padding-box, var(--gradient-ai) border-box; border-color: transparent; } .adoc .callout.ai svg { color: var(--accent-purple); }
    .adoc [data-src] { border-radius: var(--radius-xs); transition: background var(--dur-fast); cursor: text; }
    .adoc [data-src]:hover { background: var(--bg-hover); }
    .adoc .is-picked { background: var(--brand-soft) !important; box-shadow: 0 0 0 2px var(--brand-soft-2); }
    .adoc .ai-busy { background: linear-gradient(90deg, var(--accent-purple-soft), var(--brand-soft), var(--accent-purple-soft)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    .adoc .doc-lead { color: var(--fg-muted); }
    .c-mark { display: inline-flex; align-items: center; justify-content: center; gap: 3px; margin-left: 8px; height: 20px; min-width: 20px; padding: 0 6px; border-radius: 10px; border: 0; cursor: pointer; vertical-align: middle; font-size: 10px; font-weight: 600; background: var(--warning-soft); color: var(--warning-fg); }
    .c-mark svg { width: 11px; height: 11px; }
    .c-mark.done { background: var(--bg-surface-3); color: var(--fg-subtle); }
    .ai-suggest { margin: 4px 0 14px; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid transparent; font-size: var(--text-sm); line-height: 1.6;
      background: linear-gradient(var(--bg-surface), var(--bg-surface)) padding-box, var(--gradient-ai) border-box; box-shadow: var(--shadow-md); }
    .ai-suggest .k { display: flex; align-items: center; gap: 6px; font-size: var(--text-2xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-purple); margin-bottom: 6px; }
    .ai-suggest .old { color: var(--fg-subtle); text-decoration: line-through; margin-bottom: 4px; font-size: var(--text-xs); }
    .ai-suggest .new { color: var(--fg-strong); }
    .ai-suggest .acts { display: flex; gap: 6px; margin-top: 10px; }

    /* floating AI mini-toolbar */
    .ai-bar { position: fixed; z-index: var(--z-dropdown); display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: var(--radius-lg); background: var(--bg-inverse); color: var(--fg-inverse); box-shadow: var(--shadow-lg); animation: popIn var(--dur-fast) var(--ease-out); }
    .ai-bar button { height: 28px; padding: 0 9px; border: 0; border-radius: var(--radius-sm); background: transparent; color: inherit; font-size: var(--text-xs); font-weight: var(--weight-medium); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .ai-bar button:hover { background: color-mix(in srgb, var(--fg-inverse) 14%, transparent); }
    .ai-bar button.ask { background: var(--gradient-ai); color: #fff; }
    .ai-bar .sep { width: 1px; height: 16px; background: color-mix(in srgb, var(--fg-inverse) 22%, transparent); margin: 0 3px; }
    .ai-bar svg { width: 13px; height: 13px; }

    /* editor + diff */
    .md-edit { display: block; width: 100%; height: 100%; min-height: 100%; border: 0; resize: none; outline: none; padding: var(--space-6) var(--space-8); background: var(--bg-canvas); color: var(--fg-default); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.75; tab-size: 2; }
    .dv { padding: var(--space-5); max-width: 980px; margin: 0 auto; }
    .dv .diff { margin-top: var(--space-3); }
    .dv .diff-line { white-space: pre-wrap; word-break: break-word; }
    .dv .diff-line > span:nth-child(-n+2) { white-space: nowrap; }
    .dv .fold { padding: 4px 12px; color: var(--fg-subtle); background: var(--bg-surface-2); font-size: var(--text-xs); font-family: var(--font-sans); border-top: 1px dashed var(--border-subtle); border-bottom: 1px dashed var(--border-subtle); cursor: pointer; }
    .dv .fold:hover { color: var(--brand-fg); }
    .dv .sum { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); }
    .dv .sum .add { color: var(--success-fg); font-weight: 600; } .dv .sum .del { color: var(--danger-fg); font-weight: 600; }

    /* sources viewer */
    .sv { max-width: 820px; margin: 0 auto; padding: var(--space-6) var(--space-8) var(--space-12); }
    .sv-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-5); }
    .sv-meta > div { padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface-2); }
    .sv-meta .l { font-size: var(--text-2xs); color: var(--fg-subtle); } .sv-meta .v { font-size: var(--text-sm); font-weight: 500; color: var(--fg-strong); }
    .page { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-8); font-size: var(--text-sm); line-height: 1.7; color: var(--fg-default); }
    .page h4 { margin-bottom: 8px; }
    .tx { display: grid; grid-template-columns: 52px 92px minmax(0, 1fr); gap: 4px 12px; font-size: var(--text-sm); }
    .tx .ts { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-subtle); padding-top: 2px; } .tx .sp { font-weight: 600; color: var(--fg-strong); }
    .wave { display: flex; align-items: center; gap: 2px; height: 56px; padding: 0 var(--space-4); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); margin-bottom: var(--space-4); }
    .wave i { flex: 1; background: var(--accent-magenta); border-radius: 2px; opacity: .75; min-width: 2px; }
    .wave i.p { background: var(--border-strong); }

    /* meta pane */
    .meta { display: none; flex-direction: column; min-height: 0; border-left: 1px solid var(--border-default); background: var(--bg-surface); overflow: auto; }
    .ar.meta-open .meta { display: flex; }
    .m-sec { padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .m-h { display: flex; align-items: center; justify-content: space-between; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); margin-bottom: var(--space-2); }
    .m-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--fg-default); text-decoration: none !important; cursor: pointer; border: 0; background: none; width: calc(100% + 16px); text-align: left; }
    .m-row:hover { background: var(--bg-hover); }
    .m-row .file-tile { width: 26px; height: 26px; }
    .m-row .s { font-size: var(--text-2xs); color: var(--fg-subtle); }
    .m-empty { font-size: var(--text-xs); color: var(--fg-faint); padding: 4px 0; }
    .hist { list-style: none; padding: 0; margin: 0; }
    .hist li { position: relative; padding: 0 0 14px 22px; cursor: pointer; }
    .hist li::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: -6px; width: 2px; background: var(--border-default); }
    .hist li:last-child::before { display: none; }
    .hist li::after { content: ""; position: absolute; left: 0; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg-surface); border: 2px solid var(--border-strong); }
    .hist li.cur::after { border-color: var(--brand); background: var(--brand); }
    .hist li.ai::after { border-color: var(--accent-purple); }
    .hist li.ai.cur::after { background: var(--accent-purple); }
    .hist .t { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .hist .s { font-size: var(--text-xs); color: var(--fg-subtle); }
    .cm { padding: 8px 10px; border-radius: var(--radius-md); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); font-size: var(--text-xs); margin-bottom: 6px; }
    .cm b { color: var(--fg-strong); } .cm q { display: block; margin-top: 2px; color: var(--fg-muted); quotes: none; }
    .tone-1 { background: var(--gradient-brand); } .tone-2 { background: var(--accent-purple); } .tone-3 { background: var(--accent-magenta); } .tone-4 { background: var(--accent-teal); color: var(--gray-900); } .tone-ai { background: var(--gradient-ai); }
    .avatar.xs { width: 22px; height: 22px; font-size: 9px; border-width: 1.5px; }

    /* modals */
    .tpl-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); }
    .tpl { text-align: left; padding: 10px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .tpl:hover { border-color: var(--border-strong); background: var(--bg-surface-2); }
    .tpl.is-on { border-color: var(--brand); background: var(--brand-soft); box-shadow: var(--shadow-focus); }
    .tpl .n { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .tpl .d { font-size: var(--text-2xs); color: var(--fg-subtle); line-height: 1.4; }
    .tpl .file-tile { width: 26px; height: 26px; }
    .chk-list { display: flex; flex-direction: column; border: 1px solid var(--border-default); border-radius: var(--radius-md); max-height: 150px; overflow: auto; }
    .chk-list label { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: var(--text-sm); cursor: pointer; border-bottom: 1px solid var(--border-subtle); }
    .chk-list label:last-child { border-bottom: 0; } .chk-list label:hover { background: var(--bg-hover); }
    .gen-steps { list-style: none; padding: 0; margin: var(--space-4) 0 0; display: flex; flex-direction: column; gap: 10px; }
    .gen-steps li { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); color: var(--fg-subtle); }
    .gen-steps li.done { color: var(--fg-default); } .gen-steps li.done svg { color: var(--success); } .gen-steps li.cur { color: var(--fg-strong); font-weight: 500; }
    .gen-steps .ic { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }
    .up-file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface-2); font-size: var(--text-sm); margin-top: 8px; }

    /* container-driven responsiveness: assistant panel is open by default so canvas is often < 1100px */
    @container ar (max-width: 1100px) {
      .ar.meta-open { grid-template-columns: 276px minmax(0, 1fr); }
      .meta { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; z-index: 5; box-shadow: var(--shadow-lg); }
    }
    @container ar (max-width: 820px) {
      .ar, .ar.meta-open { grid-template-columns: 236px minmax(0, 1fr); }
      .adoc { padding: var(--space-6) var(--space-5) var(--space-12); }
      .btn-lbl { display: none; }
      .sv-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) { .tpl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body data-page="artifacts" data-shell="project" data-crumb="nav.artifacts">
  <main class="canvas"><div class="canvas-inner flush">
    <div class="ar-wrap"><div class="ar meta-open" id="ar">

        <div class="lp-top">

          <div class="input-group"><i data-lucide="search"></i><input class="input" id="lp-q" data-i18n-placeholder="ar.search" style="height:32px"></div>

      </aside>
      <section class="cp" id="cp"></section>
      <aside class="meta" id="meta"></aside>
    </div></div>
  </div></main>

        'ar.st.draft': 'Draft', 'ar.st.review': 'In review', 'ar.st.approved': 'Approved', 'ar.status': 'Status',
        'ar.mode.preview': 'Preview', 'ar.mode.edit': 'Edit markdown', 'ar.mode.diff': 'Diff vs previous',
        'ar.version': 'Version', 'ar.versions': 'Version history', 'ar.latest': 'latest', 'ar.by': 'by', 'ar.assistant': 'Assistant',
        'ar.export': 'Export', 'ar.export.docx': 'Word (.docx)', 'ar.export.pdf': 'PDF (.pdf)', 'ar.export.md': 'Markdown (.md)', 'ar.export.pptx': 'PowerPoint (.pptx)', 'ar.export.html': 'HTML (.html)',

      const words = md => (md.replace(/[#>*|`\-\[\]!]/g, ' ').match(/\S+/g) || []).length;

      /* ================= markdown ================= */
      const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
      const CALL = { NOTE: 'info', WARNING: 'triangle-alert', AI: 'sparkles' };

      }
      function renderMd(md) {
        const lines = md.replace(/\r/g, '').split('\n'); let out = '', i = 0;
        const src = s => ` data-src="${esc(s)}"`;
        while (i < lines.length) {
          const ln = lines[i];
          if (!ln.trim()) { i++; continue; }
          if (ln.startsWith('```')) { let j = i + 1, buf = []; while (j < lines.length && !lines[j].startsWith('```')) buf.push(lines[j++]); out += `<pre class="code">${esc(buf.join('\n'))}</pre>`; i = j + 1; continue; }
          let m;
          if ((m = ln.match(/^(#{1,3}) (.*)$/))) { out += `<h${m[1].length}${m[1].length > 1 ? src(m[2]) : ''}>${inl(m[2])}</h${m[1].length}>`; i++; continue; }
          if (/^---+$/.test(ln.trim())) { out += '<hr>'; i++; continue; }
          if (ln.startsWith('>')) { let j = i, buf = []; while (j < lines.length && lines[j].startsWith('>')) buf.push(lines[j++].replace(/^>\s?/, '')); let txt = buf.join(' '), kind = 'note'; const t = txt.match(/^\[!(\w+)\]\s*/); if (t) { kind = t[1].toLowerCase(); txt = txt.slice(t[0].length); } out += `<div class="callout ${kind}"><i data-lucide="${CALL[kind.toUpperCase()] || 'info'}"></i><div data-src="${esc(txt)}">${inl(txt)}</div></div>`; i = j; continue; }
          if (ln.startsWith('|')) {
            let j = i, rows = []; while (j < lines.length && lines[j].startsWith('|')) rows.push(lines[j++]);
            const split = r => r.replace(/^\||\|$/g, '').split('|');
            const head = split(rows[0]), body = rows.slice(2).map(split);
            out += `<div class="tbl table-wrap"><table><thead><tr>${head.map(c => `<th>${esc(c.trim())}</th>`).join('')}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td${c.trim().length > 14 ? src(c.trim()) : ''}>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; i = j; continue;
          }
          if (/^- /.test(ln)) { let j = i, it = []; while (j < lines.length && /^- /.test(lines[j])) it.push(lines[j++].slice(2)); out += '<ul>' + it.map(t => `<li${src(t)}>${inl(t)}</li>`).join('') + '</ul>'; i = j; continue; }
          let j = i, buf = []; while (j < lines.length && lines[j].trim() && !/^(#{1,3} |>|\||- |```)/.test(lines[j])) buf.push(lines[j++]); if (!buf.length) buf.push(lines[j++]);
          // first paragraph right after the H1 is the lead
          const lead = out.startsWith('<h1') && out.indexOf('<p') < 0;
          buf.forEach(t => { out += `<p${lead ? ' class="doc-lead"' : ''}${src(t)}>${inl(t)}</p>`; }); i = j;

      /* ================= diff ================= */
      function lineDiff(a, b) {
        const x = a.split('\n'), y = b.split('\n'), n = x.length, m = y.length;
        const dp = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
        for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        const out = []; let i = 0, j = 0;
        while (i < n && j < m) { if (x[i] === y[j]) { out.push({ t: ' ', s: x[i], a: i + 1, b: j + 1 }); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: '-', s: x[i], a: i + 1 }); i++; } else { out.push({ t: '+', s: y[j], b: j + 1 }); j++; } }
        while (i < n) { out.push({ t: '-', s: x[i], a: i + 1 }); i++; } while (j < m) { out.push({ t: '+', s: y[j], b: j + 1 }); j++; }
        return out;
      }
      function renderDiff(a) {
        const vi = verIdx(a); if (vi === 0) return `<div class="empty"><div class="empty-icon"><i data-lucide="git-compare"></i></div><div>${PC.t('ar.diff.none')}</div></div>`;
        const d = lineDiff(a.vers[vi - 1].md, mdOf(a)); const add = d.filter(l => l.t === '+').length, del = d.filter(l => l.t === '-').length;

        let html = '', k = 0;
        while (k < d.length) {
          if (d[k].t === ' ') { let e = k; while (e < d.length && d[e].t === ' ') e++; const run = d.slice(k, e), first = k === 0, last = e === d.length;
            const keepHead = first ? 0 : 2, keepTail = last ? 0 : 2;
            if (run.length > keepHead + keepTail + 3) { run.slice(0, keepHead).forEach(l => html += dl(l)); html += `<div class="fold" data-fold="${esc(JSON.stringify(run.slice(keepHead, run.length - keepTail).map(l => [l.a, l.b, l.s])))}"><i data-lucide="unfold-vertical" class="icon-sm" style="display:inline;vertical-align:-3px"></i> ${PC.t('ar.diff.fold', { n: run.length - keepHead - keepTail })}</div>`; run.slice(run.length - keepTail).forEach(l => html += dl(l)); }
            else run.forEach(l => html += dl(l));
            k = e; } else { html += dl(d[k]); k++; }

        return `<div class="dv"><div class="sum"><b>${PC.t('ar.diff.title', { b: vi, a: vi + 1 })}</b><span class="add">+${add}</span><span class="del">−${del}</span><span class="text-subtle">· ${byLine(a.vers[vi].who)}</span></div><div class="diff">${html}</div></div>`;

      /* ================= LEFT LIST ================= */

        $$('.fold', $('#cp-body')).forEach(f => f.onclick = () => { const rows = JSON.parse(f.dataset.fold); f.outerHTML = rows.map(r => `<div class="diff-line"><span>${r[0] || ''}</span><span>${r[1] || ''}</span><span>  ${esc(r[2])}</span></div>`).join(''); });
        const doc = $('#doc'); if (doc) bindDoc(a, doc);
      }
      function captureEdit(a) { const ed = $('#md-edit'); if (ed && verIdx(a) === a.vers.length - 1) { if (ed.value !== a.vers[a.vers.length - 1].md) state.draft[a.id] = ed.value; else delete state.draft[a.id]; } }

      /* ---- inline AI affordances ---- */
      let bar = null, picked = null;
      function closeBar() { if (bar) { bar.remove(); bar = null; } if (picked) { picked.classList.remove('is-picked'); picked = null; } }
      function showBar(rect, target, text) {
        closeBar(); picked = target; if (target) target.classList.add('is-picked');
        bar = PC.h(`<div class="ai-bar"><button class="ask" data-a="ask"><i data-lucide="sparkles"></i>${PC.t('ar.ai.ask')}</button><button data-a="rewrite"><i data-lucide="pen-line"></i>${PC.t('ar.ai.rewrite')}</button><button data-a="expand"><i data-lucide="maximize-2"></i>${PC.t('ar.ai.expand')}</button><span class="sep"></span><button data-a="comment"><i data-lucide="message-square-plus"></i>${PC.t('ar.ai.comment')}</button></div>`);
        document.body.appendChild(bar); PC.refresh(bar);
        const w = bar.offsetWidth; bar.style.left = Math.max(8, Math.min(innerWidth - w - 8, rect.left + rect.width / 2 - w / 2)) + 'px'; bar.style.top = Math.max(52, rect.top - 44) + 'px';
        bar.onmousedown = e => e.preventDefault();
        bar.onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; const act = b.dataset.a, tg = target, tx = text; closeBar(); aiAction(act, tg, tx); };
      }
      function bindDoc(a, doc) {
        const latest = verIdx(a) === a.vers.length - 1;
        doc.addEventListener('mouseup', e => {
          if (e.target.closest('.c-mark, .ai-suggest, button')) return;
          setTimeout(() => {
            const sel = getSelection(); const blk = e.target.closest('[data-src]');
            if (sel && !sel.isCollapsed && doc.contains(sel.anchorNode) && sel.toString().trim().length > 2) { const r = sel.getRangeAt(0).getBoundingClientRect(); showBar(r, blk, sel.toString()); }
            else if (blk && latest) showBar(blk.getBoundingClientRect(), blk, blk.textContent);
            else closeBar();
          }, 0);
        });
        doc.addEventListener('click', e => { const m = e.target.closest('[data-cm]'); if (m) openComment(a, m); });
        $('#cp-body').addEventListener('scroll', closeBar, { passive: true });
      }
      document.addEventListener('mousedown', e => { if (bar && !bar.contains(e.target) && !e.target.closest('#doc')) closeBar(); });

      const REWRITES = [[/\bshould be able to\b/gi, 'must be able to'], [/\bshould\b/g, 'must'], [/\bvery easy to use\b/gi, 'usable by a first-time merchant owner without training'], [/\bvery\b ?/gi, ''], [/\bin order to\b/gi, 'to'], [/\bquickly\b/gi, 'within the agreed latency target'], [/\bhighly available\b/gi, 'available 99.9% of the time'], [/\bstay(s)? below\b/gi, 'is kept under']];
      function fakeRewrite(s) { let o = s; REWRITES.forEach(([r, t]) => { o = o.replace(r, t); }); if (o === s) o = s.replace(/^(The |A )/, '').replace(/^./, c => c.toUpperCase()).replace(/\.$/, '') + ', with an accountable owner and a measurable target.'; return o; }
      function fakeExpand(s) { return s.replace(/\.$/, '') + '. This applies to every merchant tier, is traceable to a test scenario in the test strategy, and any exception needs product-owner approval.'; }
      function aiAction(act, target, text) {
        const a = cur(); const q = (text || '').trim();
        if (act === 'ask') return askAI(PC.t('ar.ai.quote', { q: q.length > 90 ? q.slice(0, 90) + '…' : q }), '<p>' + PC.t('ar.ai.reply') + '</p>');
        if (act === 'comment') { PC.toast(PC.t('ar.ai.comment.added'), { icon: 'message-square-plus' }); return; }
        if (!target) return; const raw = target.dataset.src;
        target.classList.add('ai-busy');
        setTimeout(() => {
          target.classList.remove('ai-busy');
          const nw = act === 'rewrite' ? fakeRewrite(raw) : fakeExpand(raw);
          const box = PC.h(`<div class="ai-suggest"><div class="k"><i data-lucide="sparkles" class="icon-sm"></i>${PC.t('ar.ai.suggest.' + act)}</div><div class="old">${inl(raw)}</div><div class="new">${inl(nw)}</div>
            <div class="acts"><button class="btn btn-primary btn-sm" data-s="ok"><i data-lucide="check" class="icon-sm"></i>${PC.t('ar.ai.accept')}</button><button class="btn btn-ghost btn-sm" data-s="no">${PC.t('ar.ai.discard')}</button><button class="btn btn-ghost btn-sm" data-s="again"><i data-lucide="rotate-ccw" class="icon-sm"></i>${PC.t('ar.ai.retry')}</button></div></div>`);
          const anchor = target.closest('tr') ? target.closest('.tbl') : (target.closest('li') ? target.closest('ul') : (target.closest('.callout') || target));
          anchor.insertAdjacentElement('afterend', box); PC.refresh(box);
          box.onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; if (b.dataset.s === 'again') { box.remove(); aiAction(act, target, text); return; }
            box.remove(); if (b.dataset.s === 'ok') { const md = mdOf(a); if (md.includes(raw)) { state.draft[a.id] = md.replace(raw, () => nw); PC.toast(PC.t('ar.ai.applied'), { icon: 'sparkles' }); renderCenter(); } } };
        }, 1100);
      }
      function openComment(a, btn) {
        const c = a.cm[+btn.dataset.cm];
        const pop = PC.popover(btn, `<div style="width:270px;padding:6px 8px 8px"><div class="row gap-2" style="margin-bottom:6px">${av(c.who, 'xs')}<b class="text-sm">${who(c.who)}</b></div><div class="text-sm" style="line-height:1.55">${esc(c.t)}</div>
          <div class="row gap-2" style="margin-top:10px"><button class="btn btn-secondary btn-sm" data-v="reply"><i data-lucide="reply" class="icon-sm"></i>${PC.t('ar.ai.ask')}</button><button class="btn btn-soft btn-sm" data-v="resolve"><i data-lucide="check" class="icon-sm"></i>${PC.t('ar.comment.resolve')}</button></div></div>`, v => {
          if (v === 'resolve') { c.done = true; PC.toast(PC.t('ar.comment.resolved')); renderAll(); }
          else askAI(c.t, '<p>' + PC.t('ar.ai.reply') + '</p>');
        });
      }

      function askAI(userText, replyHtml) {
        const AS = PC.assistant, d = new Date(), time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        AS.open(); AS.msgsLocked = true; if (!AS.msgs) AS.msgs = [];

        AS.reply(replyHtml || '<p>' + PC.t('ar.as.reply.sg') + '</p>', { time, tool: 'claude -p ' + PC.cliFlags('claude') });
      }
      function exportAs(a, f) {

      /* ---- sources viewer ---- */
      function renderSource() {

        const kindLabel = { pdf: 'PDF', doc: 'DOCX', sheet: 'XLSX', audio: 'Audio (m4a)', md: 'Markdown', transcript: 'Transcript (VTT)', image: 'Image (PNG)' }[s.kind] || s.kind;
        let pv = '';
        if (s.pv.type === 'text') pv = `<div class="page"><h4>${PC.t('ar.src.extracted')}</h4>${s.pv.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
        else if (s.pv.type === 'sheet') pv = `<div class="page"><h4>${PC.t('ar.src.sheet')}</h4><div class="table-wrap"><table class="table"><thead><tr>${s.pv.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${s.pv.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
        else pv = `${s.kind === 'audio' ? `<div class="wave">${Array.from({ length: 84 }, (_, i) => `<i class="${i < 22 ? '' : 'p'}" style="height:${12 + Math.abs(Math.sin(i * 1.7) * 30 + Math.cos(i * .6) * 12)}px"></i>`).join('')}</div>` : ''}<div class="page"><h4>${PC.t('ar.src.transcript')}</h4><div class="tx">${s.pv.lines.map(l => `<span class="ts">${l[0]}</span><span class="sp">${l[1]}</span><span>${esc(l[2])}</span>`).join('')}</div></div>`;
        cp.innerHTML = `<div class="cp-head" style="padding-bottom:var(--space-3)"><div class="row between gap-3"><div class="cp-title"><span class="file-tile ${KIND_TILE[s.kind] || ''}"><i data-lucide="${s.icon}"></i></span><div class="grow" style="min-width:0"><h3 class="truncate">${esc(s.name)}</h3><div class="cp-sub"><span>${kindLabel}</span><span class="text-faint">·</span><span>${s.kind === 'audio' || s.kind === 'transcript' ? PC.t('ar.src.min', { n: s.meta }) : s.kind === 'image' ? '—' : PC.t('ar.src.pages', { n: s.meta })}</span></div></div></div>

          <div class="cp-body"><div class="sv"><div class="sv-meta"><div><div class="l">${PC.t('ar.src.type')}</div><div class="v">${kindLabel}</div></div><div><div class="l">${PC.t('ar.src.size')}</div><div class="v">${s.size}</div></div><div><div class="l">${PC.t('ar.src.uploaded')}</div><div class="v">${longDate(s.date)} · ${esc(who(s.by))}</div></div><div><div class="l">${PC.t('ar.src.status')}</div><div class="v">${s.indexing ? PC.t('ar.indexing') : '<span class="text-success">● ' + PC.t('ar.indexed') + '</span>'}</div></div></div>

        $('#s-re').onclick = () => { PC.toast(PC.t('ar.src.reindexing', { n: esc(s.name) }), { icon: 'refresh-cw' }); };
        $('#s-gen').onclick = () => openGenerate(s.id);

        } else {
          const a = cur();
          if (!a) { el.innerHTML = `<div class="m-sec"><div class="m-h">${PC.t('ar.meta.type')}</div><div class="m-empty">${PC.t('ar.empty.meta')}</div></div>`; PC.refresh(el); return; }
          const vi = verIdx(a);

          </div>
          <div id="g-run" class="hidden"><div class="row gap-3"><span class="spinner" id="g-spin"></span><b id="g-run-t"></b></div><div class="progress progress-ai" style="margin-top:14px"><span id="g-bar" style="width:4%"></span></div><ul class="gen-steps" id="g-steps"></ul></div>`,
          actions: [{ label: PC.t('common.cancel'), kind: 'ghost' }, { label: PC.t('ar.gen.go'), kind: 'ai', icon: 'sparkles', onClick: ov => { run(ov); return false; } }] });
        const ov = m.el, title = $('#g-title', ov);
        const setTitle = () => { title.value = PC.t('ar.tpl.' + tpl.id) + ' – ' + PNAME; };
        setTitle();
        $('#g-tpls', ov).onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tpl = TPL.find(t => t.id === b.dataset.t); $$('.tpl', ov).forEach(x => x.classList.toggle('is-on', x === b)); setTitle(); };
        function run(ov) {
          const picked = $$('#g-src input:checked', ov).map(i => i.value), cliId = $('#g-cli', ov).value, c = cli.find(x => x.id === cliId), name = title.value.trim() || tpl.name;
          $('#g-setup', ov).classList.add('hidden'); $('#g-run', ov).classList.remove('hidden'); $$('.modal-footer .btn', ov).forEach(b => b.disabled = true);
          $('#g-run-t', ov).textContent = PC.t('ar.gen.running', { cli: c.name });
          const steps = [PC.t('ar.gen.s1', { n: picked.length }), PC.t('ar.gen.s2'), PC.t('ar.gen.s3'), PC.t('ar.gen.s4'), PC.t('ar.gen.s5')];
          const ul = $('#g-steps', ov); let i = 0;
          const draw = () => { ul.innerHTML = steps.map((s, k) => `<li class="${k < i ? 'done' : k === i ? 'cur' : ''}"><span class="ic">${k < i ? '<i data-lucide="check-circle-2"></i>' : k === i ? '<span class="spinner" style="width:14px;height:14px"></span>' : '<i data-lucide="circle" style="color:var(--fg-faint)"></i>'}</span>${s}</li>`).join(''); PC.refresh(ul); $('#g-bar', ov).style.width = Math.round((i + .4) / steps.length * 100) + '%'; };
          draw();
          const t = setInterval(() => { i++; if (i >= steps.length) { clearInterval(t); $('#g-bar', ov).style.width = '100%'; finish(); } else draw(); }, 850);
          function finish() {
            const id = 'gen-' + (++state.genSeq);
            const secs = tpl.secs.map((h, k) => S(h, k === tpl.secs.length - 1 ? '- ' + (PC.lang === 'vi' ? 'Cần người phụ trách xác nhận nội dung này' : 'To be confirmed by the document owner') + '\n- ' + (PC.lang === 'vi' ? 'Bổ sung số liệu từ nguồn đã chọn' : 'Add figures from the selected sources') : (PC.lang === 'vi' ? 'Nội dung phần “' + h + '” được soạn từ ' + picked.length + ' nguồn đã chọn; vui lòng rà soát.' : 'Draft content for “' + h + '” compiled from ' + picked.length + ' selected sources. Please review.')));
            const flat = secs.map(s => ({ h: s.h, items: s.items.join('\n').split('\n') }));
            const md = buildMd(name, `> [!AI] ${PC.t('ar.gen.note', { cli: c.name, model: c.model, n: picked.length })}`, flat, 0);
            const a = { id, ph: tpl.ph, icon: tpl.icon, st: 'draft', title: name, src: picked.filter(x => srcById(x)), tasks: [], fresh: true, cm: [], vers: [{ v: 1, who: 'AI', date: 'now', note: 'Generated with ' + c.name + ' (' + c.model + ')', md }] };
            ART.push(a); picked.forEach(sid => { const s = srcById(sid); if (s) s.used.push(id); });
            setTimeout(() => { m.close(); state.tab = 'artifacts'; state.q = ''; $('#lp-q').value = ''; state.closed[a.ph] = false; state.sel = id; state.ver = null; state.mode = 'preview'; renderAll(); PC.toast(PC.t('ar.gen.done', { t: esc(name) }), { icon: 'sparkles', tone: 'success' }); try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// */ } }, 500);
          }
        }
      }

      /* ================= boot ================= */
      PC.onReady(() => {
        const h = location.hash.slice(1); if (h && byId(h)) state.sel = h;
        $('#lp-list').onclick = e => {
          const g = e.target.closest('[data-grp]'); if (g) { state.closed[g.dataset.grp] = !state.closed[g.dataset.grp]; renderList(); return; }
          const it = e.target.closest('[data-id]'); if (it) return selectArt(it.dataset.id);
          const fb = e.target.closest('[data-first]'); if (fb) return openGenerate(SRC.length ? SRC[SRC.length - 1].id : null, 'notes');
          const sr = e.target.closest('[data-src-id]'); if (sr) selectSource(sr.dataset.srcId);
        };
        $$('.lp .tab').forEach(t => t.onclick = () => { if (state.mode === 'edit' && state.tab === 'artifacts') captureEdit(cur()); state.tab = t.dataset.tab; state.q = ''; $('#lp-q').value = ''; renderAll(); });
        $('#lp-q').oninput = e => { state.q = e.target.value; renderList(); };
        $('#btn-upload').onclick = openUpload; $('#btn-gen').onclick = () => openGenerate();
        // wide canvas: meta pane open by default; narrow: drawer starts closed
        const wrap = $('.ar-wrap'); let wasNarrow = null;
        const fit = () => { const narrow = wrap.clientWidth <= 1100; if (narrow !== wasNarrow) { wasNarrow = narrow; state.meta = !narrow; $('#ar').classList.toggle('meta-open', state.meta); } };
        fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
        renderAll();
      });
      window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && byId(h) && h !== state.sel) selectArt(h, true); });
      document.addEventListener('pc:lang', () => { closeBar(); renderAll(); });
    })();
  </script>
</body>
</html>
