<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== Assistant (full page) — page-only styles, semantic tokens only ===== */
    .ac-wrap { container-type: inline-size; container-name: ac; height: 100%; }
    .ac { height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .ac > .conv { flex: 1; }

    .cli-b { height: 17px; padding: 0 5px; border-radius: var(--radius-xs); font-size: 9.5px; font-weight: var(--weight-semibold); display: inline-flex; align-items: center; background: none; border: 1px solid var(--border-default); color: var(--fg-muted); white-space: nowrap; }

    /* ---- conversation ---- */
    .conv { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-surface); position: relative; }
    .conv-head { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-5); border-bottom: 1px solid var(--border-default); background: var(--bg-surface); }
    .conv-head h3 { font-size: var(--text-md); }
    .conv-head .sub { font-size: var(--text-xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .conv-head .sub .phase-chip { height: 18px; font-size: 9px; }
    .thread { flex: 1; overflow: auto; min-height: 0; scroll-behavior: smooth; }
    .t-in { max-width: 760px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-4); display: flex; flex-direction: column; gap: var(--space-6); }
    .m { display: flex; gap: 12px; min-width: 0; }
    .m .avatar { width: 28px; height: 28px; margin-top: 2px; }
    .m-body { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; }
    .m-meta { display: flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--fg-faint); margin-bottom: 4px; }
    .m-meta b { color: var(--fg-strong); font-size: var(--text-sm); font-weight: var(--weight-semibold); }
    .m.user { justify-content: flex-end; }
    .m.user .m-body { flex: 0 1 auto; max-width: 86%; }
    .m.user .bubble { background: var(--bg-surface-2); border: 1px solid var(--border-default); color: var(--fg-default); border-radius: var(--radius-lg); padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
    .m.user .m-meta { justify-content: flex-end; }
    .u-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; justify-content: flex-end; }
    .md p { margin: 0 0 10px; } .md p:last-child { margin-bottom: 0; }
    .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; } .md li::marker { color: var(--fg-faint); }
    .md code { font-size: 12px; padding: 1px 6px; border-radius: var(--radius-xs); background: var(--bg-surface-3); }
    .md table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); margin: 4px 0 12px; border: 1px solid var(--border-default); display: table; }
    .md th { text-align: left; font-size: var(--text-xs); font-weight: 500; color: var(--fg-subtle); background: var(--bg-surface-2); padding: 8px 12px; border-bottom: 1px solid var(--border-default); }
    .md td { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); } .md tr:last-child td { border-bottom: 0; }
    .md h4 { margin: 14px 0 6px; }
    .caret::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--brand); border-radius: 1px; animation: caretb 1s steps(2) infinite; }
    @keyframes caretb { 50% { opacity: 0; } }
    .m-acts { display: flex; gap: 2px; margin-top: 8px; }
    .m-acts .btn { color: var(--fg-faint); }

    /* blocks */
    .blk { margin: 10px 0; }
    .tool { border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); overflow: hidden; }
    .tool-h { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 8px 12px; cursor: pointer; text-align: left; font-size: var(--text-xs); color: var(--fg-muted); }
    .tool-h:hover { background: var(--bg-hover); }
    .tool-h .l { font-weight: var(--weight-semibold); color: var(--fg-default); white-space: nowrap; }
    .tool-h code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--fg-subtle); background: none; padding: 0; }
    .tool-h .st { display: inline-flex; align-items: center; gap: 5px; color: var(--success-fg); font-weight: 500; white-space: nowrap; }
    .tool-h .chev { transition: transform var(--dur-fast); } .tool.is-open .chev { transform: rotate(180deg); }
    .tool-b { display: none; padding: 0 10px 10px; } .tool.is-open .tool-b { display: block; }
    .tool-b .terminal { white-space: pre-wrap; word-break: break-all; font-size: 11.5px; }
    .cites { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cites .lbl { font-size: var(--text-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); margin-right: 2px; }
    .cite { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 7px 0 6px; border-radius: var(--radius-xs); border: 1px solid var(--border-default); background: var(--bg-surface); font-size: var(--text-xs); color: var(--fg-muted); text-decoration: none !important; max-width: 100%; }
    .cite:hover { border-color: var(--brand); color: var(--brand-fg); }
    .cite svg { width: 12px; height: 12px; } .cite b { font-weight: 500; color: var(--fg-default); } .cite:hover b { color: inherit; }
    .acard { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); }
    /* plain glyphs, no colored icon tiles (rule 5) */
    .ac .file-tile, .cmp-menu .file-tile { background: none !important; border: 0 !important; color: var(--fg-subtle) !important; width: 18px; height: 18px; border-radius: 0; flex-shrink: 0; }
    .acard .t { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.35; }
    .acard .s { font-size: var(--text-xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .acard .acts { display: flex; gap: 6px; flex-shrink: 0; }
    .dif .diff { font-size: 11.5px; } .dif .diff-line { white-space: pre-wrap; word-break: break-word; grid-template-columns: 34px 34px 1fr; }
    .dif .diff-line > span:nth-child(-n+2) { white-space: nowrap; }
    .plan { border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); overflow: hidden; }
    .plan-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .plan-h .progress { width: 80px; margin-left: auto; height: 5px; } .plan-h .n { font-size: var(--text-xs); color: var(--fg-subtle); font-weight: 500; font-variant-numeric: tabular-nums; }
    .plan-i { display: flex; align-items: flex-start; gap: 10px; padding: 8px 14px; font-size: var(--text-sm); cursor: pointer; }
    .plan-i + .plan-i { border-top: 1px solid var(--border-subtle); }
    .plan-i:hover { background: var(--bg-hover); }
    .plan-i input { margin-top: 3px; accent-color: var(--brand); width: 15px; height: 15px; }
    .plan-i.done span { color: var(--fg-subtle); text-decoration: line-through; }
    .plan-f { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border-subtle); background: var(--bg-surface-2); }
    .tool.running .st { color: var(--fg-subtle); }

    /* empty state */
    .hero { max-width: 760px; margin: 0 auto; padding: 12vh var(--space-6) var(--space-6); text-align: center; }
    .hero .orb { display: flex; justify-content: center; margin: 0 auto 12px; color: var(--brand-fg); }
    .hero .orb svg { width: 24px; height: 24px; }
    .hero h2 { margin-bottom: 6px; font-size: var(--text-xl); } .hero p { color: var(--fg-muted); }
    .sg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin-top: var(--space-6); text-align: left; background: var(--border-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; }
    .sg { padding: 12px 14px; background: var(--bg-surface); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
    .sg:hover { background: var(--bg-hover); }
    .sg .file-tile { margin-top: 1px; } .sg b { display: block; font-size: var(--text-sm); color: var(--fg-strong); font-weight: var(--weight-medium); } .sg span.d { font-size: var(--text-xs); color: var(--fg-subtle); }

    /* composer */
    .cmp-wrap { max-width: 760px; width: 100%; margin: 0 auto; padding: 0 var(--space-6) var(--space-4); position: relative; }
    .cmp { border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-surface); transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
    .cmp:focus-within { border-color: var(--border-focus); box-shadow: var(--shadow-focus); }
    .cmp textarea { display: block; width: 100%; border: 0; outline: none; background: transparent; resize: none; padding: 14px 16px 6px; min-height: 52px; max-height: 200px; font-size: 14px; line-height: 1.6; }
    .cmp-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 12px 0; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 8px; border-radius: var(--radius-sm); background: var(--bg-surface-3); border: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-default); }
    .chip svg { width: 12px; height: 12px; color: var(--fg-subtle); }
    .chip button { border: 0; background: none; cursor: pointer; width: 16px; height: 16px; padding: 0; color: var(--fg-subtle); display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; } .chip button:hover { background: var(--bg-hover); color: var(--fg-default); }
    .chip.static { padding-right: 8px; }
    .cmp-bar { display: flex; align-items: center; gap: 2px; padding: 4px 8px 8px; }
    .pill { height: 26px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: var(--bg-surface-2); color: var(--fg-muted); font-size: var(--text-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    .pill:hover { background: var(--bg-surface-3); color: var(--fg-default); }
    .pill.mode-edit, .pill.mode-agent { color: var(--fg-default); box-shadow: inset 0 0 0 1px var(--border-strong); }
    .cmp-wrap .as-usage { width: 100%; margin: 0 0 6px; }
    .sendb { margin-left: 6px; width: 32px; height: 32px; border: 0; border-radius: var(--radius-md); background: var(--brand); color: var(--fg-on-brand); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    .sendb:hover { background: var(--brand-hover); } .sendb:disabled { background: var(--bg-surface-3); color: var(--fg-faint); cursor: default; }
    .sendb.stop { background: var(--fg-strong); color: var(--bg-surface); }
    .cmp-hint { text-align: center; font-size: var(--text-2xs); color: var(--fg-faint); margin-top: 8px; }
    .cmp-menu { position: absolute; left: var(--space-6); right: var(--space-6); bottom: calc(100% - 10px); z-index: 20; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 6px; max-height: 300px; overflow: auto; animation: popIn var(--dur-fast) var(--ease-out); }
    .cmp-menu .mi { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-sm); }
    .cmp-menu .mi.is-on, .cmp-menu .mi:hover { background: var(--bg-active); }
    .cmp-menu .mi code { font-weight: 600; color: var(--brand-fg); min-width: 82px; background: none; padding: 0; font-size: 12.5px; }
    .cmp-menu .mi .d { color: var(--fg-subtle); font-size: var(--text-xs); }

    /* ---- context pane ---- */
    .cx { padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .cx-h { display: flex; align-items: center; justify-content: space-between; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); margin-bottom: 10px; }
    .kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: var(--text-sm); }
    .kv .k { color: var(--fg-subtle); font-size: var(--text-xs); } .kv .v { color: var(--fg-default); font-weight: 500; text-align: right; min-width: 0; }
    .path { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 10px; border-radius: var(--radius-sm); background: var(--code-bg); border: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 11px; color: var(--fg-default); }
    .path span { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }
    .note { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 8px; line-height: 1.5; display: flex; gap: 6px; }
    .note svg { width: 13px; height: 13px; margin-top: 2px; color: var(--success-fg); }
    .tokbar { display: flex; height: 6px; border-radius: 1px; overflow: hidden; background: var(--bg-surface-3); margin: 6px 0 10px; }
    .tokbar i { display: block; height: 100%; } .tokbar .a { background: var(--brand); } .tokbar .b { background: var(--accent-purple); } .tokbar .c { background: var(--accent-teal); }
    .dotk { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; } .dotk.a { background: var(--brand); } .dotk.b { background: var(--accent-purple); } .dotk.c { background: var(--accent-teal); }
    .a-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 0 -8px; border-radius: var(--radius-md); font-size: var(--text-sm); }
    .a-row:hover { background: var(--bg-hover); } .a-row .file-tile { background: none !important; color: var(--fg-subtle) !important; width: 18px; height: 18px; }
    .a-row a { color: inherit; text-decoration: none !important; flex: 1; min-width: 0; } .a-row .x { opacity: 0; } .a-row:hover .x { opacity: 1; }

    @container ac (max-width: 860px) {
      .t-in, .cmp-wrap { padding-left: var(--space-4); padding-right: var(--space-4); }
      .sg-grid { grid-template-columns: minmax(0, 1fr); }
      .acard { flex-wrap: wrap; }
    }
    .h-title { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; min-width: 0; padding: 2px 6px; margin: -2px -6px; border: 0; border-radius: var(--radius-sm); background: transparent; cursor: pointer; color: inherit; }
    .h-title:hover { background: var(--bg-hover); }
    .h-title svg { flex-shrink: 0; color: var(--fg-subtle); }
    .scope-pick { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 3px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-surface); color: var(--fg-default); font-size: var(--text-2xs); font-weight: var(--weight-medium); cursor: pointer; max-width: 260px; }
    .scope-pick:hover { border-color: var(--brand); }
    .scope-pick svg { flex-shrink: 0; color: var(--fg-subtle); }
    .sc-av { width: 18px; height: 18px; border-radius: 5px; font-size: 7.5px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .sc-av.none { background: var(--bg-surface-3); color: var(--fg-muted); } .sc-av.none svg { width: 11px; height: 11px; }
    .sc-item .count { margin-left: auto; padding-left: 12px; font-size: var(--text-2xs); color: var(--fg-faint); }
    .hist { display: flex; flex-direction: column; max-height: min(620px, calc(100vh - 140px)); margin: -6px; }
    .hist-top { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
    .hist-scopes { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
    .hf { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 4px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-surface); font-size: var(--text-2xs); font-weight: var(--weight-medium); color: var(--fg-muted); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .hf.all { padding-left: 8px; }
    .hf:hover { color: var(--fg-default); border-color: var(--fg-faint); }
    .hf.is-on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-fg); }
    .hf .n { color: var(--fg-faint); font-variant-numeric: tabular-nums; }
    .hist-list { flex: 1; overflow: auto; padding: 0 0 6px; }
    .hg { padding: 12px 12px 4px; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); }
    .hr { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 0; cursor: pointer; min-height: 46px; position: relative; }
    .hr + .hr { border-top: 1px solid var(--border-subtle); }
    .hr:hover { background: var(--bg-hover); }
    .hr.is-active { background: var(--brand-soft); }
    .hr.is-active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); }
    .hr.is-active .hr-t { color: var(--brand-fg); }
    .hr > .sc-av { width: 22px; height: 22px; border-radius: var(--radius-sm); font-size: 8.5px; }
    .hr > .sc-av.none svg { width: 13px; height: 13px; }
    .hr-main { flex: 1; min-width: 0; }
    .hr-t { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); display: flex; align-items: center; gap: 5px; }
    .hr-t svg { width: 12px; height: 12px; color: var(--fg-subtle); flex-shrink: 0; }
    .hr-s { font-size: var(--text-2xs); color: var(--fg-subtle); margin-top: 2px; }
    .hr-time { font-size: var(--text-2xs); color: var(--fg-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hr-acts { display: none; gap: 2px; flex-shrink: 0; }
    .hr:hover .hr-acts, .hr.is-editing .hr-acts, .hr.is-confirm .hr-acts, .hr.is-moving .hr-acts { display: flex; }
    .hr:hover .hr-time, .hr.is-moving .hr-time { display: none; }
    .hr-acts .danger:hover { color: var(--danger-fg); }
    .hr.is-editing, .hr.is-confirm, .hr.is-moving { cursor: default; background: var(--bg-surface-2); flex-wrap: wrap; }
    .hr .input { height: 30px; }
    .hr-confirm { flex: 1; font-size: var(--text-xs); color: var(--danger-fg); }
    .hr-move { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 2px 32px; }
    .hist-empty { padding: var(--space-8) var(--space-3); text-align: center; color: var(--fg-subtle); font-size: var(--text-sm); }
    .ctx-pop { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); margin: -6px; max-height: calc(100vh - 220px); overflow: auto; }
    .ctx-pop > div { padding: 14px 16px; min-width: 0; }
    .ctx-pop > div + div { border-left: 1px solid var(--border-subtle); }
    .ctx-pop .cx-h { margin: 16px 0 6px; } .ctx-pop .cx-h:first-child { margin-top: 0; }
    .ctx-pop .kv { font-size: var(--text-xs); padding: 3px 0; }
    .ctx-pop .cx-warn .btn { white-space: nowrap; }
    @media (max-width: 900px) { .ctx-pop { grid-template-columns: minmax(0, 1fr); } .ctx-pop > div + div { border-left: 0; border-top: 1px solid var(--border-subtle); } }
    .gen-av { display: inline-flex; align-items: center; justify-content: center; background: var(--bg-surface-3); color: var(--fg-muted); }
    .gen-av svg { width: 14px; height: 14px; }
    .scope-b { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; border-radius: var(--radius-xs); background: var(--bg-surface-3); color: var(--fg-muted); font-size: 10px; font-weight: 600; }
    .scope-b svg { width: 11px; height: 11px; }
    .cx-sub { font-size: var(--text-2xs); color: var(--fg-faint); line-height: 1.5; margin-top: 6px; }
    .cx-warn { margin-top: 10px; padding: 8px 10px; border-radius: var(--radius-md); border: 1px solid var(--border-default); border-left: 3px solid var(--warning); background: var(--bg-surface); color: var(--fg-default); font-size: var(--text-xs); line-height: 1.45; display: flex; gap: 8px; align-items: flex-start; }
    .cx-warn svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--warning-fg); }
    .src { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-faint); margin-top: 6px; overflow-wrap: anywhere; }
    .tokbar .cr { background: var(--accent-teal); } .tokbar .nw { background: var(--brand); } .tokbar .ou { background: var(--accent-purple); }
    .dotk.cr { background: var(--accent-teal); } .dotk.nw { background: var(--brand); } .dotk.ou { background: var(--accent-purple); }
  </style>
</head>
<body data-page="chats" data-shell="home" data-crumb="nav.chats.all" data-assistant="none">
  <main class="canvas"><div class="canvas-inner flush">
    <div class="ac-wrap"><div class="ac" id="ac">
      <section class="conv">
        <div class="conv-head" id="c-head"></div>
        <div class="thread" id="thread"></div>
        <div class="cmp-wrap" id="cmp-wrap">

        if (cmd === 'estimate') return { tool: mk(X('Estimate effort', 'Ước lượng effort'), out(['info', 'read  velocity of sprints 1–4'], ['ok', 'done']), '10.4s'), md: X('For **' + t + '** I estimate **13 points** (about 4.5 working days for one agent plus review):\n\n| Part | Points |\n|---|---|\n| API and streaming | 5 |\n| UI and filters | 3 |\n| e2e and evidence | 3 |\n| Review buffer | 2 |', 'Với **' + t + '** mình ước lượng **13 điểm** (khoảng 4,5 ngày làm việc cho một agent cộng thời gian review):\n\n| Phần | Điểm |\n|---|---|\n| API và streaming | 5 |\n| UI và bộ lọc | 3 |\n| e2e và bằng chứng | 3 |\n| Dự phòng review | 2 |'), extra: [] };
        if (cmd === 'adr') return { tool: mk(X('Write ADR', 'Viết ADR'), out(['info', 'read  ADR-001..005, infra plan'], ['ok', 'save  ADR-006 → Draft']), '14.8s'), md: X('I drafted **ADR-006** covering context, the decision, alternatives and consequences. Two alternatives are rejected with reasons; please confirm the *Consequences* section with the tech lead.', 'Mình đã soạn **ADR-006** gồm bối cảnh, quyết định, phương án thay thế và hệ quả. Hai phương án bị loại kèm lý do; bạn xác nhận phần *Hệ quả* với tech lead nhé.'), extra: [art(null, 'ADR-006 · ' + short, 'git-pull-request-arrow', 'created', 'Draft', X('Status: Proposed', 'Trạng thái: Đề xuất'))] };
        if (cmd === 'scaffold' || mode === 'agent') return { tool: mk(X('Plan scaffolding', 'Lập kế hoạch scaffolding'), out(['info', 'scan  repo ' + PC.project().repo], ['info', 'plan  6 steps · worktree feature/scaffold'], ['ok', 'done']), '9.1s'), md: X('Here is the plan I would run in a **dedicated git worktree**. Nothing touches `main` until you review and promote the pull request.', 'Đây là kế hoạch mình sẽ chạy trong **git worktree riêng**. Không có gì chạm vào `main` cho tới khi bạn review và đưa PR.'), extra: [plan(X('Agent plan', 'Kế hoạch cho agent'), [[false, X('Create worktree from main', 'Tạo worktree từ main')], [false, X('Generate or update the files', 'Sinh hoặc cập nhật các file')], [false, X('Run lint, unit and e2e', 'Chạy lint, unit và e2e')], [false, X('Collect evidence for review', 'Thu thập bằng chứng để review')], [false, X('Open pull request draft', 'Mở PR dạng nháp')]], true)] };
        if (cmd === 'plan') return { tool: mk(X('Create plan', 'Tạo kế hoạch'), out(['info', 'read  spec, test strategy, repo graph'], ['ok', 'done  7 steps']), '8.2s'), md: X('Solution outline for **' + t + '**: keep the change inside the existing module boundary, add contract tests first, then implement behind a feature flag.', 'Phác thảo giải pháp cho **' + t + '**: giữ thay đổi trong ranh giới module hiện có, viết contract test trước rồi triển khai sau feature flag.'), extra: [plan(X('Implementation plan', 'Kế hoạch triển khai'), [[false, X('Write contract tests', 'Viết contract test')], [false, X('Implement behind a feature flag', 'Triển khai sau feature flag')], [false, X('Unit tests', 'Unit test')], [false, X('e2e scenario and evidence', 'Kịch bản e2e và bằng chứng')]], true)] };
        if (mode === 'edit') return { tool: mk(X('Propose edit', 'Đề xuất chỉnh sửa'), out(['info', 'read  attached artifacts'], ['ok', 'diff  +1 −1']), '5.7s'), md: X('Here is the proposed change. It is not applied until you click **Apply changes**.', 'Đây là thay đổi đề xuất. Nó chưa được áp dụng cho tới khi bạn bấm **Áp dụng thay đổi**.'), extra: [dif('Business Requirements Doc · §5 NFR-03', 48, [[' ', '| ID | Category | Requirement | Target |'], ['-', '| NFR-03 | Performance | p95 API latency stays below 400 ms at 500 concurrent merchants | < 400 ms |'], ['+', '| NFR-03 | Performance | p95 API latency stays below 400 ms at 500 concurrent merchants, measured on staging | < 400 ms |']]), art('brd', 'Business Requirements Doc', 'file-text', 'edited', 'v4 → v4.1', 'NFR-03', false)] };

      /* ===================== sending & streaming ===================== */
      function send(text) {
        const s = S(); text = (text || '').trim();
        if (state.stream) { stopStream(); return; }
        if (!text && !state.chips.length) return;
        const cm = text.match(/^\/(\w+)/), cmd = cm && CMDS.some(c => c[0] === cm[1]) ? cm[1] : null;
        const chips = state.chips.map(c => [c.icon, c.label]);
        state.chips.forEach(c => { if (c.art && !s.attached.includes(c.art)) s.attached.push(c.art); });
        s.messages.push({ role: 'user', time: hhmm(new Date()), text: text || chips.map(c => c[1]).join(', '), chips });
        if (s.messages.length === 1 && /^New chat|^Chat mới$/.test(s.title)) s.title = (text || chips[0][1]).replace(/^\/\w+\s*/, '').slice(0, 52) || s.title;
        s.at = nowIso(); state.chips = [];
        $('#ta').value = ''; $('#ta').style.height = ''; closeMenu();
        renderThread(); renderHead(); save();
        reply(text, cmd, s);
      }
      let timers = [];
      const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
      function reply(text, cmd, s) {
        const rep = makeReply(text, cmd, state.mode, s);
        const st = state.stream = { s, rep, partial: '', done: false };
        renderComposer();
        const inner = $('#t-in'), node = PC.h(`<div class="m"><span class="avatar avatar-ai"><i data-lucide="sparkles" style="width:14px;height:14px"></i></span><div class="m-body"><div class="m-meta"><b>${PC.t('ac.assistant')}</b><span class="cli-b ${s.cli}">${CLI[s.cli].name}</span></div><div class="live"><div class="typing"><i></i><i></i><i></i></div></div></div></div>`);
        inner.appendChild(node); PC.refresh(node); scrollEnd();
        const live = $('.live', node);
        later(() => { live.innerHTML = toolHTML(rep.tool, true); PC.refresh(live); scrollEnd();
          later(() => {
            live.innerHTML = toolHTML(rep.tool, false) + '<div class="md caret" id="stream-md"></div>'; PC.refresh(live);
            const el = $('#stream-md'), full = rep.md; let i = 0;
            const iv = setInterval(() => {
              i = Math.min(full.length, i + 3); st.partial = full.slice(0, i); el.innerHTML = md(st.partial); scrollEnd(true);
              if (i >= full.length) { clearInterval(iv); el.classList.remove('caret'); extras(); }
            }, 18); st.iv = iv;
            function extras() { let k = 0; const nxt = () => { if (k >= rep.extra.length) return finish(); live.insertAdjacentHTML('beforeend', blockHTML(rep.extra[k], -1, -1)); PC.refresh(live); k++; scrollEnd(); later(nxt, 380); }; nxt(); }
          }, 1000);
        }, 650);
      }
      function scrollEnd(soft) { const th = $('#thread'); if (!soft || th.scrollHeight - th.scrollTop - th.clientHeight < 140) { th.style.scrollBehavior = 'auto'; th.scrollTop = th.scrollHeight; th.style.scrollBehavior = ''; } }
      function finish() {
        const st = state.stream; if (!st) return; const { s, rep } = st;
        s.messages.push({ role: 'ai', time: hhmm(new Date()), blocks: [rep.tool, tx(st.partial || rep.md), ...rep.extra] });
        const di = 700 + Math.round(rep.md.length * .6), dout = Math.round(rep.md.length / 3.2) + 120;
        s.tok.i += di; s.tok.o += dout; s.tok.c += 1800;
        // end of turn (Stop hook / result event): the whole previous prompt is now cache read, plus the new input and output
        const at = nowIso(); s.ctx = { cr: ctxUsed(s), nw: di, o: dout, at };
        PC.usage.record(s.cli, at);   // also fires pc:usage → meter + limits re-render
        state.stream = null; timers = []; save(); renderThread(); renderComposer(); renderCtx();
      }
      function stopStream() { const st = state.stream; if (!st) return; clearInterval(st.iv); timers.forEach(clearTimeout); timers = []; if (!st.partial) st.partial = rep0(st); finish(); }
      const rep0 = st => st.rep.md.slice(0, 40) + '…';

      /* ===================== slash / mention menu ===================== */
      function closeMenu() { const m = $('#cmp-menu'); if (m) m.remove(); state.menu = null; }
      function openMenu(kind, items) {
        closeMenu(); if (!items.length) return;
        state.menu = { kind, items, on: 0 };
        const m = PC.h(`<div class="cmp-menu" id="cmp-menu"><div class="menu-label">${PC.t(kind === 'cmd' ? 'ac.cmd.title' : 'ac.mention.title')}</div>${items.map((it, i) => kind === 'cmd'
          ? `<div class="mi ${i === 0 ? 'is-on' : ''}" data-i="${i}"><span class="file-tile"><i data-lucide="${it[1]}" class="icon-sm"></i></span><code>/${it[0]}</code><span class="d">${PC.t('ac.cmd.' + it[0])}</span></div>`
          : `<div class="mi ${i === 0 ? 'is-on' : ''}" data-i="${i}"><span class="file-tile"><i data-lucide="${it[2]}" class="icon-sm"></i></span><span class="truncate">${esc(it[1])}</span></div>`).join('')}</div>`);

      }
      function moveMenu(d) { const mn = state.menu; if (!mn) return; mn.on = (mn.on + d + mn.items.length) % mn.items.length; $$('#cmp-menu .mi').forEach((e, i) => e.classList.toggle('is-on', i === mn.on)); const on = $('#cmp-menu .is-on'); on && on.scrollIntoView({ block: 'nearest' }); }
      function choose(i) {
        const mn = state.menu; if (!mn) return; const it = mn.items[i], ta = $('#ta');
        if (mn.kind === 'cmd') { ta.value = '/' + it[0] + ' '; }
        else { ta.value = ta.value.replace(/@[^\s@]*$/, ''); state.chips.push({ icon: it[2], label: it[1], art: it[0] }); renderComposer(); }
        closeMenu(); ta.focus(); ta.dispatchEvent(new Event('input'));
      }
      function syncMenu() {
        const v = $('#ta').value, mc = v.match(/^\/(\w*)$/), mm = v.match(/(?:^|\s)@([^\s@]*)$/);
        if (mc) openMenu('cmd', CMDS.filter(c => c[0].startsWith(mc[1].toLowerCase())));
        else if (mm) openMenu('art', ARTL.filter(a => a[1].toLowerCase().includes(mm[1].toLowerCase())).slice(0, 8));
        else closeMenu();
      }

      /* ===================== session actions ===================== */
      function openSession(id) {
        if (state.stream) return;
        state.cur = id; state.chips = []; useScope(S().scope);
        try { history.replaceState(null, '', '#' + id); localStorage.setItem('pc.assistant.page.cur', id); } catch (e) { /* file:// */ }
        renderAll();
      }
      function newChat(scope) {
        if (state.stream) return;
        scope = scope || (S() ? S().scope : PC.data.currentProjectId);
        const ex = state.sessions.find(s => !s.messages.length && s.scope === scope);
        if (ex) { openSession(ex.id); $('#ta').focus(); return; }
        const id = 'n' + Date.now().toString(36), cli = S() ? S().cli : 'claude';
        state.sessions.unshift({ id, scope, title: PC.t('ac.newchat'), phase: scopeProject(scope).phase, cli, at: nowIso(), pinned: false, attached: [], sid: (cli === 'codex' ? 'cdx_' : 'ses_') + Math.random().toString(16).slice(2, 14).toUpperCase(), tok: { i: 0, o: 0, c: 0 }, ctx: { cr: 0, nw: 0, o: 0, at: null }, messages: [] });
        save(); openSession(id); $('#ta').focus();
      }
      function queryScope() {
        const m = location.search.match(/[?&]scope=([\w-]+)/); if (!m) return null;
        return m[1] === 'general' ? '__general' : SCOPES.includes(m[1]) ? m[1] : null;
      }
      function initialChat() {
        const h = location.hash.slice(1); let last = null;
        try { last = localStorage.getItem('pc.assistant.page.cur'); } catch (e) { /* ignore */ }
        const pick = [h, last].find(id => id && state.sessions.some(s => s.id === id));
        return pick || state.sessions.slice().sort((a, b) => new Date(b.at) - new Date(a.at))[0].id;
      }

      function renderAll() { renderHead(); renderThread(); renderComposer(); renderList(); }

      /* ===================== boot ===================== */
      PC.onReady(() => {
        state.cur = initialChat(); useScope(S().scope);
        if (location.hash === '#new') setTimeout(() => newChat(queryScope() || S().scope), 0);
        const ta = $('#ta');
        $('#thread').onclick = e => {
          const tg = e.target.closest('[data-tool]'); if (tg) { tg.parentElement.classList.toggle('is-open'); return; }
          const f = e.target.closest('[data-fill]'); if (f) { ta.value = f.dataset.fill; ta.focus(); ta.dispatchEvent(new Event('input')); return; }
          const ap = e.target.closest('[data-apply]'); if (ap) { const [mi, bi] = ap.dataset.apply.split(':').map(Number), b = S().messages[mi] && S().messages[mi].blocks[bi]; if (b) { b.applied = true; save(); renderThread(true); PC.toast(PC.t('ac.apply.toast'), { icon: 'check-circle-2', tone: 'success' }); } return; }
          const st = e.target.closest('[data-start]'); if (st) { PC.toast(PC.t('ac.plan.started'), { icon: 'git-branch' }); return; }
          const ac = e.target.closest('[data-act]'); if (ac) { const m = ac.closest('.m-body'); if (ac.dataset.act === 'copy') { try { navigator.clipboard && navigator.clipboard.writeText(m.innerText); } catch (err) { /* ignore */ } PC.toast(PC.t('ac.copied')); } else if (ac.dataset.act === 'up') PC.toast(PC.t('ac.thanks'), { icon: 'thumbs-up' }); else PC.toast(PC.t('ac.regen.toast'), { icon: 'rotate-ccw' }); }
        };
        $('#thread').addEventListener('change', e => { const c = e.target.closest('[data-plan]'); if (!c) return; const [mi, bi, k] = c.dataset.plan.split(':').map(Number), b = S().messages[mi] && S().messages[mi].blocks[bi]; if (b) { b.items[k][0] = c.checked; save(); renderThread(true); } });
        ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(200, ta.scrollHeight) + 'px'; syncMenu(); });
        ta.addEventListener('keydown', e => {
          if (state.menu) { if (e.key === 'ArrowDown') { e.preventDefault(); moveMenu(1); return; } if (e.key === 'ArrowUp') { e.preventDefault(); moveMenu(-1); return; } if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); choose(state.menu.on); return; } if (e.key === 'Escape') { closeMenu(); return; } }

        $('#b-attach').onclick = () => $('#f-in').click();
        $('#f-in').onchange = e => { Array.from(e.target.files).forEach(f => state.chips.push({ icon: 'paperclip', label: f.name })); e.target.value = ''; renderComposer(); PC.toast(PC.t('ac.attached'), { icon: 'paperclip' }); };
        $('#b-mode').onclick = e => PC.popover(e.currentTarget, [['ask', 'message-circle'], ['edit', 'file-pen-line'], ['agent', 'bot']].map(m => `<button class="menu-item" data-v="${m[0]}" style="min-width:250px"><i data-lucide="${m[1]}"></i><span class="grow"><b style="font-weight:500">${PC.t('as.mode.' + m[0])}</b><span class="text-subtle" style="display:block;font-size:11px">${PC.t('ac.mode.' + m[0] + '.d')}</span></span>${state.mode === m[0] ? '<i data-lucide="check"></i>' : ''}</button>`).join(''), v => { state.mode = v; renderComposer(); });
        $('#b-cli').onclick = e => PC.popover(e.currentTarget, `<div class="menu-label">${PC.t('ac.cli.pick')}</div>` + PC.data.cli.map(c => `<button class="menu-item" data-v="${c.id}" style="min-width:260px"><span class="dot dot-success"></span><span class="grow"><b style="font-weight:500">${c.name}</b><span class="text-subtle mono" style="display:block;font-size:11px">${c.model}</span></span>${S().cli === c.id ? '<i data-lucide="check"></i>' : ''}</button>`).join(''), v => { const s = S(); if (s.cli !== v) { s.cli = v; save(); renderAll(); PC.toast(PC.t('ac.cli.switched', { cli: CLI[v].name }), { icon: 'terminal' }); } });
        $('#b-usage').onclick = openUsage;
        document.addEventListener('mousedown', e => { if (state.menu && !e.target.closest('#cmp-menu, #ta')) closeMenu(); });
        window.addEventListener('hashchange', () => { const hh = location.hash.slice(1); if (hh === 'new') newChat(); else if (hh && hh !== state.cur && state.sessions.some(s => s.id === hh)) openSession(hh); });
        document.addEventListener('pc:usage', () => { if (state.cur) { renderMeter(); renderCtx(); } });
        document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') { e.preventDefault(); openHistory($('#h-title')); } });
        renderAll();
      });
      document.addEventListener('pc:lang', () => { if (state.cur) { closeMenu(); renderAll(); } });
    })();
