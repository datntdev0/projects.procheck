<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDLC board · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ============ Locked phase state (identical block lives in board.html) ============ */
    .lk { position: relative; min-height: 100%; display: flex; justify-content: center; align-items: flex-start; padding: var(--space-10) var(--space-8) var(--space-12); overflow: hidden; }
    .lk-bg { position: absolute; inset: 0; padding: var(--space-8); overflow: hidden; pointer-events: none; user-select: none; opacity: .85; filter: blur(1.2px) saturate(.7);
      -webkit-mask-image: linear-gradient(#000 0%, #000 55%, transparent 100%); mask-image: linear-gradient(#000 0%, #000 55%, transparent 100%); }
    .lk-wrap { position: relative; z-index: 1; width: min(960px, 100%); display: flex; flex-direction: column; gap: var(--space-3); }
    .lk-card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; }
    .lk-hero { display: flex; gap: var(--space-4); align-items: flex-start; padding: var(--space-6) var(--space-8) var(--space-5); background: linear-gradient(180deg, color-mix(in srgb, var(--_c) 9%, transparent), transparent); }
    .lk-ic { position: relative; width: 56px; height: 56px; border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--_c); background: color-mix(in srgb, var(--_c) 14%, var(--bg-surface)); border: 1px solid color-mix(in srgb, var(--_c) 28%, transparent); }
    .lk-ic > svg { width: 24px; height: 24px; }
    .lk-pad { position: absolute; right: -7px; bottom: -7px; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-inverse); color: var(--fg-inverse); border: 2px solid var(--bg-surface); }
    .lk-pad svg { width: 12px; height: 12px; }
    .lk-title { margin-top: var(--space-2); }
    .lk-gate { margin: 4px 0 0; color: var(--fg-muted); font-size: var(--text-sm); }
    .lk-note { display: flex; gap: var(--space-2); align-items: center; margin: 0 var(--space-8) var(--space-4); padding: 8px 12px; border-radius: var(--radius-md); background: var(--brand-soft); color: var(--fg-default); font-size: var(--text-xs); }
    .lk-note svg { color: var(--brand-fg); width: 14px; height: 14px; }
    .lk-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); border-top: 1px solid var(--border-subtle); }
    @media (max-width: 900px) { .lk-cols { grid-template-columns: minmax(0, 1fr); } .lk-col + .lk-col { border-left: 0 !important; border-top: 1px solid var(--border-subtle); } }
    .lk-col { padding: var(--space-5) var(--space-8); }
    .lk-col + .lk-col { border-left: 1px solid var(--border-subtle); }
    .lk-col h5 { margin-bottom: var(--space-3); }
    .lk-does { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-3); }
    .lk-does li { display: flex; gap: var(--space-3); font-size: var(--text-sm); line-height: 1.45; color: var(--fg-default); }
    .lk-does .n { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-2xs); font-weight: var(--weight-semibold); background: color-mix(in srgb, var(--_c) 14%, var(--bg-surface)); color: var(--_c); }
    .lk-pre { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .lk-pre li { display: flex; gap: var(--space-3); align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
    .lk-pre li:last-child { border-bottom: 0; }
    .lk-pre li > svg, .lk-pre li > .spinner { margin-top: 2px; }
    .lk-pre .tx { flex: 1; min-width: 0; line-height: 1.35; }
    .lk-pre .tx small { display: block; color: var(--fg-subtle); font-size: var(--text-xs); margin-top: 1px; }
    .lk-pre .st { font-size: var(--text-2xs); font-weight: var(--weight-semibold); white-space: nowrap; padding-top: 3px; }
    .lk-pre .k-done > svg { color: var(--success); } .lk-pre .k-done .st { color: var(--success-fg); }
    .lk-pre .k-review > svg, .lk-pre .k-wait > svg { color: var(--warning); } .lk-pre .k-review .st, .lk-pre .k-wait .st { color: var(--warning-fg); }
    .lk-pre .k-wip > svg { color: var(--brand); } .lk-pre .k-wip .st { color: var(--brand-fg); }
    .lk-pre .k-todo > svg, .lk-pre .k-locked > svg { color: var(--fg-faint); } .lk-pre .k-todo .st, .lk-pre .k-locked .st { color: var(--fg-subtle); }
    .lk-foot { display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; padding: var(--space-4) var(--space-8); background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); }
    .lk-prev { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .lk-prev .cap { font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-subtle); }
    .lk-bar .row { font-size: var(--text-xs); }
    .lk-bar .row b { font-variant-numeric: tabular-nums; color: var(--fg-strong); }
    .lk-bar .progress > span { background: var(--_b, var(--brand)); }
    .lk-cap { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--text-2xs); color: var(--fg-subtle); }
    .lk-cap svg { width: 12px; height: 12px; }
    .sk { background: var(--bg-surface-3); border-radius: var(--radius-sm); }
    .sk-card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: var(--space-4); display: flex; flex-direction: column; gap: 10px; }
    .sk-row { display: flex; gap: var(--space-3); align-items: center; }

    /* board-specific additions */
    .kc-fail { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: var(--radius-sm); background: var(--danger-soft); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); }
    .kc-fail .hd { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: var(--weight-semibold); color: var(--danger-fg); }
    .kc-fail .hd svg { width: 13px; height: 13px; }
    .kc-fail .bt { display: flex; gap: 6px; }
    .kc-fail .bt .btn { height: 24px; font-size: 11px; padding: 0 8px; }
    .kcard.is-failed { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
    .kc-rework { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--radius-sm); background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); }
    .kc-rework .hd { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: var(--weight-semibold); color: var(--warning-fg); }
    .kc-rework .hd svg { width: 13px; height: 13px; }
    .kc-rework ul { margin: 0; padding-left: 16px; font-size: 10.5px; color: var(--fg-muted); line-height: 1.45; }
    .kc-rework .progress { height: 5px; background: var(--bg-surface); }
    .kc-rework .progress > span { background: var(--warning); }
    .rel { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin: var(--space-3) var(--space-6) 0; padding: 10px var(--space-4); border-radius: var(--radius-lg); background: var(--accent-teal-soft); border: 1px solid color-mix(in srgb, var(--accent-teal) 30%, transparent); }
    .rel .ic { width: 34px; height: 34px; border-radius: var(--radius-md); background: var(--accent-teal); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .rel .tt { min-width: 160px; }
    .rel .tt b { font-size: var(--text-sm); color: var(--fg-strong); display: block; line-height: 1.25; }
    .rel .tt small { font-size: var(--text-xs); color: var(--fg-muted); }
    .rel .bar { flex: 1 1 200px; min-width: 160px; display: flex; flex-direction: column; gap: 4px; font-size: var(--text-xs); color: var(--fg-muted); }
    .rel .bar .progress { background: var(--bg-surface); height: 8px; }
    .rel .bar .progress > span { background: var(--accent-teal); }
    .rel .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .rel .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: var(--radius-full); background: var(--bg-surface); border: 1px solid var(--border-default); font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-muted); text-decoration: none !important; }
    .rel .chip svg { width: 12px; height: 12px; }
    .rel .chip.is-danger { color: var(--danger-fg); border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: var(--danger-soft); }
    .rel .chip.is-warn { color: var(--warning-fg); border-color: color-mix(in srgb, var(--warning) 35%, transparent); background: var(--warning-soft); }

    /* ---- Board page (tokens only; class prefix bd-/kc- avoids clashes with components.css) ---- */
    .bd { display: flex; flex-direction: column; height: 100%; min-height: 0; }
    .bd-top { display: flex; align-items: center; gap: var(--space-4); padding: 14px var(--space-6) 0; flex-wrap: wrap; }
    .bd-top h3 { font-size: var(--text-xl); }
    .bd-metrics { font-size: var(--text-xs); font-weight: var(--weight-medium); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .bd-goal { font-size: var(--text-xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .bd-toolbar { display: flex; align-items: center; gap: var(--space-2); padding: 12px var(--space-6); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
    .bd-toolbar .input-group { width: 220px; }
    .bd-toolbar .input { height: 30px; font-size: var(--text-xs); }
    .bd-sprint { height: 30px; gap: 6px; font-weight: var(--weight-semibold); }
    .fbtn { height: 30px; padding: 0 10px; gap: 6px; font-size: var(--text-xs); }
    .fbtn .v { color: var(--fg-subtle); font-weight: var(--weight-regular); }
    .fbtn.is-on { background: var(--brand-soft); color: var(--brand-fg); border-color: var(--brand-soft-2); }
    .fbtn.is-on .v { color: var(--brand-fg); font-weight: var(--weight-semibold); }
    .bd-sep { width: 1px; height: 20px; background: var(--border-default); margin: 0 4px; }
    .bd-body { flex: 1; min-height: 0; display: flex; background: var(--bg-canvas); }
    .bd-cols { flex: 1; min-width: 0; display: flex; gap: var(--space-3); padding: var(--space-4) var(--space-6); overflow-x: auto; overflow-y: hidden; align-items: stretch; }
    .kcol { flex: 1 1 200px; min-width: 200px; display: flex; flex-direction: column; min-height: 0; background: var(--bg-surface-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); transition: border-color var(--dur-fast), background var(--dur-fast); }
    .kcol.is-over { border-color: var(--brand); background: var(--brand-soft); }
    .kcol-head { display: flex; align-items: center; gap: var(--space-2); padding: 12px 12px 8px; }
    .kcol-head .ic { color: var(--c, var(--fg-subtle)); width: 15px; height: 15px; }
    .kcol-head b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .kcol-count { margin-left: 2px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); padding: 1px 7px; border-radius: 999px; background: var(--bg-surface-3); color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .kcol-count.is-full { background: var(--warning-soft); color: var(--warning-fg); }
    .kcol-bar { height: 2px; margin: 0 12px 8px; border-radius: 2px; background: var(--c, var(--border-default)); opacity: .7; }
    .kcol-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .kc-empty { border: 1.5px dashed var(--border-default); border-radius: var(--radius-md); padding: var(--space-6) var(--space-3); text-align: center; font-size: var(--text-xs); color: var(--fg-faint); }
    .kc-ph { border: 1.5px dashed var(--brand); background: var(--brand-soft); border-radius: var(--radius-md); height: 56px; flex-shrink: 0; }
    .kc-group { font-size: var(--text-2xs); font-weight: var(--weight-semibold); color: var(--fg-subtle); text-transform: uppercase; letter-spacing: .06em; padding: 6px 4px 0; display: flex; align-items: center; gap: 6px; }

    .kcard { position: relative; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 10px 12px 10px; box-shadow: var(--shadow-xs); cursor: grab; display: flex; flex-direction: column; gap: 8px; transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast); flex-shrink: 0; }
    .kcard:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
    .kcard:active { cursor: grabbing; }
    .kcard.dragging { opacity: .35; transform: rotate(1.5deg); }
    .kcard.is-new { animation: kcNew 1.6s var(--ease-out); }
    @keyframes kcNew { 0% { box-shadow: 0 0 0 0 var(--brand); } 30% { box-shadow: var(--shadow-focus); } 100% { box-shadow: var(--shadow-xs); } }
    .kc-top { display: flex; align-items: center; gap: 6px; }
    .kc-type { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kc-type svg { width: 12px; height: 12px; }
    .kc-feature { background: var(--brand-soft); color: var(--brand-fg); }
    .kc-bug { background: var(--danger-soft); color: var(--danger-fg); }
    .kc-chore { background: var(--bg-surface-3); color: var(--fg-muted); }
    .kc-id { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--fg-subtle); }
    .kc-pri { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-2xs); font-weight: var(--weight-medium); }
    .kc-pri svg { width: 14px; height: 14px; }
    .pri-urgent { color: var(--danger-fg); } .pri-high { color: var(--warning-fg); } .pri-medium { color: var(--info-fg); } .pri-low { color: var(--fg-faint); }
    .kc-title { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); line-height: 1.4; }
    .kc-labels { display: flex; flex-wrap: wrap; gap: 4px; }
    .kc-labels .tag { height: 18px; font-size: 10px; padding: 0 6px; }
    .kc-art { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; max-width: 100%; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); font-size: 10.5px; font-weight: var(--weight-medium); color: var(--fg-muted); text-decoration: none !important; }
    .kc-art:hover { border-color: var(--brand); color: var(--brand-fg); }
    .kc-art svg { width: 12px; height: 12px; color: var(--fg-subtle); }
    .kc-art span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kc-run { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--radius-sm); background: var(--accent-teal-soft); }
    .kc-run .row { font-size: 11px; color: var(--accent-teal-fg); font-weight: var(--weight-medium); }
    .kc-run .pct { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); }
    .kc-run .progress { height: 5px; background: var(--bg-surface); }
    .kc-run .progress > span { background: var(--accent-teal); }
    .kc-branch { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); overflow: hidden; }
    .kc-branch svg { width: 11px; height: 11px; flex-shrink: 0; }
    .kc-branch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kc-ev { display: flex; flex-wrap: wrap; gap: 4px; }
    .kc-ev .badge { height: 20px; }
    .kc-plan { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 10.5px; font-weight: var(--weight-medium); color: var(--accent-purple); background: var(--accent-purple-soft); padding: 3px 8px; border-radius: var(--radius-sm); }
    .kc-plan svg { width: 12px; height: 12px; }
    .kc-foot { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .agent-b { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; font-weight: var(--weight-medium); color: var(--fg-muted); }
    .agent-b .avatar { width: 20px; height: 20px; font-size: 8px; border-width: 0; letter-spacing: .02em; }
    .agent-b span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-b .by { color: var(--fg-faint); font-weight: var(--weight-regular); }
    .ag-claude { background: var(--gradient-ai); }
    .ag-codex { background: linear-gradient(135deg, var(--kms-teal), var(--kms-blue)); }
    .kc-foot .pts { margin-left: auto; font-size: 10.5px; font-weight: var(--weight-semibold); color: var(--fg-subtle); background: var(--bg-surface-3); border-radius: 999px; padding: 1px 7px; }
    /* list view */
    .bd-list { flex: 1; min-width: 0; overflow: auto; padding: var(--space-4) var(--space-6) var(--space-8); }
    .bd-list .table tbody tr { cursor: pointer; }
    .bd-list .table tr.grp td { background: var(--bg-surface-2); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-muted); text-transform: uppercase; letter-spacing: .05em; padding: 7px var(--space-4); cursor: default; }
    .bd-list .table tr.grp:hover { background: none; }
    .st-pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: var(--weight-medium); }

    /* agent confirm modal */
    .kv-line { display: grid; grid-template-columns: 110px 1fr; gap: var(--space-2); align-items: center; font-size: var(--text-sm); padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
    .kv-line:last-of-type { border-bottom: 0; }
    .kv-line .k { color: var(--fg-subtle); font-size: var(--text-xs); }
    .kv-line code { font-size: 12px; word-break: break-all; }
  </style>
</head>
<body data-assistant="closed" data-page="board" data-shell="project" data-crumb="nav.board">
  <main class="canvas">
    <div class="canvas-inner flush hidden" id="lockedRoot"></div>
    <div class="canvas-inner flush" id="boardRoot">
      <div class="bd">
        <div class="bd-top">
          <div class="row gap-3"><span class="file-tile" style="background:var(--accent-teal-soft);color:var(--accent-teal-fg)"><i data-lucide="kanban"></i></span><h3 data-i18n="nav.board"></h3></div>
          <button class="btn btn-secondary bd-sprint" id="sprintBtn"><i data-lucide="calendar-range" class="icon-sm"></i><span id="sprintLabel"></span><i data-lucide="chevron-down" class="icon-sm"></i></button>
          <span class="badge badge-teal"><span class="dot dot-pulse" style="width:6px;height:6px"></span><span id="sprintDay"></span></span><span class="badge" id="sprintPts"></span>
          <div class="bd-goal grow"><i data-lucide="target" class="icon-sm"></i><span class="truncate" id="goalText"></span></div>
          <a class="btn btn-ghost btn-sm bd-metrics" href="overview.html#metrics"><i data-lucide="chart-no-axes-combined" class="icon-sm"></i><span data-i18n="board.metrics"></span><i data-lucide="arrow-up-right" class="icon-sm"></i></a>
        </div>
        <div class="bd-toolbar">
          <div class="input-group"><i data-lucide="search" class="icon-sm"></i><input class="input" id="q" data-i18n-placeholder="board.search" autocomplete="off"></div>
          <span id="filters" class="row gap-2"></span>
          <span class="bd-sep"></span>
          <button class="btn btn-secondary fbtn" id="groupBtn"></button>
          <span class="grow"></span>
          <div class="segmented" id="viewSeg">
            <button data-view="board" class="is-active"><i data-lucide="columns-3" class="icon-sm"></i><span data-i18n="board.view.board"></span></button>
            <button data-view="list"><i data-lucide="list" class="icon-sm"></i><span data-i18n="board.view.list"></span></button>
          </div>
          <button class="btn btn-primary" id="newBtn" style="height:30px"><i data-lucide="plus"></i><span data-i18n="board.new"></span></button>
        </div>
        <div id="relBanner"></div>
        <div class="bd-body">
          <div class="bd-cols" id="cols"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    PC.i18n.extend({
      en: {
        /* shared: locked phase state */
        'lk.title': '{phase} is locked', 'lk.badge': 'Locked', 'lk.does': 'What this phase will do', 'lk.pre': 'Prerequisites', 'lk.met': '{n} of {m} met',
        'lk.prev': 'Previous phase progress', 'lk.cta': 'Continue {phase} phase', 'lk.view': 'Project overview', 'lk.cap': 'Faded preview of the screen that unlocks',
        'lk.st.done': 'Done', 'lk.st.review': 'In review', 'lk.st.wip': 'In progress', 'lk.st.todo': 'Not started', 'lk.st.wait': 'Awaiting approval', 'lk.st.run': 'Running', 'lk.st.locked': 'Locked',
        'lk.steps': '{d} of {n} steps done', 'lk.locked': 'Locked',
        'bd.lk.do1': 'Seed the backlog from the approved BRD requirements and scope, then plan sprints.',
        'bd.lk.do2': 'Plan each task with AI, then let Claude Code or Codex implement it in an isolated git worktree.',
        'bd.lk.do3': 'Review evidence (tests, screenshots, diff) and promote reviewed work to a pull request.',
        'bd.lk.seed.none': 'Backlog will be seeded from BRD requirements when SDLC starts. None are captured yet.',

      { id: 'AH-294', title: 'Onboarding checklist templates', type: 'feature', pri: 'medium', labels: ['onboarding'], agent: 'claude', col: 'done', pr: { n: 413, st: 'merged' }, pts: 5 },
      { id: 'AH-292', title: 'Fix payslip PDF rounding of allowances', type: 'bug', pri: 'high', labels: ['payroll'], agent: 'codex', col: 'done', pr: { n: 411, st: 'merged' }, pts: 2 },
      { id: 'AH-296', title: 'Employee directory search performance', type: 'chore', pri: 'medium', labels: ['performance', 'profile'], agent: 'codex', col: 'done', pr: { n: 414, st: 'open' }, pts: 2 },
      { id: 'AH-289', title: 'Bump EF Core to latest 8.0 patch', type: 'chore', pri: 'low', labels: ['tech-debt', 'security'], agent: 'codex', col: 'done', pr: { n: 408, st: 'merged' }, pts: 2 },
    ];

    /* ------------------------------------------------------------ per-project dataset (from PC.project().state.sdlc) */
    const P = PC.project(), SD = P.state.sdlc, LOCKED = SD.status === 'locked';
    const DATASETS = {
      'lotus-pay': { prefix: 'LP', tasks: LOTUS_TASKS, art: LOTUS_ART, nextId: 179, nextPr: 319, sprintDates: 'Nov 17–28',
        goal: { en: 'Sprint goal: ship merchant onboarding and settlement reporting', vi: 'Mục tiêu sprint: hoàn thành onboarding merchant và báo cáo đối soát' },
        menu: [['5', 'Sprint 5 · Nov 29 – Dec 12', 'planned'], ['4', 'Sprint 4 · Nov 17–28'], ['3', 'Sprint 3 · Nov 3–14', 'closed']] },
      'atlas-hr': { prefix: 'AH', tasks: ATLAS_TASKS, art: ATLAS_ART, nextId: 332, nextPr: 415, sprintDates: 'Nov 12–25',
        goal: { en: 'Sprint goal: harden payroll and leave flows, then cut release v2.0', vi: 'Mục tiêu sprint: hardening luồng lương và nghỉ phép, rồi chốt release v2.0' },
        menu: [['10', 'Sprint 10 · Nov 26 – Dec 9', 'planned'], ['9', 'Sprint 9 · Nov 12–25'], ['8', 'Sprint 8 · Oct 29 – Nov 11', 'closed']] },
    };
    const DS = DATASETS[P.id] || DATASETS['lotus-pay'];
    const ARTIFACTS = DS.art;
    const TASKS = LOCKED ? [] : DS.tasks;
    TASKS.forEach(t => { t.pts = t.pts || 3; });

    const F = { q: '', type: 'all', pri: 'all', label: 'all' };
    const V = { view: 'board', group: 'none' };
    const ALL_LABELS = [...new Set(TASKS.flatMap(t => t.labels))].sort();
    let nextId = DS.nextId, nextPr = DS.nextPr;

    /* ------------------------------------------------------------ helpers */
    const $ = id => document.getElementById(id);
    const T = (k, v) => PC.t(k, v);
    const esc = PC.esc;
    const colName = id => T('board.col.' + id);
    const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').split('-').slice(0, 5).join('-');
    const slugOf = t => t.slug || slugify(t.title);
    const branchOf = t => 'agent/' + t.id + '-' + slugOf(t);
    const stepFor = p => [0, 8, 22, 45, 62, 80, 92].reduce((a, th, i) => p >= th ? i : a, 0);
    const visible = t => {
      if (F.q) { const q = F.q.toLowerCase(); if (!(t.id + ' ' + t.title + ' ' + t.labels.join(' ') + ' ' + (t.art || '')).toLowerCase().includes(q)) return false; }
      if (F.type !== 'all' && t.type !== F.type) return false;
      if (F.pri !== 'all' && t.pri !== F.pri) return false;
      if (F.label !== 'all' && !t.labels.includes(F.label)) return false;
      return true;
    };
    const anyFilter = () => F.q || F.type !== 'all' || F.pri !== 'all' || F.label !== 'all';
    /* Single-user app: the only "who" on a card is the agent that executed the task. */
    const AGENTS = { claude: { name: 'Claude Code', initials: 'CC' }, codex: { name: 'Codex', initials: 'CX' } };
    function agentBadge(id, withBy) {
      const a = AGENTS[id]; if (!a) return '';
      return `<span class="agent-b" title="${esc(T('board.by'))} ${esc(a.name)}"><span class="avatar ag-${id}">${a.initials}</span>${withBy ? `<span class="by">${T('board.by')}</span>` : ''}<span class="nm">${a.name}</span></span>`;
    }
    const agentFor = t => ['running', 'review', 'done'].includes(t.col) ? t.agent : null;
    function groupOf(t) {
      if (V.group === 'label') return { k: t.labels[0], label: t.labels[0], o: ALL_LABELS.indexOf(t.labels[0]) };
      if (V.group === 'priority') return { k: t.pri, label: T('board.pri.' + t.pri), o: PRI_ORDER.indexOf(t.pri) };
      if (V.group === 'type') return { k: t.type, label: T('board.type.' + t.type), o: ['feature', 'bug', 'chore'].indexOf(t.type) };
      return null;
    }

    /* ------------------------------------------------------------ render: cards */
    function cardHTML(t) {
      const col = t.col;
      let extra = '';
      if (col === 'running' && t.failed) {
        extra = `<div class="kc-fail"><div class="hd"><i data-lucide="octagon-alert"></i>${T('bd.fail', { p: t.failed.passed, t: t.failed.total })}</div>
          <div class="kc-branch"><i data-lucide="git-branch"></i><span>${esc(branchOf(t))}</span></div>
          <div class="bt"><button class="btn btn-danger" data-retry="${t.id}"><i data-lucide="rotate-cw" class="icon-sm"></i>${T('bd.retry')}</button><a class="btn btn-secondary" href="task.html?p=${P.id}&id=${t.id}"><i data-lucide="scroll-text" class="icon-sm"></i>${T('bd.logs')}</a></div></div>`;
      } else if (col === 'running' && t.rework) {
        const p = t.progress || 0;
        extra = `<div class="kc-rework"><div class="hd"><i data-lucide="message-square-diff"></i>${T('bd.rework')}</div>
          <div class="text-xs text-subtle">${T('bd.attempt', { n: t.rework.attempt })} · ${T('bd.rework.title')}</div>
          <ul>${t.rework.changes.map(c => `<li>${esc(PC.L(c))}</li>`).join('')}</ul>
          <div class="row gap-2" style="font-size:11px;color:var(--warning-fg)"><span class="spinner" style="width:11px;height:11px;border-width:1.5px"></span><span data-step="${t.id}">${T('board.step.' + stepFor(p))}</span><span class="pct" data-pct="${t.id}" style="margin-left:auto;font-weight:600">${p}%</span></div>
          <div class="progress"><span data-bar="${t.id}" style="width:${p}%"></span></div>
          <div class="kc-branch"><i data-lucide="git-branch"></i><span>${esc(branchOf(t))}</span></div></div>`;
      } else if (col === 'running') {
        const p = t.progress || 0;
        extra = `<div class="kc-run"><div class="row gap-2"><span class="spinner" style="width:11px;height:11px;border-width:1.5px"></span><span data-step="${t.id}">${T('board.step.' + stepFor(p))}</span><span class="pct" data-pct="${t.id}">${p}%</span></div>
          <div class="progress"><span data-bar="${t.id}" style="width:${p}%"></span></div>
          <div class="kc-branch"><i data-lucide="git-branch"></i><span>${esc(branchOf(t))}</span></div></div>`;
      } else if (col === 'review' && t.ev) {
        extra = `<div class="kc-ev"><span class="badge badge-success"><i data-lucide="check-circle-2"></i>${T('board.ev.tests', { n: t.ev.tests })}</span><span class="badge"><i data-lucide="image"></i>${T('board.ev.shots', { n: t.ev.shots })}</span><span class="badge"><i data-lucide="file-diff"></i>${T('board.ev.files', { n: t.ev.files })}</span></div>`;
      } else if (col === 'planning' && t.plan) {
        extra = `<span class="kc-plan"><i data-lucide="${t.plan === 'draft' ? 'file-clock' : 'loader'}"></i>${T(t.plan === 'draft' ? 'board.plan.draft' : 'board.plan.drafting')}</span>`;
      } else if (col === 'done' && t.pr) {
        extra = `<div class="row gap-2"><span class="badge ${t.pr.st === 'merged' ? 'badge-purple' : 'badge-success'}"><i data-lucide="${t.pr.st === 'merged' ? 'git-merge' : 'git-pull-request'}"></i>#${t.pr.n} ${T('board.pr.' + t.pr.st)}</span></div>`;
      }
      return `<div class="kcard ${t._new ? 'is-new' : ''} ${t.failed && col === 'running' ? 'is-failed' : ''}" draggable="true" data-id="${t.id}">
        <div class="kc-top"><span class="kc-type kc-${t.type}" title="${T('board.type.' + t.type)}"><i data-lucide="${TYPES[t.type]}"></i></span><span class="kc-id">${t.id}</span>
          <span class="kc-pri pri-${t.pri}" title="${T('board.pri.' + t.pri)}"><i data-lucide="${PRI[t.pri]}"></i></span></div>
        <div class="kc-title">${esc(t.title)}</div>
        <div class="kc-labels">${t.labels.map(l => `<span class="tag">${esc(l)}</span>`).join('')}</div>
        ${t.art ? `<a class="kc-art" href="artifacts.html"><i data-lucide="file-text"></i><span>${esc(t.art)}</span></a>` : ''}
        ${extra}
        <div class="kc-foot">${agentBadge(agentFor(t), false)}<span class="pts">${T('board.pts', { n: t.pts })}</span></div>
      </div>`;
    }

    function renderBoard() {
      $('cols').innerHTML = COLS.map(c => {
        const items = TASKS.filter(t => t.col === c.id && visible(t));
        const total = TASKS.filter(t => t.col === c.id).length;
        const full = c.wip && total >= c.wip;
        let body = '';
        if (!items.length) body = `<div class="kc-empty">${anyFilter() && total ? T('board.nomatch') : T('board.empty')}</div>`;
        else if (V.group !== 'none') {
          const groups = {};
          items.forEach(t => { const g = groupOf(t); (groups[g.k] = groups[g.k] || { g, items: [] }).items.push(t); });
          body = Object.values(groups).sort((a, b) => a.g.o - b.g.o).map(x => `<div class="kc-group">${esc(x.g.label)}<span class="text-faint">${x.items.length}</span></div>${x.items.map(cardHTML).join('')}`).join('');
        } else body = items.map(cardHTML).join('');
        return `<section class="kcol" data-col="${c.id}" style="--c:${c.c}">
          <div class="kcol-head"><i data-lucide="${c.icon}" class="ic"></i><b title="${T('board.coltip.' + c.id)}">${colName(c.id)}</b>
            <span class="kcol-count ${full ? 'is-full' : ''}" ${c.wip ? `title="${T('board.wip', { n: c.wip })}"` : ''}>${c.wip ? total + '/' + c.wip : items.length}</span>
            <span class="grow"></span>${c.id === 'backlog' ? `<button class="btn btn-ghost btn-icon btn-sm" data-act="new" style="width:24px;height:24px"><i data-lucide="plus"></i></button>` : ''}
          </div>
          <div class="kcol-bar"></div>
          <div class="kcol-body" data-body="${c.id}">${body}</div></section>`;
      }).join('');
      TASKS.forEach(t => delete t._new);
      PC.refresh($('cols'));
    }

    function renderList() {
      const items = TASKS.filter(visible);
      const rows = []; let last = null;
      const order = COLS.map(c => c.id);
      const sorted = items.slice().sort((a, b) => V.group !== 'none' ? (groupOf(a).o - groupOf(b).o) || (order.indexOf(a.col) - order.indexOf(b.col)) : order.indexOf(a.col) - order.indexOf(b.col));
      sorted.forEach(t => {
        const g = V.group !== 'none' ? groupOf(t) : null;
        if (g && g.k !== last) { rows.push(`<tr class="grp"><td colspan="7">${esc(g.label)}</td></tr>`); last = g.k; }
        const c = COLS.find(x => x.id === t.col);
        rows.push(`<tr data-id="${t.id}">
          <td><span class="kc-id">${t.id}</span></td>
          <td><div class="row gap-2"><span class="kc-type kc-${t.type}"><i data-lucide="${TYPES[t.type]}"></i></span><span style="font-weight:500;color:var(--fg-strong)">${esc(t.title)}</span></div></td>
          <td><span class="st-pill"><i data-lucide="${t.failed ? 'octagon-alert' : c.icon}" class="icon-sm" style="color:${t.failed ? 'var(--danger)' : c.c}"></i>${colName(t.col)}${t.failed ? ` <span class="badge badge-danger">${T('bd.fail', { p: t.failed.passed, t: t.failed.total })}</span>` : ''}</span></td>
          <td><span class="kc-pri pri-${t.pri}" style="margin:0"><i data-lucide="${PRI[t.pri]}"></i>${T('board.pri.' + t.pri)}</span></td>
          <td>${agentFor(t) ? agentBadge(agentFor(t)) : '<span class="text-faint">—</span>'}</td>
          <td><div class="kc-labels">${t.labels.map(l => `<span class="tag">${esc(l)}</span>`).join('')}</div></td>
          <td>${t.art ? `<a class="kc-art" href="artifacts.html"><i data-lucide="file-text"></i><span>${esc(t.art)}</span></a>` : '<span class="text-faint">—</span>'}</td></tr>`);
      });
      $('cols').className = 'bd-list';
      $('cols').innerHTML = `<div class="table-wrap"><table class="table"><thead><tr><th>${T('board.th.id')}</th><th>${T('board.th.title')}</th><th>${T('board.th.status')}</th><th>${T('board.th.priority')}</th><th>${T('board.th.agent')}</th><th>${T('board.th.labels')}</th><th>${T('board.th.artifact')}</th></tr></thead><tbody>${rows.join('') || `<tr><td colspan="7" class="text-subtle" style="text-align:center;padding:32px">${T('board.nomatch')}</td></tr>`}</tbody></table></div>`;
      PC.refresh($('cols'));
    }
    function render() { if (V.view === 'list') renderList(); else { $('cols').className = 'bd-cols'; renderBoard(); } }

    /* ------------------------------------------------------------ toolbar */
    const filterLabel = (kind, v) => v === 'all' ? T('board.f.all') : kind === 'type' ? T('board.type.' + v) : kind === 'label' ? v : T('board.pri.' + v);
    function renderToolbar() {
      const btn = (kind, ic, key, val) => `<button class="btn btn-secondary fbtn ${val !== 'all' ? 'is-on' : ''}" data-filter="${kind}"><i data-lucide="${ic}" class="icon-sm"></i>${T(key)}${val !== 'all' ? `<span class="v">· ${esc(filterLabel(kind, val))}</span>` : ''}</button>`;
      $('filters').innerHTML = btn('type', 'shapes', 'board.f.type', F.type) + btn('pri', 'signal-high', 'board.f.priority', F.pri) + btn('label', 'tag', 'board.f.label', F.label)
        + (anyFilter() ? `<button class="btn btn-ghost fbtn" data-filter="clear"><i data-lucide="x" class="icon-sm"></i>${T('board.f.clear')}</button>` : '');
      $('groupBtn').innerHTML = `<i data-lucide="layers" class="icon-sm"></i>${T('board.group')}<span class="v">· ${T('board.group.' + V.group)}</span>`;
      $('groupBtn').classList.toggle('is-on', V.group !== 'none');
      $('sprintLabel').textContent = 'Sprint ' + SD.sprint.n + ' · ' + DS.sprintDates;
      $('sprintDay').textContent = T('board.sprint.day', { d: SD.sprint.day, n: SD.sprint.days });
      $('sprintPts').innerHTML = '<i data-lucide="target"></i>' + SD.sprint.done + '/' + SD.sprint.points + ' ' + (PC.lang === 'vi' ? 'điểm' : 'pts');
      $('goalText').textContent = PC.L(DS.goal);
      PC.refresh($('filters')); PC.refresh($('groupBtn'));
    }
    const menuItems = (opts, cur) => opts.map(o => o.sep ? '<div class="menu-sep"></div>' : `<button class="menu-item" data-v="${o.v}">${o.icon ? `<i data-lucide="${o.icon}"></i>` : ''}<span>${esc(o.label)}</span>${cur === o.v ? '<i data-lucide="check" style="margin-left:auto;color:var(--brand-fg)"></i>' : ''}</button>`).join('');
    function openFilter(anchor, kind) {
      if (kind === 'clear') { F.q = ''; $('q').value = ''; F.type = F.pri = F.label = 'all'; renderToolbar(); render(); return; }
      let opts;
      if (kind === 'label') opts = [{ v: 'all', label: T('board.f.all') }, ...ALL_LABELS.map(k => ({ v: k, label: k, icon: 'tag' }))];
      else if (kind === 'type') opts = [{ v: 'all', label: T('board.f.all') }, ...Object.keys(TYPES).map(k => ({ v: k, label: T('board.type.' + k), icon: TYPES[k] }))];
      else opts = [{ v: 'all', label: T('board.f.all') }, ...PRI_ORDER.map(k => ({ v: k, label: T('board.pri.' + k), icon: PRI[k] }))];
      PC.popover(anchor, menuItems(opts, F[kind]), v => { F[kind] = v; renderToolbar(); render(); });
    }

    /* ------------------------------------------------------------ moves */
    function doMove(t, col, beforeId, opts) {
      const from = t.col;
      TASKS.splice(TASKS.indexOf(t), 1);
      const bi = beforeId ? TASKS.findIndex(x => x.id === beforeId) : -1;
      if (bi >= 0) TASKS.splice(bi, 0, t); else TASKS.push(t);
      t.col = col; t._new = from !== col;
      if (col === 'running' && from !== 'running') { delete t.failed; delete t.rework; }
      if (col === 'running') { t.progress = t.failed ? undefined : (from === 'running' ? t.progress : 2); t.agent = (opts && opts.agent) || t.agent || 'claude'; t.slug = (opts && opts.slug) || slugOf(t); }
      if (['review', 'done'].includes(col) && !t.agent) t.agent = 'claude';
      if (['backlog', 'ready', 'planning'].includes(col)) delete t.agent;
      if (col !== 'running') { delete t.progress; delete t.failed; delete t.rework; }
      if (col === 'review' && !t.ev) t.ev = { tests: '6/6', shots: 2, files: 5 };
      if (col === 'done' && !t.pr) t.pr = { n: nextPr++, st: 'open' };
      if (col !== 'done') delete t.pr;
      if (col === 'planning' && !t.plan) t.plan = 'drafting';
      render();
      if (from !== col) PC.toast(T('board.t.moved', { id: '<b>' + t.id + '</b>', col: '<b>' + colName(col) + '</b>' }), { icon: 'move-right' });
    }
    function requestMove(id, col, beforeId) {
      const t = TASKS.find(x => x.id === id); if (!t) return;
      if (t.col === col) { doMove(t, col, beforeId); return; }
      if (col === 'done' && t.col !== 'review') { PC.toast(T('board.t.guard'), { tone: 'warning', icon: 'shield-alert', duration: 3800 }); return; }
      if (col === 'running') { confirmAgent(t); return; }
      doMove(t, col, beforeId);
    }
    function confirmAgent(t) {
      const MODELS = { claude: ['claude-opus-5-5', 'claude-sonnet-5-5'], codex: ['gpt-5-codex'] };
      const noPlan = ['backlog', 'ready'].includes(t.col) || (t.col === 'planning' && t.plan);
      const m = PC.modal({
        title: T('board.a.title'), width: 560,
        body: `<p class="text-sm text-muted">${T('board.a.desc', { base: '<code>develop</code>' })}</p>
          ${noPlan ? `<div class="alert alert-warning mb-4" style="margin-bottom:12px"><i data-lucide="triangle-alert"></i><span>${T('board.a.noplan')}</span></div>` : ''}
          <div class="row gap-3" style="margin-bottom:10px;align-items:stretch">
            <div class="field grow"><label class="label">${T('board.a.cli')}</label><select class="select" id="aCli"><option value="claude">Claude Code</option><option value="codex">Codex CLI</option></select></div>
            <div class="field grow"><label class="label">${T('board.a.model')}</label><select class="select" id="aModel"></select></div></div>
          <div class="kv-line"><span class="k">${T('board.a.branch')}</span><code id="aBranch"></code></div>
          <div class="kv-line"><span class="k">${T('board.a.base')}</span><code>develop</code></div>
          <div class="kv-line"><span class="k">${T('board.a.worktree')}</span><code id="aWt"></code></div>
          <div class="kv-line"><span class="k">${T('board.a.home')}</span><code id="aHome"></code></div>
          <label class="switch mt-4" style="margin-top:12px"><input type="checkbox" checked><span>${T('board.a.verify')}</span></label>`,
        actions: [
          { label: T('common.cancel'), kind: 'secondary' },
          { label: T('board.a.start'), kind: 'primary', icon: 'play', onClick: ov => {
            const cli = ov.querySelector('#aCli').value;
            doMove(t, 'running', null, { agent: cli });
            t.cli = cli;
            PC.toast(T('board.t.started', { id: '<b>' + t.id + '</b>', branch: '<span class="mono">' + esc(branchOf(t)) + '</span>' }), { icon: 'bot', tone: 'success' });
          } },
        ]
      });
      const upd = () => {
        const cli = m.el.querySelector('#aCli').value;
        m.el.querySelector('#aModel').innerHTML = MODELS[cli].map(x => `<option>${x}</option>`).join('');
        m.el.querySelector('#aBranch').textContent = branchOf(t);
        m.el.querySelector('#aWt').textContent = PC.project().dir + '\\.procheck\\worktrees\\' + t.id;
        m.el.querySelector('#aHome').textContent = PC.projectCli(cli);
      };
      m.el.querySelector('#aCli').addEventListener('change', upd); upd();
    }

    /* drag & drop */
    let dragId = null, ph = null;
    function clearOver() { document.querySelectorAll('.kcol.is-over').forEach(c => c.classList.remove('is-over')); document.querySelectorAll('.kc-empty').forEach(x => x.style.display = ''); if (ph) { ph.remove(); ph = null; } }
    document.addEventListener('dragstart', e => {
      const c = e.target.closest && e.target.closest('.kcard'); if (!c) return;
      dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
      setTimeout(() => c.classList.add('dragging'), 0);
    });
    document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); clearOver(); });
    document.addEventListener('dragover', e => {
      const col = e.target.closest && e.target.closest('.kcol'); if (!col || !dragId) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      if (!col.classList.contains('is-over')) { document.querySelectorAll('.kcol.is-over').forEach(c => c.classList.remove('is-over')); col.classList.add('is-over'); }
      const body = col.querySelector('.kcol-body');
      const cards = [...body.querySelectorAll('.kcard:not(.dragging)')];
      const after = cards.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      if (!ph) { ph = document.createElement('div'); ph.className = 'kc-ph'; }
      if (after) body.insertBefore(ph, after); else body.appendChild(ph);
      body.querySelectorAll('.kc-empty').forEach(x => x.style.display = 'none');
    });
    document.addEventListener('dragleave', e => {
      const col = e.target.closest && e.target.closest('.kcol'); if (!col) return;
      if (!col.contains(e.relatedTarget)) { col.classList.remove('is-over'); if (ph && col.contains(ph)) { ph.remove(); ph = null; } col.querySelectorAll('.kc-empty').forEach(x => x.style.display = ''); }
    });
    document.addEventListener('drop', e => {
      const col = e.target.closest && e.target.closest('.kcol'); if (!col || !dragId) return;
      e.preventDefault();
      const nxt = ph && ph.nextElementSibling; const beforeId = nxt && nxt.classList.contains('kcard') ? nxt.dataset.id : null;
      const id = dragId; dragId = null; clearOver();
      requestMove(id, col.dataset.col, beforeId);
    });

    /* ------------------------------------------------------------ new task */
    function newTask() {
      const m = PC.modal({
        title: T('board.n.title'), width: 600,
        body: `<div class="col gap-3" style="gap:14px">
          <div class="field"><label class="label">${T('board.n.f.title')}</label><input class="input" id="nTitle" placeholder="${esc(T('board.n.f.title.ph'))}"></div>
          <div class="field"><label class="label">${T('board.n.f.desc')}</label><textarea class="textarea" id="nDesc" placeholder="${esc(T('board.n.f.desc.ph'))}"></textarea></div>
          <div class="grid grid-3" style="gap:12px">
            <div class="field"><label class="label">${T('board.n.f.type')}</label><select class="select" id="nType">${Object.keys(TYPES).map(k => `<option value="${k}">${T('board.type.' + k)}</option>`).join('')}</select></div>
            <div class="field"><label class="label">${T('board.n.f.pri')}</label><select class="select" id="nPri">${['medium', 'urgent', 'high', 'low'].map(k => `<option value="${k}">${T('board.pri.' + k)}</option>`).join('')}</select></div>
            <div class="field"><label class="label">${T('board.n.f.art')}</label><select class="select" id="nArt"><option value="">${T('board.n.f.none')}</option>${ARTIFACTS.map(a => `<option>${esc(a)}</option>`).join('')}</select></div></div>
          <div class="field"><div class="row between"><label class="label">${T('board.n.f.ac')}</label><button type="button" class="btn btn-soft btn-sm" id="nAi"><i data-lucide="sparkles"></i>${T('board.n.f.ai')}</button></div>
            <textarea class="textarea" id="nAc" placeholder="${esc(T('board.n.f.ac.ph'))}"></textarea></div></div>`,
        actions: [
          { label: T('common.cancel'), kind: 'secondary' },
          { label: T('board.n.create'), kind: 'primary', icon: 'plus', onClick: ov => {
            const title = ov.querySelector('#nTitle').value.trim();
            if (!title) { ov.querySelector('#nTitle').classList.add('is-invalid'); ov.querySelector('#nTitle').focus(); PC.toast(T('board.t.titlereq'), { tone: 'warning', icon: 'circle-alert' }); return false; }
            const t = { id: DS.prefix + '-' + nextId++, title, type: ov.querySelector('#nType').value, pri: ov.querySelector('#nPri').value, labels: ['new'], art: ov.querySelector('#nArt').value || undefined, col: 'backlog', pts: 3, _new: true };
            TASKS.unshift(t); render();
            PC.toast(T('board.t.created', { id: '<b>' + t.id + '</b>' }), { tone: 'success', icon: 'plus-circle' });
          } },
        ]
      });
      m.el.querySelector('#nAi').onclick = () => {
        m.el.querySelector('#nAc').value = PC.lang === 'vi'
          ? 'Người dùng thực hiện được luồng chính mà không có lỗi\nCó thông báo lỗi rõ ràng khi dữ liệu không hợp lệ\nCó test e2e bao phủ luồng chính và ca lỗi'
          : 'User can complete the main flow without errors\nClear error messages are shown for invalid input\nE2E tests cover the happy path and failure cases';
        PC.toast(T('board.t.ai'), { icon: 'sparkles' });
      };
      m.el.querySelector('#nTitle').focus();
    }

    /* ------------------------------------------------------------ events */
    document.addEventListener('click', e => {
      const rt = e.target.closest('[data-retry]');
      if (rt) {
        const t = TASKS.find(x => x.id === rt.dataset.retry); if (!t) return;
        const n = (t.failed ? t.failed.attempt : 1) + 1; delete t.failed; t.progress = 3; t.rework = null; delete t.rework; t.retry = n;
        PC.toast(T('bd.t.retry', { id: '<b>' + t.id + '</b>', n }), { icon: 'rotate-cw', tone: 'success' }); render(); renderRelease(); return;
      }
      const f = e.target.closest('[data-filter]'); if (f) { openFilter(f, f.dataset.filter); return; }
      if (e.target.closest('#groupBtn')) {
        const opts = ['none', 'type', 'priority', 'label'].map(k => ({ v: k, label: T('board.group.' + k), icon: { none: 'ban', label: 'tag', priority: 'signal-high', type: 'shapes' }[k] }));
        PC.popover($('groupBtn'), `<div class="menu-label">${T('board.group')}</div>` + menuItems(opts, V.group), v => { V.group = v; renderToolbar(); render(); }); return;
      }
      if (e.target.closest('#sprintBtn')) {
        const cur = String(SD.sprint.n);
        const opts = DS.menu.map(m => ({ v: m[0], label: m[1] + (m[2] ? ' (' + T('board.sprint.' + m[2]) + ')' : '') }));
        PC.popover($('sprintBtn'), menuItems(opts, cur), v => { if (v !== cur) PC.toast(T('bd.sprint.only', { n: cur }), { icon: 'info' }); }); return;
      }
      const seg = e.target.closest('#viewSeg [data-view]');
      if (seg) { V.view = seg.dataset.view; document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('is-active', b === seg)); render(); return; }
      if (e.target.closest('#newBtn') || e.target.closest('[data-act="new"]')) { newTask(); return; }
      if (e.target.closest('a') || e.target.closest('button')) return;
      const card = e.target.closest('.kcard, tr[data-id]');
      if (card && card.dataset.id) location.href = 'task.html?p=' + P.id + '&id=' + card.dataset.id;
    });
    /* ------------------------------------------------------------ release readiness (atlas) */
    function renderRelease() {
      const el = $('relBanner'), R = SD.release;
      if (!R) { el.innerHTML = ''; return; }
      const failed = TASKS.filter(t => t.failed && t.col === 'running').length;
      const rework = TASKS.filter(t => t.rework && t.col === 'running').length;
      const chips = [`<span class="chip"><i data-lucide="target"></i>${T('bd.release.pts', { d: SD.sprint.done, t: SD.sprint.points })}</span>`];
      if (failed) chips.push(`<a class="chip is-danger" href="task.html?p=${P.id}&id=${SD.hero.id}"><i data-lucide="octagon-alert"></i>${T('bd.release.blocker', { n: failed })} · ${SD.hero.id}</a>`);
      if (rework) chips.push(`<span class="chip is-warn"><i data-lucide="message-square-diff"></i>${T('bd.release.changes', { n: rework })} · ${SD.changesRequested.id}</span>`);
      chips.push(`<span class="chip"><i data-lucide="calendar-check"></i>${T('bd.release.due', { d: PC.lang === 'vi' ? '28/11' : 'Nov 28' })}</span>`);
      el.innerHTML = `<div class="rel"><span class="ic"><i data-lucide="rocket"></i></span>
        <div class="tt"><b>${T('bd.release', { v: R.name })} · ${T('bd.release.ready', { p: R.readiness })}</b><small>${T('bd.release.sub', { n: SD.sprint.n })}</small></div>
        <div class="bar"><div class="progress"><span style="width:${R.readiness}%"></span></div></div>
        <div class="chips">${chips.join('')}</div></div>`;
      PC.refresh(el);
    }

    /* ------------------------------------------------------------ locked state (same visual as scaffolding.html) */
    const PH_META = { release: { icon: 'blocks', c: 'var(--phase-release)', b: 'var(--phase-release)' }, sdlc: { icon: 'infinity', c: 'var(--accent-teal-fg)', b: 'var(--accent-teal)' }, initial: { b: 'var(--phase-initial)' } };
    const LK_ICON = { done: 'check-circle-2', review: 'eye', wip: 'loader-circle', todo: 'circle-dashed', wait: 'hourglass', run: 'loader-circle', locked: 'lock' };
    function lockedHTML(c) {
      const m = PH_META[c.phase], met = c.pre.filter(r => r.st === 'done').length;
      const pre = c.pre.map(r => `<li class="k-${r.st}">${r.st === 'run' ? '<span class="spinner"></span>' : `<i data-lucide="${LK_ICON[r.st]}"></i>`}<span class="tx">${esc(r.label)}${r.detail ? `<small>${esc(r.detail)}</small>` : ''}</span><span class="st">${r.stLabel || T('lk.st.' + r.st)}</span></li>`).join('');
      const prev = c.prev.map(b => `<div class="lk-bar" style="--_b:${PH_META[b.phase].b}"><div class="row between"><span>${T('phase.' + b.phase)} · <b>${b.pct}%</b></span><span class="text-subtle">${esc(b.note)}</span></div><div class="progress" style="margin-top:4px"><span style="width:${b.pct}%"></span></div></div>`).join('');
      return `<div class="lk" style="--_c:${m.c}">
        <div class="lk-bg" aria-hidden="true">${c.bg}</div>
        <div class="lk-wrap">
          <section class="lk-card">
            <div class="lk-hero">
              <div class="lk-ic"><i data-lucide="${m.icon}"></i><span class="lk-pad"><i data-lucide="lock"></i></span></div>
              <div class="grow"><span class="phase-chip phase-${c.phase}">${T('phase.' + c.phase)}</span><h2 class="lk-title">${T('lk.title', { phase: T('phase.' + c.phase) })}</h2><p class="lk-gate">${esc(c.gate)}</p></div>
              <span class="badge badge-outline"><i data-lucide="lock"></i>${T('lk.badge')}</span>
            </div>
            ${c.note ? `<div class="lk-note"><i data-lucide="sparkles"></i><span>${esc(c.note)}</span></div>` : ''}
            <div class="lk-cols">
              <div class="lk-col"><h5>${T('lk.does')}</h5><ul class="lk-does">${c.does.map((d, i) => `<li><span class="n">${i + 1}</span><span>${esc(d)}</span></li>`).join('')}</ul></div>
              <div class="lk-col"><div class="row between"><h5>${T('lk.pre')}</h5><span class="text-xs text-subtle" style="margin-bottom:12px">${T('lk.met', { n: met, m: c.pre.length })}</span></div><ul class="lk-pre">${pre}</ul></div>
            </div>
            <div class="lk-foot">
              <div class="lk-prev"><span class="cap">${T('lk.prev')}</span>${prev}</div>
              <div class="row gap-2 wrap"><a class="btn btn-secondary" href="overview.html?p=${P.id}">${T('lk.view')}</a><a class="btn btn-primary btn-lg" href="${c.cta.href}">${esc(c.cta.label)}<i data-lucide="arrow-right"></i></a></div>
            </div>
          </section>
          <div class="lk-cap"><i data-lucide="eye"></i>${T('lk.cap')}</div>
        </div>
      </div>`;
    }
    const sk = (w, h, extra) => `<div class="sk" style="width:${w};height:${h};${extra || ''}"></div>`;
    function boardSkeleton() {
      const card = h => `<div class="sk-card" style="padding:12px;gap:8px"><div class="sk-row">${sk('20px', '20px')}${sk('46px', '11px')}<span class="grow"></span>${sk('14px', '14px')}</div>${sk('90%', '12px')}${sk('64%', '12px')}<div class="sk-row">${sk('44px', '16px')}${sk('52px', '16px')}</div>${h ? sk('100%', '38px') : ''}</div>`;
      const cols = [[1, 1, 1, 0], [1, 1, 0], [1, 0], [1, 1], [1], [1, 1, 1]];
      return `<div class="sk-row" style="margin-bottom:16px">${sk('150px', '28px')}${sk('140px', '30px')}${sk('90px', '24px', 'border-radius:999px')}<span class="grow"></span>${sk('110px', '30px')}</div>
        <div class="sk-row" style="align-items:stretch;gap:12px">${cols.map(c => `<div style="flex:1;min-width:0;background:var(--bg-surface-2);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;gap:8px">${sk('55%', '14px')}${c.map(card).join('')}</div>`).join('')}</div>`;
    }
    function solved() { return P.state.scaffolding.status; }
    function lockedPrereqs() {
      const I = P.state.initial, SC = P.state.scaffolding;
      if (SC.status === 'locked') {
        const map = { done: 'done', in_review: 'review', in_progress: 'wip', not_started: 'todo' };
        const ph = T('lk.st.locked');
        return [
          { st: map[(I.steps || {}).signoff] || 'todo', label: T('bd.pre.sow'), detail: T('bd.pre.sow.d') },
          { st: 'locked', label: T('bd.pre.solution'), detail: T('bd.pre.locked') }, { st: 'locked', label: T('bd.pre.repo') },
          { st: 'locked', label: T('bd.pre.infra') }, { st: 'locked', label: T('bd.pre.dev') },
        ];
      }
      /* scaffolding is in progress (mekong): real step status */
      const stMap = { done: 'done', running: 'run', pending: 'todo' };
      const adr4 = (SC.architecture || []).find(a => a.id === 'adr-004'), adrOk = !adr4 || adr4.status === 'approved';
      const rows = Object.keys(SC.steps).map((id, i) => {
        let st = stMap[SC.steps[id]] || 'todo', detail = '', label = T('sc.step.' + id);
        if (st === 'run') detail = T('bd.pre.run', { p: SC.run.progress });
        if (id === 'devcontainer' && !adrOk) { st = 'wait'; detail = T('bd.pre.blocked'); }
        return { st, label: (i + 1) + '. ' + label, detail };
      });
      if (!adrOk) rows.splice(0, 0, { st: 'wait', label: T('bd.pre.adr4'), detail: T('bd.pre.adr4.d') });
      return rows;
    }
    function renderLocked() {
      const I = P.state.initial, SC = P.state.scaffolding, scLocked = SC.status === 'locked';
      let prev, cta, note;
      if (scLocked) {
        const done = Object.values(I.steps || {}).filter(v => v === 'done').length;
        prev = [{ phase: 'initial', pct: P.progress.initial, note: T('lk.steps', { d: done, n: 5 }) }, { phase: 'release', pct: P.progress.release, note: T('lk.locked') }];
        cta = { href: 'initial.html?p=' + P.id, label: T('lk.cta', { phase: T('phase.initial') }) };
        note = I.requirements ? T('bd.lk.seed.n', { n: I.requirements }) : T('bd.lk.seed.none');
      } else {
        const stepsDone = Object.values(SC.steps).filter(v => v === 'done').length;
        prev = [{ phase: 'release', pct: P.progress.release, note: T('lk.steps', { d: stepsDone, n: 6 }) }];
        cta = { href: 'scaffolding.html?p=' + P.id, label: T('lk.cta', { phase: T('phase.release') }) };
        note = T('bd.lk.seed.ok');
      }
      $('boardRoot').classList.add('hidden'); $('lockedRoot').classList.remove('hidden');
      $('lockedRoot').innerHTML = lockedHTML({ phase: 'sdlc', gate: PC.L(SD.gate), note, does: [T('bd.lk.do1'), T('bd.lk.do2'), T('bd.lk.do3')], pre: lockedPrereqs(), prev, cta, bg: boardSkeleton() });
      PC.refresh($('lockedRoot'));
    }

    PC.onReady(() => {
      if (LOCKED) { renderLocked(); setAssistant(); return; }
      $('q').addEventListener('input', e => { F.q = e.target.value.trim(); renderToolbar(); render(); });
      renderToolbar(); render(); renderRelease(); setAssistant();
      // simulate live agent progress (failed runs stay halted)
      setInterval(() => {
        TASKS.filter(t => t.col === 'running' && !t.failed).forEach(t => {
          t.progress = Math.min(96, (t.progress || 0) + 1 + Math.floor(Math.random() * 3));
          const bar = document.querySelector(`[data-bar="${t.id}"]`); if (!bar) return;
          bar.style.width = t.progress + '%';
          const pct = document.querySelector(`[data-pct="${t.id}"]`); if (pct) pct.textContent = t.progress + '%';
          const st = document.querySelector(`[data-step="${t.id}"]`); if (st) st.textContent = T('board.step.' + stepFor(t.progress));
        });
      }, 2500);
    });
    function setAssistant() {
      const vi = PC.lang === 'vi';
      if (LOCKED) {
        PC.assistant.setContext([{ icon: 'lock', label: vi ? 'SDLC đã khoá' : 'SDLC locked' }, { icon: 'blocks', label: PC.L(SD.gate) }]);
        PC.assistant.setSuggestions(vi ? ['Còn thiếu gì để mở khoá?', 'Backlog sẽ được tạo thế nào?'] : ['What is missing to unlock this?', 'How will the backlog be seeded?']);
        return;
      }
      const run = TASKS.filter(t => t.col === 'running').length, rev = TASKS.filter(t => t.col === 'review').length;
      PC.assistant.setContext([{ icon: 'kanban', label: 'Sprint ' + SD.sprint.n }, { icon: 'bot', label: vi ? run + ' agent đang chạy' : run + ' agents running' }, { icon: 'eye', label: vi ? rev + ' chờ review' : rev + ' in review' }]);
      PC.assistant.setSuggestions(P.id === 'atlas-hr'
        ? (vi ? ['Vì sao AH-311 bị lỗi?', 'Release v2.0 còn thiếu gì?', 'Tóm tắt các lượt chạy agent'] : ['Why did AH-311 fail?', 'What blocks release v2.0?', 'Summarize agent runs'])
        : (vi ? ['Task nào đang bị chặn?', 'Lập kế hoạch Sprint 5', 'Tóm tắt các lượt chạy agent'] : ['Which tasks are blocked?', 'Plan Sprint 5', 'Summarize agent runs']));
    }
    document.addEventListener('pc:lang', () => { if (LOCKED) { renderLocked(); setAssistant(); return; } renderToolbar(); render(); renderRelease(); setAssistant(); });
  </script>
</body>
</html>
