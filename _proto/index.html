<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    .canvas { container-type: inline-size; }

    /* ---------- Hero ---------- */
    .hero { position: relative; border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); background: var(--gradient-hero), var(--bg-surface); padding: var(--space-8); margin-bottom: var(--space-6); overflow: hidden; }
    .hero .kicker { display: inline-flex; align-items: center; gap: 6px; margin-bottom: var(--space-2); }
    .hero h1 { font-size: var(--text-3xl); font-weight: var(--weight-semibold); letter-spacing: -0.02em; }
    .hero .lead { margin: var(--space-2) 0 0; max-width: 620px; }
    .quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-6); }
    .qa { display: flex; align-items: center; gap: var(--space-3); padding: 14px 16px; text-align: left; border-radius: var(--radius-lg); border: 1px solid var(--border-default); background: color-mix(in srgb, var(--bg-surface) 84%, transparent); backdrop-filter: blur(6px); cursor: pointer; color: var(--fg-default); text-decoration: none !important; transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast); font: inherit; }
    .qa:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .qa .ico { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--brand-soft); color: var(--brand-fg); flex-shrink: 0; }
    .qa.is-primary { border-color: transparent; background: var(--brand); color: var(--fg-on-brand); box-shadow: var(--shadow-md); }
    .qa.is-primary:hover { background: var(--brand-hover); }
    .qa.is-primary .ico { background: rgba(255,255,255,.18); color: var(--fg-on-brand); }
    .qa.is-primary .qa-d { color: rgba(255,255,255,.8); }
    .qa-t, .qa-d { display: block; }
    .qa-t { font-size: var(--text-md); font-weight: var(--weight-semibold); line-height: 1.3; }
    .qa-d { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.4; margin-top: 2px; }
    .qa .chev { margin-left: auto; opacity: .6; }

    /* ---------- Stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); margin-bottom: var(--space-6); }
    .stat-card { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-5); }
    .stat-ico { width: 32px; height: 32px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--brand-soft); color: var(--brand-fg); }
    .stat-ico.purple { background: var(--accent-purple-soft); color: var(--accent-purple); }
    .stat-ico.teal { background: var(--accent-teal-soft); color: var(--accent-teal-fg); }

    /* ---------- Continue ---------- */
    .cont { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.7fr) auto; gap: var(--space-6); align-items: center; padding: var(--space-5) var(--space-6); margin-bottom: var(--space-8); color: inherit; text-decoration: none !important; background: var(--gradient-hero), var(--bg-surface); }
    .cont .project-avatar { width: 48px; height: 48px; border-radius: 12px; font-size: 15px; }
    .cont-name { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.3; }
    .cont-last { display: flex; align-items: center; gap: 6px; margin-top: var(--space-3); font-size: var(--text-xs); color: var(--fg-subtle); }
    .cont-phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
    .cph .cph-head { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-default); margin-bottom: 8px; }
    .cph .cph-head svg { width: 14px; height: 14px; }
    .cph .cph-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: var(--text-2xs); color: var(--fg-subtle); }
    .cph .cph-meta b { color: var(--fg-default); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }

    /* ---------- Main grid ---------- */
    .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-8); align-items: start; }
    .side-col { display: flex; flex-direction: column; gap: var(--space-6); }
    .toolbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
    .toolbar .search { flex: 1 1 200px; min-width: 160px; }
    .toolbar .select { width: 176px; }
    .tabs.filter { margin-bottom: var(--space-4); }
    .view-btn { width: 30px; padding: 0 !important; justify-content: center; }

    /* project card (grid) */
    .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .pcard { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4) var(--space-5); color: inherit; text-decoration: none !important; }
    .pcard .project-avatar { width: 40px; height: 40px; border-radius: 10px; font-size: 13px; }
    .pname { font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.3; }
    .pclient { font-size: var(--text-xs); color: var(--fg-subtle); }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .seg > span { height: 5px; border-radius: 4px; background: var(--bg-surface-3); position: relative; overflow: hidden; }
    .seg > span > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; }
    .seg-labels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; font-size: var(--text-2xs); color: var(--fg-subtle); font-weight: var(--weight-medium); }
    .seg-labels span { display: flex; flex-direction: column; }
    .seg-labels b { color: var(--fg-default); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
    .pmeta { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--fg-subtle); }
    .pmeta .repo { flex: 1 1 auto; display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
    .pmeta .repo.none { font-family: var(--font-sans); color: var(--fg-faint); }
    .pmeta .repo svg, .upd svg { width: 12px; height: 12px; }
    .upd { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; margin-left: auto; }
    .pfoot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .pdir { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 10px; border-radius: var(--radius-md); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
    .pdir svg { width: 13px; height: 13px; color: var(--fg-subtle); }
    .pcount { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .pcount svg { width: 12px; height: 12px; }
    .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .phase-chip { white-space: nowrap; }
    .new-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); min-height: 150px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-lg); color: var(--fg-subtle); background: transparent; text-decoration: none !important; text-align: center; padding: var(--space-5); transition: border-color var(--dur-fast), color var(--dur-fast), background var(--dur-fast); }
    .new-card:hover { border-color: var(--brand); color: var(--brand-fg); background: var(--brand-soft); }
    .new-card .plus { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-surface-3); }

    /* project row (list) */
    .plist { display: flex; flex-direction: column; gap: var(--space-2); }
    .prow, .plist-head { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.7fr) minmax(0, 1.1fr) 120px 92px; gap: var(--space-4); align-items: center; }
    .seg-labels svg { width: 10px; height: 10px; vertical-align: -1px; color: var(--fg-faint); }
    .seg-labels .is-lock { color: var(--fg-faint); }
    .pstate { display: flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--fg-default); font-weight: var(--weight-medium); min-width: 0; }
    .pstate .sd { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ph); }
    .pstate .sd.live { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ph) 22%, transparent); }
    .phc-initial { --ph: var(--phase-initial); } .phc-release { --ph: var(--phase-release); } .phc-sdlc { --ph: var(--phase-sdlc); }
    .att-flag { display: inline-flex; align-items: center; gap: 4px; }
    .upd-flag { margin-left: auto; }
    /* lifecycle strip */
    .life { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr) 24px minmax(0, 1fr); align-items: stretch; margin-bottom: var(--space-6); }
    .life-c { display: flex; align-items: center; gap: var(--space-3); padding: 12px var(--space-4); text-align: left; cursor: pointer; font: inherit; color: inherit; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); transition: border-color var(--dur-fast), box-shadow var(--dur-fast), background var(--dur-fast); min-width: 0; }
    .life-c:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .life-c.is-on { border-color: var(--ph); background: color-mix(in srgb, var(--ph) 9%, var(--bg-surface)); box-shadow: var(--shadow-sm); }
    .life-n { font-size: var(--text-2xl); font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; line-height: 1; min-width: 22px; }
    .life-ic { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--ph) 16%, transparent); color: var(--ph); flex-shrink: 0; }
    .life-t { display: block; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .life-d { display: block; font-size: var(--text-2xs); color: var(--fg-subtle); }
    .life-av { margin-left: auto; display: flex; flex-shrink: 0; }
    .life-av .project-avatar { width: 24px; height: 24px; border-radius: 7px; font-size: 9px; border: 2px solid var(--bg-surface); margin-left: -6px; }
    .life-arrow { display: flex; align-items: center; justify-content: center; color: var(--fg-faint); }
    .life-arrow svg { width: 14px; height: 14px; }
    .prow { padding: 12px var(--space-4); color: inherit; text-decoration: none !important; }
    .prow .project-avatar { width: 34px; height: 34px; border-radius: 9px; font-size: 12px; }
    .plist-head { padding: 0 var(--space-4); font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); }
    .prow .upd { margin-left: 0; justify-content: flex-end; }

    /* attention + activity */
    .att { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); text-decoration: none !important; color: inherit; --_accent: var(--warning); }
    .att-top { display: flex; align-items: flex-start; gap: var(--space-3); }
    .att-id { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-subtle); }
    .att-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.35; }
    .att-meta { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--fg-subtle); }
    .att-meta span { display: inline-flex; align-items: center; gap: 4px; }
    .att-meta svg { width: 12px; height: 12px; }
    .run { display: flex; align-items: flex-start; gap: var(--space-3); padding: 10px var(--space-4); text-decoration: none !important; color: inherit; border-bottom: 1px solid var(--border-subtle); }
    .run:last-child { border-bottom: 0; }
    .run:hover { background: var(--bg-hover); }
    .run-ico { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .run-ico svg { width: 14px; height: 14px; }
    .run-ico.running { background: var(--brand-soft); color: var(--brand-fg); }
    .run-ico.review { background: var(--warning-soft); color: var(--warning-fg); }
    .run-ico.passed { background: var(--success-soft); color: var(--success-fg); }
    .run-ico.failed { background: var(--danger-soft); color: var(--danger-fg); }
    .run-title { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-default); line-height: 1.35; }
    .run-meta { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }

    .spin-i, svg.spin-i { animation: spin 1.2s linear infinite; }

    @container (max-width: 900px) {
      .home-grid { grid-template-columns: minmax(0, 1fr); }
      .side-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
      .cont { grid-template-columns: minmax(0, 1fr) auto; }
      .cont-phases { grid-column: 1 / -1; grid-row: 2; }
    }
    @container (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @container (max-width: 760px) {
      .quick { grid-template-columns: minmax(0, 1fr); }
      .pgrid { grid-template-columns: minmax(0, 1fr); }
      .side-col { grid-template-columns: minmax(0, 1fr); }
      .prow, .plist-head { grid-template-columns: minmax(0, 2fr) minmax(0, 1.6fr) minmax(0, 1.1fr); }
      .prow > .c-att, .prow > .c-upd, .plist-head > .c-att, .plist-head > .c-upd { display: none; }
      .life { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); } .life-arrow { display: none; }
      .hero { padding: var(--space-5); }
    }
  </style>
</head>
<body data-page="home" data-shell="home" data-crumb="home.title">
  <main class="canvas"><div class="canvas-inner">

    <!-- Hero -->
    <section class="hero">
      <div class="kicker"><i data-lucide="layout-grid" class="icon-sm"></i><span data-i18n="home.kicker"></span></div>
      <h1 id="greet"></h1>
      <p class="lead" id="hero-sub"></p>
      <div class="quick">
        <a class="qa is-primary" href="new-project.html">
          <span class="ico"><i data-lucide="plus" class="icon-lg"></i></span>
          <span><span class="qa-t" data-i18n="home.qa.new"></span><span class="qa-d" data-i18n="home.qa.new.d"></span></span>
          <i data-lucide="arrow-right" class="chev"></i>
        </a>
        <a class="qa" href="new-project.html?mode=open">
          <span class="ico"><i data-lucide="folder-open" class="icon-lg"></i></span>
          <span><span class="qa-t" data-i18n="home.qa.import"></span><span class="qa-d" data-i18n="home.qa.import.d"></span></span>
        </a>
        <button class="qa" id="qa-recent" type="button">
          <span class="ico"><i data-lucide="history" class="icon-lg"></i></span>
          <span><span class="qa-t" data-i18n="home.qa.recent"></span><span class="qa-d" data-i18n="home.qa.recent.d"></span></span>
          <i data-lucide="chevron-down" class="chev"></i>
        </button>
      </div>
    </section>

    <!-- Stats -->
    <section class="stats" id="stats"></section>

    <!-- Lifecycle at a glance -->
    <div class="section-title"><h3 data-i18n="home.life.title"></h3><span class="text-xs text-subtle" data-i18n="home.life.hint"></span></div>
    <section class="life" id="life"></section>

    <!-- Continue -->
    <div class="section-title"><h3 data-i18n="home.cont.title"></h3></div>
    <a class="card card-interactive cont" id="cont" href="overview.html"></a>

    <!-- Projects + side -->
    <div class="home-grid">
      <section>
        <div class="section-title"><h3><span data-i18n="home.proj.title"></span> <span class="text-faint" id="proj-count" style="font-weight:400;margin-left:4px"></span></h3></div>
        <div class="toolbar">
          <div class="input-group search"><i data-lucide="search"></i><input class="input" id="q" type="search" data-i18n-placeholder="home.search.ph" autocomplete="off"></div>
          <select class="select" id="sort" aria-label="Sort">
            <option value="recent" data-i18n="home.sort.recent"></option>
            <option value="name" data-i18n="home.sort.name"></option>
            <option value="progress" data-i18n="home.sort.progress"></option>
          </select>
          <div class="segmented" id="view">
            <button class="view-btn is-active" data-view="grid" data-i18n-tip="home.view.grid"><i data-lucide="layout-grid" class="icon-sm"></i></button>
            <button class="view-btn" data-view="list" data-i18n-tip="home.view.list"><i data-lucide="list" class="icon-sm"></i></button>
          </div>
        </div>
        <div class="tabs filter" id="filters"></div>
        <div id="projects"></div>
      </section>

      <aside class="side-col">
        <section>
          <div class="section-title"><h3 data-i18n="home.att.title"></h3><span class="badge badge-warning" id="att-count">0</span></div>
          <div class="col gap-3" id="attention"></div>
        </section>
        <section>
          <div class="section-title"><h3 data-i18n="home.act.title"></h3><a class="text-xs" href="task.html" data-i18n="home.act.all"></a></div>
          <div class="card" style="overflow:hidden" id="activity"></div>
        </section>
      </aside>
    </div>

  </div></main>

      function renderProjects() {
        const list = filtered();
        $('proj-count').textContent = list.length + '/' + D.projects.length;
        let html;
        if (!list.length) {
          html = `<div class="card"><div class="empty"><div class="empty-icon"><i data-lucide="search-x"></i></div><h4>${PC.t('home.empty.t')}</h4><div class="text-sm">${PC.t('home.empty.d')}</div><button class="btn btn-secondary btn-sm" id="clear-f">${PC.t('home.empty.clear')}</button></div></div>`;
        } else if (state.view === 'grid') {
          html = `<div class="pgrid">${list.map(cardHTML).join('')}<a class="new-card" href="new-project.html"><span class="plus"><i data-lucide="plus"></i></span><b class="text-sm" style="color:var(--fg-default)">${PC.t('home.card.new')}</b><span class="text-xs">${PC.t('home.card.new.d')}</span></a></div>`;
        } else {
          html = `<div class="plist"><div class="plist-head"><span>${PC.t('home.col.project')}</span><span>${PC.t('home.col.phase')}</span><span>${PC.t('home.col.progress')}</span><span class="c-att">${PC.t('home.col.att')}</span><span class="c-upd" style="text-align:right">${PC.t('home.col.updated')}</span></div>${list.map(rowHTML).join('')}</div>`;
        }
        $('projects').innerHTML = html;
        document.querySelectorAll('#view button').forEach(b => b.classList.toggle('is-active', b.dataset.view === state.view));
        PC.refresh($('projects'));
      }

      const TONE = { danger: 'var(--danger)', warning: 'var(--warning)', info: 'var(--info)' };
      const TBADGE = { danger: 'badge-danger', warning: 'badge-warning', info: 'badge-brand' };
      function renderAttention() {
        $('att-count').textContent = ATT.length;
        $('attention').innerHTML = ATT.map(a => { const p = byId(a.pid); return `<a class="card card-interactive card-accent att" style="--_accent:${TONE[a.tone]}" href="${U(a.pid, a.href[0], a.href[1])}">
          <div class="att-top"><div class="grow" style="min-width:0"><div class="att-id"><span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-weight:500;color:var(--fg-default)"><span class="project-avatar" style="width:16px;height:16px;border-radius:5px;font-size:7px;background:${p.color}">${PC.esc(p.short)}</span>${PC.esc(p.name.split(' — ')[0])}</span> · ${a.id}</div><div class="att-title">${a.t()}</div></div><span class="badge ${TBADGE[a.tone]}"><i data-lucide="${a.icon}"></i></span></div>
          <div class="att-meta"><span style="line-height:1.4">${a.m()}</span></div>
          <div class="row between"><span class="btn btn-soft btn-sm">${PC.t(a.cta)} <i data-lucide="arrow-right" class="icon-sm"></i></span><span class="text-xs text-faint">${PC.t('home.ago.' + agoKey(a.ago[0]), { n: a.ago[1] })}</span></div>
        </a>`; }).join('');
        PC.refresh($('attention'));
      }

      const RUN_ICON = { running: 'loader-circle', review: 'eye', passed: 'check', failed: 'x' };
      function renderActivity() {
        $('activity').innerHTML = RUNS.map(r => { const p = byId(r.pid); return `<a class="run" href="${U(r.pid, r.page, r.hash)}">
          <span class="run-ico ${r.st}"><i data-lucide="${RUN_ICON[r.st]}" ${r.st === 'running' ? 'class="spin-i"' : ''}></i></span>
          <div class="grow"><div class="run-title"><span class="mono text-xs text-subtle">${r.id}</span> ${PC.esc(r.title())}</div>
            <div class="run-meta"><b style="font-weight:600;color:var(--fg-default)">${PC.esc(p.short)}</b> · ${PC.t('home.run.' + r.st)} · ${r.meta()} · ${r.cli}</div></div>
          <span class="text-xs text-faint nowrap">${PC.t('home.ago.' + r.ago[0], { n: r.ago[1] })}</span>
        </a>`; }).join('');
        PC.refresh($('activity'));
      }

      function setAssistant(forceSeed) {
        const A = PC.assistant;
        A.setContext([{ icon: 'layout-grid', label: PC.t('home.as.ctx.ws') }, { icon: 'folder', label: PC.t('home.as.ctx.n', { n: D.projects.length }) }, { icon: 'eye', label: PC.t('home.as.ctx.review', { n: ATT.length }) }]);
        A.setSuggestions([PC.t('home.as.s1'), PC.t('home.as.s2'), PC.t('home.as.s3')]);
        if (forceSeed || (A.msgs && A.msgs.length <= 1)) {
          const now = new Date(); const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
          A.seed([{ role: 'ai', time, text: PC.t('home.as.hello', { n: D.projects.length, a: ATT.length, c: runsActive() }) }]);
        }
      }

      function openRecent(anchor) {
        const cur = PC.data.currentProjectId;
        const order = [cur].concat(D.projects.map(p => p.id).filter(id => id !== cur));
        const html = `<div class="menu-label">${PC.t('home.recent.label')}</div>` + order.slice(0, 5).map(id => { const p = byId(id); return `<button class="menu-item" data-v="${p.id}"><span class="project-avatar" style="width:22px;height:22px;border-radius:6px;font-size:9px;background:${p.color}">${PC.esc(p.short)}</span><span class="truncate" style="max-width:190px">${PC.esc(p.name)}</span></button>`; }).join('');
        PC.popover(anchor, html, id => { PC.setProject(id); location.href = U(id, 'overview.html'); });
      }

      function refreshPhase() { renderLife(); renderFilters(); renderProjects(); PC.refresh($('life')); }
      function renderAll() { renderHero(); renderStats(); renderLife(); renderContinue(); renderFilters(); renderProjects(); renderAttention(); renderActivity(); PC.refresh(document.querySelector('.canvas')); }

      PC.onReady(() => {
        renderAll(); setAssistant(true);
        $('q').addEventListener('input', e => { state.q = e.target.value; renderProjects(); });
        $('sort').addEventListener('change', e => { state.sort = e.target.value; renderProjects(); });
        $('view').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (!b) return; state.view = b.dataset.view; try { localStorage.setItem('pc.home.view', state.view); } catch (err) {} renderProjects(); });
        $('filters').addEventListener('click', e => { const b = e.target.closest('[data-phase]'); if (!b) return; state.phase = b.dataset.phase; refreshPhase(); });
        $('life').addEventListener('click', e => { const b = e.target.closest('[data-life]'); if (!b) return; state.phase = state.phase === b.dataset.life ? 'all' : b.dataset.life; refreshPhase(); });
        $('projects').addEventListener('click', e => { if (e.target.closest('#clear-f')) { state.q = ''; state.phase = 'all'; $('q').value = ''; refreshPhase(); } });
        $('qa-recent').addEventListener('click', e => openRecent(e.currentTarget));
      });
      document.addEventListener('pc:lang', () => { renderAll(); setAssistant(false); });
    })();
  </script>
</body>
</html>
