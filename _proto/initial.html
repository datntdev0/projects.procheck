<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Initial phase · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script src="assets/workflow.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ---- Initial phase page (tokens only) ---- */
    .canvas-inner { container-type: inline-size; }
    /* file references are plain links with a glyph, not bordered chips */
    .src-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); background: none; font: inherit; font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-link); text-decoration: none !important; cursor: pointer; max-width: 100%; }
    .src-chip:hover { text-decoration: underline !important; }
    .src-chip svg { color: var(--fg-subtle); width: 13px; height: 13px; flex-shrink: 0; }
    .src-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rq { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-xs); font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; background: var(--brand-soft); color: var(--brand-fg); white-space: nowrap; }
    .mono-sm { font-family: var(--font-mono); font-size: 11.5px; }

    .page-header > div:first-child { flex: 1 1 420px; min-width: 0; }
    .page-header .subtitle { max-width: 560px; }

    /* sticky phase tabs */
    .ph-tabs { position: sticky; top: 0; z-index: 6; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--space-8) * -1) var(--space-6); padding: 0 var(--space-8); background: color-mix(in srgb, var(--bg-canvas) 92%, transparent); backdrop-filter: blur(8px); }
    .ph-tabs::-webkit-scrollbar { display: none; }
    .ph-tabs .tab { flex-shrink: 0; height: 42px; }
    .ph-tabs .tab:hover { color: var(--fg-default); }
    .ph-tabs .tab .count.is-danger { background: var(--danger-soft); color: var(--danger-fg); }
    .ph-tabs .tab .count.is-ok { background: var(--success-soft); color: var(--success-fg); }
    .ph-tabs .tab .count.is-warn { background: var(--warning-soft); color: var(--warning-fg); }
    @media (max-width: 1080px) { .ph-tabs { margin: 0 calc(var(--space-4) * -1) var(--space-6); padding: 0 var(--space-4); } }
    .tab-panel[hidden] { display: none; }
    .tab-panel > .section:last-child { margin-bottom: 0; }

    /* discovery */
    .dx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 0 0 var(--space-3); margin-bottom: var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .dx-t { font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-subtle); margin-right: 4px; }
    .dx-c { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-default); }
    .dx-c svg { width: 14px; height: 14px; flex-shrink: 0; }
    .dx-c.is-ok svg { color: var(--success); }
    .dx-c.is-fail svg { color: var(--danger); }
    .dx-c.is-warn svg { color: var(--warning); }
    .dx-c.is-todo svg { color: var(--fg-faint); }
    .dx-c small { color: var(--fg-subtle); }
    /* discovery outputs: meeting notes + discovery report */
    /* one panel, one column per artifact divided by rules (wrapped columns get a top rule) */
    .d-outs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-bottom: var(--space-5); border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); overflow: hidden; }
    .d-outs[hidden] { display: none; }
    .d-inh { font-size: var(--text-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: var(--space-2); }
    .do { display: flex; flex-direction: column; gap: 10px; padding: var(--space-4); min-width: 0; box-shadow: -1px 0 0 var(--border-default), 0 -1px 0 var(--border-default); }
    .do-h { display: flex; align-items: flex-start; gap: 10px; }
    .do-ic { display: inline-flex; color: var(--fg-subtle); flex-shrink: 0; margin-top: 2px; }
    .do-ic svg { width: 16px; height: 16px; }
    .do-h .grow { min-width: 0; }
    .do-h b { display: block; }
    .do-path { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .do-d { font-size: var(--text-sm); color: var(--fg-muted); margin: 0; }
    .do-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--text-xs); color: var(--fg-muted); }
    .do-stats span { display: inline-flex; align-items: center; gap: 5px; }
    .do-stats svg { width: 13px; height: 13px; }
    .do-stats b { color: var(--fg-default); }
    .do-out { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; font-size: var(--text-xs); color: var(--fg-subtle); }
    .do-out > span { display: inline-flex; align-items: center; gap: 4px; }
    .do-out > span:not(:last-child)::after { content: "\00B7"; margin: 0 6px; color: var(--fg-faint); }
    .do-cov { display: flex; flex-direction: column; gap: 4px; font-size: var(--text-xs); }
    .do-cov div { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .do-cov div span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .do-cov svg { width: 13px; height: 13px; flex-shrink: 0; }
    .do-cov .is-in svg { color: var(--success); }
    .do-cov .is-out { color: var(--warning-fg); }
    .do-note { display: flex; align-items: flex-start; gap: 6px; font-size: var(--text-xs); color: var(--warning-fg); }
    .do-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; }
    .do-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
    /* document preview */
    .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: var(--space-4); border-radius: var(--radius-md); background: var(--bg-surface-2); font-size: var(--text-xs); color: var(--fg-muted); }
    .pv-bar .mono { overflow-wrap: anywhere; }
    .pv { max-height: min(62vh, 640px); overflow: auto; padding-right: 4px; font-size: var(--text-sm); line-height: 1.6; }
    .pv h3 { font-size: var(--text-lg); margin: 0 0 4px; }
    .pv h4 { font-size: var(--text-md); margin: var(--space-5) 0 4px; padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
    .pv h4:first-of-type { border-top: 0; padding-top: 0; }
    .pv h5 { font-size: var(--text-sm); margin: var(--space-3) 0 2px; color: var(--fg-default); }
    .pv ul { margin: 0; padding-left: 20px; }
    .pv li { margin: 2px 0; }
    .pv .muted, .pv .pv-meta { color: var(--fg-subtle); }
    .pv .pv-meta { font-size: var(--text-xs); }
    .pv table { width: 100%; border-collapse: collapse; font-size: var(--text-xs); margin-top: 4px; }
    .pv th, .pv td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
    .pv th { color: var(--fg-subtle); font-weight: 600; }
    .cite { display: inline-flex; align-items: center; gap: 3px; margin-left: 4px; padding: 0 6px; border-radius: var(--radius-xs); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); font-size: 11px; color: var(--fg-muted); white-space: nowrap; vertical-align: 1px; }
    .pv .pv-warn { display: flex; gap: 6px; align-items: flex-start; color: var(--warning-fg); }
    .pv .pv-warn svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 3px; }
    .d-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
    .d-bar .select { height: 30px; font-size: var(--text-xs); width: auto; }
    .card[hidden] { display: none; }
    .doc-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px var(--space-3); padding: 12px var(--space-4); border-bottom: 1px solid var(--border-subtle); align-items: start; }
    .doc-row:last-child { border-bottom: 0; }
    .doc-ic { display: inline-flex; color: var(--fg-subtle); margin-top: 2px; }
    .doc-ic svg { width: 16px; height: 16px; }
    .doc-row.is-pend { box-shadow: inset 3px 0 0 var(--warning); }
    .doc-row.is-pend .doc-ic { color: var(--warning-fg); }
    .doc-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .doc-h b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); overflow-wrap: anywhere; }
    .doc-meta { margin-top: 3px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .doc-sum { margin: 6px 0 0; font-size: var(--text-sm); color: var(--fg-muted); line-height: 1.45; }
    .cf-note { display: flex; gap: 6px; align-items: flex-start; margin-top: 4px; font-size: var(--text-xs); color: var(--warning-fg); }
    .cf-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 1px; }
    /* findings register: a table of ruled rows (ID · type · finding · status) */
    .fd-row { display: grid; grid-template-columns: 48px 104px minmax(0, 1fr) 132px; gap: 4px var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid var(--border-subtle); align-items: start; }
    .fd-row:last-child { border-bottom: 0; }
    .fd-row.fd-th { padding-top: 8px; padding-bottom: 8px; background: var(--bg-surface-2); border-radius: var(--radius-lg) var(--radius-lg) 0 0; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .05em; color: var(--fg-subtle); }
    .fd-row .q-id { padding-top: 2px; }
    .fd-ty .badge { margin-top: 1px; }
    .fd-tx { font-size: var(--text-sm); color: var(--fg-strong); line-height: 1.45; }
    .fd-row .q-act { justify-content: flex-start; }
    .cf > :nth-child(3) { grid-column: 2; justify-self: start; }
    .cf { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 4px 8px; align-items: start; margin-top: 6px; font-size: var(--text-xs); color: var(--fg-default); }
    .cf > svg { width: 14px; height: 14px; color: var(--warning-fg); flex-shrink: 0; margin-top: 1px; }
    .cf b { color: var(--warning-fg); font-weight: var(--weight-semibold); }
    @container (max-width: 640px) { .fd-row { grid-template-columns: 44px minmax(0, 1fr) auto; } .fd-row .fd-ty { grid-column: 2; grid-row: 1; } .fd-row .fd-main { grid-column: 2 / -1; } .fd-row .q-act { grid-column: 3; grid-row: 1; justify-content: flex-end; } .fd-row.fd-th { display: none; } }
    @container (max-width: 560px) { .doc-row { grid-template-columns: minmax(0, 1fr); } .doc-row .doc-ic { display: none; } }

    /* step artifacts (overview stepper) */
    .ph-arts { display: flex; flex-direction: column; gap: 3px; }
    .ph-art { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-muted); text-decoration: none !important; min-width: 0; border-radius: var(--radius-xs); }
    .ph-art:hover { color: var(--brand-fg); }
    .ph-art span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ph-art svg { width: 12px; height: 12px; flex-shrink: 0; color: var(--fg-faint); }
    .ph-art.is-primary { color: var(--fg-strong); font-weight: var(--weight-semibold); }
    .ph-art.is-approved svg { color: var(--success); }
    .ph-art.is-review svg, .ph-art.is-stale svg { color: var(--warning); }
    .ph-art.is-draft svg { color: var(--brand); }


    /* milestones */
    /* figures: one stat strip (cells divided by rules) */
    .kpis { --cols: 4; margin-bottom: var(--space-4); overflow: hidden; }
    .stat-strip.kpis > .kpi { border-left: 0; box-shadow: -1px 0 0 var(--border-subtle), 0 -1px 0 var(--border-subtle); }
    @container (max-width: 760px) { .kpis { --cols: 2; } }
    .kpi .stat-value { font-size: 20px; }
    .kpi small { display: block; font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* notice: flat bar with a tone stripe */
    .ms-note { display: flex; gap: 10px; align-items: center; padding: 10px var(--space-4); margin-bottom: var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--border-default); border-left: 3px solid var(--info); background: var(--bg-surface); font-size: var(--text-sm); color: var(--fg-muted); }
    .ms-note > svg { color: var(--brand-fg); flex-shrink: 0; width: 16px; height: 16px; }
    .ms-note { flex-wrap: nowrap; }
    .ms-note .grow { min-width: 0; }
    .ms-track { display: flex; height: 6px; border-radius: var(--radius-xs); overflow: hidden; gap: 2px; margin-bottom: 6px; background: var(--bg-surface-3); }
    .ms-track i { display: block; height: 100%; background: var(--border-strong); }
    .ms-track i.is-done { background: var(--success); }
    .ms-track i.is-current { background: var(--brand); }
    .ms-track i.is-at_risk { background: var(--warning); }
    .ms-track i.is-draft { background: var(--border-strong); }
    .ms-track-leg { display: flex; justify-content: space-between; gap: 8px; font-size: var(--text-2xs); color: var(--fg-subtle); margin-bottom: var(--space-4); font-variant-numeric: tabular-nums; }
    .ms-list { display: flex; flex-direction: column; }
    .ms-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px var(--space-4); padding: var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .ms-row:last-child { border-bottom: 0; }
    .ms-rail { display: flex; flex-direction: column; align-items: center; }
    .ms-dot { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--fg-subtle); font-size: 10px; font-weight: 600; font-family: var(--font-mono); flex-shrink: 0; }
    .ms-dot svg { width: 14px; height: 14px; }
    .ms-row.is-done .ms-dot { border-color: var(--success); color: var(--success-fg); }
    .ms-row.is-current .ms-dot { border-color: var(--brand); color: var(--brand-fg); }
    .ms-row.is-at_risk .ms-dot { border-color: var(--warning); color: var(--warning-fg); }
    .ms-row.is-draft .ms-dot { border-style: dashed; }
    .ms-rail i { flex: 1; width: 1px; margin-top: 6px; background: var(--border-default); }
    .ms-row.is-done .ms-rail i { background: var(--success); }
    .ms-row:last-child .ms-rail i { display: none; }
    .ms-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ms-head h5 { font-size: var(--text-md); }
    .ms-head .ms-id { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-subtle); }
    .ms-desc { margin: 4px 0 0; font-size: var(--text-sm); color: var(--fg-muted); line-height: 1.45; }
    .ms-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 8px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .ms-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .ms-meta svg { width: 12px; height: 12px; }
    .ms-scope { display: flex; gap: 2px 0; flex-wrap: wrap; margin-top: 8px; font-size: var(--text-xs); color: var(--fg-default); }
    .ms-scope > span:not(:last-child)::after { content: "\00B7"; margin: 0 8px; color: var(--fg-faint); }
    .ms-acc { margin-top: 8px; font-size: var(--text-sm); line-height: 1.45; color: var(--fg-default); }
    .ms-acc b { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-subtle); margin-right: 8px; font-weight: var(--weight-semibold); }
    .ms-row.is-done .ms-acc b { color: var(--success-fg); }
    .ms-date { text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .ms-date b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
    .ms-date s { font-size: var(--text-xs); color: var(--fg-faint); }
    .ms-date .badge { margin-top: 4px; }
    @container (max-width: 560px) { .ms-row { grid-template-columns: 30px minmax(0, 1fr); } .ms-date { grid-column: 2; align-items: flex-start; text-align: left; } }

    /* estimation */
    .es-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--space-4); align-items: start; }
    @container (max-width: 860px) { .es-grid { grid-template-columns: minmax(0, 1fr); } }
    .es-col { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
    .ea { display: grid; grid-template-columns: minmax(0, 1fr) 76px 44px; gap: 6px var(--space-3); align-items: center; padding: 10px var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .ea:last-child { border-bottom: 0; }
    .ea .nm { font-size: var(--text-sm); color: var(--fg-default); min-width: 0; }
    .ea .h { text-align: right; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
    .ea .pc { text-align: right; font-size: var(--text-xs); color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
    .ea .bar { grid-column: 1 / -1; height: 4px; border-radius: 1px; background: var(--bg-surface-3); overflow: hidden; }
    .ea .bar span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
    .ea.is-total { border-top: 1px solid var(--border-default); }
    .ea.is-total .nm { font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .rng { padding: var(--space-4); }
    .rng-bar { position: relative; height: 8px; border-radius: var(--radius-xs); background: var(--bg-surface-3); margin: 12px 0 8px; }
    .rng-bar .span { position: absolute; top: 0; bottom: 0; border-radius: var(--radius-xs); background: color-mix(in srgb, var(--brand) 30%, transparent); }
    .rng-bar .pin { position: absolute; top: -4px; width: 3px; height: 18px; border-radius: 2px; background: var(--brand); transform: translateX(-50%); }
    .rng-leg { display: flex; justify-content: space-between; gap: 8px; font-size: var(--text-xs); color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
    .rng-leg b { color: var(--fg-strong); font-weight: var(--weight-semibold); }
    .tm { display: flex; align-items: center; gap: 10px; padding: 9px var(--space-4); border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
    .tm:last-child { border-bottom: 0; }
    .tm .n { margin-left: auto; font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
    .tm-ic { width: 16px; height: 16px; color: var(--fg-subtle); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tm-ic svg { width: 15px; height: 15px; }
    .es-list { list-style: none; margin: 0; padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: 8px; font-size: var(--text-sm); line-height: 1.45; }
    .es-list li { display: flex; gap: 8px; align-items: flex-start; }
    .es-list li svg { width: 14px; height: 14px; color: var(--fg-subtle); margin-top: 3px; flex-shrink: 0; }

    /* section header */
    .sh { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
    section.section { scroll-margin-top: 56px; }
    .sh .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sh h3 { font-size: var(--text-md); }
    .sh .sub { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }

    /* phase banner: flat notice with a tone stripe, facts as a ruled line of key/values */
    .banner { display: flex; flex-direction: column; gap: var(--space-3); padding: 12px var(--space-4); border: 1px solid var(--border-default); border-left: 3px solid var(--_c); border-radius: var(--radius-lg); background: var(--bg-surface); margin-bottom: var(--space-5); }
    .banner.is-done { --_c: var(--success); --_cf: var(--success-fg); }
    .banner.is-reopen { --_c: var(--warning); --_cf: var(--warning-fg); }
    .banner-main { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
    .b-ic { display: inline-flex; color: var(--_cf); flex-shrink: 0; align-self: flex-start; margin-top: 1px; }
    .b-ic svg { width: 18px; height: 18px; }
    .b-txt { flex: 1 1 280px; min-width: 0; }
    .b-txt .h5 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .b-txt p { margin: 2px 0 0; font-size: var(--text-sm); color: var(--fg-muted); }
    .facts { display: flex; gap: var(--space-3) var(--space-6); flex-wrap: wrap; padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
    .fact { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .fact span { font-size: var(--text-2xs); color: var(--fg-subtle); font-weight: var(--weight-medium); text-transform: uppercase; letter-spacing: .05em; }
    .fact b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }

    /* meetings timeline */

        { n: 'NAPAS bank file format v3.pdf', k: 'spec', date: '2026-02-03', from: 'payroll', an: true, sum: L('Bank transfer file format for salary payments.', 'Định dạng file chuyển khoản lương.'), f: [fd_('system', 'Salary payments are exported as NAPAS v3 bank files.', 'Lương được xuất ra file ngân hàng NAPAS v3.')] },
        { n: 'Legacy HR tool data dictionary.xlsx', k: 'data', date: '2026-01-20', from: 'itlead', an: true, sum: L('Fields and code lists of the legacy HR tool.', 'Các trường và danh mục mã của công cụ HR cũ.'), f: [fd_('term', '"Grade" maps to the salary band, not the job level.', '"Grade" là bậc lương, không phải cấp bậc công việc.')] },
        { n: 'Atlas HR process map.pdf', k: 'process', date: '2026-01-12', from: 'hrdir', an: true, sum: L('HR processes from hire to retire.', 'Quy trình nhân sự từ tuyển dụng đến nghỉ việc.'), f: [fd_('pain', 'Leave is approved by email and re-typed into payroll.', 'Nghỉ phép được duyệt qua email rồi nhập lại vào bảng lương.')] },
      ],
    };

    /* ------------------------------------------------------------- state */
    const D = DS[P.id] || DS['lotus-pay'];
    const PL = PLAN[P.id] || PLAN['lotus-pay'];
    const IS = (P.state && P.state.initial) || {};
    const IDS = Object.assign({}, DEF_IDS, D.ids);
    const idOf = k => IDS[k] || k;
    /* every artifact of a step counts toward the step; there are no roles, dependencies or locks */
    const mkArt = (c, step) => ({ id: idOf(c.id), k: c.id, step, icon: WF.artIcon(c), req: true, primary: false, deps: [], cfg: c });
    const ARTS = [];
    STEPS.forEach((s, i) => CFG.steps[s].arts.forEach(c => ARTS.push(mkArt(c, i))));
    const REQS = D.reqs, NFRS = D.nfrs, ROLES = D.roles;
    const clone = o => JSON.parse(JSON.stringify(o));
    const S = {
      finalized: PC.phaseStatus('initial') === 'done', finalDate: IS.completedOn || null,
      rebaselined: false, reopened: false, cr: null, snap: null,
      tab: 'overview', qFilter: 'all', showAllMeet: false, openPts: new Set(),
      dview: 'meetings', ff: { src: 'all', type: 'all', only: '' }, fseq: 0, openDocs: new Set(),
      ms: clone(PL.ms), docs: clone(DOCS[P.id] || []),
      art: {}, q: clone(D.q), meet: clone(D.meet), sc: clone(D.sc), asm: clone(D.asm), risk: clone(D.risk),
      crs: D.crs,
    };
    /* sample projects: artifacts they started with carry their history; anything the user adds starts fresh.
       The five starter artifacts always keep a state, because other tabs read it even when the user removed one. */
    const INHERIT = { disc: 'meeting', nfr: 'brd', risk: 'scope', plan: 'est', proposal: 'sow' };
    const SEEDED = WF.seedIds(P.id);
    const seedState = k => { const v = D.arts[k] || D.arts[INHERIT[k]] || NS; return { st: v.st, v: v.v, date: v.date, stale: false }; };
    ARTS.forEach(a => { S.art[a.id] = SEEDED.has(a.k) ? seedState(a.k) : Object.assign({ stale: false }, NS); });
    Object.keys(WF.SEED).forEach(k => { if (!S.art[idOf(k)]) S.art[idOf(k)] = seedState(k); });
    S.meet.forEach(m => (m.pts || []).forEach(x => { if (x.ok == null) x.ok = true; }));
    S.docs.forEach(d => (d.f || []).forEach(x => { if (x.ok == null) x.ok = true; }));
    (function () { const m = S.meet.find(x => x.pts); if (m) S.openPts.add(m.id); })();
    const artById = id => ARTS.find(a => a.id === id);
    const artName = a => WF.artName(a.cfg);
    const artShort = artName;
    const stepGoal = i => t('in.step.' + (i + 1) + 'd');
    const slug = a => a.id;

    /* ----------------------------------------------------- derived values */
    const isOk = a => S.art[a.id].st === 'approved' && !S.art[a.id].stale;
    const reqArts = () => ARTS.slice().sort((x, y) => x.step - y.step);
    const stepArts = i => ARTS.filter(a => a.step === i);
    const unlocked = () => true;
    /* a new version of an artifact makes the approved artifacts of later steps outdated */
    const stepOfId = id => { const a = artById(id); if (a) return a.step; const k = Object.keys(WF.SEED).find(x => idOf(x) === id); return k ? STEPS.indexOf(WF.SEED[k].step) : STEPS.length; };
    const dependents = id => ARTS.filter(a => a.step > stepOfId(id));
    function markStale(id) { let n = 0; dependents(id).forEach(a => { const s = S.art[a.id]; if (s.st !== 'not_started' && !s.stale) { s.stale = true; n++; } }); return n; }
    function stepStatus(i) {
      const all = stepArts(i), req = all, p = all[0];
      if (!all.length) return i === 0 || stepStatus(i - 1) === 'done' ? 'done' : 'todo';
      if (req.every(isOk)) return 'done';
      if (req.some(a => S.art[a.id].stale)) return 'stale';
      if (p && S.art[p.id].st === 'review') return 'review';
      if (IS.steps && IS.steps[STEPS[i]] === 'in_progress') return 'current';
      return all.some(a => S.art[a.id].st !== 'not_started') || i === 0 || ['done', 'review'].includes(stepStatus(i - 1)) ? 'current' : 'todo';
    }
    const approvedCount = () => reqArts().filter(isOk).length;
    const pctDone = () => {
      const r = reqArts(); if (!r.length) return S.finalized ? 100 : 0;
      const calc = Math.round(r.reduce((n, a) => n + (S.art[a.id].stale ? .5 : ({ approved: 1, review: .6, draft: .3, not_started: 0 }[S.art[a.id].st] || 0)), 0) / r.length * 100);
      return S.finalized ? 100 : Math.max((P.progress && P.progress.initial) || 0, calc);
    };
    const qCount = st => S.q.filter(q => q.st === st).length;
    const blockingOpen = () => S.q.filter(q => q.st === 'open' && q.blocking).length;
    const nonBlockingOpen = () => S.q.filter(q => q.st === 'open' && !q.blocking).length;
    const nextStepName = () => { const i = STEPS.findIndex((k, n) => stepStatus(n) !== 'done'); return t('in.step.' + ((i < 0 ? 4 : i) + 1)); };
    const filesCount = () => S.meet.reduce((n, m) => n + m.files.length, 0);
    const srcCount = () => filesCount() + S.docs.length;
    const brdV = () => S.art.brd.v;
    const brdLabel = () => S.art.brd.st === 'not_started' ? t('in.a.brd') : 'BRD v' + S.art.brd.v;
    const recommended = () => { const a = reqArts().find(x => S.art[x.id].st === 'not_started'); return a ? a.id : null; };

    /* ------------------------------------------------ discovery: sources & findings */
    const pendingSources = () => S.meet.filter(m => !m.pts).length + S.docs.filter(d => !d.an).length;
    function allFindings() {
      const out = [];
      S.meet.slice().reverse().forEach(m => (m.pts || []).forEach(f => out.push({ f, src: 'meet', label: tx(m.title), date: m.date, icon: 'calendar-days' })));
      S.docs.forEach(d => (d.f || []).forEach(f => out.push({ f, src: 'doc', label: d.n, date: d.date, icon: DK[d.k][0] })));
      out.forEach(x => { if (!x.f.id) x.f.id = 'F-' + pad2(++S.fseq); });
      return out;
    }
    const toReview = () => allFindings().filter(x => !x.f.ok).length;
    const cfNoQ = () => allFindings().filter(x => x.f.cf && !x.f.cf.q).length;
    const discChecks = () => {
      const p = pendingSources(), r = toReview(), c = cfNoQ(), d = artById(IDS.disc);
      return [
        { k: p ? 'fail' : 'ok', block: !!p, label: t('in.d.c1'), detail: p ? t('in.d.c1.n', { n: p }) : '', reason: t('in.d.c1.n', { n: p }) },
        { k: r ? 'warn' : 'ok', block: false, label: t('in.d.c2'), detail: r ? t('in.d.c2.n', { n: r }) : '' },
        { k: c ? 'fail' : 'ok', block: !!c, label: t('in.d.c3'), detail: c ? t('in.d.c3.n', { n: c }) : '', reason: t('in.d.c3.n', { n: c }) },
        { k: d && isOk(d) ? 'ok' : 'todo', block: false, label: t('in.d.c4'), detail: '' },
      ];
    };
    const gateChecks = () => {
      const ck = [];
      reqArts().forEach(a => {
        const s = S.art[a.id], ok = isOk(a);
        const stTxt = s.stale ? t('in.st.stale') : t('in.as.' + s.st);
        const k = ok ? 'ok' : s.stale ? 'fail' : s.st === 'review' ? 'warn' : 'todo';
        let detail;
        if (ok) { const u = S.sc.und.length; detail = a.k === 'scope' ? t(u ? 'in.gk.scope_nu' : 'in.gk.scope_n', { a: S.sc.in.length, b: S.sc.later.length, c: S.sc.out.length, u }) : 'v' + s.v + ' · ' + fd(s.date); }
        else detail = t('in.gk.not_yet', { s: stTxt });
        ck.push({ k, block: !ok, label: t('in.gk.art', { name: artName(a) }), detail, reason: t('in.gk.reason', { name: artName(a), s: stTxt }), link: 'artifacts.html#' + a.id });
      });
      discChecks().slice(0, 3).forEach(c => ck.push(Object.assign({ go: 's-disc' }, c)));
      if (S.sc.und.length) { const m = t('in.gk.und', { n: S.sc.und.length }); ck.push({ k: 'fail', block: true, label: t('in.gk.scope_dec'), detail: m, reason: m, go: 's-scope' }); }
      const b = blockingOpen(), o = nonBlockingOpen();
      if (!S.q.length) {
        ck.push({ k: 'todo', block: false, label: t('in.gk.q_blocking'), detail: t('in.gk.q_none'), go: 's-q' });
        ck.push({ k: 'todo', block: false, label: t('in.gk.q_open'), detail: '', go: 's-q' });
      } else {
        ck.push({ k: b ? 'fail' : 'ok', block: !!b, label: t('in.gk.q_blocking'), detail: b ? t('in.gk.q_blocking.fail', { n: b }) : '', reason: t('in.gk.q_blocking.fail', { n: b }), go: 's-q' });
        ck.push({ k: o ? 'warn' : 'ok', block: false, label: t('in.gk.q_open'), detail: o ? t('in.gk.q_open.warn', { n: o }) : '', go: 's-q' });
      }
      return ck;
    };

    /* -------------------------------------------------------------- render */
    function renderSubtitle() { $('subtitle').textContent = t('in.sub', { client: CLIENT }); }
    /* ---------------------------------------------------------------- tabs */
    const TABS = [['overview', 'layout-dashboard'], ['discovery', 'compass'], ['clarifications', 'message-circle-question'], ['requirements', 'list-checks'], ['milestones', 'milestone'], ['estimation', 'calculator']];
    const fmtN = n => Number(n).toLocaleString(PC.lang === 'vi' ? 'vi-VN' : 'en-US');
    const kH = n => n >= 1000 ? (Math.round(n / 100) / 10).toLocaleString(PC.lang === 'vi' ? 'vi-VN' : 'en-US') + 'k h' : n + ' h';
    const daysBetween = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
    function tabCount(id) {
      if (id === 'overview') return [pctDone() + '%', pctDone() === 100 ? 'is-ok' : ''];
      if (id === 'discovery') return [S.meet.length + S.docs.length, pendingSources() || cfNoQ() ? 'is-danger' : toReview() ? 'is-warn' : ''];
      if (id === 'clarifications') { const o = qCount('open'); return S.q.length ? [o, blockingOpen() ? 'is-danger' : o ? 'is-warn' : 'is-ok'] : null; }
      if (id === 'requirements') return REQS.length ? [REQS.length, S.sc.und.length ? 'is-warn' : ''] : null;
      if (id === 'milestones') return S.ms.length ? [S.ms.length, S.ms.some(m => m.st === 'at_risk') ? 'is-warn' : ''] : null;
      if (id === 'estimation') return PL.est ? [(PL.est.rom ? '~' : '') + kH(PL.est.likely), ''] : null;
    }
    function renderNav() {
      $('phTabs').innerHTML = TABS.map(([id, ic]) => {
        const c = tabCount(id);
        return `<button class="tab ${S.tab === id ? 'is-active' : ''}" role="tab" aria-selected="${S.tab === id}" data-tab="${id}"><i data-lucide="${ic}" class="icon-sm"></i>${t('in.tab.' + id)}${c ? `<span class="count ${c[1]}">${esc(String(c[0]))}</span>` : ''}</button>`;
      }).join('');
      document.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.dataset.panel !== S.tab; });
      PC.refresh($('phTabs'));
      const act = $('phTabs').querySelector('.is-active'), bar = $('phTabs');
      if (act && (act.offsetLeft < bar.scrollLeft || act.offsetLeft + act.offsetWidth > bar.scrollLeft + bar.clientWidth)) bar.scrollLeft = act.offsetLeft - 16;
    }
    function setTab(id, opts) {
      if (!TABS.some(x => x[0] === id)) id = 'overview';
      const changed = S.tab !== id;
      S.tab = id; renderNav();
      try { history.replaceState(null, '', '#' + id); } catch (err) {}
      if (changed && !(opts && opts.keepScroll)) { const c = document.querySelector('.canvas'); if (c) c.scrollTop = 0; }
    }
    (function () { let h = (location.hash || '').slice(1); if (h === 'meetings') h = 'discovery'; if (TABS.some(x => x[0] === h)) S.tab = h; })();

    /* ---------------------------------------------------------- milestones */
    const MS_IC = { done: 'check', current: null, planned: null, at_risk: 'triangle-alert', draft: null };
    const MS_BD = { done: 'badge-success', current: 'badge-brand', planned: '', at_risk: 'badge-warning', draft: 'badge-purple' };
    function renderMilestones() {
      const ms = S.ms, sow = S.art[IDS.sow];
      const draft = ms.length && ms.every(m => m.st === 'draft');
      $('msActs').innerHTML = ms.length

        ${kpi(t('in.ms.k.golive'), fd(due(last)), last.fc ? t('in.ms.k.slip', { n: daysBetween(last.fc, last.date) }) : esc(tx(last.name)))}
        ${kpi(t('in.ms.k.done'), done + ' / ' + ms.length, fmtN(ms.filter(m => m.st === 'done').reduce((n, m) => n + m.h, 0)) + ' / ' + t('in.ms.hours', { h: fmtN(ms.reduce((n, m) => n + m.h, 0)) }))}
        ${kpi(t('in.ms.k.risk'), String(risk.length), risk.length ? risk.map(m => m.id + (m.fc ? ' · ' + t('in.ms.k.slip', { n: daysBetween(m.fc, m.date) }) : '')).join(', ') : t('in.ms.k.none'))}
      </div>`;
      const totalH = ms.reduce((n, m) => n + m.h, 0);
      const track = `<div class="ms-track">${ms.map(m => `<i class="is-${m.st}" style="width:${m.h / totalH * 100}%" title="${esc(m.id + ' · ' + tx(m.name))}"></i>`).join('')}</div>
        <div class="ms-track-leg">${ms.map(m => `<span>${esc(m.id)} · ${fdShort(due(m))}</span>`).join('')}</div>`;
      const note = draft ? `<div class="ms-note"><i data-lucide="sparkles"></i><span class="grow">${t('in.ms.draft_note')}</span></div>` : '';
      const rows = ms.map(m => {
        const dot = MS_IC[m.st] ? `<i data-lucide="${MS_IC[m.st]}"></i>` : esc(m.id);
        const sp = m.sp === '0' ? t('in.ms.sprint', { s: 0 }) : m.sp.includes('–') ? t('in.ms.sprints', { s: m.sp }) : t('in.ms.sprint', { s: m.sp });
        const dateHtml = m.fc ? `<s>${fd(m.date)}</s><b>${t('in.ms.forecast')} ${fd(m.fc)}</b>` : m.base ? `<b>${fd(m.date)}</b><s>${t('in.ms.baseline', { d: fd(m.base) })}</s>` : `<b>${fd(m.date)}</b>`;
        return `<div class="ms-row is-${m.st}">
          <div class="ms-rail"><span class="ms-dot">${dot}</span><i></i></div>
          <div style="min-width:0">
            <div class="ms-head"><span class="ms-id">${esc(m.id)}</span><h5>${esc(tx(m.name))}</h5></div>
            <p class="ms-desc">${esc(tx(m.d))}</p>
            <div class="ms-meta"><span><i data-lucide="repeat"></i>${sp}</span><span><i data-lucide="clock-3"></i>${t('in.ms.hours', { h: fmtN(m.h) })}</span></div>
            <div class="ms-scope">${m.del.map(x => `<span>${esc(tx(x))}</span>`).join('')}</div>
            <div class="ms-acc"><b>${t('in.ms.acc')}</b>${esc(tx(m.acc))}</div>
          </div>
          <div class="ms-date">${dateHtml}<span class="badge ${MS_BD[m.st]}">${t('in.ms.st.' + m.st)}</span></div>
        </div>`;
      }).join('');
      $('msBody').innerHTML = note + kpis + track + `<div class="card"><div class="ms-list">${rows}</div></div>`;
      PC.refresh($('msActs')); PC.refresh($('msBody'));

      const kpis = `<div class="stat-strip kpis">

        ${kpi(t('in.es.k.team'), t('in.es.k.people', { n: people }), E.team.map(r => r.n + ' ' + t('role.' + r.k)).join(' · '))}
        ${kpi(t('in.es.k.dur'), t('in.es.k.sprints', { n: E.sprints }), t('in.es.k.weeks', { n: E.sprints * E.wk }))}
        ${kpi(t('in.es.k.model'), `<span style="font-size:var(--text-md)">${esc(tx(E.model))}</span>`, '')}
      </div>`;
      const note = rom ? `<div class="ms-note"><i data-lucide="sparkles"></i><span class="grow">${t('in.es.rom_note', { v: S.art[IDS.scope].v })}</span></div>` : '';
      const max = Math.max.apply(null, E.areas.map(x => x[1]));
      const areas = `<div class="card"><div class="card-header"><h5>${t('in.es.areas')}</h5><span class="text-xs text-subtle">${t('in.es.hours')} · ${t('in.es.share')}</span></div>
        ${E.areas.map(x => `<div class="ea"><span class="nm">${esc(tx(x[0]))}</span><span class="h">${fmtN(x[1])}</span><span class="pc">${Math.round(x[1] / total * 100)}%</span><div class="bar"><span style="width:${x[1] / max * 100}%"></span></div></div>`).join('')}
        <div class="ea is-total"><span class="nm">${t('in.es.total')}</span><span class="h">${fmtN(total)}</span><span class="pc">100%</span></div></div>`;
      const lo = E.low * 0.85, hi = E.high * 1.05, pos = v => ((v - lo) / (hi - lo) * 100).toFixed(1);
      const range = `<div class="card"><div class="card-header"><div><h5>${t('in.es.range')}</h5><div class="text-xs text-subtle">${t('in.es.range_d')}</div></div></div>
        <div class="rng"><div class="rng-bar"><span class="span" style="left:${pos(E.low)}%;right:${(100 - pos(E.high)).toFixed(1)}%"></span><span class="pin" style="left:${pos(E.likely)}%"></span></div>
          <div class="rng-leg"><span>${t('in.es.low')}<br><b>${fmtN(E.low)} h</b></span><span style="text-align:center">${t('in.es.likely')}<br><b>${fmtN(E.likely)} h</b></span><span style="text-align:right">${t('in.es.high')}<br><b>${fmtN(E.high)} h</b></span></div>
          ${rom ? '' : `<div class="cov" style="margin:var(--space-4) 0 0"><div class="row"><span>${t('in.es.cov')}</span><b>${D.cov.est} / ${n}</b></div><div class="progress ${D.cov.est >= n - 1 ? 'ok' : 'warn'}"><span style="width:${n ? Math.round(D.cov.est / n * 100) : 0}%"></span></div></div>`}
        </div></div>`;
      const RI = { tl: 'crown', eng: 'code-2', fe: 'layout-template', mob: 'smartphone', qa: 'bug', po: 'clipboard-list', ba: 'notebook-pen' };
      const team = `<div class="card"><div class="card-header"><h5>${t('in.es.team')}</h5><span class="badge">${t('in.es.k.people', { n: people })}</span></div>

        <div class="tm"><span class="tm-ic is-agent"><i data-lucide="bot"></i></span><span>${t('in.es.agents')}</span><span class="n text-xs text-muted" style="font-weight:var(--weight-medium)">Claude Code · Codex</span></div></div>`;
      const asm = `<div class="card"><div class="card-header"><h5>${t('in.es.asm')}</h5><span class="badge">${E.asm.length}</span></div>

    function renderBanner() {
      let cls, ic, title, sub, actions, facts;
      const crsN = S.crs;
      const nPend = pendingSources();
      if (S.reopened) {
        cls = 'is-reopen'; ic = 'git-pull-request-arrow'; title = t('in.b.reopen'); sub = t('in.b.reopen.sub', { cr: S.cr.id });
        actions = `<button class="btn btn-secondary btn-sm" data-act="discard"><i data-lucide="undo-2"></i>${t('in.b.discard')}</button><button class="btn btn-primary btn-sm" data-go="s-gate"><i data-lucide="arrow-down"></i>${t('in.b.to_gate')}</button>`;
        facts = [[t('in.f.baseline'), 'BRD v' + D.ver.brd + ' · ' + t('in.a.scope') + ' v' + D.ver.scope + ' · SOW v' + D.ver.sow], [t('in.f.crs'), t('in.f.crs.v2', { n: crsN })], [t('in.f.signoff'), t('in.f.pending')]];
      } else if (S.finalized) {
        cls = 'is-done'; ic = 'badge-check'; title = S.rebaselined ? t('in.b.rebase') : t('in.b.done');
        sub = S.rebaselined ? t('in.b.rebase.sub', { cr: S.rebaselined }) : t('in.b.done.sub');

        facts = [[t('in.f.completed'), fd(S.finalDate)], D.contract ? [t('in.f.contract'), D.contract] : null, [t('in.f.baseline'), 'BRD v' + brdV() + ' · ' + t('in.a.scope') + ' v' + S.art.scope.v + ' · SOW v' + S.art.sow.v], [t('in.f.meetings'), String(S.meet.length)], [t('in.f.reqs'), String(REQS.length)], [t('in.f.crs'), t('in.f.crs.v', { n: crsN })]].filter(Boolean);
      } else { $('banner').innerHTML = ''; return; }
      $('banner').innerHTML = `<div class="banner ${cls}">
        <div class="banner-main">
          <span class="b-ic"><i data-lucide="${ic}" class="icon-lg"></i></span>
          <div class="b-txt"><div class="h5">${title}</div><p>${sub}</p></div>
          <div class="row gap-2 wrap">${actions}</div>
        </div>
        <div class="facts">${facts.map(f => `<div class="fact"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}</div>
      </div>`;
      PC.refresh($('banner'));
    }

    function renderStepper() {
      const badge = { done: 'badge-success', current: 'badge-brand', review: 'badge-warning', todo: '', stale: 'badge-warning' };
      const sic = { not_started: 'circle-dashed', draft: 'pencil', review: 'eye', approved: 'circle-check' };
      const rec = recommended(), gateOpen = S.finalized || gateChecks().every(c => !c.block);
      /* one primary action per view: the recommended step, unless the gate below is ready */
      const recStep = rec && !gateOpen ? artById(rec).step : -1;
      $('stepper').innerHTML = STEPS.map((k, i) => {
        const st = stepStatus(i), arts = stepArts(i), req = arts, p = arts[0];
        const dot = st === 'done' ? '<i data-lucide="check"></i>' : st === 'stale' ? '<i data-lucide="refresh-cw"></i>' : (i + 1);
        const list = arts.map(a => { const s = S.art[a.id], c = s.stale ? 'stale' : s.st;
          return `<a class="ph-art is-${c}" href="artifacts.html#${a.id}" title="${esc(artName(a) + ' · ' + (s.stale ? t('in.st.stale') : t('in.as.' + s.st)) + (s.v ? ' · v' + s.v : '') + ' · ' + (a.cfg.file ? t('in.a.tpl_file', { f: a.cfg.file.name }) : t('in.a.tpl_none')))}"><i data-lucide="${s.stale ? 'refresh-cw' : sic[s.st]}"></i><span>${esc(artShort(a))}</span></a>`; }).join('');
        return `<div class="ph-step is-${st}">
          <span class="ph-dot">${dot}</span>
          <div class="ph-main"><div class="ph-name">${t('in.step.' + (i + 1))}</div>
            <p class="ph-desc">${esc(stepGoal(i))}</p>
            <div class="ph-date">${arts.length ? t('in.ph.req', { a: req.filter(isOk).length, n: req.length }) : '—'}${st === 'done' && p ? ' · ' + fd(S.art[p.id].date) : ''}</div></div>
          <div class="ph-arts">${list}</div>
          <div class="ph-st"><span class="badge ${badge[st]}">${t('in.st.' + st)}</span></div>
          <div class="ph-acts">${arts.length ? (() => { const fresh = arts.every(a => S.art[a.id].st === 'not_started');
            return `<button class="btn btn-ai ${i === recStep ? 'is-primary' : ''} btn-sm" data-act="gen-step" data-step="${i}"><i data-lucide="sparkles"></i>${t(fresh ? 'in.a.gen' : 'in.a.upd')}</button>`; })() : ''}</div></div>`;
      }).join('');
      $('stepSub').textContent = t('in.s1.sub2', { a: approvedCount(), n: reqArts().length, dir: DIR + '\\artifacts' });
      PC.refresh($('stepper'));
    }

      const list = S.showAllMeet ? S.meet : S.meet.slice(0, 4);
      const rows = list.map(m => {
        const [mi, mb] = MT[m.type] || MT.other;
        const d = dm(m.date);
        const files = m.files.map(f => {
          const ic = `<i data-lucide="${FK[f.k]}" class="${f.k === 'audio' ? 'kind-audio' : ''}"></i>`;
          const title = esc(DIR + '\\sources\\meetings\\' + f.n);
          return f.link ? `<a class="src-chip" href="artifacts.html#${f.link}" title="${title}">${ic}<span>${esc(f.n)}</span></a>` : `<button class="src-chip" data-act="openfile" data-n="${esc(f.n)}" title="${title}">${ic}<span>${esc(f.n)}</span></button>`;
        }).join('');
        let pts;
        if (m.pts) {
          const open = S.openPts.has(m.id);
          pts = `<div class="pts"><button class="pts-head ${open ? 'open' : ''}" data-act="pts" data-id="${m.id}"><i data-lucide="wand-sparkles" class="icon-sm text-brand"></i>${t('in.m.keypoints')} <span class="badge">${m.pts.length}</span><i data-lucide="chevron-down" class="chev icon-sm"></i></button>
            ${open ? `<div class="pts-list">${m.pts.map(p => `<div class="pt"><span class="badge ${PT[p.t]}">${t('in.pt.' + p.t)}</span><span>${esc(tx(p.tx))}</span></div>`).join('')}</div>` : ''}</div>`;

              ${m.sugg.map((s, i) => `<div class="sugg-row"><span class="tx">${esc(tx(s.q))}${s.blocking ? ` <span class="badge badge-danger">${t(s.blocks ? 'in.q.blocks.' + s.blocks : 'in.q.blocking')}</span>` : ''}</span>${s.added ? `<span class="badge badge-success"><i data-lucide="check"></i>${t('in.m.sugg_added')}</span>` : `<button class="btn btn-secondary btn-sm" data-act="sugg-add" data-id="${m.id}" data-i="${i}"><i data-lucide="plus"></i>${t('in.m.sugg_add')}</button>`}</div>`).join('')}</div>`;
          }

          pts = `<div class="pend is-hero"><span class="pend-ic"><i data-lucide="wand-sparkles"></i></span><div class="grow"><b>${t('in.m.hero.t')}</b><div class="text-sm text-muted">${t('in.m.hero.d')}</div></div><button class="btn btn-ai is-primary" data-act="extract"><i data-lucide="wand-sparkles"></i>${t('in.m.extract_one')}</button></div>`;
        } else {
          pts = `<div class="pend"><i data-lucide="hourglass" class="icon-sm text-warning"></i><span class="grow">${t('in.m.pending')}</span><button class="btn btn-soft btn-sm" data-act="extract"><i data-lucide="wand-sparkles"></i>${t('in.m.extract_one')}</button></div>`;

        return `<div class="tl-item">
          <div class="tl-date"><b>${d.d}</b><span>${d.m}</span><i></i></div>
          <div class="min-w-0" style="min-width:0">
            <div class="tl-head"><h5>${esc(tx(m.title))}</h5><span class="badge ${mb}"><i data-lucide="${mi}"></i>${t('in.mt.' + m.type)}</span></div>
            <div class="tl-meta"><span><i data-lucide="clock-3"></i>${t('in.m.min', { n: m.dur })}</span><span><i data-lucide="map-pin"></i>${m.where ? esc(m.where) : t('in.m.online')}</span><span><i data-lucide="users"></i>${m.roles.map(r => t('in.role.' + r)).join(' · ')}</span></div>
            <div class="tl-files">${files}</div>
            ${pts}
          </div></div>`;
      }).join('');
      const hidden = S.meet.length - 4;
      const more = hidden > 0 ? `<div class="more-row"><button class="btn btn-ghost btn-sm" data-act="more-meet"><i data-lucide="${S.showAllMeet ? 'chevrons-up' : 'chevrons-down'}"></i>${S.showAllMeet ? t('in.m.less') : t('in.m.more', { n: hidden })}</button></div>` : '';
      $('meetCard').innerHTML = `<div class="tl">${rows}</div>${more}`;

    /* ----------------------------------------------------------- progress */
    function runProgress(o) {
      let i = 0, timer, finished = false;
      const body = `<p class="text-sm text-muted">${o.sub}</p>
        <div class="pg-list">${o.steps.map((s, n) => `<div class="pg-step" data-n="${n}"><span class="pg-ic"></span><span>${s}</span></div>`).join('')}</div>

      const m = PC.modal({ title: o.title, width: 540, body, actions: [{ label: t('common.cancel'), kind: 'secondary' }], onClose: () => { if (!finished) clearTimeout(timer); } });
      const paint = () => {
        m.el.querySelectorAll('.pg-step').forEach((el, n) => {
          const st = n < i ? 'done' : n === i ? 'run' : 'pend';
          el.className = 'pg-step ' + (st === 'pend' ? '' : 'is-' + st);
          el.querySelector('.pg-ic').innerHTML = st === 'done' ? '<i data-lucide="check"></i>' : st === 'run' ? '<span class="spinner"></span>' : '';
        });
        const bar = m.el.querySelector('#pgBar'); if (bar) bar.style.width = Math.round(i / o.steps.length * 100) + '%';
        PC.refresh(m.el);
      };
      const tick = () => {
        paint();
        if (i >= o.steps.length) { finished = true; setTimeout(() => { m.close(); o.onDone(); }, 250); return; }
        i++; timer = setTimeout(tick, o.delay || 750);
      };
      i = 0; tick();
    }

    /* ---------------------------------------------------------- insights */
    const bi = k => ({ en: PC.i18n.dict.en[k], vi: PC.i18n.dict.vi[k] });
    const nextQid = () => 'Q-' + String(S.q.reduce((x, y) => Math.max(x, +y.id.slice(2) || 0), 0) + 1).padStart(2, '0');
    function addSuggested(mid, only) {
      const m = meetById(mid); if (!m || !m.sugg) return 0; let n = 0;
      m.sugg.forEach((s, i) => {
        if (s.added || (only != null && only !== i)) return;
        S.q.push({ id: nextQid(), src: mid, st: 'open', blocking: !!s.blocking, blocks: s.blocks, req: s.req || null, q: s.q, a: null });
        s.added = true; n++;
      });
      return n;
    }
    function extractInsights() {
      const pm = S.meet.filter(m => !m.pts), pd = S.docs.filter(d => !d.an);
      if (!pm.length && !pd.length) { PC.toast(t('in.x.none'), { icon: 'info' }); return; }
      runProgress({
        title: t('in.x.title'), sub: t('in.x.sub'),
        steps: [t('in.x.s1', { n: pm.length + pd.length }), t('in.x.s2'), t('in.x.s3', { v: brdLabel() }), t('in.x.s4')],
        onDone() {
          let pts = 0, qs = 0, candTx = null; const cfs = [];
          pm.forEach(m => {
            const x = (D.x && D.x[m.id]) || {};
            m.pts = clone(x.pts || [{ t: 'action', tx: bi('in.x.gen1') }, { t: 'req', tx: bi('in.x.gen2') }]).map(f => Object.assign(f, { ok: false }));
            m.sugg = clone(x.sugg || []);
            pts += m.pts.length; qs += m.sugg.length; S.openPts.add(m.id);
            if (x.cand && !candTx) candTx = x.cand;
          });
          pd.forEach(d => {
            const x = d.x || { sum: bi('in.ad.gen_sum'), f: [{ t: 'req', tx: bi('in.ad.gen1') }] };
            d.an = true; d.sum = x.sum; d.f = clone(x.f).map(f => Object.assign(f, { ok: false }));
            pts += d.f.length; S.openDocs.add(d.n);
            d.f.forEach(f => {
              if (!f.cf) return;
              if (f.cf.qn && !f.cf.q) { const id = nextQid(); S.q.push({ id, srcLabel: { en: d.n, vi: d.n }, st: 'open', blocking: !!f.cf.blocking, blocks: f.cf.blocks, req: null, q: f.cf.qn, a: null }); f.cf.q = id; }
              cfs.push(f);
            });
          });
          /* new findings make the findings register and everything built on it outdated */
          const mn = artById(IDS.meeting); if (pm.length && mn && S.art[mn.id].st !== 'not_started') S.art[mn.id].stale = true;
          const fr = artById(IDS.findings) || artById(IDS.disc); let stale = 0;
          if (fr && S.art[fr.id].st !== 'not_started' && !S.art[fr.id].stale) { S.art[fr.id].stale = true; stale = 1 + markStale(fr.id); }
          renderAll();
          const toFindings = () => { S.dview = 'findings'; S.ff = { src: 'all', type: 'all', only: 'rev' }; renderDiscovery(); go('s-disc'); };
          PC.modal({
            title: t('in.x.res.title'), width: 540,

    function findItem(id) { for (const k of ['in', 'later', 'out']) { const i = S.sc[k].findIndex(x => x.id === id); if (i >= 0) return { k, i, item: S.sc[k][i] }; } }

    /* ---------------------------------------------------------- assistant */
    function setAssistant() {
      PC.assistant.setContext([{ icon: 'compass', label: t('phase.initial') }, { icon: 'file-text', label: brdLabel() }, { icon: 'paperclip', label: t('in.ctx.sources', { n: srcCount() }) }, { icon: 'mic', label: t('in.ctx.meet', { n: S.meet.length }) }]);

    }
    function ask(kind, label) {
      const now = new Date(); const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      PC.assistant.open();
      PC.assistant.push({ role: 'user', time, text: esc(label) });
      const ai = D.ai || {};
      const html = kind === 'ms' ? msReply() : kind === 'est' ? estReply() : kind === 'gaps' ? (REQS.length ? tx(ai.gaps) : t('in.r.nogaps')) : kind === 'questions' ? tx(ai.questions) : kind === 'needs' ? t('in.r.needs', { v: brdV(), n: nonBlockingOpen() }) : kind === 'summ' ? tx(ai.summ) : kind === 'reqdraft' ? t('in.r.reqdraft', { n: (S.meet.find(m => m.pts) || { pts: [] }).pts.length }) : t('in.r.default', { v: brdV(), n: qCount('open') });
      PC.assistant.reply(html, { time });
    }
    function msReply() {
      if (!S.ms.length) return t('in.r.ms_none');
      const r = S.ms.find(m => m.st === 'at_risk');
      if (r) return t('in.r.ms', { id: r.id, name: esc(tx(r.name)), fc: fd(r.fc || r.date), d: fd(r.date), why: esc(tx(r.d)) });
      const n = S.ms.find(m => m.st !== 'done') || S.ms[S.ms.length - 1];
      return t('in.r.ms_ok', { id: n.id, name: esc(tx(n.name)), d: fd(n.date), n: fmtN(n.h), acc: esc(tx(n.acc)) });
    }
    function estReply() {
      const E = PL.est; if (!E) return t('in.r.est_none');
      const total = E.areas.reduce((s, x) => s + x[1], 0), top = E.areas.slice().sort((a, b) => b[1] - a[1])[0];
      return t('in.r.est', { area: esc(tx(top[0])), h: fmtN(top[1]), pct: Math.round(top[1] / total * 100), low: fmtN(E.low), high: fmtN(E.high), up: Math.round((E.high / E.likely - 1) * 100) });
    }
    const nextCr = () => 'CR-' + pad2(S.crs + 1);
    /* jump to a section: switch to the tab that holds it, then scroll unless it opens the tab */
    function go(id) {
      const el = $(id); if (!el) return;
      const panel = el.closest('.tab-panel');
      if (panel) setTab(panel.dataset.panel);
      if (!panel || panel.querySelector('.section') !== el) requestAnimationFrame(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    }

    /* ------------------------------------------------------------- events */
    document.addEventListener('click', e => {
      const tb = e.target.closest('[data-tab]'); if (tb) { setTab(tb.dataset.tab); return; }
      const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
      const a = e.target.closest('[data-act]'); if (!a) return;
      const id = a.dataset.id;
      switch (a.dataset.act) {
        case 'ask-top': ask('default', t('in.ask')); break;
        case 'g': ask(a.dataset.g, t({ questions: 'in.g.p1', gaps: 'in.g.p2', needs: 'in.g.p3', ms: 'in.ms.ask', est: 'in.es.ask' }[a.dataset.g])); break;
        case 'genq': generateQuestions(); break;
        case 'draftreq': draftRequirements(); break;
        case 'sugg-add': { const n = addSuggested(id, +a.dataset.i); renderAll(); if (n) PC.toast(t('in.q.t.bulk', { n }), { icon: 'message-square-plus' }); break; }
        case 'sugg-all': { const n = addSuggested(id); renderAll(); if (n) { PC.toast(t('in.q.t.bulk', { n }), { icon: 'message-square-plus' }); go('s-q'); } break; }
        case 'gaps': ask('gaps', t('in.g.p2')); break;
        case 'export-all': exportAll(a); break;
        case 'upload': uploadModal(); break;
        case 'notes': notesModal(); break;
        case 'extract': extractInsights(); break;
        case 'pts': S.openPts.has(id) ? S.openPts.delete(id) : S.openPts.add(id); renderMeetings(); break;
        case 'more-meet': S.showAllMeet = !S.showAllMeet; renderMeetings(); break;
        case 'openfile': PC.toast(t('in.m.open', { f: '<b>' + esc(a.dataset.n) + '</b>' }), { icon: 'file-text' }); break;
        case 'qf': S.qFilter = a.dataset.f; renderQuestions(); break;
        case 'q-add': questionModal(); break;
        case 'q-answer': questionModal(id); break;
        case 'sc-menu': { const f = findItem(id); PC.popover(a, `<div class="menu-label">${t('in.sc.move')}</div>` + ['in', 'later', 'out'].filter(k => k !== f.k).map(k => `<button class="menu-item" data-v="${k}"><span class="dot ${SC_META[k][0]}"></span><span>${t(SC_META[k][1])}</span></button>`).join('') + `<div class="menu-sep"></div><button class="menu-item" data-v="__rm"><i data-lucide="trash-2"></i><span>${t('in.sc.remove')}</span></button>`, v => { if (v === '__rm') { S.sc[f.k].splice(f.i, 1); renderScope(); renderReqs(); renderGate(); } else moveItem(id, v); }); break; }
        case 'sc-add': addScope(a.dataset.k, document.querySelector('[data-add="' + a.dataset.k + '"]')); break;
        case 'list-add': addList(a.dataset.l, document.querySelector('[data-addlist="' + a.dataset.l + '"]')); break;
        case 'asm-toggle': { const x = S.asm.find(i => i.id === id); x.ok = !x.ok; renderScope(); break; }
        case 'gen': generate(id); break;
        case 'gen-step': generateStep(+a.dataset.step); break;
        case 'add-doc': addDocsModal(); break;
        case 'dv': S.dview = a.dataset.v; renderDiscovery(); break;
        case 'out-pv': previewOut(a.dataset.k); break;
        case 'doc-open': { const n = a.dataset.n; S.openDocs.has(n) ? S.openDocs.delete(n) : S.openDocs.add(n); renderDocs(); break; }
        case 'ff-src': S.ff.src = a.dataset.v; renderFindings(); break;
        case 'ff-only': S.ff.only = a.dataset.v; renderFindings(); break;
        case 'f-ok': { const x = findingById(id); if (x.f) x.f.ok = true; renderAll(); break; }
        case 'f-ok-all': { const n = allFindings().filter(x => !x.f.ok).map(x => { x.f.ok = true; return 1; }).length; PC.toast(t('in.f2.t.reviewed', { n }), { icon: 'check-check', tone: 'success' }); renderAll(); break; }
        case 'f-q': { const x = findingById(id); if (!x.f) break; const qid = nextQid(); S.q.push({ id: qid, srcLabel: { en: x.label, vi: x.label }, st: 'open', blocking: true, blocks: 'scope', req: null, q: { en: t('in.f2.q_tpl', { a: tx(x.f.tx), b: tx(x.f.cf.tx) }), vi: t('in.f2.q_tpl', { a: tx(x.f.tx), b: tx(x.f.cf.tx) }) }, a: null }); x.f.cf.q = qid; PC.toast(t('in.f2.t.q', { id: qid }), { icon: 'message-square-plus' }); renderAll(); break; }
        case 'reopen': reopenModal(); break;
        case 'discard': discardCR(); break;
        case 'gate-go': if (a.classList.contains('is-disabled')) { e.preventDefault(); break; } if (!S.finalized) { e.preventDefault(); if (!a.classList.contains('is-disabled')) finalizeModal(); } break;
      }
    });
    document.addEventListener('change', e => { if (e.target.id === 'ffType') { S.ff.type = e.target.value; renderFindings(); } });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const el = e.target; if (!el.matches) return;
      if (el.matches('[data-add]')) { e.preventDefault(); addScope(el.dataset.add, el); }
      else if (el.matches('[data-addlist]')) { e.preventDefault(); addList(el.dataset.addlist, el); }
    });
    /* drag & drop between scope lists */
    let dragId = null;
    document.addEventListener('dragstart', e => { const it = e.target.closest && e.target.closest('.sc-item'); if (!it) return; dragId = it.dataset.id; it.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (err) {} });
    document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.sc-item.dragging').forEach(x => x.classList.remove('dragging')); document.querySelectorAll('.sc-col.is-over').forEach(x => x.classList.remove('is-over')); });
    document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.sc-col'); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll('.sc-col.is-over').forEach(x => { if (x !== c) x.classList.remove('is-over'); }); c.classList.add('is-over'); });
    document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('.sc-col'); if (!c || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; moveItem(id, c.dataset.col); });

    PC.onReady(renderAll);
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== S.tab && TABS.some(x => x[0] === h)) setTab(h); });
    document.addEventListener('pc:lang', renderAll);
  </script>
</body>
</html>
