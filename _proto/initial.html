<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Initial phase · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ---- Initial phase page (tokens only) ---- */
    .canvas-inner { container-type: inline-size; }
    .src-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--bg-surface); font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-default); text-decoration: none !important; cursor: pointer; max-width: 100%; }
    .src-chip:hover { border-color: var(--brand); color: var(--brand-fg); background: var(--brand-soft); }
    .src-chip svg { color: var(--fg-subtle); width: 13px; height: 13px; }
    .src-chip:hover svg { color: var(--brand-fg); }
    .src-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rq { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-xs); font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; background: var(--brand-soft); color: var(--brand-fg); white-space: nowrap; }
    .mono-sm { font-family: var(--font-mono); font-size: 11.5px; }

    .page-header > div:first-child { flex: 1 1 420px; min-width: 0; }
    .page-header .subtitle { max-width: 560px; }

    /* sticky section nav */
    .sec-nav { position: sticky; top: 0; z-index: 6; display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(var(--space-8) * -1) var(--space-6); padding: 8px var(--space-8); background: color-mix(in srgb, var(--bg-canvas) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-subtle); }
    .sec-nav button { flex-shrink: 0; height: 28px; padding: 0 10px; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--fg-muted); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .sec-nav button:hover { background: var(--bg-hover); color: var(--fg-default); }
    .sec-nav button .n { width: 16px; height: 16px; border-radius: 50%; background: var(--bg-surface-3); color: var(--fg-muted); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
    @media (max-width: 1080px) { .sec-nav { margin: 0 calc(var(--space-4) * -1) var(--space-6); padding: 8px var(--space-4); } }

    /* section header */
    .sh { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
    section.section { scroll-margin-top: 56px; }
    .sh .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .sh .no { width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-fg); font-size: var(--text-xs); font-weight: var(--weight-semibold); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sh h3 { font-size: var(--text-lg); }
    .sh .sub { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }

    /* phase banner */
    .banner { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4) var(--space-5); border-radius: var(--radius-lg); border: 1px solid; margin-bottom: var(--space-4); }
    .banner.is-done { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 30%, transparent); --_c: var(--success); }
    .banner.is-reopen { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 35%, transparent); --_c: var(--warning); }
    .banner.is-wip { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 25%, transparent); --_c: var(--brand); }
    .banner-main { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; }
    .b-ic { width: 44px; height: 44px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; background: var(--_c); color: #fff; flex-shrink: 0; }
    .banner.is-reopen .b-ic { color: var(--gray-900); }
    .b-txt { flex: 1 1 280px; min-width: 0; }
    .b-txt .h5 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .b-txt p { margin: 2px 0 0; font-size: var(--text-sm); color: var(--fg-muted); }
    .facts { display: flex; gap: var(--space-3) var(--space-5); flex-wrap: wrap; padding-top: var(--space-3); border-top: 1px solid color-mix(in srgb, var(--_c) 22%, transparent); }
    .fact { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .fact span { font-size: var(--text-2xs); color: var(--fg-subtle); font-weight: var(--weight-medium); text-transform: uppercase; letter-spacing: .05em; }
    .fact b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }

    /* assistant guidance */
    .guide { display: flex; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); margin-bottom: var(--space-8); align-items: flex-start; }
    .guide .avatar { width: 32px; height: 32px; border: 0; }
    .guide-body { flex: 1; min-width: 0; }
    .guide-body p { margin: 2px 0 var(--space-3); font-size: var(--text-sm); color: var(--fg-muted); }
    .guide-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .guide-btns button { height: 28px; padding: 0 12px; border-radius: var(--radius-full); border: 1px solid var(--border-default); background: var(--bg-surface); font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .guide-btns button:hover { border-color: var(--brand); color: var(--brand-fg); background: var(--brand-soft); }

    /* phase stepper */
    .ph-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-3); }
    .ph-step { display: flex; flex-direction: column; gap: 8px; padding: var(--space-3) var(--space-3) var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); min-width: 0; }
    .ph-step.is-current, .ph-step.is-review { border-color: var(--brand); box-shadow: var(--shadow-focus); }
    .ph-step.is-stale { border-color: color-mix(in srgb, var(--warning) 45%, var(--border-default)); }
    .ph-top { display: flex; align-items: center; gap: 8px; }
    .ph-dot { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: var(--text-xs); font-weight: var(--weight-semibold); border: 1.5px solid var(--border-strong); color: var(--fg-subtle); background: var(--bg-surface); flex-shrink: 0; }
    .is-done .ph-dot { background: var(--brand); border-color: var(--brand); color: #fff; }
    .is-current .ph-dot, .is-review .ph-dot { border-color: var(--brand); color: var(--brand-fg); }
    .is-stale .ph-dot { border-color: var(--warning); color: var(--warning-fg); background: var(--warning-soft); }
    .ph-dot svg { width: 14px; height: 14px; }
    .ph-line { flex: 1; height: 2px; border-radius: 2px; background: var(--border-default); }
    .is-done .ph-line { background: var(--brand); }
    .ph-name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.3; }
    .ph-desc { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.45; margin: 0; flex: 1; }
    .ph-date { font-size: var(--text-2xs); color: var(--fg-faint); }
    .ph-step .badge { align-self: flex-start; }
    @container (max-width: 800px) {
      .ph-steps { grid-template-columns: minmax(0, 1fr); }
      .ph-step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-items: start; }
      .ph-top { grid-row: 1 / span 3; flex-direction: column; align-self: stretch; }
      .ph-line { width: 2px; height: auto; flex: 1; }
      .ph-step .badge { grid-column: 3; grid-row: 1; }
      .ph-name { grid-column: 2; grid-row: 1; }
      .ph-desc { grid-column: 2 / span 2; }
      .ph-step .src-chip, .ph-step .ph-date { grid-column: 2 / span 2; justify-self: start; }
    }

    /* meetings timeline */
    .tl { display: flex; flex-direction: column; }
    .tl-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); }
    .tl-item:last-child { border-bottom: 0; }
    .tl-date { display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 2px; }
    .tl-date b { font-size: var(--text-xl); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1; letter-spacing: -0.02em; }
    .tl-date span { font-size: var(--text-2xs); color: var(--fg-subtle); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; text-align: center; }
    .tl-date i { flex: 1; width: 2px; background: var(--border-default); margin-top: 8px; border-radius: 2px; }
    .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tl-head h5 { font-size: var(--text-md); }
    .tl-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 4px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .tl-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .tl-meta svg { width: 12px; height: 12px; }
    .tl-files { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .tl-files .src-chip svg.kind-audio { color: var(--accent-magenta); }
    .pts { margin-top: 10px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface-2); overflow: hidden; }
    .pts-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; width: 100%; border: 0; background: none; cursor: pointer; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-muted); text-align: left; }
    .pts-head:hover { color: var(--fg-default); }
    .pts-head .chev { transition: transform var(--dur-fast); margin-left: auto; }
    .pts-head.open .chev { transform: rotate(180deg); }
    .pts-list { padding: 2px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
    .pt { display: flex; gap: 8px; align-items: flex-start; font-size: var(--text-sm); line-height: 1.45; }
    .pt .badge { flex-shrink: 0; margin-top: 1px; min-width: 70px; justify-content: center; }
    .pend { margin-top: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px dashed var(--border-strong); border-radius: var(--radius-md); font-size: var(--text-xs); color: var(--fg-muted); flex-wrap: wrap; }
    .pend .grow { min-width: 160px; }
    .more-row { padding: 10px var(--space-5); border-top: 1px solid var(--border-subtle); display: flex; justify-content: center; background: var(--bg-surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    @container (max-width: 560px) { .tl-item { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); } .tl-date { flex-direction: row; gap: 8px; align-items: baseline; } .tl-date i { display: none; } }

    /* questions */
    .q-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px var(--space-3); padding: 14px var(--space-5); border-bottom: 1px solid var(--border-subtle); align-items: start; }
    .q-row:last-child { border-bottom: 0; }
    .q-row:hover { background: var(--bg-hover); }
    .q-id { font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--fg-subtle); padding-top: 2px; }
    .q-text { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); line-height: 1.45; }
    .q-meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .q-meta > span { display: inline-flex; align-items: center; gap: 4px; }
    .q-meta svg { width: 12px; height: 12px; }
    .q-ans { grid-column: 2 / span 2; margin-top: 6px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--bg-surface-2); border-left: 3px solid var(--success); font-size: var(--text-sm); color: var(--fg-default); line-height: 1.45; }
    .q-ans.is-assume { border-left-color: var(--accent-purple); }
    .q-ans b { font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-subtle); display: block; margin-bottom: 1px; }
    .q-act { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .q-pend { grid-column: 2 / span 2; margin-top: 2px; display: flex; gap: 6px; }
    @container (max-width: 560px) { .q-row { grid-template-columns: minmax(0, 1fr) auto; } .q-id { grid-column: 1 / span 2; } .q-ans, .q-pend { grid-column: 1 / span 2; } }

    /* requirements */
    .rq-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: var(--space-5); }
    @container (max-width: 860px) { .rq-grid { grid-template-columns: minmax(0, 1fr); } }
    .rq-col h5 { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-subtle); margin-bottom: var(--space-3); }
    .big-nums { display: flex; gap: var(--space-5); margin-bottom: var(--space-4); }
    .big-nums .stat-value { font-size: var(--text-3xl); }
    .pbar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--bg-surface-3); }
    .pbar i { display: block; height: 100%; }
    .pbar-leg { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-top: 8px; font-size: var(--text-xs); color: var(--fg-muted); }
    .pbar-leg span { display: inline-flex; align-items: center; gap: 6px; }
    .cov { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-3); }
    .cov .row { font-size: var(--text-xs); color: var(--fg-muted); justify-content: space-between; }
    .cov .row b { color: var(--fg-strong); font-variant-numeric: tabular-nums; }
    .cov .progress { height: 6px; }
    .cov .progress.ok > span { background: var(--success); }
    .cov .progress.warn > span { background: var(--warning); }
    .nfr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
    .nfr:last-child { border-bottom: 0; padding-bottom: 0; }
    .nfr:first-of-type { padding-top: 0; }
    .nfr .tgt { margin-left: auto; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--brand-fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .nfr .tx { font-size: var(--text-sm); line-height: 1.4; min-width: 0; }
    .nfr .tx small { display: block; font-size: var(--text-xs); color: var(--fg-subtle); }

    /* scope */
    .sc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
    @container (max-width: 760px) { .sc-grid { grid-template-columns: minmax(0, 1fr); } }
    .sc-col { background: var(--bg-surface-2); border: 1px solid var(--border-default); border-radius: var(--radius-lg); display: flex; flex-direction: column; min-width: 0; transition: border-color var(--dur-fast), background var(--dur-fast); }
    .sc-col.is-over { border-color: var(--brand); background: var(--brand-soft); }
    .sc-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; }
    .sc-head b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .sc-head .dot { width: 9px; height: 9px; }
    .sc-count { font-size: var(--text-2xs); font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--bg-surface-3); color: var(--fg-muted); }
    .sc-sub { padding: 0 12px 8px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .sc-body { display: flex; flex-direction: column; gap: 6px; padding: 2px 8px 8px; flex: 1; min-height: 60px; }
    .sc-item { display: flex; gap: 6px; align-items: flex-start; padding: 8px 6px 8px 8px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-md); cursor: grab; box-shadow: var(--shadow-xs); }
    .sc-item:hover { border-color: var(--border-strong); }
    .sc-item.dragging { opacity: .35; }
    .sc-item > svg.grip { width: 14px; height: 14px; color: var(--fg-faint); margin-top: 2px; }
    .sc-item .tx { flex: 1; min-width: 0; font-size: var(--text-sm); line-height: 1.4; color: var(--fg-default); }
    .sc-item .tx .rqs { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    .sc-add { display: flex; gap: 6px; padding: 0 8px 10px; }
    .sc-add .input { height: 30px; font-size: var(--text-xs); }
    .sc-empty { border: 1.5px dashed var(--border-default); border-radius: var(--radius-md); padding: var(--space-4); text-align: center; font-size: var(--text-xs); color: var(--fg-faint); }
    .ar-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-top: var(--space-3); }
    @container (max-width: 760px) { .ar-grid { grid-template-columns: minmax(0, 1fr); } }
    .li { display: flex; gap: 10px; align-items: flex-start; padding: 10px var(--space-4); border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); line-height: 1.45; }
    .li:last-of-type { border-bottom: 0; }
    .li .id { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--fg-subtle); padding-top: 2px; min-width: 32px; }
    .li .tx { flex: 1; min-width: 0; }
    .li .tx small { display: block; color: var(--fg-subtle); font-size: var(--text-xs); margin-top: 2px; }
    .li button.badge { border: 0; cursor: pointer; }
    #asmCard, #riskCard { display: flex; flex-direction: column; }
    .li-add { margin-top: auto; display: flex; gap: 6px; padding: 10px var(--space-4); border-top: 1px solid var(--border-subtle); background: var(--bg-surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .li-add .input { height: 30px; font-size: var(--text-xs); }

    /* artifact pipeline */
    .pl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-3); }
    .pl-card { display: flex; flex-direction: column; gap: 10px; padding: var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); box-shadow: var(--shadow-xs); min-width: 0; }
    .pl-head { display: flex; gap: 10px; align-items: flex-start; }
    .pl-head h5 { font-size: var(--text-md); line-height: 1.3; }
    .pl-head .sub { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 1px; line-height: 1.4; }
    .pl-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: var(--text-xs); color: var(--fg-subtle); }
    .pl-src { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.45; flex: 1; }
    .pl-foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
    .pl-add { border-style: dashed; background: var(--bg-surface-2); align-items: center; justify-content: center; text-align: center; color: var(--fg-subtle); cursor: pointer; min-height: 190px; box-shadow: none; }
    .pl-add:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-fg); }
    .pl-add .empty-icon { width: 40px; height: 40px; }

    /* gate */
    .gate { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    @container (max-width: 800px) { .gate { grid-template-columns: minmax(0, 1fr); } }
    .gate-list { padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: 2px; }
    .gk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: var(--text-sm); }
    .gk > svg { margin-top: 1px; }
    .gk .tx { flex: 1; min-width: 0; line-height: 1.4; }
    .gk small { display: block; font-size: var(--text-xs); color: var(--fg-subtle); }
    .gk.ok > svg { color: var(--success); }
    .gk.warn > svg { color: var(--warning); }
    .gk.fail > svg { color: var(--danger); }
    .gate-cta { padding: var(--space-5); border-left: 1px solid var(--border-subtle); background: var(--bg-surface-2); display: flex; flex-direction: column; gap: var(--space-3); justify-content: center; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
    @container (max-width: 800px) { .gate-cta { border-left: 0; border-top: 1px solid var(--border-subtle); border-radius: 0 0 var(--radius-lg) var(--radius-lg); } }
    .gate-cta .btn-lg { width: 100%; white-space: normal; height: auto; min-height: 42px; padding: 10px 16px; text-align: center; line-height: 1.3; }
    .gate-in { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-xs); color: var(--fg-muted); }
    .gate-in span { display: inline-flex; align-items: center; gap: 6px; }
    .gate-in svg { width: 13px; height: 13px; color: var(--fg-subtle); }

    /* progress modal */
    .pg-list { display: flex; flex-direction: column; gap: 8px; margin-top: var(--space-3); }
    .pg-step { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); color: var(--fg-subtle); }
    .pg-step.is-run { color: var(--fg-strong); }
    .pg-step.is-done { color: var(--fg-muted); }
    .pg-ic { width: 20px; height: 20px; border-radius: 50%; border: 1.5px dashed var(--border-strong); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pg-step.is-run .pg-ic { border: 0; }
    .pg-step.is-done .pg-ic { border: 0; background: var(--success); color: var(--fg-on-brand); }
    .pg-ic svg { width: 12px; height: 12px; }
    .file-list { display: flex; flex-direction: column; gap: 6px; margin-top: var(--space-3); }
    .file-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: var(--text-sm); }
    .file-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .role-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .role-pick label { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: var(--radius-full); font-size: var(--text-xs); cursor: pointer; background: var(--bg-surface); }
    .role-pick label:has(input:checked) { background: var(--brand-soft); border-color: var(--brand-soft-2); color: var(--brand-fg); }
    .role-pick input { accent-color: var(--brand); margin: 0; }
    .res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin: var(--space-3) 0; }
    .res-stats > div { padding: 10px 12px; border-radius: var(--radius-md); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); }
    .res-stats .stat-value { font-size: var(--text-xl); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    .modal .field + .field { margin-top: var(--space-3); }

    /* ---- lifecycle states: first-run, blockers, empty states ---- */
    .empty.is-compact { padding: var(--space-8) var(--space-6); }
    .src-strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: var(--space-3); }
    .src-strip .src-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-subtle); margin-right: 4px; }
    .pend { border-color: var(--brand); background: var(--brand-soft); }
    .pend.is-hero { padding: var(--space-4) var(--space-5); gap: var(--space-4); border-style: solid; border-color: var(--brand-soft-2); box-shadow: var(--shadow-focus); }
    .pend.is-hero { flex-wrap: nowrap; }
    .pend.is-hero .grow { min-width: 0; }
    .pend.is-hero .btn { flex-shrink: 0; }
    .pend.is-hero .file-tile { width: 40px; height: 40px; flex-shrink: 0; background: var(--brand); color: var(--fg-on-brand); }
    .pend.is-hero b { font-size: var(--text-md); color: var(--fg-strong); }
    .sugg { margin-top: 10px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--bg-surface); overflow: hidden; }
    .sugg-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: var(--text-xs); color: var(--fg-muted); background: var(--bg-surface-2); border-bottom: 1px solid var(--border-subtle); }
    .sugg-head b { font-weight: var(--weight-semibold); }
    .sugg-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: var(--text-sm); line-height: 1.45; border-bottom: 1px solid var(--border-subtle); }
    .sugg-row:last-child { border-bottom: 0; }
    .sugg-row .tx { flex: 1; min-width: 0; }
    .fr-list { list-style: none; padding: 0; margin: var(--space-3) 0 0; display: flex; flex-direction: column; gap: 6px; }
    .fr-i { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface); }
    .fr-i.is-next { border-color: var(--brand); box-shadow: var(--shadow-focus); }
    .fr-i .n { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: var(--text-xs); font-weight: var(--weight-semibold); border: 1.5px solid var(--border-strong); color: var(--fg-subtle); }
    .fr-i.is-next .n { border-color: var(--brand); color: var(--brand-fg); }
    .fr-i.is-done .n { background: var(--success); border-color: var(--success); color: var(--fg-on-brand); }
    .fr-i .n svg { width: 13px; height: 13px; }
    .fr-i .tx { flex: 1; min-width: 0; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .fr-i.is-done .tx { color: var(--fg-subtle); font-weight: var(--weight-regular); }
    .q-alert { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px var(--space-5); background: var(--danger-soft); border-bottom: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); border-radius: var(--radius-lg) var(--radius-lg) 0 0; font-size: var(--text-sm); color: var(--fg-strong); }
    .q-alert > svg { color: var(--danger); flex-shrink: 0; }
    .q-alert .text-xs { margin-top: 2px; }
    .q-row.is-blocking { background: color-mix(in srgb, var(--danger) 5%, transparent); box-shadow: inset 3px 0 0 var(--danger); }
    .dot-und { background: var(--fg-faint); }
    .sc-grid.has-und { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @container (max-width: 1000px) { .sc-grid.has-und { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @container (max-width: 760px) { .sc-grid.has-und { grid-template-columns: minmax(0, 1fr); } }
    .sc-col.is-und { border-style: dashed; border-color: var(--border-strong); }
    .sc-item .wait { margin-top: 4px; }
    .li-empty { color: var(--fg-faint); font-size: var(--text-xs); justify-content: center; padding: var(--space-5) var(--space-4); }
    .pl-card.is-locked { background: var(--bg-surface-2); }
    .pl-card.is-locked .pl-head, .pl-card.is-locked .pl-meta { opacity: .7; }
    .pl-card.is-rec { border-color: var(--brand); box-shadow: var(--shadow-focus); }
    .gk.todo > svg { color: var(--fg-faint); }
    .gate-why { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-xs); color: var(--fg-muted); }
    .gate-why b { color: var(--danger-fg); font-weight: var(--weight-semibold); }
    .gate-why ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    .gate-why li { display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
    .gate-why li svg { width: 13px; height: 13px; color: var(--danger); margin-top: 1px; flex-shrink: 0; }
  </style>

<body data-page="initial" data-shell="project" data-crumb="nav.initial">
  <main class="canvas">
    <div class="canvas-inner">

      <!-- Header -->
      <div class="page-header">
        <div>
          <span class="phase-chip phase-initial" data-i18n="phase.initial"></span>
          <h1 class="mt-2" data-i18n="in.title"></h1>
          <div class="subtitle" id="subtitle"></div>
        </div>
        <div class="row gap-2 wrap">

          <button class="btn btn-ai" data-act="ask-top"><i data-lucide="sparkles"></i><span data-i18n="in.ask"></span></button>
        </div>
      </div>

      <div class="sec-nav" id="secNav"></div>

      <div id="banner"></div>
      <div id="guide"></div>

      <!-- 1 Stepper -->

        <div class="ph-steps" id="stepper"></div>
      </section>

      <!-- 2 Meetings -->
      <section class="section" id="s-meet">
        <div class="sh">
          <div class="ttl"><span class="no">2</span><div><h3 data-i18n="in.s2.title"></h3><div class="sub" id="meetSub"></div></div></div>
          <div class="row gap-2 wrap">
            <button class="btn btn-secondary btn-sm" data-act="upload"><i data-lucide="upload"></i><span data-i18n="in.upload"></span></button>
            <button class="btn btn-secondary btn-sm" data-act="notes"><i data-lucide="notebook-pen"></i><span data-i18n="in.addnotes"></span></button>
            <button class="btn btn-ai btn-sm" data-act="extract"><i data-lucide="wand-sparkles"></i><span data-i18n="in.extract"></span></button>
          </div>
        </div>
        <div class="card" id="meetCard"></div>
        <div class="src-strip" id="srcStrip"></div>
      </section>

      <!-- 3 Questions -->
      <section class="section" id="s-q">
        <div class="sh">
          <div class="ttl"><span class="no">3</span><div><h3 data-i18n="in.s3.title"></h3><div class="sub" data-i18n="in.s3.sub"></div></div></div>
          <div class="row gap-2 wrap">

            <button class="btn btn-secondary btn-sm" data-act="q-add"><i data-lucide="plus"></i><span data-i18n="in.q.add"></span></button>
          </div>
        </div>
        <div class="card" id="qCard"></div>
      </section>

      <!-- 4 Requirements -->
      <section class="section" id="s-req">
        <div class="sh">
          <div class="ttl"><span class="no">4</span><div><h3 data-i18n="in.s4.title"></h3><div class="sub" id="reqSub"></div></div></div>
          <div class="row gap-2 wrap">
            <button class="btn btn-secondary btn-sm" id="gapsBtn" data-act="gaps"><i data-lucide="scan-search"></i><span data-i18n="in.gaps"></span></button>
            <a class="btn btn-soft btn-sm" id="brdLink" href="artifacts.html#brd"><i data-lucide="file-text"></i><span id="openBrd"></span></a>
          </div>
        </div>
        <div class="card card-body" id="reqCard"></div>
      </section>

      <!-- 5 Scope -->
      <section class="section" id="s-scope">
        <div class="sh">
          <div class="ttl"><span class="no">5</span><div><h3 data-i18n="in.s5.title"></h3><div class="sub" data-i18n="in.s5.sub"></div></div></div>
          <a class="btn btn-soft btn-sm" href="artifacts.html#scope"><i data-lucide="target"></i><span data-i18n="in.open_scope"></span></a>
        </div>

        <div class="ar-grid">
          <div class="card" id="asmCard"></div>
          <div class="card" id="riskCard"></div>
        </div>
      </section>

      <!-- 6 Artifact pipeline -->

          <div class="ttl"><span class="no">6</span><div><h3 data-i18n="in.s6.title"></h3><div class="sub" id="plSub"></div></div></div>

        questions: L('<p>Draft agenda for the next Atlas steering meeting:</p><ol><li>Does the payroll window include bank file approval (Q-08)?</li><li>Handling of rejected lines in the NAPAS file.</li><li>Delegation rules around public holidays.</li><li>Priority of the overtime approval change request.</li></ol>', '<p>Gợi ý chương trình cho buổi họp ban chỉ đạo Atlas tới:</p><ol><li>Khung chạy lương có gồm duyệt file ngân hàng không (Q-08)?</li><li>Xử lý các dòng bị từ chối trong file NAPAS.</li><li>Quy tắc ủy quyền vào ngày lễ.</li><li>Mức ưu tiên của change request duyệt làm thêm giờ.</li></ol>'),
        summ: L('<p><b>Charter sign-off 14 Mar — summary</b></p><ul><li>Internal SOW ATL-INT-2026-003 signed by HR and IT.</li><li>Scope changes go through the HR steering committee.</li></ul><p>Full notes are in <b>Meeting notes</b>.</p>', '<p><b>Ký duyệt điều lệ 14/3 — tóm tắt</b></p><ul><li>SOW nội bộ ATL-INT-2026-003 được Nhân sự và CNTT ký.</li><li>Thay đổi phạm vi đi qua ban chỉ đạo Nhân sự.</li></ul><p>Biên bản đầy đủ nằm trong <b>Biên bản họp</b>.</p>'),

    /* ------------------------------------------------------------- state */
    const D = DS[P.id] || DS['lotus-pay'];
    const IS = (P.state && P.state.initial) || {};
    const IDS = Object.assign({ meeting: 'meeting-notes', brd: 'brd', scope: 'scope', est: 'estimation', sow: 'sow' }, D.ids);
    const ARTS = BASE_ARTS.map(b => Object.assign({ id: IDS[b.k] }, b));
    const REQS = D.reqs, NFRS = D.nfrs, ROLES = D.roles;
    const clone = o => JSON.parse(JSON.stringify(o));
    const S = {
      finalized: PC.phaseStatus('initial') === 'done', finalDate: IS.completedOn || null,
      rebaselined: false, reopened: false, cr: null, snap: null,
      qFilter: 'all', showAllMeet: false, openPts: new Set(),
      art: {}, q: clone(D.q), meet: clone(D.meet), sc: clone(D.sc), asm: clone(D.asm), risk: clone(D.risk),
      crs: D.crs,
    };
    ARTS.forEach(a => { const s = D.arts[a.k]; S.art[a.id] = { st: s.st, v: s.v, date: s.date, stale: false }; });
    (function () { const m = S.meet.find(x => x.pts); if (m) S.openPts.add(m.id); })();
    const artName = a => t('in.a.' + a.k);
    const slug = a => ({ meeting: 'Meeting-notes', brd: 'BRD', scope: 'Scope-definition', est: 'Estimation', sow: 'SOW' }[a.k]);

    /* ----------------------------------------------------- derived values */
    const STEP_KEYS = ['discovery', 'requirements', 'scope', 'estimation', 'signoff'];
    function stepStatus(i) {
      const a = ARTS[i], s = S.art[a.id];
      if (s.st === 'approved') return 'done';
      if (s.st === 'review') return 'review';
      if (s.stale) return 'stale';
      if (IS.steps && IS.steps[STEP_KEYS[i]] === 'in_progress') return 'current';
      return ARTS.slice(0, i).every(x => S.art[x.id].st === 'approved') ? 'current' : 'todo';
    }
    const approvedCount = () => ARTS.filter(a => S.art[a.id].st === 'approved').length;
    const pctDone = () => {
      const calc = Math.round(ARTS.reduce((n, a) => n + ({ approved: 1, review: .6, draft: .3, not_started: 0 }[S.art[a.id].st] || 0), 0) / ARTS.length * 100);
      return S.finalized ? 100 : Math.max((P.progress && P.progress.initial) || 0, calc);
    };
    const qCount = st => S.q.filter(q => q.st === st).length;
    const blockingOpen = () => S.q.filter(q => q.st === 'open' && q.blocking).length;
    const nonBlockingOpen = () => S.q.filter(q => q.st === 'open' && !q.blocking).length;
    const nextStepName = () => { const i = ARTS.findIndex(a => S.art[a.id].st !== 'approved'); return i < 0 ? t('in.step.5') : t('in.step.' + (i + 1)); };
    const filesCount = () => S.meet.reduce((n, m) => n + m.files.length, 0);
    const brdV = () => S.art.brd.v;
    const brdLabel = () => S.art.brd.st === 'not_started' ? t('in.a.brd') : 'BRD v' + S.art.brd.v;
    /* a card can be generated once the previous artifact exists and is approved (the first one is always open) */
    const unlocked = i => i === 0 || S.art[ARTS[i - 1].id].st === 'approved' || S.art[ARTS[i].id].st !== 'not_started';
    const recommended = () => { const i = ARTS.findIndex((a, n) => S.art[a.id].st === 'not_started' && unlocked(n)); return i >= 0 && ARTS.slice(0, i).every(x => S.art[x.id].st === 'approved') ? ARTS[i].id : null; };
    const gateChecks = () => {
      const ck = [];
      const gk = { meeting: 'notes', brd: 'brd', scope: 'scope', est: 'est', sow: 'sow' };
      ARTS.forEach(a => {
        const s = S.art[a.id], ok = s.st === 'approved';
        const stTxt = s.stale ? t('in.st.stale') : t('in.as.' + s.st);
        const k = ok ? 'ok' : s.stale ? 'fail' : s.st === 'review' ? 'warn' : 'todo';
        let detail;
        if (ok) { const u = S.sc.und.length; detail = a.k === 'scope' ? t(u ? 'in.gk.scope_nu' : 'in.gk.scope_n', { a: S.sc.in.length, b: S.sc.later.length, c: S.sc.out.length, u }) : 'v' + s.v + ' · ' + fd(s.date); }
        else detail = t('in.gk.not_yet', { s: stTxt });
        ck.push({ k, block: !ok, label: t('in.gk.' + gk[a.k]), detail, reason: t('in.gk.reason', { name: artName(a), s: stTxt }), link: 'artifacts.html#' + a.id });
      });
      if (S.sc.und.length) { const m = t('in.gk.und', { n: S.sc.und.length }); ck.push({ k: 'fail', block: true, label: t('in.gk.scope_dec'), detail: m, reason: m, go: 's-scope' }); }
      const b = blockingOpen(), o = nonBlockingOpen();
      if (!S.q.length) {
        ck.push({ k: 'todo', block: false, label: t('in.gk.q_blocking'), detail: t('in.gk.q_none'), go: 's-q' });
        ck.push({ k: 'todo', block: false, label: t('in.gk.q_open'), detail: '', go: 's-q' });
      } else {
        ck.push({ k: b ? 'fail' : 'ok', block: !!b, label: t('in.gk.q_blocking'), detail: b ? t('in.gk.q_blocking.fail', { n: b }) : '', reason: t('in.gk.q_blocking.fail', { n: b }), go: 's-q' });
        ck.push({ k: o ? 'warn' : 'ok', block: false, label: t('in.gk.q_open'), detail: o ? t('in.gk.q_open.warn', { n: o }) : '', go: 's-q' });
      }
      return ck;
    };

    /* -------------------------------------------------------------- render */
    function renderSubtitle() { $('subtitle').textContent = t('in.sub', { client: CLIENT }); }
    function renderNav() {
      const items = [['s-steps', 'in.nav.steps'], ['s-meet', 'in.nav.meet'], ['s-q', 'in.nav.q'], ['s-req', 'in.nav.req'], ['s-scope', 'in.nav.scope'], ['s-art', 'in.nav.art'], ['s-gate', 'in.nav.gate']];
      $('secNav').innerHTML = items.map((x, i) => `<button data-go="${x[0]}"><span class="n">${i + 1}</span>${t(x[1])}</button>`).join('');

    function renderBanner() {
      let cls, ic, title, sub, actions, facts;
      const crsN = S.crs;
      const nPend = S.meet.filter(m => !m.pts).length;
      if (S.reopened) {
        cls = 'is-reopen'; ic = 'git-pull-request-arrow'; title = t('in.b.reopen'); sub = t('in.b.reopen.sub', { cr: S.cr.id });
        actions = `<button class="btn btn-secondary btn-sm" data-act="discard"><i data-lucide="undo-2"></i>${t('in.b.discard')}</button><button class="btn btn-primary btn-sm" data-go="s-gate"><i data-lucide="arrow-down"></i>${t('in.b.to_gate')}</button>`;
        facts = [[t('in.f.baseline'), 'BRD v' + D.ver.brd + ' · ' + t('in.a.scope') + ' v' + D.ver.scope + ' · SOW v' + D.ver.sow], [t('in.f.crs'), t('in.f.crs.v2', { n: crsN })], [t('in.f.signoff'), t('in.f.pending')]];
      } else if (S.finalized) {
        cls = 'is-done'; ic = 'badge-check'; title = S.rebaselined ? t('in.b.rebase') : t('in.b.done');
        sub = S.rebaselined ? t('in.b.rebase.sub', { cr: S.rebaselined }) : t('in.b.done.sub');
        actions = `<a class="btn btn-secondary btn-sm" href="artifacts.html#${IDS.sow}"><i data-lucide="file-signature"></i>${t('in.b.view_sow')}</a><button class="btn btn-secondary btn-sm" data-act="reopen"><i data-lucide="rotate-ccw"></i>${t('in.b.reopen_btn')}</button>`;
        facts = [[t('in.f.completed'), fd(S.finalDate)], D.contract ? [t('in.f.contract'), D.contract] : null, [t('in.f.baseline'), 'BRD v' + brdV() + ' · ' + t('in.a.scope') + ' v' + S.art.scope.v + ' · SOW v' + S.art.sow.v], [t('in.f.meetings'), String(S.meet.length)], [t('in.f.reqs'), String(REQS.length)], [t('in.f.crs'), t('in.f.crs.v', { n: crsN })]].filter(Boolean);
      } else {
        cls = 'is-wip'; ic = 'compass'; title = D.firstRun ? t('in.b.new') : t('in.b.wip');
        sub = IS.next ? t('in.b.wip.sub2', { pct: pctDone(), next: PC.L(IS.next) }) : t('in.b.wip.sub', { pct: pctDone(), next: nextStepName() });
        const bo = blockingOpen();
        if (D.firstRun && nPend) actions = `<button class="btn btn-primary btn-sm" data-act="extract"><i data-lucide="wand-sparkles"></i>${t('in.m.extract_one')}</button>`;
        else if (D.firstRun && !S.q.length) actions = `<button class="btn btn-primary btn-sm" data-act="genq"><i data-lucide="sparkles"></i>${t('in.q.gen_short')}</button>`;
        else actions = (bo ? `<button class="btn btn-secondary btn-sm" data-go="s-q"><i data-lucide="octagon-alert"></i>${t('in.b.review_blocking', { n: bo })}</button>` : '') + `<button class="btn btn-primary btn-sm" data-go="s-art"><i data-lucide="arrow-right"></i>${t('in.b.continue')}</button>`;
        const open = qCount('open');
        facts = [[t('in.f.started'), fd(D.started)], [t('in.f.meetings'), String(S.meet.length)], [t('in.f.sources'), String(D.sources.length)],
          [t('in.f.questions'), S.q.length ? t('in.f.q.v', { o: open, b: bo }) : '0'], [t('in.f.reqs'), String(REQS.length)], [t('in.f.baseline'), S.art.brd.st === 'not_started' ? '—' : brdLabel() + ' · ' + t('in.as.' + S.art.brd.st)], [t('in.f.signoff'), t('in.f.pending')]];
      }
      $('banner').innerHTML = `<div class="banner ${cls}">
        <div class="banner-main">
          <span class="b-ic"><i data-lucide="${ic}" class="icon-lg"></i></span>
          <div class="b-txt"><div class="h5">${title}</div><p>${sub}</p></div>
          <div class="row gap-2 wrap">${actions}</div>
        </div>
        <div class="facts">${facts.map(f => `<div class="fact"><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}</div>
      </div>`;
      PC.refresh($('banner'));
    }

    function guideText() {
      if (S.reopened) return ARTS.every(a => S.art[a.id].st === 'approved') && blockingOpen() === 0 ? t('in.g.reopened_ready') : t('in.g.reopened', { cr: S.cr.id });
      if (!S.finalized) {
        if (D.firstRun) {
          if (S.meet.some(m => !m.pts)) return t('in.g.first1', { s: D.sources.length, m: S.meet.length });
          if (!S.q.length) return t('in.g.first2');
          return t('in.g.first3', { n: S.q.length });
        }
        const bo = blockingOpen();
        if (bo) return t('in.g.blk', { n: bo, ids: S.q.filter(q => q.st === 'open' && q.blocking).map(q => q.id).join(', ') });
        return t('in.g.wip', { next: nextStepName(), q: qCount('open') });
      }
      return nonBlockingOpen() ? t('in.g.done_open', { n: nonBlockingOpen() }) : t('in.g.done');
    }
    function renderGuide() {
      let extra;
      if (D.firstRun && !S.finalized) {
        const st = [
          { done: S.meet.every(m => m.pts), label: t('in.g.s1'), act: 'extract', btn: t('in.m.extract_one'), icon: 'wand-sparkles' },
          { done: S.q.length > 0, label: t('in.g.s2'), act: 'genq', btn: t('in.q.gen_short'), icon: 'message-square-plus' },
          { done: REQS.length > 0, label: t('in.g.s3'), act: 'draftreq', btn: t('in.r.draft_short'), icon: 'file-text' },
        ];
        let nextFound = false;
        extra = `<ol class="fr-list">${st.map((s, i) => {
          const isNext = !s.done && !nextFound; if (isNext) nextFound = true;
          return `<li class="fr-i ${s.done ? 'is-done' : isNext ? 'is-next' : ''}"><span class="n">${s.done ? '<i data-lucide="check"></i>' : i + 1}</span><span class="tx">${s.label}</span>${s.done ? '' : `<button class="btn ${isNext ? 'btn-ai' : 'btn-secondary'} btn-sm" data-act="${s.act}" ${isNext ? '' : 'disabled'}><i data-lucide="${s.icon}"></i>${s.btn}</button>`}</li>`;
        }).join('')}</ol>`;
      } else {
        extra = `<div class="guide-btns">
            <button data-act="g" data-g="questions"><i data-lucide="message-square-plus" class="icon-sm"></i>${t('in.g.p1')}</button>
            <button data-act="g" data-g="gaps"><i data-lucide="scan-search" class="icon-sm"></i>${t('in.g.p2')}</button>
            <button data-act="g" data-g="needs"><i data-lucide="blocks" class="icon-sm"></i>${t('in.g.p3')}</button>
          </div>`;
      }
      $('guide').innerHTML = `<div class="alert alert-ai guide"><span class="avatar avatar-ai"><i data-lucide="sparkles" style="width:15px;height:15px"></i></span>
        <div class="guide-body"><div class="h5">${t(D.firstRun && !S.finalized ? 'in.g.title_first' : 'in.g.title')}</div><p>${esc(guideText())}</p>${extra}</div></div>`;
      PC.refresh($('guide'));
    }

    function renderStepper() {
      const badge = { done: 'badge-success', current: 'badge-brand', review: 'badge-warning', todo: '', stale: 'badge-warning' };
      $('stepper').innerHTML = ARTS.map((a, i) => {
        const st = stepStatus(i), s = S.art[a.id], ns = s.st === 'not_started';
        const dot = st === 'done' ? '<i data-lucide="check"></i>' : st === 'stale' ? '<i data-lucide="refresh-cw"></i>' : (i + 1);
        return `<div class="ph-step is-${st}">
          <div class="ph-top"><span class="ph-dot">${dot}</span>${i < ARTS.length - 1 ? '<span class="ph-line"></span>' : ''}</div>
          <div class="ph-name">${t('in.step.' + (i + 1))}</div>
          <span class="badge ${badge[st]}">${t('in.st.' + st)}</span>
          <p class="ph-desc">${t('in.step.' + (i + 1) + 'd')}</p>
          <a class="src-chip" href="artifacts.html#${a.id}"><i data-lucide="${ns ? 'circle-dashed' : a.icon}"></i><span>${t('in.sn.' + a.k)} · ${ns ? t('in.as.not_started') : 'v' + s.v}</span></a>
          <div class="ph-date">${st === 'done' ? fd(s.date) : '—'}</div></div>`;
      }).join('');
      PC.refresh($('stepper'));
    }

    function renderMeetings() {
      $('meetSub').textContent = t('in.s2.sub', { m: S.meet.length, f: filesCount(), dir: DIR + '\\sources\\meetings' });
      const list = S.showAllMeet ? S.meet : S.meet.slice(0, 4);
      const rows = list.map(m => {
        const [mi, mb] = MT[m.type] || MT.other;
        const d = dm(m.date);
        const files = m.files.map(f => {
          const ic = `<i data-lucide="${FK[f.k]}" class="${f.k === 'audio' ? 'kind-audio' : ''}"></i>`;
          const title = esc(DIR + '\\sources\\meetings\\' + f.n);
          return f.link ? `<a class="src-chip" href="artifacts.html#${f.link}" title="${title}">${ic}<span>${esc(f.n)}</span></a>` : `<button class="src-chip" data-act="openfile" data-n="${esc(f.n)}" title="${title}">${ic}<span>${esc(f.n)}</span></button>`;
        }).join('');
        let pts;
        if (m.pts) {
          const open = S.openPts.has(m.id);
          pts = `<div class="pts"><button class="pts-head ${open ? 'open' : ''}" data-act="pts" data-id="${m.id}"><i data-lucide="wand-sparkles" class="icon-sm text-brand"></i>${t('in.m.keypoints')} <span class="badge">${m.pts.length}</span><i data-lucide="chevron-down" class="chev icon-sm"></i></button>
            ${open ? `<div class="pts-list">${m.pts.map(p => `<div class="pt"><span class="badge ${PT[p.t]}">${t('in.pt.' + p.t)}</span><span>${esc(tx(p.tx))}</span></div>`).join('')}</div>` : ''}</div>`;
          if (m.sugg && m.sugg.length) {
            const left = m.sugg.filter(s => !s.added).length;
            pts += `<div class="sugg"><div class="sugg-head"><i data-lucide="lightbulb" class="icon-sm text-warning"></i><b>${t('in.m.sugg')}</b><span class="badge">${m.sugg.length}</span>${left ? `<button class="btn btn-soft btn-sm" style="margin-left:auto" data-act="sugg-all" data-id="${m.id}"><i data-lucide="list-plus"></i>${t('in.m.sugg_all')}</button>` : ''}</div>
              ${m.sugg.map((s, i) => `<div class="sugg-row"><span class="tx">${esc(tx(s.q))}${s.blocking ? ` <span class="badge badge-danger">${t(s.blocks ? 'in.q.blocks.' + s.blocks : 'in.q.blocking')}</span>` : ''}</span>${s.added ? `<span class="badge badge-success"><i data-lucide="check"></i>${t('in.m.sugg_added')}</span>` : `<button class="btn btn-secondary btn-sm" data-act="sugg-add" data-id="${m.id}" data-i="${i}"><i data-lucide="plus"></i>${t('in.m.sugg_add')}</button>`}</div>`).join('')}</div>`;
          }
        } else if (D.firstRun) {
          pts = `<div class="pend is-hero"><span class="file-tile"><i data-lucide="wand-sparkles"></i></span><div class="grow"><b>${t('in.m.hero.t')}</b><div class="text-sm text-muted">${t('in.m.hero.d')}</div></div><button class="btn btn-primary" data-act="extract"><i data-lucide="wand-sparkles"></i>${t('in.m.extract_one')}</button></div>`;
        } else {
          pts = `<div class="pend"><i data-lucide="hourglass" class="icon-sm text-warning"></i><span class="grow">${t('in.m.pending')}</span><button class="btn btn-soft btn-sm" data-act="extract"><i data-lucide="wand-sparkles"></i>${t('in.m.extract_one')}</button></div>`;
        }
        return `<div class="tl-item">
          <div class="tl-date"><b>${d.d}</b><span>${d.m}</span><i></i></div>
          <div class="min-w-0" style="min-width:0">
            <div class="tl-head"><h5>${esc(tx(m.title))}</h5><span class="badge ${mb}"><i data-lucide="${mi}"></i>${t('in.mt.' + m.type)}</span></div>
            <div class="tl-meta"><span><i data-lucide="clock-3"></i>${t('in.m.min', { n: m.dur })}</span><span><i data-lucide="map-pin"></i>${m.where ? esc(m.where) : t('in.m.online')}</span><span><i data-lucide="users"></i>${m.roles.map(r => t('in.role.' + r)).join(' · ')}</span></div>
            <div class="tl-files">${files}</div>
            ${pts}
          </div></div>`;
      }).join('');
      const hidden = S.meet.length - 4;
      const more = hidden > 0 ? `<div class="more-row"><button class="btn btn-ghost btn-sm" data-act="more-meet"><i data-lucide="${S.showAllMeet ? 'chevrons-up' : 'chevrons-down'}"></i>${S.showAllMeet ? t('in.m.less') : t('in.m.more', { n: hidden })}</button></div>` : '';
      $('meetCard').innerHTML = `<div class="tl">${rows}</div>${more}`;
      $('srcStrip').innerHTML = `<span class="src-lbl"><i data-lucide="paperclip" class="icon-sm"></i>${t('in.m.sources', { n: D.sources.length })}</span>` + D.sources.map(n => `<button class="src-chip" data-act="openfile" data-n="${esc(n)}" title="${esc(DIR + '\\sources\\' + n)}"><i data-lucide="${/\.xlsx?$/i.test(n) ? 'sheet' : /\.(png|jpe?g)$/i.test(n) ? 'image' : 'file-text'}"></i><span>${esc(n)}</span></button>`).join('');
      PC.refresh($('meetCard')); PC.refresh($('srcStrip'));
    }

    const meetById = id => S.meet.find(m => m.id === id);
    function qSource(q) {
      if (q.src) { const m = meetById(q.src); return `<span><i data-lucide="calendar-days"></i>${esc(tx(m.title))} · ${fdShort(m.date)}</span>`; }
      return `<span><i data-lucide="file-search"></i>${esc(tx(q.srcLabel))}</span>`;
    }
    function renderQuestions() {
      const f = S.qFilter;
      if (!S.q.length) {
        $('qFilter').innerHTML = '';
        $('qCard').innerHTML = `<div class="empty is-compact"><div class="empty-icon"><i data-lucide="message-square-plus"></i></div><div><div class="h5">${t('in.q.empty.t')}</div><p class="text-sm text-muted" style="max-width:460px;margin:4px auto 0">${t('in.q.empty.d')}</p></div>
          <div class="row gap-2 wrap" style="justify-content:center"><button class="btn btn-ai" data-act="genq"><i data-lucide="sparkles"></i>${t('in.q.gen')}</button><button class="btn btn-secondary" data-act="q-add"><i data-lucide="plus"></i>${t('in.q.add')}</button></div></div>`;
        PC.refresh($('qCard')); return;
      }
      const opts = [['all', S.q.length], ['open', qCount('open')], ['answered', qCount('answered')], ['assumption', qCount('assumption')]];
      $('qFilter').innerHTML = opts.map(o => `<button data-act="qf" data-f="${o[0]}" class="${f === o[0] ? 'is-active' : ''}">${t('in.q.' + o[0])} <span class="text-faint">${o[1]}</span></button>`).join('');
      const list = S.q.filter(q => f === 'all' || q.st === f);
      const stBadge = { open: 'badge-warning', answered: 'badge-success', assumption: 'badge-purple' };
      const stIcon = { open: 'circle-help', answered: 'circle-check', assumption: 'lightbulb' };
      const bo = S.q.filter(q => q.st === 'open' && q.blocking);
      const alertHtml = bo.length ? `<div class="q-alert"><i data-lucide="octagon-alert"></i><div class="grow"><b>${t('in.q.bsum', { n: bo.length, what: t('in.q.what.' + (bo[0].blocks || 'signoff')) })}</b><div class="text-xs text-muted">${esc(bo.map(q => q.id + ' · ' + tx(q.q)).join('  |  '))}</div></div><button class="btn btn-secondary btn-sm" data-act="g" data-g="questions"><i data-lucide="message-square-plus"></i>${t('in.g.p1')}</button></div>` : '';
      $('qCard').innerHTML = alertHtml + (list.length ? list.map(q => `<div class="q-row ${q.blocking && q.st === 'open' ? 'is-blocking' : ''}">
          <div class="q-id">${q.id}</div>
          <div style="min-width:0"><div class="q-text">${esc(tx(q.q))}</div>
            <div class="q-meta">${qSource(q)}${q.req ? `<span><i data-lucide="link-2"></i>${rqChip(q.req)}</span>` : ''}${q.blocking && q.st === 'open' ? `<span class="badge badge-danger"><i data-lucide="octagon-alert"></i>${t(q.blocks ? 'in.q.blocks.' + q.blocks : 'in.q.blocking')}</span>` : ''}</div></div>
          <div class="q-act"><span class="badge ${stBadge[q.st]}"><i data-lucide="${stIcon[q.st]}"></i>${t('in.q.' + q.st)}</span>
            ${q.st === 'open' ? `<button class="btn btn-soft btn-sm" data-act="q-answer" data-id="${q.id}">${t('in.q.answer')}</button>` : `<button class="btn btn-ghost btn-sm btn-icon" data-act="q-answer" data-id="${q.id}" data-i18n-tip="in.q.edit"><i data-lucide="pencil"></i></button>`}</div>
          ${q.a ? `<div class="q-ans ${q.st === 'assumption' ? 'is-assume' : ''}"><b>${t(q.st === 'assumption' ? 'in.q.assume_lbl' : 'in.q.answer_lbl')}</b>${esc(tx(q.a))}</div>` : ''}
        </div>`).join('') : `<div class="empty"><div class="empty-icon"><i data-lucide="circle-check"></i></div><div>${t('in.q.none')}</div></div>`);
      PC.refresh($('qFilter')); PC.refresh($('qCard'));
    }

    function renderReqs() {
      const n = REQS.length;
      $('gapsBtn').classList.toggle('hidden', !n);
      $('brdLink').classList.toggle('hidden', S.art.brd.st === 'not_started');
      if (!n) {
        $('reqSub').textContent = t('in.s4.sub0');
        $('reqCard').innerHTML = `<div class="empty is-compact"><div class="empty-icon"><i data-lucide="list-checks"></i></div><div><div class="h5">${t('in.r.empty.t')}</div><p class="text-sm text-muted" style="max-width:460px;margin:4px auto 0">${t('in.r.empty.d')}</p></div>
          <div class="row gap-2 wrap" style="justify-content:center"><button class="btn btn-secondary" data-act="draftreq"><i data-lucide="file-text"></i>${t('in.r.draft')}</button></div></div>`;
        PC.refresh($('reqCard')); return;
      }
      $('reqSub').textContent = S.art.brd.st === 'approved' ? t('in.s4.sub', { v: brdV(), n }) : t('in.s4.sub2', { v: brdV(), st: t('in.as.' + S.art.brd.st).toLowerCase(), n });
      $('openBrd').textContent = t('in.open_brd', { v: brdV() });
      const cnt = (key, val) => REQS.filter(r => r[key] === val).length;
      const fr = cnt('ty', 'fr'), nfr = cnt('ty', 'nfr');
      const pr = { must: cnt('p', 'must'), should: cnt('p', 'should'), could: cnt('p', 'could') };
      const scopedIds = new Set([].concat(S.sc.in, S.sc.later).flatMap(i => i.req));
      const frIn = D.cov.scopeFR != null ? D.cov.scopeFR : REQS.filter(r => r.ty === 'fr' && scopedIds.has(r.id)).length;
      const withQ = new Set(S.q.filter(q => q.st === 'open' && q.req).map(q => q.req)).size;
      const cov = (label, a, b, cls) => `<div class="cov"><div class="row"><span>${label}</span><b>${a} / ${b}</b></div><div class="progress ${cls || ''}"><span style="width:${b ? Math.round(a / b * 100) : 0}%"></span></div></div>`;
      $('reqCard').innerHTML = `<div class="rq-grid">
        <div class="rq-col"><h5>${t('in.r.by_type')}</h5>
          <div class="big-nums"><div class="stat"><span class="stat-value">${fr}</span><span class="stat-label">${t('in.r.fr')}</span></div><div class="stat"><span class="stat-value">${nfr}</span><span class="stat-label">${t('in.r.nfr')}</span></div></div>
          <h5>${t('in.r.by_pri')}</h5>
          <div class="pbar"><i style="width:${pr.must / n * 100}%;background:var(--brand)"></i><i style="width:${pr.should / n * 100}%;background:var(--accent-purple)"></i><i style="width:${pr.could / n * 100}%;background:var(--accent-teal)"></i></div>
          <div class="pbar-leg"><span><span class="dot dot-brand"></span>${t('in.p.must')} <b>${pr.must}</b></span><span><span class="dot dot-purple"></span>${t('in.p.should')} <b>${pr.should}</b></span><span><span class="dot dot-teal"></span>${t('in.p.could')} <b>${pr.could}</b></span></div></div>
        <div class="rq-col"><h5>${t('in.r.cov')}</h5>
          ${cov(t('in.r.c.src'), D.cov.src, n, D.cov.src === n ? 'ok' : 'warn')}${cov(t('in.r.c.scope'), frIn, fr, frIn === fr ? 'ok' : 'warn')}${cov(t('in.r.c.est'), D.cov.est, n, D.cov.est >= n - 1 ? 'ok' : 'warn')}
          <div class="row text-xs text-muted" style="justify-content:space-between"><span>${t('in.r.c.q')}</span><b class="${withQ ? 'text-warning' : 'text-success'}">${withQ}</b></div></div>
        <div class="rq-col"><h5>${t('in.r.top')}</h5>
          ${NFRS.map(r => `<div class="nfr">${rqChip(r.id)}<div class="tx">${esc(tx(r.tx))}<small>${esc(tx(r.cat))}</small></div><span class="tgt">${esc(r.tgt)}</span></div>`).join('')}</div>
      </div>`;
      PC.refresh($('reqCard'));
    }

    const SC_META = { und: ['dot-und', 'in.sc.und', 'in.sc.und.d'], in: ['dot-success', 'in.sc.in', 'in.sc.in.d', 'badge-success'], later: ['dot-warning', 'in.sc.later', 'in.sc.later.d'], out: ['dot-danger', 'in.sc.out', 'in.sc.out.d'] };
    function renderScope() {
      const total = ['und', 'in', 'later', 'out'].reduce((n, k) => n + S.sc[k].length, 0);
      const grid = $('scGrid');
      if (!total && !S.finalized) {
        grid.className = 'sc-grid';
        grid.innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty is-compact"><div class="empty-icon"><i data-lucide="target"></i></div><div><div class="h5">${t('in.sc.empty.t')}</div><p class="text-sm text-muted" style="max-width:480px;margin:4px auto 0">${t('in.sc.empty.d')}</p></div>
          <div class="row gap-2 wrap" style="justify-content:center"><span class="badge badge-success"><span class="dot dot-success"></span>${t('in.sc.in')}</span><span class="badge badge-warning"><span class="dot dot-warning"></span>${t('in.sc.later')}</span><span class="badge badge-danger"><span class="dot dot-danger"></span>${t('in.sc.out')}</span></div></div></div>`;
      } else {
        const cols = S.sc.und.length ? ['und', 'in', 'later', 'out'] : ['in', 'later', 'out'];
        grid.className = 'sc-grid' + (cols.length === 4 ? ' has-und' : '');
        grid.innerHTML = cols.map(k => {
          const items = S.sc[k];
          return `<div class="sc-col ${k === 'und' ? 'is-und' : ''}" data-col="${k}"><div class="sc-head"><span class="dot ${SC_META[k][0]}"></span><b>${t(SC_META[k][1])}</b><span class="sc-count">${items.length}</span></div>
          <div class="sc-sub">${t(SC_META[k][2])}</div>
          <div class="sc-body">${items.length ? items.map(i => {
            const wait = i.blockedBy && (S.q.find(q => q.id === i.blockedBy) || {}).st === 'open';
            return `<div class="sc-item" draggable="true" data-id="${i.id}"><i data-lucide="grip-vertical" class="grip"></i>
            <div class="tx">${esc(tx(i.tx))}${wait ? `<div class="wait"><span class="badge badge-danger"><i data-lucide="octagon-alert"></i>${t('in.sc.wait', { q: i.blockedBy })}</span></div>` : ''}${i.req.length ? `<div class="rqs">${i.req.map(rqChip).join('')}</div>` : ''}</div>
            <button class="btn btn-ghost btn-icon btn-sm" style="--_h:24px" data-act="sc-menu" data-id="${i.id}" data-i18n-tip="in.sc.move"><i data-lucide="more-horizontal"></i></button></div>`; }).join('') : `<div class="sc-empty">${t('in.sc.empty')}</div>`}</div>
          <div class="sc-add"><input class="input" data-add="${k}" placeholder="${esc(t('in.sc.add'))}"><button class="btn btn-secondary btn-sm btn-icon" data-act="sc-add" data-k="${k}"><i data-lucide="plus"></i></button></div></div>`;
        }).join('');
      }
      const none = k => `<div class="li li-empty">${t(k)}</div>`;
      $('asmCard').innerHTML = `<div class="card-header"><h5>${t('in.as.title')}</h5><span class="badge">${S.asm.filter(a => a.ok).length}/${S.asm.length}</span></div>
        ${S.asm.length ? S.asm.map(a => `<div class="li"><span class="id">${a.id}</span><div class="tx">${esc(tx(a.tx))}</div><button class="badge ${a.ok ? 'badge-success' : 'badge-warning'}" data-act="asm-toggle" data-id="${a.id}"><i data-lucide="${a.ok ? 'check' : 'help-circle'}"></i>${t(a.ok ? 'in.as.validated' : 'in.as.tovalidate')}</button></div>`).join('') : none('in.as.none')}
        <div class="li-add"><input class="input" data-addlist="asm" placeholder="${esc(t('in.as.add'))}"><button class="btn btn-secondary btn-sm btn-icon" data-act="list-add" data-l="asm"><i data-lucide="plus"></i></button></div>`;
      const sev = { high: 'badge-danger', med: 'badge-warning', low: '' };
      $('riskCard').innerHTML = `<div class="card-header"><h5>${t('in.rk.title')}</h5><span class="badge">${S.risk.length}</span></div>
        ${S.risk.length ? S.risk.map(r => `<div class="li"><span class="id">${r.id}</span><div class="tx">${esc(tx(r.tx))}${r.mit ? `<small><b>${t('in.rk.mit')}:</b> ${esc(tx(r.mit))}</small>` : ''}</div><span class="badge ${sev[r.sev]}">${t('in.rk.' + r.sev)}</span></div>`).join('') : none('in.rk.none')}
        <div class="li-add"><input class="input" data-addlist="risk" placeholder="${esc(t('in.rk.add'))}"><button class="btn btn-secondary btn-sm btn-icon" data-act="list-add" data-l="risk"><i data-lucide="plus"></i></button></div>`;
      PC.refresh($('scGrid')); PC.refresh($('asmCard')); PC.refresh($('riskCard'));
    }

    function renderPipeline() {
      $('plSub').textContent = t('in.s6.sub', { a: approvedCount(), n: ARTS.length, dir: DIR + '\\artifacts' });
      const bd = { not_started: '', draft: '', review: 'badge-warning', approved: 'badge-success' };
      const bi = { not_started: 'circle-dashed', draft: 'pencil', review: 'eye', approved: 'check' };
      const rec = recommended();
      $('plGrid').innerHTML = ARTS.map((a, i) => {
        const s = S.art[a.id], ns = s.st === 'not_started', locked = ns && !unlocked(i), isRec = rec === a.id;
        return `<div class="pl-card ${locked ? 'is-locked' : ''} ${isRec ? 'is-rec' : ''}">
          <div class="pl-head"><span class="file-tile">${`<i data-lucide="${a.icon}"></i>`}</span><div class="grow"><h5>${esc(artName(a))}</h5><div class="sub">${t('in.a.' + a.k + '.d')}</div></div>${ns ? '' : `<a class="btn btn-ghost btn-sm btn-icon" href="artifacts.html#${a.id}" data-i18n-tip="in.a.open"><i data-lucide="arrow-up-right"></i></a>`}</div>
          <div class="pl-meta"><span class="badge ${bd[s.st]}"><i data-lucide="${bi[s.st]}"></i>${t('in.as.' + s.st)}</span>${ns ? '' : `<span class="tag mono">v${s.v}</span>`}${isRec ? `<span class="badge badge-brand"><i data-lucide="sparkles"></i>${t('in.a.rec')}</span>` : ''}${s.stale ? `<span class="badge badge-warning"><i data-lucide="refresh-cw"></i>${t('in.a.outdated')}</span>` : ns ? '' : `<span>${t('in.a.updated', { d: fd(s.date) })}</span>`}</div>
          ${locked ? `<div class="pl-src"><i data-lucide="lock" class="icon-sm" style="vertical-align:-3px"></i> ${t('in.a.locked', { name: artName(ARTS[i - 1]) })}</div>` : `<div class="pl-src"><b>${t('in.a.based')}:</b> ${t('in.a.src.' + a.k)}</div>`}
          <div class="pl-foot">
            <button class="btn ${isRec ? 'btn-primary' : 'btn-ai'} btn-sm" data-act="gen" data-id="${a.id}" ${locked ? 'disabled' : ''}><i data-lucide="sparkles"></i>${t(ns ? 'in.a.gen' : 'in.a.upd')}</button>
            ${ns ? '' : `<button class="btn btn-secondary btn-sm" data-act="export" data-id="${a.id}"><i data-lucide="download"></i>${t('in.a.export')}<i data-lucide="chevron-down" class="icon-sm"></i></button>`}
            ${s.st === 'review' ? `<button class="btn btn-soft btn-sm" data-act="approve" data-id="${a.id}"><i data-lucide="check"></i>${t('in.a.approve')}</button>` : ''}
          </div></div>`;
      }).join('') + `<button class="pl-card pl-add" data-act="add-art"><span class="empty-icon"><i data-lucide="plus"></i></span><b style="color:inherit;font-size:var(--text-sm)">${t('in.a.add')}</b><span class="text-xs">${t('in.a.add.d')}</span></button>`;
      PC.refresh($('plGrid'));
    }

    function renderGate() {
      const ck = gateChecks();
      const reasons = ck.filter(c => c.block);
      const icon = { ok: 'circle-check', warn: 'triangle-alert', fail: 'circle-x', todo: 'circle-dashed' };
      const ready = reasons.length === 0;
      const done = S.finalized;
      $('gateCard').innerHTML = `<div class="gate">
        <div><div class="card-header"><div class="row gap-3"><span class="file-tile" style="background:var(--accent-purple-soft);color:var(--accent-purple)"><i data-lucide="${done ? 'lock' : 'flag'}"></i></span><div><h4>${t('in.gate.title')}</h4><div class="text-xs text-subtle">${done ? t('in.gate.done_sub', { d: fd(S.finalDate) }) : t('in.gate.sub')}</div></div></div></div>
          <div class="gate-list">${ck.map(c => `<div class="gk ${c.k}"><i data-lucide="${icon[c.k]}"></i><div class="tx">${esc(c.label)}${c.detail ? `<small>${esc(c.detail)}</small>` : ''}</div>${c.k !== 'ok' ? (c.link ? `<a class="btn btn-ghost btn-sm" href="${c.link}">${t('in.a.open')}</a>` : `<button class="btn btn-ghost btn-sm" data-go="${c.go}">${t('in.a.open')}</button>`) : ''}</div>`).join('')}</div></div>
        <div class="gate-cta">
          <div class="menu-label" style="padding:0">${t('in.gate.passes')}</div>
          <div class="gate-in"><span><i data-lucide="file-text"></i>${t('in.gate.in1')}</span><span><i data-lucide="shield-alert"></i>${t('in.gate.in2')}</span><span><i data-lucide="file-signature"></i>${t('in.gate.in3')}</span></div>
          <a class="btn btn-primary btn-lg ${ready || done ? '' : 'is-disabled'}" href="scaffolding.html" data-act="gate-go" ${ready || done ? '' : 'aria-disabled="true"'}><i data-lucide="${done ? 'blocks' : 'rocket'}"></i>${t(done ? 'in.gate.cta_done' : 'in.gate.cta')}<i data-lucide="arrow-right"></i></a>
          ${!ready && !done ? `<div class="gate-why"><b>${t('in.gate.blocked', { n: reasons.length })}</b><ul>${reasons.map(r => `<li><i data-lucide="x"></i><span>${esc(r.reason)}</span></li>`).join('')}</ul></div>` : ''}
        </div></div>`;
      PC.refresh($('gateCard'));
    }

    function renderAll() { renderSubtitle(); renderNav(); renderBanner(); renderGuide(); renderStepper(); renderMeetings(); renderQuestions(); renderReqs(); renderScope(); renderPipeline(); renderGate(); setAssistant(); }

    /* ----------------------------------------------------------- progress */
    function runProgress(o) {
      let i = 0, timer, finished = false;
      const body = `<p class="text-sm text-muted">${o.sub}</p>
        <div class="pg-list">${o.steps.map((s, n) => `<div class="pg-step" data-n="${n}"><span class="pg-ic"></span><span>${s}</span></div>`).join('')}</div>

      const m = PC.modal({ title: o.title, width: 540, body, actions: [{ label: t('common.cancel'), kind: 'secondary' }], onClose: () => { if (!finished) clearTimeout(timer); } });
      const paint = () => {
        m.el.querySelectorAll('.pg-step').forEach((el, n) => {
          const st = n < i ? 'done' : n === i ? 'run' : 'pend';
          el.className = 'pg-step ' + (st === 'pend' ? '' : 'is-' + st);
          el.querySelector('.pg-ic').innerHTML = st === 'done' ? '<i data-lucide="check"></i>' : st === 'run' ? '<span class="spinner"></span>' : '';
        });
        const bar = m.el.querySelector('#pgBar'); if (bar) bar.style.width = Math.round(i / o.steps.length * 100) + '%';
        PC.refresh(m.el);
      };
      const tick = () => {
        paint();
        if (i >= o.steps.length) { finished = true; setTimeout(() => { m.close(); o.onDone(); }, 250); return; }

    function setAssistant() {
      PC.assistant.setContext([{ icon: 'compass', label: t('phase.initial') }, { icon: 'file-text', label: brdLabel() }, { icon: 'paperclip', label: t('in.ctx.sources', { n: filesCount() + D.sources.length }) }, { icon: 'mic', label: t('in.ctx.meet', { n: S.meet.length }) }]);
      PC.assistant.setSuggestions([t('in.sg1'), t('in.sg2'), t('in.sg3')]);
    }
    function ask(kind, label) {
      const now = new Date(); const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      PC.assistant.open();
      PC.assistant.push({ role: 'user', time, text: esc(label) });
      const ai = D.ai || {};
      const html = kind === 'gaps' ? (REQS.length ? tx(ai.gaps) : t('in.r.nogaps')) : kind === 'questions' ? tx(ai.questions) : kind === 'needs' ? t('in.r.needs', { v: brdV(), n: nonBlockingOpen() }) : kind === 'summ' ? tx(ai.summ) : kind === 'reqdraft' ? t('in.r.reqdraft', { n: (S.meet.find(m => m.pts) || { pts: [] }).pts.length }) : t('in.r.default', { v: brdV(), n: qCount('open') });
      PC.assistant.reply(html, { time });
    }
    const nextCr = () => 'CR-' + pad2(S.crs + 1);
    function go(id) { const el = $(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

    /* ------------------------------------------------------------- events */
    document.addEventListener('click', e => {
      const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
      const a = e.target.closest('[data-act]'); if (!a) return;
      const id = a.dataset.id;
      switch (a.dataset.act) {
        case 'ask-top': ask('default', t('in.ask')); break;
        case 'g': ask(a.dataset.g, t({ questions: 'in.g.p1', gaps: 'in.g.p2', needs: 'in.g.p3' }[a.dataset.g])); break;
        case 'genq': generateQuestions(); break;
        case 'draftreq': draftRequirements(); break;
        case 'sugg-add': { const n = addSuggested(id, +a.dataset.i); renderAll(); if (n) PC.toast(t('in.q.t.bulk', { n }), { icon: 'message-square-plus' }); break; }
        case 'sugg-all': { const n = addSuggested(id); renderAll(); if (n) { PC.toast(t('in.q.t.bulk', { n }), { icon: 'message-square-plus' }); go('s-q'); } break; }
        case 'gaps': ask('gaps', t('in.g.p2')); break;
        case 'export-all': exportAll(a); break;
        case 'upload': uploadModal(); break;
        case 'notes': notesModal(); break;
        case 'extract': extractInsights(); break;
        case 'pts': S.openPts.has(id) ? S.openPts.delete(id) : S.openPts.add(id); renderMeetings(); break;
        case 'more-meet': S.showAllMeet = !S.showAllMeet; renderMeetings(); break;
        case 'openfile': PC.toast(t('in.m.open', { f: '<b>' + esc(a.dataset.n) + '</b>' }), { icon: 'file-text' }); break;
        case 'qf': S.qFilter = a.dataset.f; renderQuestions(); break;
        case 'q-add': questionModal(); break;
        case 'q-answer': questionModal(id); break;
        case 'sc-menu': { const f = findItem(id); PC.popover(a, `<div class="menu-label">${t('in.sc.move')}</div>` + ['in', 'later', 'out'].filter(k => k !== f.k).map(k => `<button class="menu-item" data-v="${k}"><span class="dot ${SC_META[k][0]}"></span><span>${t(SC_META[k][1])}</span></button>`).join('') + `<div class="menu-sep"></div><button class="menu-item" data-v="__rm"><i data-lucide="trash-2"></i><span>${t('in.sc.remove')}</span></button>`, v => { if (v === '__rm') { S.sc[f.k].splice(f.i, 1); renderScope(); renderReqs(); renderGate(); } else moveItem(id, v); }); break; }
        case 'sc-add': addScope(a.dataset.k, document.querySelector('[data-add="' + a.dataset.k + '"]')); break;
        case 'list-add': addList(a.dataset.l, document.querySelector('[data-addlist="' + a.dataset.l + '"]')); break;
        case 'asm-toggle': { const x = S.asm.find(i => i.id === id); x.ok = !x.ok; renderScope(); break; }
        case 'gen': generate(id); break;
        case 'export': exportMenu(a, ARTS.find(x => x.id === id)); break;
        case 'approve': { const s = S.art[id], ar = ARTS.find(x => x.id === id); s.st = 'approved'; s.date = TODAY; PC.toast(t('in.t.approved', { name: esc(artName(ar)), v: s.v }), { icon: 'badge-check', tone: 'success' }); renderAll(); break; }
        case 'add-art': PC.toast(t('in.a.add') + ' — ' + t('in.a.add.d'), { icon: 'plus' }); break;
        case 'reopen': reopenModal(); break;
        case 'discard': discardCR(); break;
        case 'gate-go': if (a.classList.contains('is-disabled')) { e.preventDefault(); break; } if (!S.finalized) { e.preventDefault(); if (!a.classList.contains('is-disabled')) finalizeModal(); } break;
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const el = e.target; if (!el.matches) return;
      if (el.matches('[data-add]')) { e.preventDefault(); addScope(el.dataset.add, el); }
      else if (el.matches('[data-addlist]')) { e.preventDefault(); addList(el.dataset.addlist, el); }
    });
    /* drag & drop between scope lists */
    let dragId = null;
    document.addEventListener('dragstart', e => { const it = e.target.closest && e.target.closest('.sc-item'); if (!it) return; dragId = it.dataset.id; it.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (err) {} });
    document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.sc-item.dragging').forEach(x => x.classList.remove('dragging')); document.querySelectorAll('.sc-col.is-over').forEach(x => x.classList.remove('is-over')); });
    document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.sc-col'); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll('.sc-col.is-over').forEach(x => { if (x !== c) x.classList.remove('is-over'); }); c.classList.add('is-over'); });
    document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('.sc-col'); if (!c || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; moveItem(id, c.dataset.col); });

    PC.onReady(renderAll);
    document.addEventListener('pc:lang', renderAll);
  </script>
</body>
</html>
