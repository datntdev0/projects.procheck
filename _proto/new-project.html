<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New project · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    .canvas { container-type: inline-size; }
    .wrap-np { max-width: 1120px; margin: 0 auto; }

    /* stepper */
    .stepper-bar { padding: var(--space-4) var(--space-5); margin-bottom: var(--space-6); background: var(--gradient-hero), var(--bg-surface); }
    .stepper .step { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-subtle); }
    .stepper .step.is-current { color: var(--fg-strong); }
    .stepper .step.is-done { color: var(--fg-default); }
    .stepper .step:hover .step-label { color: var(--fg-strong); }

    /* layout */
    .wiz { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-6); align-items: start; }
    .aside { position: sticky; top: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
    .panel-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border-subtle); }
    .panel-head .ph-ico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--brand-soft); color: var(--brand-fg); flex-shrink: 0; }
    .panel-head p { margin: 2px 0 0; font-size: var(--text-sm); color: var(--fg-muted); }
    .panel-body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
    .wiz-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border-subtle); background: var(--bg-surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .fgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--space-4); }
    .s2 { grid-column: span 2; } .s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: 1 / -1; }
    .req { color: var(--danger-fg); margin-left: 2px; }
    .ferr { display: none; font-size: var(--text-xs); color: var(--danger-fg); align-items: center; gap: 4px; }
    .ferr svg { width: 12px; height: 12px; }
    .field.has-error .ferr { display: flex; }
    .field.has-error .input { border-color: var(--danger); }
    .field.has-error .input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }
    .sub-title { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); }
    .sub-title h5 { font-size: var(--text-md); }

    /* project directory + tree */
    .dir-row { display: flex; gap: var(--space-2); }
    .ptree { border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface-2); overflow: hidden; }
    .ptree-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 12px; color: var(--fg-strong); font-weight: var(--weight-medium); background: var(--bg-surface); }
    .ptree-head svg { color: var(--brand-fg); }
    .ptree-head .badge { margin-left: auto; font-family: var(--font-sans); flex-shrink: 0; }
    .tbody { position: relative; margin: 8px 0 8px 22px; border-left: 1px solid var(--border-strong); }
    .tnode { position: relative; display: grid; grid-template-columns: 16px minmax(0, 232px) minmax(0, 1fr); align-items: center; gap: 10px; padding: 6px 14px 6px 20px; font-size: var(--text-xs); }
    .tnode::before { content: ""; position: absolute; left: 0; top: 50%; width: 12px; border-top: 1px solid var(--border-strong); }
    .tnode svg { width: 14px; height: 14px; color: var(--fg-subtle); }
    .tnode .tp { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-default); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tnode.is-hidden .tp { color: var(--fg-muted); }
    .tnode .td { color: var(--fg-subtle); }
    .tnode:hover { background: var(--bg-hover); }
    .repo-quick { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-top: 2px; }
    .repo-quick code { font-size: 11px; }

    /* open existing project */
    .open-wrap { max-width: 860px; margin: 0 auto; }
    .recent-list { display: flex; flex-direction: column; border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-surface); }
    .recent-item { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border: 0; border-bottom: 1px solid var(--border-subtle); background: transparent; text-align: left; cursor: pointer; width: 100%; }
    .recent-item:last-child { border-bottom: 0; }
    .recent-item:hover { background: var(--bg-hover); }
    .recent-item.is-picked { background: var(--brand-soft); }
    .recent-item .project-avatar { width: 30px; height: 30px; border-radius: 8px; font-size: 11px; }
    .recent-item .rp { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-subtle); }
    .detect { border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); overflow: hidden; }
    .detect-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); background: var(--gradient-hero), var(--bg-surface); }
    .detect-head .project-avatar { width: 44px; height: 44px; border-radius: 11px; font-size: 14px; }
    .detect-phases { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); }
    .detect-phases .dp-h { display: flex; justify-content: space-between; font-size: var(--text-xs); margin-bottom: 6px; color: var(--fg-muted); font-weight: var(--weight-medium); }
    .detect-phases .dp-h b { color: var(--fg-default); font-variant-numeric: tabular-nums; }
    .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-6); padding: var(--space-2) var(--space-5); }
    .fact { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 9px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-xs); }
    .fact .k { color: var(--fg-subtle); white-space: nowrap; }
    .fact .v { color: var(--fg-default); font-weight: var(--weight-medium); min-width: 0; text-align: right; }
    .fact .v.mono { font-size: 11px; font-weight: 400; }
    .checks { padding: var(--space-4) var(--space-5); background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 8px; }
    .checks .ck { display: flex; align-items: flex-start; gap: var(--space-2); font-size: var(--text-sm); color: var(--fg-default); }
    .checks .ck svg { margin-top: 2px; }
    .checks .ck.ok svg { color: var(--success-fg); } .checks .ck.info svg { color: var(--brand-fg); }
    .checks .ck code { font-size: 11.5px; background: var(--code-bg); padding: 1px 6px; border-radius: var(--radius-xs); }

    /* selectable cards */
    .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
    .opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .opt { position: relative; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); border: 1.5px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); cursor: pointer; text-align: left; transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast); }
    .opt:hover { border-color: var(--border-strong); }
    .opt:focus-visible { box-shadow: var(--shadow-focus); border-radius: var(--radius-lg); }
    .opt.is-selected { border-color: var(--brand); background: var(--brand-soft); box-shadow: var(--shadow-focus); }
    .opt .tick { position: absolute; top: 14px; right: 14px; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: transparent; background: var(--bg-surface); }
    .opt .tick svg { width: 12px; height: 12px; stroke-width: 3; }
    .opt.is-selected .tick { background: var(--brand); border-color: var(--brand); color: var(--fg-on-brand); }
    .opt-ico { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
    .opt-ico.initial { background: var(--brand-soft); color: var(--phase-initial); }
    .opt-ico.release { background: var(--accent-purple-soft); color: var(--phase-release); }
    .opt-ico.sdlc { background: var(--accent-teal-soft); color: var(--accent-teal-fg); }
    .opt.is-selected .opt-ico { background: var(--bg-surface); }
    .opt h4 { font-size: var(--text-lg); }
    .opt p { margin: 0; font-size: var(--text-sm); color: var(--fg-muted); line-height: 1.55; }
    .opt .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: var(--space-1); }
    .opt-row { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-lg); cursor: pointer; background: var(--bg-surface); }
    .opt-row:hover { border-color: var(--border-strong); }
    .opt-row b { display: block; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .opt-row .hint { display: block; margin-top: 2px; }
    .opt-row.is-disabled { opacity: .55; pointer-events: none; }
    .rows { display: flex; flex-direction: column; gap: var(--space-2); }

    /* phase preview */
    .pv { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
    .pv > div { padding: 10px 12px; border-radius: var(--radius-md); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); }
    .pv .bar { height: 4px; border-radius: 4px; background: var(--border-default); margin-bottom: 8px; position: relative; overflow: hidden; }
    .pv .bar i { position: absolute; inset: 0; border-radius: inherit; }
    .pv b { display: block; font-size: var(--text-xs); color: var(--fg-default); font-weight: var(--weight-semibold); }
    .pv span { font-size: var(--text-2xs); color: var(--fg-subtle); }
    .pv .is-start { border-color: var(--brand); background: var(--brand-soft); }

    /* files */
    .dropzone { padding: var(--space-6); }
    .dz-ico { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--bg-surface); border: 1px solid var(--border-default); color: var(--brand-fg); }
    .dropzone.is-over .dz-ico, .dropzone:hover .dz-ico { border-color: var(--brand); }
    .flist { display: flex; flex-direction: column; border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-surface); }
    .fitem { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .fitem:last-child { border-bottom: 0; }
    .fitem .fname { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-default); }
    .fitem .fmeta { font-size: var(--text-xs); color: var(--fg-subtle); }
    .fitem .progress { width: 120px; height: 4px; }
    .flist-empty { padding: var(--space-5); text-align: center; font-size: var(--text-sm); color: var(--fg-subtle); }

    /* ai */
    .cli-card { gap: var(--space-3); }
    .cli-top { display: flex; align-items: center; gap: var(--space-3); }
    .cli-logo { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--bg-surface-3); color: var(--fg-default); }
    .opt.is-selected .cli-logo { background: var(--bg-surface); color: var(--brand-fg); }
    .cli-meta { display: flex; flex-direction: column; gap: 4px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .cli-meta code { font-size: 11px; color: var(--fg-muted); }
    .rev { display: flex; flex-direction: column; }
    .rev-item { display: flex; align-items: flex-start; gap: var(--space-3); padding: 10px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-sm); }
    .rev-item:last-child { border-bottom: 0; }
    .rev-item > svg { color: var(--success-fg); margin-top: 2px; }
    .rev-item .k { width: 150px; flex-shrink: 0; color: var(--fg-subtle); }
    .rev-item .v { min-width: 0; color: var(--fg-default); word-break: break-word; }
    .rev-item .v code { font-size: 11.5px; background: var(--code-bg); padding: 1px 6px; border-radius: var(--radius-xs); }

    /* summary aside */
    .sum-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); }
    .sum-head .project-avatar { width: 40px; height: 40px; border-radius: 10px; }
    .sum-rows { padding: var(--space-2) var(--space-5) var(--space-4); }
    .sum-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 9px 0; border-bottom: 1px solid var(--border-subtle); font-size: var(--text-xs); }
    .sum-row:last-child { border-bottom: 0; }
    .sum-row .k { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-subtle); white-space: nowrap; }
    .sum-row .k svg { width: 13px; height: 13px; }
    .sum-row .v { color: var(--fg-default); font-weight: var(--weight-medium); text-align: right; min-width: 0; }
    .sum-row .avatar { width: 22px; height: 22px; font-size: 8.5px; }
    .tip-card { padding: var(--space-4); display: flex; gap: var(--space-3); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.55; }
    .tip-card svg { color: var(--accent-purple); margin-top: 1px; }

    /* creating modal */
    .cstep { display: flex; align-items: flex-start; gap: var(--space-3); padding: 8px 0; font-size: var(--text-sm); color: var(--fg-faint); transition: color var(--dur-base); }
    .cstep .ci { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .cstep .ci i.pend { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
    .cstep.is-run { color: var(--fg-strong); font-weight: var(--weight-medium); }
    .cstep.is-done { color: var(--fg-default); }
    .cstep.is-done .ci { color: var(--success); }
    .cstep small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); font-weight: 400; margin-top: 1px; }

    @container (max-width: 980px) {
      .wiz { grid-template-columns: minmax(0, 1fr); }
      .aside { position: static; }
    }
    @container (max-width: 760px) {
      .opts, .opts.two { grid-template-columns: minmax(0, 1fr); }
      .s2, .s3, .s4 { grid-column: 1 / -1; }
      .stepper .step-label { display: none; }
      .stepper .step.is-current .step-label { display: inline; }
      .panel-body, .panel-head, .wiz-foot { padding-left: var(--space-4); padding-right: var(--space-4); }
      .rev-item .k { width: 100px; }
      .tnode { grid-template-columns: 16px minmax(0, 1fr); } .tnode .td { display: none; }
      .facts { grid-template-columns: minmax(0, 1fr); } .detect-phases { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body data-page="new-project" data-shell="home" data-crumb="np.title" data-assistant="closed">
  <main class="canvas"><div class="canvas-inner"><div class="wrap-np">

    <div class="page-header">
      <div>
        <div class="crumbs"><a href="index.html" data-i18n="shell.home"></a><i data-lucide="chevron-right" class="icon-sm"></i><span id="h-crumb" data-i18n="np.title"></span></div>
        <h1 id="h-h1" data-i18n="np.h1"></h1>
        <div class="subtitle" id="h-sub" data-i18n="np.sub"></div>
      </div>
      <a class="btn btn-ghost" href="index.html"><i data-lucide="x"></i><span data-i18n="common.cancel"></span></a>
    </div>

    <div id="new-flow">
    <div class="card stepper-bar"><div class="stepper" id="stepper"></div></div>

    <div class="wiz">
      <div class="card" id="wizard">

        <!-- STEP 1 · Basics -->
        <section data-panel="1">
          <div class="panel-head"><span class="ph-ico"><i data-lucide="file-pen-line" class="icon-lg"></i></span><div><h4 data-i18n="np.s1.t"></h4><p data-i18n="np.s1.d"></p></div></div>
          <div class="panel-body">
            <div class="fgrid">
              <div class="field s4" id="f-name">
                <label class="label" for="name"><span data-i18n="np.name"></span><span class="req">*</span></label>
                <input class="input" id="name" autocomplete="off" data-i18n-placeholder="np.name.ph">
                <div class="ferr"><i data-lucide="alert-circle"></i><span data-i18n="np.err.name"></span></div>
              </div>
              <div class="field s2">
                <label class="label" for="code" data-i18n="np.code"></label>
                <input class="input mono" id="code" maxlength="6" autocomplete="off" placeholder="LP" style="text-transform:uppercase">
                <div class="hint" data-i18n="np.code.h"></div>
              </div>
              <div class="field s3">
                <label class="label" for="client" data-i18n="np.client"></label>
                <input class="input" id="client" autocomplete="off" data-i18n-placeholder="np.client.ph">
              </div>
              <div class="field s3">
                <label class="label" for="industry" data-i18n="np.industry"></label>
                <select class="select" id="industry">
                  <option value="fintech" data-i18n="np.ind.fintech"></option>
                  <option value="retail" data-i18n="np.ind.retail"></option>
                  <option value="health" data-i18n="np.ind.health"></option>
                  <option value="logistics" data-i18n="np.ind.logistics"></option>
                  <option value="mfg" data-i18n="np.ind.mfg"></option>
                  <option value="edu" data-i18n="np.ind.edu"></option>
                  <option value="other" data-i18n="np.ind.other"></option>
                </select>
              </div>
              <div class="field s6">
                <label class="label" for="desc" data-i18n="np.desc"></label>
                <textarea class="textarea" id="desc" data-i18n-placeholder="np.desc.ph"></textarea>
                <div class="hint" data-i18n="np.desc.h"></div>
              </div>
            </div>
            <div class="field" id="f-dir">
              <label class="label" for="dir"><span data-i18n="np.dir"></span><span class="req">*</span></label>
              <div class="dir-row">
                <div class="input-group grow"><i data-lucide="folder"></i><input class="input mono" id="dir" autocomplete="off" spellcheck="false" data-i18n-placeholder="np.dir.ph"></div>
                <button class="btn btn-secondary" id="dir-browse" type="button"><i data-lucide="folder-open"></i><span data-i18n="np.browse"></span></button>
              </div>
              <div class="ferr"><i data-lucide="alert-circle"></i><span id="dir-err"></span></div>
              <div class="hint" data-i18n="np.dir.h"></div>
            </div>
            <div>
              <div class="sub-title"><h5 data-i18n="np.tree.title"></h5><span class="text-xs text-subtle" data-i18n="np.tree.sub"></span></div>
              <div class="ptree" id="ptree"></div>
              <div class="alert alert-info" style="margin-top:12px"><i data-lucide="hard-drive"></i><div class="grow text-sm" data-i18n-html="np.tree.note"></div></div>
            </div>
          </div>
        </section>

        <!-- STEP 2 · Starting phase -->
        <section data-panel="2" class="hidden">
          <div class="panel-head"><span class="ph-ico"><i data-lucide="route" class="icon-lg"></i></span><div><h4 data-i18n="np.s2.t"></h4><p data-i18n="np.s2.d"></p></div></div>
          <div class="panel-body">
            <div class="opts" id="phases" role="radiogroup">
              <div class="opt is-selected" role="radio" tabindex="0" aria-checked="true" data-phase="initial">
                <span class="tick"><i data-lucide="check"></i></span>
                <span class="opt-ico initial"><i data-lucide="compass" class="icon-lg"></i></span>
                <h4 data-i18n="np.phase.initial.t"></h4>
                <p data-i18n="np.phase.initial.d"></p>
                <div class="tags"><span class="tag" data-i18n="np.tag.notes"></span><span class="tag">BRD</span><span class="tag" data-i18n="np.tag.scope"></span><span class="tag" data-i18n="np.tag.estimate"></span><span class="tag">SOW</span></div>
              </div>
              <div class="opt" role="radio" tabindex="0" aria-checked="false" data-phase="release">
                <span class="tick"><i data-lucide="check"></i></span>
                <span class="opt-ico release"><i data-lucide="rocket" class="icon-lg"></i></span>
                <h4 data-i18n="np.phase.release.t"></h4>
                <p data-i18n="np.phase.release.d"></p>
                <div class="tags"><span class="tag" data-i18n="np.tag.arch"></span><span class="tag" data-i18n="np.tag.scaffold"></span><span class="tag">Infra</span><span class="tag">CI/CD</span></div>
              </div>
              <div class="opt" role="radio" tabindex="0" aria-checked="false" data-phase="sdlc">
                <span class="tick"><i data-lucide="check"></i></span>
                <span class="opt-ico sdlc"><i data-lucide="infinity" class="icon-lg"></i></span>
                <h4 data-i18n="np.phase.sdlc.t"></h4>
                <p data-i18n="np.phase.sdlc.d"></p>
                <div class="tags"><span class="tag">Kanban</span><span class="tag">Worktree</span><span class="tag" data-i18n="np.tag.evidence"></span><span class="tag">Pull request</span></div>
              </div>
            </div>

            <label class="opt-row" id="existing-row">
              <span class="grow"><b data-i18n="np.existing.t"></b><span class="hint" id="existing-hint"></span></span>
              <span class="switch"><input type="checkbox" id="existing"></span>
            </label>

            <div>

      let fid = 0;
      const mkFile = (name, size, p) => ({ id: ++fid, name, size, p: p == null ? 0 : p });
      const S = {
        step: 1, name: '', code: '', codeTouched: false, client: '', industry: 'fintech', desc: '',
        dir: 'D:\\Projects\\my-project', dirTouched: false, phase: 'initial', existing: false, method: 'scrum',
        files: [mkFile(SAMPLES[0].name, SAMPLES[0].size, 100), mkFile(SAMPLES[1].name, SAMPLES[1].size, 100), mkFile(SAMPLES[2].name, SAMPLES[2].size, 38)],

      };

      /* ---------------- helpers ---------------- */
      const deburr = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');

      const codeFrom = n => { const w = deburr(head(n)).split(/[^A-Za-z0-9]+/).filter(Boolean); return w.slice(0, 4).map(x => x[0]).join('').toUpperCase().slice(0, 6); };
      const code = () => S.code || codeFrom(S.name) || 'PRJ';
      const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
      const extOf = n => (n.split('.').pop() || '').toLowerCase();

        if (e === 'xls' || e === 'xlsx') return { c: 'sheet', i: 'file-spreadsheet' };
        if (e === 'md') return { c: 'md', i: 'file-code' };

        return { c: '', i: 'file' };

          <div class="cli-meta"><span>${PC.t('np.ai.model')}: <code>${PC.esc(c.model)}</code></span><span>${PC.t('np.ai.signed')}</span></div>
        </div>`).join('');
        PC.refresh($('clis'));
      }
      function renderModels() {
        const list = MODELS[S.cli] || [cliObj().model];
        if (!list.includes(S.model)) S.model = cliObj().model;
        $('model').innerHTML = list.map((m, i) => `<option value="${m}" ${m === S.model ? 'selected' : ''}>${m}${m === cliObj().model ? ' · ' + PC.t('np.ai.default') : ''}</option>`).join('');
      }
      function renderHome() { $('home-code').textContent = `cd ${dirPath()}\n${S.cli === 'codex' ? 'codex' : 'claude'} ${PC.cliFlags(S.cli, { dir: dirPath() }).split(' --').join(' \\\n    --')}`; }

      function renderReview() {
        const c = cliObj(), ready = S.files.length;
        const safety = [S.history ? 'np.rev.hist' : 'np.rev.nohist', S.worktree ? 'np.rev.wt' : 'np.rev.nowt', S.approval ? 'np.rev.appr' : 'np.rev.noappr'].map(k => PC.t(k)).join(' · ');
        const rows = [
          ['np.rev.folder', `<code>${PC.esc(dirPath())}</code>`],
          ['np.rev.registry', `<code>${REGISTRY}</code>`],
          ['np.rev.home', `<code>${PC.esc(homeRoot() + '\\' + S.cli)}</code>`],
          ['np.rev.docs', PC.t('np.rev.docs.v', { n: ready })],
          ['np.rev.repo', S.repo.trim() ? `<code>${PC.esc(S.repo.trim())}</code>` : PC.t('np.sum.none')],
          ['np.rev.assistant', PC.esc(PC.t('np.rev.assistant.v', { cli: c.name, model: S.model, phase: PC.t('phase.' + S.phase) }))],
          ['np.rev.safety', PC.esc(safety)],
        ];
        $('review').innerHTML = rows.map(r => `<div class="rev-item"><i data-lucide="check-circle-2" class="icon-sm"></i><span class="k">${PC.t(r[0])}</span><span class="v">${r[1]}</span></div>`).join('');
        PC.refresh($('review'));
      }

      function renderSummary() {
        const c = cliObj();
        $('sum-head').innerHTML = `<div class="project-avatar" style="background:var(--gradient-brand)">${PC.esc(code().slice(0, 3))}</div>
          <div class="grow"><div class="${S.name.trim() ? '' : 'text-faint'}" style="font-size:var(--text-sm);font-weight:600;color:${S.name.trim() ? 'var(--fg-strong)' : ''}">${PC.esc(S.name.trim() || PC.t('np.sum.untitled'))}</div><div class="text-xs text-subtle truncate">${PC.esc(S.client.trim() || PC.t('np.sum.client'))}</div></div>`;
        const row = (icon, k, v) => `<div class="sum-row"><span class="k"><i data-lucide="${icon}"></i>${PC.t(k)}</span><span class="v">${v}</span></div>`;
        $('sum-rows').innerHTML =
          row('folder', 'np.sum.dir', `<span class="mono truncate" style="display:inline-block;max-width:160px;font-size:11px;vertical-align:bottom" title="${PC.esc(dirPath())}">${PC.esc(dirPath())}</span>`) +
          row('route', 'np.sum.phase', `<span class="phase-chip phase-${S.phase === 'release' ? 'release' : S.phase}">${PC.t('phase.' + S.phase)}</span>`) +
          row('workflow', 'np.sum.method', PC.t('np.method.' + S.method)) +
          row('files', 'np.sum.docs', PC.t('np.sum.docs.v', { n: S.files.length })) +
          row('folder-git-2', 'np.sum.repo', S.repo.trim() ? `<span class="mono truncate" style="display:inline-block;max-width:150px;font-size:11px;vertical-align:bottom" title="${PC.esc(S.repo.trim())}">${PC.esc(S.repo.trim())}</span>` : `<span class="text-faint">${PC.t('np.sum.none')}</span>`) +
          row('cpu', 'np.sum.ai', `${PC.esc(c.name)}<div class="mono text-subtle" style="font-size:10.5px;font-weight:400">${PC.esc(S.model)}</div>`);
        $('tip').textContent = PC.t('np.tip.' + S.step);
        PC.refresh($('sum-head').parentElement);
      }

      function renderStatic() {
        renderStepper(); renderTree(); renderPhases(); renderMethodHint(); renderFiles(); renderRepo(); renderClis(); renderModels(); renderHome(); renderReview(); renderSummary();
        PC.refresh(document.querySelector('.canvas'));
      }

      /* ---------------- navigation ---------------- */
      function validate(n) {
        if (n === 1) {
          let ok = true;
          if (!S.name.trim()) { $('f-name').classList.add('has-error'); ok = false; }
          const d = S.dir.trim();
          if (!(/^[A-Za-z]:[\\/]/.test(d) || /^\\\\/.test(d))) { $('dir-err').textContent = PC.t(d ? 'np.dir.err.bad' : 'np.dir.err.empty'); $('f-dir').classList.add('has-error'); ok = false; }
          if (!ok) { ($('f-name').classList.contains('has-error') ? $('name') : $('dir')).focus(); return false; }
        }
        if (n === 3 && needRepo() && !S.repo.trim()) {
          $('f-repo').classList.add('has-error'); $('repo').focus(); return false;
        }
        return true;
      }
      function showStep(n) {
        S.step = n;
        document.querySelectorAll('[data-panel]').forEach(p => p.classList.toggle('hidden', +p.dataset.panel !== n));
        $('back').style.visibility = n === 1 ? 'hidden' : 'visible';
        $('next').classList.toggle('hidden', n === 4);
        $('create').classList.toggle('hidden', n !== 4);
        if (n === 4) { renderReview(); }
        renderStepper(); renderSummary();
        PC.refresh($('stepper'));
        const cv = document.querySelector('.canvas'); if (cv) cv.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function go(n) {
        if (n < S.step) return showStep(n);
        for (let s = S.step; s < n; s++) { if (!validate(s)) { showStep(s); validate(s); return; } }
        showStep(n);
      }

      /* ---------------- uploads ---------------- */
      let ticker = null;
      function startTicker() {
        if (ticker) return;
        ticker = setInterval(() => {
          let active = false;
          S.files.forEach(f => { if (f.p < 100) { f.p = Math.min(100, f.p + 5 + Math.random() * 11); active = true; } });
          renderFiles(); renderSummary();
          if (!active) { clearInterval(ticker); ticker = null; }
        }, 260);
      }
      function addFiles(list) { list.forEach(f => S.files.push(mkFile(f.name, f.size || 50 * 1024, 0))); renderFiles(); renderSummary(); renderReview(); startTicker(); }

      /* ---------------- create ---------------- */
      function create() {
        const keys = ['np.create.s1', 'np.create.s2', 'np.create.s3', 'np.create.s4', 'np.create.s5'];
        const subs = [dirPath() + '\\', dirPath() + '\\procheck.json', REGISTRY, homeRoot() + '\\' + S.cli, PC.t('np.rev.docs.v', { n: S.files.length }) + ' → ' + dirPath() + '\\sources\\'];
        let cancelled = false; const timers = [];
        const m = PC.modal({
          title: PC.t('np.create.title'), width: 520,
          body: `<div class="progress progress-ai" style="margin:4px 0 12px"><span id="cprog" style="width:4%"></span></div>
            <div id="csteps">${keys.map((k, i) => `<div class="cstep" data-i="${i}"><span class="ci"><i class="pend"></i></span><span style="min-width:0"><span>${PC.t(k)}</span><small style="overflow-wrap:anywhere">${PC.esc(subs[i])}</small></span></div>`).join('')}</div>
            <div class="text-sm text-muted" id="cdone" style="margin-top:8px;min-height:20px"></div>`,
          onClose: () => { cancelled = true; timers.forEach(clearTimeout); }
        });
        const el = i => m.el.querySelector(`.cstep[data-i="${i}"]`);
        const run = i => {
          if (cancelled) return;
          if (i >= keys.length) {
            m.el.querySelector('#cprog').style.width = '100%';
            m.el.querySelector('#cdone').textContent = PC.t('np.create.done');
            timers.push(setTimeout(() => { if (!cancelled) { PC.setProject('lotus-pay'); location.href = 'overview.html?p=lotus-pay'; } }, 700));
            return;
          }
          const s = el(i); s.classList.add('is-run'); s.querySelector('.ci').innerHTML = '<span class="spinner"></span>';
          m.el.querySelector('#cprog').style.width = (8 + i * 18) + '%';
          timers.push(setTimeout(() => {
            if (cancelled) return;
            s.classList.remove('is-run'); s.classList.add('is-done'); s.querySelector('.ci').innerHTML = '<i data-lucide="check-circle-2"></i>';
            PC.refresh(s); run(i + 1);
          }, 650));
        };
        run(0);
      }

      /* ---------------- assistant ---------------- */
      function setAssistant() {
        PC.assistant.setContext([{ icon: 'plus', label: PC.t('np.as.ctx') }, { icon: 'cpu', label: S.model }]);
        PC.assistant.setSuggestions([PC.t('np.as.s1'), PC.t('np.as.s2'), PC.t('np.as.s3')]);
      }

      /* ---------------- wiring ---------------- */
      function wire() {
        $('name').addEventListener('input', e => {
          S.name = e.target.value; $('f-name').classList.toggle('has-error', false);
          if (!S.codeTouched) { S.code = codeFrom(S.name); $('code').value = S.code; }
          if (!S.dirTouched) { S.dir = defaultDir(); $('dir').value = S.dir; $('f-dir').classList.remove('has-error'); }
          renderTree(); renderRepo(); renderHome(); renderReview(); renderSummary();
        });
        $('dir').addEventListener('input', e => { S.dir = e.target.value; S.dirTouched = true; $('f-dir').classList.remove('has-error'); renderTree(); renderRepo(); renderHome(); renderReview(); renderSummary(); });
        $('dir-browse').addEventListener('click', () => { S.dir = 'D:\\Clients\\' + slug(); S.dirTouched = true; $('dir').value = S.dir; $('f-dir').classList.remove('has-error'); renderTree(); renderRepo(); renderHome(); renderReview(); renderSummary(); PC.toast(PC.t('np.dir.picked')); });
        $('repo-inside').addEventListener('click', () => { S.repo = repoInside(); $('repo').value = S.repo; renderRepo(); renderSummary(); renderReview(); });
        $('code').addEventListener('input', e => { S.codeTouched = true; S.code = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); e.target.value = S.code; renderSummary(); });
        $('client').addEventListener('input', e => { S.client = e.target.value; renderSummary(); });
        $('industry').addEventListener('change', e => { S.industry = e.target.value; });
        $('desc').addEventListener('input', e => { S.desc = e.target.value; });

        const pick = (el, fn) => {
          el.addEventListener('click', e => { const o = e.target.closest('.opt'); if (o && el.contains(o)) fn(o); });
          el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('opt')) { e.preventDefault(); fn(e.target); } });
        };
        pick($('phases'), o => { S.phase = o.dataset.phase; if (S.phase === 'initial') S.existing = false; renderPhases(); renderRepo(); renderReview(); renderSummary(); });
        $('existing').addEventListener('change', e => { S.existing = e.target.checked; renderPhases(); });
        $('method').addEventListener('change', e => { S.method = e.target.value; renderMethodHint(); renderSummary(); });

        const dz = $('dz');
        dz.addEventListener('click', () => $('file-input').click());
        dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file-input').click(); } });
        ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('is-over'); }));
        ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('is-over'); }));
        dz.addEventListener('drop', e => { const fl = Array.from(e.dataTransfer && e.dataTransfer.files || []); if (fl.length) addFiles(fl); });
        $('file-input').addEventListener('change', e => { addFiles(Array.from(e.target.files)); e.target.value = ''; });
        $('sample').addEventListener('click', () => {
          const have = S.files.map(f => f.name); const next = SAMPLES.filter(s => !have.includes(s.name)).slice(0, 2);
          if (next.length) addFiles(next);
        });
        $('flist').addEventListener('click', e => { const b = e.target.closest('[data-rmf]'); if (!b) return; S.files = S.files.filter(f => f.id !== +b.dataset.rmf); renderFiles(); renderSummary(); renderReview(); });

        $('repo').addEventListener('input', e => { S.repo = e.target.value; renderRepo(); renderSummary(); });
        $('browse').addEventListener('click', () => { S.repo = 'D:\\src\\' + slug(); $('repo').value = S.repo; renderRepo(); renderSummary(); PC.toast(PC.t('np.repo.picked')); });

        pick($('clis'), o => { S.cli = o.dataset.cli; S.model = cliObj().model; renderClis(); renderModels(); renderHome(); renderReview(); renderSummary(); setAssistant(); });
        $('model').addEventListener('change', e => { S.model = e.target.value; renderReview(); renderSummary(); setAssistant(); });
        $('tg-history').addEventListener('change', e => { S.history = e.target.checked; renderReview(); });
        $('tg-worktree').addEventListener('change', e => { S.worktree = e.target.checked; renderReview(); });
        $('tg-approval').addEventListener('change', e => { S.approval = e.target.checked; renderReview(); });

        $('stepper').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
        $('back').addEventListener('click', () => go(S.step - 1));
        $('next').addEventListener('click', () => go(S.step + 1));
        $('create').addEventListener('click', () => { for (let s = 1; s <= 3; s++) { if (!validate(s)) { showStep(s); validate(s); return; } } create(); });
      }

      /* ---------------- open existing project (?mode=open) ---------------- */
      const UPD_VI = { '12 min ago': '12 phút trước', '2 h ago': '2 giờ trước', 'Yesterday': 'Hôm qua', '3 days ago': '3 ngày trước', 'Last week': 'Tuần trước' };
      const O = { path: '' };
      const norm = v => v.trim().replace(/\//g, '\\').replace(/\\+$/, '').toLowerCase();
      const findProject = v => { const n = norm(v); return n ? D.projects.find(p => p.dir.toLowerCase() === n) : null; };
      function renderOpenRecent() {
        const cur = findProject(O.path);
        $('o-recent').innerHTML = D.projects.map(p => `<button type="button" class="recent-item ${cur && cur.id === p.id ? 'is-picked' : ''}" data-dir="${PC.esc(p.dir)}"><span class="project-avatar" style="background:${p.color}">${PC.esc(p.short)}</span><span class="grow"><span style="display:block;font-size:var(--text-sm);font-weight:600;color:var(--fg-strong)" class="truncate">${PC.esc(p.name)}</span><span class="rp truncate" style="display:block">${PC.esc(p.dir)}</span></span><span class="phase-chip phase-${p.phase}">${PC.t('phase.' + p.phase)}</span></button>`).join('');
      }
      function renderOpenResult() {
        const raw = O.path.trim(), p = findProject(raw), box = $('o-result');
        $('o-open').disabled = !p;
        if (!raw) { box.innerHTML = `<div class="empty" style="padding:var(--space-8) var(--space-6)"><div class="empty-icon"><i data-lucide="folder-search"></i></div><h4>${PC.t('np.open.empty.t')}</h4><div class="text-sm">${PC.t('np.open.empty.d')}</div></div>`; return; }
        if (!p) { box.innerHTML = `<div class="alert alert-warning"><i data-lucide="alert-triangle"></i><div><b style="color:var(--fg-strong)">${PC.t('np.open.nf.t')}</b><div class="text-sm text-muted" style="margin-top:2px">${PC.t('np.open.nf.d')}</div></div></div>`; return; }
        const bars = D.phases.map(ph => `<div><div class="dp-h"><span style="color:${ph.color}">${PC.t('phase.' + ph.id)}</span><b>${p.progress[ph.id]}%</b></div><div class="progress"><span style="width:${p.progress[ph.id]}%;background:${ph.color}"></span></div></div>`).join('');
        const upd = PC.lang === 'vi' ? (UPD_VI[p.updated] || p.updated) : p.updated;
        const hasHome = p.tasks > 0;
        const fact = (k, v, mono) => `<div class="fact"><span class="k">${PC.t(k)}</span><span class="v ${mono ? 'mono truncate' : ''}">${v}</span></div>`;
        const ck = (cls, ico, t) => `<div class="ck ${cls}"><i data-lucide="${ico}"></i><span>${t}</span></div>`;
        box.innerHTML = `<div class="detect">
          <div class="detect-head"><div class="project-avatar" style="background:${p.color}">${PC.esc(p.short)}</div>
            <div class="grow"><div style="font-size:var(--text-lg);font-weight:600;color:var(--fg-strong)">${PC.esc(p.name)}</div><div class="text-xs text-subtle">${PC.esc(p.client)}</div></div>
            <span class="phase-chip phase-${p.phase}">${PC.t('phase.' + p.phase)}</span>
            <span class="badge badge-success"><i data-lucide="check"></i>${PC.t('np.open.found')}</span></div>
          <div class="detect-phases">${bars}</div>
          <div class="facts">${fact('np.open.f.dir', PC.esc(p.dir), 1)}${fact('np.open.f.repo', p.repo ? PC.esc(p.repo) : `<span class="text-faint">${PC.t('np.open.norepo')}</span>`, !!p.repo)}${fact('np.open.f.art', p.artifacts)}${fact('np.open.f.tasks', p.tasks)}${fact('np.open.f.upd', PC.esc(upd))}${fact('np.open.f.ai', 'Claude Code · claude-opus-5-5')}</div>
          <div class="checks"><div class="text-xs text-subtle" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">${PC.t('np.open.c.title')}</div>
            ${ck('ok', 'check-circle-2', PC.t('np.open.c.manifest'))}${ck('ok', 'check-circle-2', PC.t('np.open.c.dirs'))}${hasHome ? ck('ok', 'check-circle-2', PC.t('np.open.c.settings')) : ''}
            ${ck('info', 'list-plus', PC.t('np.open.c.reg'))}${ck(hasHome ? 'ok' : 'info', hasHome ? 'check-circle-2' : 'wand-sparkles', PC.t(hasHome ? 'np.open.c.home.ok' : 'np.open.c.home.new'))}</div>
        </div>`;
      }
      function renderOpen() { renderOpenRecent(); renderOpenResult(); PC.refresh(document.querySelector('.canvas')); }
      function wireOpen() {
        $('o-path').addEventListener('input', e => { O.path = e.target.value; renderOpen(); });
        $('o-recent').addEventListener('click', e => { const b = e.target.closest('[data-dir]'); if (!b) return; O.path = b.dataset.dir; $('o-path').value = O.path; renderOpen(); });
        let bi = 0;
        $('o-browse').addEventListener('click', () => { const d = D.projects[(bi++ % (D.projects.length - 1)) + 1].dir; O.path = d; $('o-path').value = d; renderOpen(); PC.toast(PC.t('np.open.picked')); });
        $('o-open').addEventListener('click', () => { const p = findProject(O.path); if (!p) return; PC.setProject(p.id); location.href = 'overview.html?p=' + p.id; });
      }

      PC.onReady(() => {
        if (OPEN) {
          let pre = ''; try { pre = new URLSearchParams(location.search).get('dir') || ''; } catch (e) {}
          O.path = pre; $('o-path').value = pre;
          wireOpen(); renderOpen();
          PC.assistant.setContext([{ icon: 'folder-open', label: PC.t('np.open.title') }]);
          return;
        }
        $('dir').value = S.dir;
        wire(); renderStatic(); showStep(1); setAssistant(); startTicker();
      });
      document.addEventListener('pc:lang', () => { if (OPEN) renderOpen(); else { renderStatic(); renderStepper(); setAssistant(); } });
    })();
  </script>
</body>
</html>
