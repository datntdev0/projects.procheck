<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== Project overview — page-only styles, tokens only ===== */
    .ph-c-initial { --ph: var(--phase-initial); --ph-fg: var(--brand-fg); --ph-soft: var(--brand-soft); --ph-on: var(--fg-on-brand); }
    .ph-c-release { --ph: var(--phase-release); --ph-fg: var(--accent-purple); --ph-soft: var(--accent-purple-soft); --ph-on: var(--fg-on-brand); }
    .ph-c-sdlc { --ph: var(--phase-sdlc); --ph-fg: var(--accent-teal-fg); --ph-soft: var(--accent-teal-soft); --ph-on: var(--gray-950); }

    /* Hero */
    .ws-hero { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-6); flex-wrap: wrap;
      padding: var(--space-6); margin-bottom: var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-xl);
      background: var(--gradient-hero), var(--bg-surface); overflow: hidden; }
    .ws-hero-main { display: flex; gap: var(--space-4); min-width: 0; flex: 1 1 520px; }
    .ws-av { width: 56px; height: 56px; border-radius: 14px; font-size: 18px; box-shadow: var(--shadow-md); }
    .ws-hero h1 { margin: 2px 0 8px; }
    .ws-meta { display: flex; align-items: center; gap: var(--space-2) var(--space-4); flex-wrap: wrap; font-size: var(--text-sm); color: var(--fg-muted); }
    .ws-meta > span { display: inline-flex; align-items: center; gap: 6px; }
    .ws-meta svg { color: var(--fg-subtle); width: 14px; height: 14px; }
    .ws-meta .state-l { font-weight: var(--weight-medium); color: var(--fg-default); }
    .ws-paths { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .ws-path { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; padding: 3px 4px 3px 10px; border-radius: var(--radius-md); background: var(--bg-surface-3); border: 1px solid var(--border-subtle); }
    .ws-path > svg { color: var(--fg-subtle); width: 14px; height: 14px; }
    .ws-path .k { font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); white-space: nowrap; }
    .ws-path code { font-size: 11.5px; color: var(--fg-default); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .ws-path .btn { --_h: 24px; padding: 0 8px; font-size: var(--text-xs); }
    .ws-path .btn.btn-icon { width: 24px; padding: 0; }
    .ws-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }

    /* Current focus callout */
    .focus { --ft: var(--info); --ft-soft: var(--info-soft); --ft-fg: var(--info-fg);
      display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; padding: var(--space-4) var(--space-5); margin-bottom: var(--space-5);
      border: 1px solid color-mix(in srgb, var(--ft) 30%, var(--border-default)); border-left: 4px solid var(--ft); border-radius: var(--radius-lg);
      background: linear-gradient(90deg, var(--ft-soft), var(--bg-surface) 65%); }
    .focus.tone-warning { --ft: var(--warning); --ft-soft: var(--warning-soft); --ft-fg: var(--warning-fg); }
    .focus.tone-danger { --ft: var(--danger); --ft-soft: var(--danger-soft); --ft-fg: var(--danger-fg); }
    .focus.tone-success { --ft: var(--success); --ft-soft: var(--success-soft); --ft-fg: var(--success-fg); }
    .focus-ic { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--ft-soft); color: var(--ft-fg); flex-shrink: 0; border: 1px solid color-mix(in srgb, var(--ft) 25%, transparent); }
    .focus-main { flex: 1 1 360px; min-width: 0; }
    .focus-k { font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: var(--tracking-kicker); color: var(--ft-fg); }
    .focus h3 { margin: 2px 0 2px; font-size: var(--text-lg); }
    .focus p { margin: 0; font-size: var(--text-sm); color: var(--fg-muted); max-width: 760px; }
    .focus-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); }
    .focus-act { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .focus-act .btn { text-decoration: none !important; }

    /* KPI */
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6); }
    .kpi { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); color: inherit; text-decoration: none !important; }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; min-height: 30px; }
    .kpi-ic { width: 30px; height: 30px; border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; background: var(--brand-soft); color: var(--brand-fg); flex-shrink: 0; }
    .kpi-ic.teal { background: var(--accent-teal-soft); color: var(--accent-teal-fg); }
    .kpi-ic.success { background: var(--success-soft); color: var(--success-fg); }
    .kpi-ic.purple { background: var(--accent-purple-soft); color: var(--accent-purple); }
    .kpi-ic.warning { background: var(--warning-soft); color: var(--warning-fg); }
    .kpi-ic.danger { background: var(--danger-soft); color: var(--danger-fg); }
    .kpi-ic.muted { background: var(--bg-surface-3); color: var(--fg-subtle); }
    .kpi-spark { width: 64px; height: 24px; color: var(--brand); }
    .kpi-spark polyline { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .kpi .stat-value { font-size: 26px; }
    .kpi .stat-value small { font-size: var(--text-sm); font-weight: var(--weight-regular); color: var(--fg-subtle); letter-spacing: 0; }
    .kpi .sub { font-size: var(--text-xs); color: var(--fg-subtle); }
    .kpi .sub b { color: var(--fg-default); font-weight: var(--weight-semibold); }
    .kpi.is-warn .sub b { color: var(--warning-fg); } .kpi.is-bad .sub b { color: var(--danger-fg); } .kpi.is-ok .sub b { color: var(--success-fg); }

    /* Phase cards */
    .flow { display: grid; grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr) 36px minmax(0, 1fr); align-items: stretch; margin-bottom: var(--space-8); }
    .ph-card { box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); position: relative; overflow: hidden; min-width: 0;
      background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-xl); box-shadow: var(--shadow-xs); }
    .ph-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--ph); opacity: .55; }
    .ph-card.is-current { border-color: var(--ph); background: linear-gradient(180deg, var(--ph-soft), var(--bg-surface) 60%); box-shadow: var(--shadow-md); }
    .ph-card.is-current::before { opacity: 1; }
    .ph-card.is-locked { background: var(--bg-surface-2); border-style: dashed; box-shadow: none; }
    .ph-card.is-locked::before { opacity: .2; }
    .ph-top { display: flex; align-items: center; gap: var(--space-3); }
    .ph-ic { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--ph-soft); color: var(--ph-fg); flex-shrink: 0; }
    .ph-ic svg { width: 20px; height: 20px; }
    .ph-card.is-current .ph-ic, .ph-card.is-done .ph-ic { background: var(--ph); color: var(--ph-on); }
    .ph-card.is-locked .ph-ic { background: var(--bg-surface-3); color: var(--fg-faint); }
    .ph-kicker { display: block; font-size: var(--text-2xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-kicker); text-transform: uppercase; color: var(--fg-subtle); }
    .ph-top .grow { min-width: 0; } .ph-top .badge { flex-shrink: 0; } .ph-name { display: block; font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.25; }
    .ph-card.is-locked .ph-name { color: var(--fg-muted); }
    .ph-desc { font-size: var(--text-sm); color: var(--fg-muted); line-height: 1.5; }
    .ph-card.is-locked .ph-desc { color: var(--fg-subtle); }
    .ph-prog { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-xs); color: var(--fg-subtle); }
    .ph-prog .progress { flex: 1; height: 6px; } .ph-prog .progress > span { background: var(--ph); }
    .ph-prog b { color: var(--fg-default); font-variant-numeric: tabular-nums; font-weight: var(--weight-semibold); white-space: nowrap; }
    .pcs { list-style: none; margin: 0; padding: var(--space-2) 0 0; display: flex; flex-direction: column; border-top: 1px solid var(--border-subtle); }
    .pcs li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 0; font-size: var(--text-sm); }
    .pcs .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center; color: var(--fg-faint); background: var(--bg-surface); }
    .pcs .n svg { width: 11px; height: 11px; stroke-width: 2.6; }
    .pcs .lb { color: var(--fg-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pcs .sx { font-size: var(--text-2xs); color: var(--fg-subtle); white-space: nowrap; }
    .pcs li.done .n { background: var(--ph); border-color: var(--ph); color: var(--ph-on); }
    .pcs li.done .lb { color: var(--fg-default); }
    .pcs li.active .n { border-color: var(--ph); color: var(--ph-fg); box-shadow: 0 0 0 3px var(--ph-soft); }
    .pcs li.active .lb { color: var(--fg-strong); font-weight: var(--weight-semibold); }
    .pcs li.active .sx { color: var(--ph-fg); font-weight: var(--weight-medium); }
    .pcs li.review .n { border-color: var(--warning); color: var(--warning-fg); background: var(--warning-soft); }
    .pcs li.review .lb { color: var(--fg-strong); font-weight: var(--weight-semibold); }
    .pcs li.review .sx { color: var(--warning-fg); font-weight: var(--weight-medium); }
    .ph-card.is-locked .pcs li .lb { color: var(--fg-subtle); }
    .pcs .spin-i { animation: spin 1.4s linear infinite; }
    .ph-note { display: flex; gap: var(--space-2); padding: 10px 12px; border-radius: var(--radius-md); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.5; }
    .ph-card.is-current .ph-note { background: var(--bg-surface); }
    .ph-note svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--ph-fg); }
    .ph-note b { color: var(--fg-default); font-weight: var(--weight-semibold); }
    .ph-note.gate svg { color: var(--fg-subtle); }
    .ph-note.warn { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
    .ph-note.warn svg { color: var(--warning-fg); }
    .ph-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--fg-subtle); flex-wrap: wrap; }
    .ph-foot b { color: var(--fg-default); font-weight: var(--weight-semibold); }
    .ph-cta { display: block; padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); margin-top: auto; }
    .ph-cta .btn { text-decoration: none !important; }
    .ph-link { display: flex; align-items: center; justify-content: center; color: var(--fg-faint); position: relative; }
    .ph-link::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--border-default); }
    .ph-link.done::before { background: var(--brand); }
    .ph-link span { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-canvas); border: 1.5px solid var(--border-default); display: inline-flex; align-items: center; justify-content: center; }
    .ph-link.done span { border-color: var(--brand); color: var(--brand-fg); }
    .ph-link svg { width: 14px; height: 14px; }

    /* Metrics */
    .metrics { scroll-margin-top: var(--space-4); margin-bottom: var(--space-8); }
    .metrics-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-3); flex-wrap: wrap; }
    .metrics-head .row h3 { font-size: var(--text-xl); }
    .metrics-head .btn { text-decoration: none !important; }
    .mgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-3); }
    .mt { grid-column: span 3; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
    .mt-wide { grid-column: span 8; padding: 0; gap: 0; }
    .mt-side { grid-column: span 4; padding: 0; gap: 0; }
    .mt-head { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-subtle); }
    .mt-head .kpi-ic { width: 26px; height: 26px; }
    .mt-body { display: flex; align-items: center; gap: var(--space-4); }
    .mt .stat-value { font-size: var(--text-3xl); line-height: 1.1; }
    .mt .stat-value small { font-size: var(--text-sm); font-weight: var(--weight-regular); color: var(--fg-subtle); letter-spacing: 0; }
    .mt .note { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.5; }
    .mt .note b { color: var(--fg-default); font-weight: var(--weight-semibold); }
    .mt .delta-ok { color: var(--success-fg); font-weight: var(--weight-medium); display: inline-flex; align-items: center; gap: 4px; }
    .mt .delta-warn { color: var(--warning-fg); font-weight: var(--weight-medium); display: inline-flex; align-items: center; gap: 4px; }
    .mt .mini-empty { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.5; }
    .mt .mini-empty a { font-weight: var(--weight-medium); }
    .ring { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
    .ring svg { width: 72px; height: 72px; transform: rotate(-90deg); }
    .ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: var(--text-md); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
    .vbars { display: flex; align-items: flex-end; gap: 8px; height: 48px; }
    .vbars div { flex: 1; border-radius: 3px 3px 0 0; background: var(--brand-soft-2); min-height: 4px; }
    .vbars div.is-cur { background: var(--brand); }
    .vbars-l { display: flex; gap: 8px; font-size: 9.5px; color: var(--fg-faint); margin-top: 4px; }
    .vbars-l span { flex: 1; text-align: center; }
    .mt-spark { width: 100%; height: 36px; color: var(--accent-teal); }
    .mt-spark polyline { vector-effect: non-scaling-stroke; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .mt-spark circle { fill: var(--bg-surface); stroke: currentColor; stroke-width: 2; }
    .split { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-surface-3); gap: 2px; }
    .split i { display: block; height: 100%; }
    .split .c-claude { background: var(--accent-purple); }
    .split .c-codex { background: var(--accent-teal); }
    .split .c-ok { background: var(--success); } .split .c-open { background: var(--warning); } .split .c-block { background: var(--danger); }
    .legend-d { display: flex; gap: var(--space-3); flex-wrap: wrap; font-size: var(--text-2xs); color: var(--fg-subtle); }
    .legend-d span { display: inline-flex; align-items: center; gap: 5px; }
    .legend-d i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .split-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--space-3); align-items: center; font-size: var(--text-sm); padding: 8px 0; }
    .split-row + .split-row { border-top: 1px solid var(--border-subtle); }
    .split-row .amt { font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
    .split-row .runs { font-size: var(--text-xs); color: var(--fg-subtle); min-width: 56px; text-align: right; }
    .mt-locked { grid-column: span 12; display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); border: 1px dashed var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface-2); font-size: var(--text-sm); color: var(--fg-subtle); }
    .mt-locked svg { width: 16px; height: 16px; color: var(--fg-faint); flex-shrink: 0; }
    .mt-locked b { color: var(--fg-muted); font-weight: var(--weight-semibold); }
    .mt-locked .gate { margin-left: auto; font-size: var(--text-xs); color: var(--fg-faint); text-align: right; }
    .chk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .chk li { display: flex; gap: 8px; align-items: flex-start; font-size: var(--text-sm); color: var(--fg-default); }
    .chk svg { width: 15px; height: 15px; margin-top: 2px; flex-shrink: 0; }
    .chk .ok svg { color: var(--success-fg); } .chk .bad svg { color: var(--danger-fg); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--bg-surface-3); border: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-default); font-weight: var(--weight-medium); }

    /* Lower grid */
    .cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
    .cols > div { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
    .card-title { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .card-title svg { color: var(--fg-subtle); }
    .link-more { font-size: var(--text-xs); font-weight: var(--weight-medium); display: inline-flex; align-items: center; gap: 4px; }
    .rows { display: flex; flex-direction: column; padding: var(--space-2); }
    .rrow { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-3); border-radius: var(--radius-md); color: inherit; text-decoration: none !important; }
    a.rrow:hover { background: var(--bg-hover); }
    .rrow .ttl { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .rrow .sub { font-size: var(--text-xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .r-ic { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-surface-3); color: var(--fg-muted); }
    .r-ic svg { width: 14px; height: 14px; }
    .r-ic.running { background: var(--brand-soft); color: var(--brand-fg); }
    .r-ic.review { background: var(--warning-soft); color: var(--warning-fg); }
    .r-ic.failed { background: var(--danger-soft); color: var(--danger-fg); }
    .r-ic.ok { background: var(--success-soft); color: var(--success-fg); }
    .r-ic.info { background: var(--info-soft); color: var(--info-fg); }
    .r-ic .spin-i { animation: spin 1.2s linear infinite; }
    .run .bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .run .bar .progress { flex: 1; height: 5px; }
    .run .bar b { font-size: var(--text-xs); font-variant-numeric: tabular-nums; color: var(--fg-default); width: 34px; text-align: right; }
    .progress.teal > span { background: var(--accent-teal); }
    .progress.purple > span { background: var(--accent-purple); }
    .run-id { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-subtle); }
    .cli-b { height: 20px; padding: 0 6px; border-radius: var(--radius-xs); font-size: var(--text-2xs); font-weight: var(--weight-semibold); display: inline-flex; align-items: center; gap: 4px; background: var(--accent-purple-soft); color: var(--accent-purple); }
    .cli-b.codex { background: var(--accent-teal-soft); color: var(--accent-teal-fg); }
    .ph-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--ph); }
    .art-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 22px; padding: 0 10px 0 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); background: var(--bg-surface); font-size: var(--text-xs); color: var(--fg-default); text-decoration: none !important; font-weight: var(--weight-medium); }
    .art-chip:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-fg); }
    .art-chip svg { width: 13px; height: 13px; color: var(--fg-subtle); }
    .card .empty { padding: var(--space-8) var(--space-6); }
    .card .empty h4 { color: var(--fg-strong); margin: 0; }
    .card .empty .text-sm { max-width: 380px; }

    /* Burndown */
    .bd { padding: var(--space-4) var(--space-5) var(--space-5); }
    .bd svg { width: 100%; height: auto; overflow: visible; }
    .bd .grid-l { stroke: var(--border-subtle); stroke-width: 1; }
    .bd .axis-t { fill: var(--fg-subtle); font-size: 10px; font-family: var(--font-sans); }
    .bd .ideal { stroke: var(--fg-faint); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .bd .actual { stroke: var(--brand); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .bd .area { fill: var(--brand-soft); }
    .bd .proj { stroke: var(--accent-teal); stroke-width: 1.8; stroke-dasharray: 2 4; fill: none; stroke-linecap: round; }
    .bd .pt { fill: var(--bg-surface); stroke: var(--brand); stroke-width: 2; }
    .bd .today-l { stroke: var(--accent-purple); stroke-width: 1; stroke-dasharray: 3 3; }
    .bd .today-t { fill: var(--accent-purple); font-size: 10px; font-weight: 600; }
    .legend { display: flex; gap: var(--space-4); flex-wrap: wrap; font-size: var(--text-xs); color: var(--fg-muted); margin-top: var(--space-2); }
    .legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin-right: 6px; vertical-align: middle; }
    .legend .l-a { border-color: var(--brand); } .legend .l-i { border-color: var(--fg-faint); border-top-style: dashed; } .legend .l-p { border-color: var(--accent-teal); border-top-style: dotted; }
    .bd-head { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); }
    .bd-head .big { font-size: var(--text-2xl); font-weight: var(--weight-semibold); color: var(--fg-strong); }

    .dec { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; padding: 12px var(--space-3); border-radius: var(--radius-md); }
    .dec + .dec { border-top: 1px solid var(--border-subtle); border-radius: 0; }
    .dec-date { text-align: center; padding: 4px 0; border-radius: var(--radius-md); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); line-height: 1.1; }
    .dec-date b { display: block; font-size: var(--text-md); color: var(--fg-strong); }
    .dec-date span { font-size: var(--text-2xs); color: var(--fg-subtle); text-transform: uppercase; letter-spacing: .05em; }
    .dec.is-pending .dec-date { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 30%, transparent); }
    .dec .ttl { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .dec .sub { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }
    .risk { padding: 12px var(--space-3); display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; }
    .risk + .risk { border-top: 1px solid var(--border-subtle); }
    .risk-ic { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; }
    .risk-ic svg { width: 13px; height: 13px; }
    .risk-ic.high { background: var(--danger-soft); color: var(--danger-fg); }
    .risk-ic.med { background: var(--warning-soft); color: var(--warning-fg); }
    .risk-ic.low { background: var(--bg-surface-3); color: var(--fg-muted); }
    .risk .ttl { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .risk .sub { font-size: var(--text-xs); color: var(--fg-muted); margin-top: 2px; }
    .risk .sub b { color: var(--fg-subtle); font-weight: var(--weight-medium); }

    /* canvas width depends on whether the Assistant panel is open, so respond to the container, not the viewport */
    .canvas-inner { container-type: inline-size; container-name: pg; }
    @container pg (max-width: 780px) { .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } .kpis > * { grid-column: span 2; } .kpis > :nth-child(n+4) { grid-column: span 3; } .cols { grid-template-columns: minmax(0, 1fr); } .mt { grid-column: span 6; } .mt-wide, .mt-side { grid-column: span 12; } }
    @container pg (max-width: 700px) { .flow { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); } .ph-link { display: none; } }
    @container pg (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis > *, .kpis > :nth-child(n+4) { grid-column: auto; } .mt { grid-column: span 12; } }
  </style>

            if (info.cur) extra += `<div class="ph-note"><i data-lucide="crosshair"></i><span><b>${PC.t('ws.cur')}</b> · ${T(info.cur)}</span></div>`;
            if (info.next) extra += `<div class="ph-note"><i data-lucide="arrow-right-circle"></i><span><b>${PC.t('ws.next')}</b> · ${T(info.next)}</span></div>`;
          }
          if (locked) {
            const pv = prevOf(id), pvLocked = status(pv) === 'locked';
            extra += `<div class="ph-note gate"><i data-lucide="lock"></i><span><b>${PC.t('ws.gate')}</b> · ${T(S[SK[id]].gate)}<br>${pvLocked ? PC.t('ws.prev.locked', { x: PC.t('phase.' + pv) }) : PC.t('ws.prev.prog', { x: PC.t('phase.' + pv), n: pctOf(pv) })}</span></div>`;
          }
          const foot = done ? `<span class="ph-foot"><span>${completedOn(id) ? PC.t('ws.done.on', { d: fmtDate(completedOn(id), true) }) : ''}</span><b>${PC.t('ws.steps.count', { done: doneOf(id), total: steps.length })}</b></span>`
            : locked ? '' : `<span class="ph-foot"><span></span><b>${PC.t('ws.steps.count', { done: doneOf(id), total: steps.length })}</b></span>`;
          const cta = done ? PC.t('ws.cta.done') : locked ? PC.t('ws.cta.locked') : PC.t('ws.cta.go');
          html += `<div class="ph-card ph-c-${id} ${st === 'in_progress' ? 'is-current' : ''} ${locked ? 'is-locked' : ''} ${done ? 'is-done' : ''}" data-phase="${id}" id="phase-${id}">
            <div class="ph-top"><span class="ph-ic"><i data-lucide="${locked ? 'lock' : PHASE_ICON[id]}"></i></span>
              <span class="grow"><span class="ph-kicker">${PC.t('ws.phase.n', { n: i + 1 })}</span><span class="ph-name">${PC.t('phase.' + id)}</span></span>${badge}</div>
            <div class="ph-desc">${PC.t('ws.phase.' + id + '.desc')}</div>
            ${mid}${list}${extra}${foot}
            <div class="ph-cta"><a class="btn ${st === 'in_progress' ? 'btn-primary' : 'btn-secondary'} btn-sm btn-block" href="${U(PHASE_PAGE[id])}"><span>${cta}</span><i data-lucide="arrow-right" class="icon-sm"></i></a></div>
          </div>`;
          if (i < 2) html += `<div class="ph-link ${done ? 'done' : ''}"><span><i data-lucide="chevron-right"></i></span></div>`;
        });
        el.innerHTML = html; PC.refresh(el);
      }

      /* ---------- metric helpers ---------- */
      const ring = (pct, col) => { const r = 31, c = 2 * Math.PI * r; return `<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--bg-surface-3)" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(c * pct / 100).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${Math.round(pct)}%</b></div>`; };
      const tile = (icon, tone, label, body) => `<div class="card mt"><div class="mt-head"><span class="kpi-ic ${tone}"><i data-lucide="${icon}"></i></span>${label}</div>${body}</div>`;
      const stBadge = st => { const k = st === 'review' ? 'in_review' : st; return `<span class="badge ${st === 'approved' ? 'badge-success' : (st === 'in_review' || st === 'review' || st === 'awaiting' || st === 'awaiting_approval') ? 'badge-warning' : st === 'draft' ? 'badge-outline' : 'badge-outline'}" style="min-width:76px;justify-content:center">${PC.t('ws.st.' + (st === 'awaiting_approval' ? 'awaiting' : k))}</span>`; };
      const ART_NAMES = { 'meeting-notes': L('Meeting notes', 'Biên bản họp'), brd: L('Business requirements (BRD)', 'Yêu cầu nghiệp vụ (BRD)'), scope: L('Scope & MVP boundary', 'Phạm vi & ranh giới MVP'), estimation: L('Estimation', 'Ước lượng'), sow: L('Statement of work (SOW)', 'Statement of Work (SOW)') };
      const ART_ICONS = { 'meeting-notes': 'mic', brd: 'file-text', scope: 'target', estimation: 'calculator', sow: 'file-signature' };
      const lockedSlim = id => `<div class="mt-locked"><i data-lucide="lock"></i><span>${PC.t('ws.locked.m', { x: '<b>' + PC.t('phase.' + id) + '</b>' })}</span><span class="gate">${T(S[SK[id]].gate)}</span></div>`;

      /* ---------- metrics: Initial ---------- */
      function metricsInitial() {
        const I = S.initial, q = I.questions, mt = I.meetings, analysed = mt.filter(m => m.insights).length;
        const arts = ART_NAMES && ['meeting-notes', 'brd', 'scope', 'estimation', 'sow'].map(id => Object.assign({ id, status: 'not_started' }, (I.artifacts || []).find(a => a.id === id)));
        const approved = arts.filter(a => a.status === 'approved').length;
        const brd = arts.find(a => a.id === 'brd');
        const discPct = mt.length ? Math.round(analysed / mt.length * 100) : 0;
        const qBody = q.total === 0
          ? `<div class="mini-empty">${PC.t('ws.m.q.empty')} <a href="${U('initial.html', '#meetings')}">${PC.t('ws.m.q.go')} →</a></div>`
          : `<div class="stat"><span class="stat-value">${q.open} <small>${PC.t('ws.m.q.open')}</small></span><span class="note"><b>${q.blocking}</b> ${PC.t('ws.m.q.bl').toLowerCase()} · ${q.total} total</span></div>
             <div class="split"><i class="c-ok" style="width:${(q.total - q.open) / q.total * 100}%"></i><i class="c-open" style="width:${(q.open - q.blocking) / q.total * 100}%"></i><i class="c-block" style="width:${q.blocking / q.total * 100}%"></i></div>
             <div class="legend-d"><span><i style="background:var(--success)"></i>${PC.t('ws.m.q.ans')} ${q.total - q.open}</span><span><i style="background:var(--warning)"></i>${PC.t('ws.m.q.nb')} ${q.open - q.blocking}</span><span><i style="background:var(--danger)"></i>${PC.t('ws.m.q.bl')} ${q.blocking}</span></div>`;
        const reqBody = I.requirements === 0
          ? `<div class="stat"><span class="stat-value" style="color:var(--fg-faint)">0</span></div><div class="mini-empty">${PC.t('ws.m.req.empty')}</div>`
          : `<div class="stat"><span class="stat-value">${I.requirements}</span><span class="note">${PC.t('ws.m.req.sub', { s: brd ? brd.version : '—' })}${brd && brd.status !== 'approved' ? ' (' + PC.t('ws.st.' + brd.status) + ')' : ''}</span></div>`;
        const pipe = `<div class="card-header"><span class="card-title"><i data-lucide="workflow"></i>${PC.t('ws.pipe.title')}<span class="badge ${approved ? 'badge-success' : ''}">${approved}/5</span></span><span class="text-xs text-subtle">${PC.t('ws.pipe.hint')}</span></div>
          <div class="rows">${arts.map(a => `<a class="rrow" href="${U('artifacts.html', '#' + a.id)}"><span class="file-tile"><i data-lucide="${ART_ICONS[a.id]}"></i></span><div class="grow"><div class="ttl">${T(ART_NAMES[a.id])}</div></div>${a.version ? `<span class="badge badge-outline">${a.version}</span>` : ''}${stBadge(a.status)}</a>`).join('')}</div>`;
        const meet = `<div class="card-header"><span class="card-title"><i data-lucide="mic"></i>${PC.t('ws.meet.title')}<span class="badge">${mt.length}</span></span><a class="link-more" href="${U('initial.html', '#meetings')}">${PC.t('ws.meet.add')}<i data-lucide="plus" class="icon-sm"></i></a></div>
          <div class="rows">${mt.map(m => `<a class="rrow" href="${U('initial.html', '#meetings')}"><span class="r-ic ${m.insights ? 'ok' : 'review'}"><i data-lucide="${m.insights ? 'check' : 'sparkles'}"></i></span><div class="grow"><div class="ttl">${esc(m.title)}</div><div class="sub">${fmtDate(m.date)} · ${m.kind}</div></div><span class="badge ${m.insights ? 'badge-success' : 'badge-warning'}">${PC.t(m.insights ? 'ws.meet.ins' : 'ws.meet.none')}</span></a>`).join('')}</div>`;
        return tile('compass', '', PC.t('ws.m.disc'), `<div class="mt-body">${ring(discPct, 'var(--phase-initial)')}<div class="note"><b>${PC.t('ws.m.disc.sub', { a: analysed, b: mt.length })}</b><br>${PC.t('ws.m.disc.note', { m: mt.length, s: I.sources.length })}</div></div>`)
          + tile('circle-help', q.blocking ? 'danger' : 'muted', PC.t('ws.m.q'), qBody)
          + tile('list-checks', I.requirements ? 'purple' : 'muted', PC.t('ws.m.req'), reqBody)
          + tile('file-check', approved ? 'success' : 'muted', PC.t('ws.m.appr'), `<div class="mt-body">${ring(approved / 5 * 100, 'var(--success)')}<div class="note"><b>${approved} / 5</b><br>${PC.t('ws.m.appr.sub')}</div></div>`)
          + `<div class="card mt-wide">${pipe}</div><div class="card mt-side">${meet}</div>`
          + lockedSlim('release') + lockedSlim('sdlc');
      }

      /* ---------- metrics: Scaffolding ---------- */
      const ARCH_TITLES = { c4: L('Solution architecture (C4)', 'Kiến trúc giải pháp (C4)'), 'adr-001': L('ADR-001 · Evolve the existing Spring Boot monolith', 'ADR-001 · Phát triển tiếp monolith Spring Boot hiện có'), 'adr-002': L('ADR-002 · PostgreSQL 16 as system of record', 'ADR-002 · PostgreSQL 16 là nguồn dữ liệu chính'), 'adr-003': L('ADR-003 · Azure DevOps pipelines with promotion', 'ADR-003 · Pipeline Azure DevOps với promote môi trường') };
      function metricsScaffolding() {
        const sc = S.scaffolding, arch = sc.architecture, ok = arch.filter(a => a.status === 'approved').length, w = archAwaiting();
        const stp = Object.values(sc.steps), sdone = stp.filter(x => x === 'done').length, run = sc.run;
        const cur = SC_STEPS.find(x => x[0] === run.step);
        const adr = `<div class="card-header"><span class="card-title"><i data-lucide="scale"></i>${PC.t('ws.adr.title')}<span class="badge ${w ? 'badge-warning' : 'badge-success'}">${ok}/${arch.length}</span></span><a class="link-more" href="${U('scaffolding.html', '#architecture')}">${PC.t('ws.dec.all')}<i data-lucide="arrow-right" class="icon-sm"></i></a></div>
          <div class="rows">${arch.map(a => `<a class="rrow" href="${U('scaffolding.html', '#architecture')}"><span class="file-tile"><i data-lucide="${a.id === 'c4' ? 'network' : 'git-pull-request-arrow'}"></i></span><div class="grow"><div class="ttl">${a.title ? 'ADR-004 · ' + esc(a.title) : T(ARCH_TITLES[a.id])}</div></div>${stBadge(a.status)}</a>`).join('')}</div>`;
        const repo = `<div class="card-header"><span class="card-title"><i data-lucide="folder-git-2"></i>${PC.t('ws.repo.title')}</span><span class="badge badge-purple">${PC.t('ws.repo.existing')}</span></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:var(--space-3)"><code class="text-xs" style="word-break:break-all">${esc(sc.repo.path)}</code>
            <div class="text-xs text-subtle">${PC.t('ws.repo.branch', { b: '<b>' + esc(sc.repo.branch) + '</b>', c: PC.t('ws.repo.clean') })}</div>
            <div class="chips">${sc.repo.stack.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>`;
        return tile('scale', w ? 'warning' : 'success', PC.t('ws.m.adr'), `<div class="mt-body">${ring(ok / arch.length * 100, 'var(--phase-release)')}<div class="note"><b>${ok} / ${arch.length}</b><br>${PC.t('ws.m.adr.note', { n: w })}</div></div>`)
          + tile('blocks', 'purple', PC.t('ws.m.steps'), `<div class="mt-body">${ring(sdone / stp.length * 100, 'var(--phase-release)')}<div class="note"><b>${sdone} / ${stp.length}</b><br>${PC.t('ws.m.steps.note', { a: sdone + 1, b: stp.length })}</div></div>`)
          + tile('bot', 'teal', PC.t('ws.m.live'), `<div class="stat"><span class="stat-value"><span data-run-pct="${run.id}">${run.progress}</span>%</span><span class="note">${PC.t('ws.m.live.note', { id: '<b>' + run.id + '</b>', step: cur ? T(cur[1]) : '', cli: run.agent === 'codex' ? 'Codex' : 'Claude Code' })}</span></div>
              <div class="progress purple"><span data-run="${run.id}" style="width:${run.progress}%"></span></div><div class="note">${PC.t('ws.m.live.note2', { b: esc(run.branch), m: run.startedMin })}</div>`)
          + tile('hand', 'warning', PC.t('ws.m.wait'), `<div class="stat"><span class="stat-value">${w}</span><span class="note">${PC.t('ws.m.wait.sub')}</span></div><a class="btn btn-secondary btn-sm" href="${U('scaffolding.html', '#architecture')}" style="align-self:flex-start;text-decoration:none">ADR-004 <i data-lucide="arrow-right" class="icon-sm"></i></a>`)
          + `<div class="card mt-wide">${adr}</div><div class="card mt-side">${repo}</div>`
          + lockedSlim('sdlc');
      }

      /* ---------- metrics: SDLC ---------- */
      function reviewSpark(d) {
        const w = 200, h = 36, mn = Math.min(...d) - 10, mx = Math.max(...d) + 10;
        const pts = d.map((v, i) => [(i / (d.length - 1) * (w - 12) + 6), (h - 5 - (v - mn) / (mx - mn) * (h - 10))]);
        const l = pts[pts.length - 1];
        return `<svg class="mt-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ')}"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3.5"/></svg>`;
      }
      function burndownCard(sp, B) {
        const W = 640, H = 210, l = 34, r = 12, t = 18, b = 28, MAX = sp.points, DY = sp.days;
        const x = d => l + (W - l - r) * d / DY, y = v => t + (H - t - b) * (1 - v / MAX);
        const act = B.actual.map((v, d) => [x(d), y(v)]);
        const line = act.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
        const area = line + ` L${x(sp.day).toFixed(1)} ${y(0)} L${x(0)} ${y(0)} Z`;
        const grid = [0, 1, 2, 3].map(i => Math.round(MAX * i / 3)).map(v => `<line class="grid-l" x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-t" x="${l - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join('');
        const xs = [0, 2, 4, 6, 8, 10].map(d => `<text class="axis-t" x="${x(d)}" y="${H - 8}" text-anchor="middle">${d}</text>`).join('');
        const last = B.actual[sp.day], ideal = MAX * (1 - sp.day / DY), behind = Math.round(last - ideal);
        const proj = `M${x(sp.day)} ${y(last)} L${x(DY)} ${y(B.projected)}`;
        return `<div class="card-header"><span class="card-title"><i data-lucide="trending-down"></i>${PC.t('ws.burn.title', { n: sp.n })}</span>${behind > 0 ? `<span class="badge badge-warning"><i data-lucide="clock-alert"></i>${PC.t('ws.burn.behind', { n: behind })}</span>` : `<span class="badge badge-success"><i data-lucide="check"></i>${PC.t('ws.burn.ontrack')}</span>`}</div>
          <div class="bd"><div class="bd-head"><span class="big">${last}</span><span class="text-sm text-muted">${PC.t('ws.burn.remaining')}</span></div>
          <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${PC.t('ws.burn.title', { n: sp.n })}">
            ${grid}${xs}
            <path class="area" d="${area}" opacity=".7"/>
            <line class="ideal" x1="${x(0)}" y1="${y(MAX)}" x2="${x(DY)}" y2="${y(0)}"/>
            <path class="proj" d="${proj}"/>
            <line class="today-l" x1="${x(sp.day)}" x2="${x(sp.day)}" y1="${t - 2}" y2="${y(0)}"/>
            <text class="today-t" x="${x(sp.day)}" y="${t - 6}" text-anchor="middle">${PC.t('ws.burn.today')}</text>
            <path class="actual" d="${line}"/>
            ${act.map((q, i) => `<circle class="pt" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i === sp.day ? 4 : 2.5}"><title>${PC.t('ws.burn.axis')} ${i}: ${B.actual[i]}</title></circle>`).join('')}
          </svg>
          <div class="legend"><span><i class="l-a"></i>${PC.t('ws.burn.actual')}</span><span><i class="l-i"></i>${PC.t('ws.burn.ideal')}</span><span><i class="l-p"></i>${PC.t('ws.burn.proj')}</span><span class="text-subtle" style="margin-left:auto">${PC.t('ws.burn.axis')}</span></div></div>`;
      }
      function spendCard(SP) {
        const total = SP.reduce((a, s) => a + s.amt, 0), runs = SP.reduce((a, s) => a + s.runs, 0);
        return `<div class="card-header"><span class="card-title"><i data-lucide="wallet"></i>${PC.t('ws.m.cost')}</span></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:var(--space-4)">
            <div class="stat"><span class="stat-value">$${total.toFixed(2)}</span><span class="note">${PC.t('ws.m.cost.sub', { n: runs })}</span></div>
            <div class="split">${SP.map(s => `<i class="c-${s.id}" style="width:${(s.amt / total * 100).toFixed(1)}%"></i>`).join('')}</div>
            <div>${SP.map(s => `<div class="split-row">${cliB(s.id)}<span class="amt">$${s.amt.toFixed(2)}</span><span class="runs">${PC.t('ws.m.runs', { n: s.runs })}</span></div>`).join('')}</div>
          </div>`;
      }
      function metricsSdlc() {
        const sp = S.sdlc.sprint, M = D.sdlcM, pts = sp.done, pct = Math.round(pts / sp.points * 100);
        const vel = M.velocity.concat([pts]), mx = Math.max(...vel), avg = Math.round(M.velocity.reduce((a, b) => a + b, 0) / M.velocity.length);
        const firstS = sp.n - M.velocity.length;
        let h = tile('gauge', '', PC.t('ws.m.progress'), `<div class="mt-body">${ring(pct, 'var(--brand)')}<div class="note"><b>${PC.t('ws.m.points', { a: pts, b: sp.points })}</b><br>${PC.t('ws.sprint.day', { n: sp.n, d: sp.day, t: sp.days })}</div></div>`)
          + tile('bar-chart-3', 'purple', PC.t('ws.m.velocity'), `<div class="stat"><span class="stat-value">${avg} <small>pts</small></span><span class="note">${PC.t('ws.m.velocity.sub')}</span></div>
              <div><div class="vbars">${vel.map((v, i) => `<div class="${i === vel.length - 1 ? 'is-cur' : ''}" style="height:${Math.max(8, v / mx * 100)}%" title="Sprint ${firstS + i}: ${v}"></div>`).join('')}</div>
              <div class="vbars-l">${vel.map((v, i) => `<span>S${firstS + i}</span>`).join('')}</div></div>`)
          + tile('bot', M.health ? 'danger' : 'teal', PC.t('ws.m.success'), `<div class="mt-body">${ring(M.success.pct, 'var(--accent-teal)')}<div class="note">${T(M.success.note)}</div></div>`)
          + tile('timer', 'success', PC.t('ws.m.review'), `<div class="stat"><span class="stat-value">${M.review.v}</span><span class="note"><span class="${M.review.tone === 'ok' ? 'delta-ok' : 'delta-warn'}"><i data-lucide="${M.review.tone === 'ok' ? 'trending-down' : 'trending-up'}" class="icon-sm"></i>${T(M.review.note)}</span></span></div>${reviewSpark(M.review.spark)}`)
          + `<div class="card mt-wide">${burndownCard(sp, M.burn)}</div><div class="card mt-side">${spendCard(M.spend)}</div>`;
        if (M.release) {
          const rl = M.release, hl = M.health;
          h += `<div class="card mt-wide"><div class="card-header"><span class="card-title"><i data-lucide="rocket"></i>${PC.t('ws.rel.title', { v: rl.v })}</span><span class="badge badge-warning">${rl.pct}%</span></div>
              <div class="card-body" style="display:flex;gap:var(--space-6);align-items:center;flex-wrap:wrap">${ring(rl.pct, 'var(--warning)')}
                <div class="grow" style="min-width:240px"><div class="text-xs text-subtle" style="margin-bottom:8px">${PC.t('ws.rel.sub')}</div>
                <ul class="chk">${rl.items.map(([ok, t]) => `<li class="${ok ? 'ok' : 'bad'}"><i data-lucide="${ok ? 'circle-check' : 'circle-x'}"></i><span>${T(t)}</span></li>`).join('')}</ul></div></div></div>
            <div class="card mt-side"><div class="card-header"><span class="card-title"><i data-lucide="activity"></i>${PC.t('ws.health.title')}</span></div>
              <div class="card-body" style="display:flex;flex-direction:column;gap:var(--space-3)">
                <div class="split-row" style="padding:0"><span class="row gap-2"><span class="r-ic failed"><i data-lucide="circle-x"></i></span>${PC.t('ws.health.failed')}</span><span class="amt" style="color:var(--danger-fg)">${hl.failed}</span><span></span></div>
                <div class="split-row"><span class="row gap-2"><span class="r-ic running"><i data-lucide="loader-circle"></i></span>${PC.t('ws.health.running')}</span><span class="amt">${hl.running}</span><span></span></div>
                <div class="split-row"><span class="row gap-2"><span class="r-ic review"><i data-lucide="eye"></i></span>${PC.t('ws.health.review')}</span><span class="amt">${hl.review}</span><span></span></div>
                <a class="btn btn-secondary btn-sm btn-block" href="${U('task.html')}" style="text-decoration:none"><span>${PC.t('ws.health.go')}</span><i data-lucide="arrow-right" class="icon-sm"></i></a></div></div>`;
        }
        return h;
      }

      function renderMetrics() {
        const ph = p.phase, sp = S.sdlc && S.sdlc.sprint;
        $('#ws-metrics-sub').textContent = ph === 'sdlc' ? PC.t('ws.metrics.sub.sdlc', { n: sp.n, d: sp.day, t: sp.days }) : PC.t('ws.metrics.sub.' + ph);
        const cta = $('#ws-metrics-cta');
        cta.setAttribute('href', U(PHASE_PAGE[ph]));
        cta.innerHTML = `<i data-lucide="${ph === 'sdlc' ? 'kanban' : PHASE_ICON[ph]}" class="icon-sm"></i><span>${PC.t('ws.metrics.open.' + ph)}</span><i data-lucide="arrow-up-right" class="icon-sm"></i>`;
        $('#ws-metrics').innerHTML = ph === 'initial' ? metricsInitial() : ph === 'release' ? metricsScaffolding() : metricsSdlc();
        PC.refresh($('#metrics'));
      }

      /* ---------- lower panels ---------- */
      const BTONE = { review: 'warning', failed: 'danger', teal: 'teal', warning: 'warning', danger: 'danger', outline: 'outline', success: 'success' };
      function renderRuns() {
        const running = D.work.filter(w => w.live).length;
        $('#ws-runs').innerHTML = `<div class="card-header"><span class="card-title"><i data-lucide="bot"></i>${PC.t('ws.runs.title')}${running ? `<span class="badge badge-teal"><span class="dot dot-pulse"></span>${running}</span>` : `<span class="badge">${D.work.length}</span>`}</span><a class="link-more" href="${U('task.html')}">${PC.t('ws.runs.all')}<i data-lucide="arrow-right" class="icon-sm"></i></a></div>
          <div class="rows">${D.work.map(w => `<a class="rrow ${w.pct != null ? 'run' : ''}" href="${U(w.page, w.hash)}"><span class="r-ic ${w.tone === 'todo' ? '' : w.tone}"><i data-lucide="${w.ic}" ${w.live ? 'class="spin-i"' : ''}></i></span>
            <div class="grow"><div class="row gap-2"><span class="run-id">${w.id}</span>${w.agent ? `<span class="text-xs text-subtle">${PC.t('ws.runby')}</span>${cliB(w.agent)}` : ''}</div>
              <div class="ttl" style="margin-top:2px">${T(w.title)}</div><div class="sub">${T(w.sub)}</div>
              ${w.pct != null ? `<div class="bar"><div class="progress ${w.cls || 'purple'}"><span data-run="${w.id}" style="width:${w.pct}%"></span></div><b data-run-pct="${w.id}">${w.pct}%</b></div>` : ''}</div>
            <span class="badge badge-${BTONE[w.badge[0]] || 'outline'}">${PC.t(w.badge[1])}</span></a>`).join('')}</div>`;
        PC.refresh($('#ws-runs'));
      }
      function renderArts() {
        const el = $('#ws-arts');
        const head = `<div class="card-header"><span class="card-title"><i data-lucide="files"></i>${PC.t('ws.arts.title')}</span><a class="link-more" href="${U('artifacts.html')}">${PC.t('ws.arts.all')}<i data-lucide="arrow-right" class="icon-sm"></i></a></div>`;
        if (!D.arts.length) {
          el.innerHTML = head + `<div class="empty"><div class="empty-icon"><i data-lucide="file-plus-2"></i></div><h4>${PC.t('ws.arts.empty.t')}</h4><div class="text-sm">${PC.t('ws.arts.empty.d')}</div>
              <a class="btn btn-primary btn-sm" href="${U('artifacts.html')}" style="text-decoration:none"><i data-lucide="sparkles"></i>${PC.t('ws.arts.empty.cta')}</a></div>
            ${D.sources && D.sources.length ? `<div style="padding:0 var(--space-3) var(--space-3)"><div class="kicker" style="padding:var(--space-2) var(--space-3)">${PC.t('ws.src.title')}</div><div class="rows" style="padding:0">${D.sources.map(s => `<a class="rrow" href="${U('artifacts.html')}"><span class="file-tile"><i data-lucide="${/\.xlsx?$/i.test(s) ? 'sheet' : 'file-text'}"></i></span><div class="grow"><div class="ttl truncate">${esc(s)}</div></div><span class="badge badge-outline">${PC.lang === 'vi' ? 'Nguồn' : 'Source'}</span></a>`).join('')}</div></div>` : ''}`;
        } else {
          el.innerHTML = head + `<div class="rows">${D.arts.map(a => `<a class="rrow ph-c-${a.ph}" href="${U('artifacts.html', '#' + a.id)}">
            <span class="file-tile"><i data-lucide="${a.icon}"></i></span>
            <div class="grow"><div class="ttl truncate">${T(a.title)}</div><div class="sub"><span class="ph-dot"></span>${PC.t('phase.' + a.ph)}<span class="text-faint">·</span>${a.ai ? `<span style="color:var(--accent-purple);font-weight:500">✦ ${PC.t('ws.by.assistant')}</span>` : PC.t('ws.you')}<span class="text-faint">·</span>${rel(a.t[0], a.t[1])}</div></div>
            <span class="badge badge-outline">${a.v}</span>${stBadge(a.st)}</a>`).join('')}</div>`;
        }
        PC.refresh(el);
      }
      function renderRisks() {
        $('#ws-risks').innerHTML = `<div class="card-header"><span class="card-title"><i data-lucide="shield-alert"></i>${PC.t('ws.risk.title')}<span class="badge">${D.risks.length}</span></span><button class="btn btn-ghost btn-sm" id="risk-add"><i data-lucide="plus"></i>${PC.t('ws.risk.add')}</button></div>
          ${D.risks.length ? `<div class="rows" style="padding:var(--space-2) var(--space-3)">${D.risks.map(r => `<div class="risk"><span class="risk-ic ${r.sev}"><i data-lucide="${r.sev === 'high' ? 'flame' : r.sev === 'med' ? 'triangle-alert' : 'info'}"></i></span>
            <div class="grow"><div class="ttl">${T(r.t)}</div><div class="sub"><b>${PC.t('ws.risk.mit')}:</b> ${T(r.mit)}</div></div>
            <span class="badge ${r.sev === 'high' ? 'badge-danger' : r.sev === 'med' ? 'badge-warning' : ''}">${PC.t('ws.risk.' + r.sev)}</span></div>`).join('')}</div>`
          : `<div class="empty"><div class="empty-icon"><i data-lucide="shield-check"></i></div><h4>${PC.t('ws.risk.empty.t')}</h4><div class="text-sm">${PC.t('ws.risk.empty.d')}</div></div>`}`;
        PC.refresh($('#ws-risks'));
        $('#risk-add').onclick = () => PC.toast(PC.t('ws.risk.toast'), { icon: 'sparkles' });
      }
      function renderDecisions() {
        $('#ws-decisions').innerHTML = `<div class="card-header"><span class="card-title"><i data-lucide="scale"></i>${PC.t('ws.dec.title')}</span>${D.decisions.length ? `<a class="link-more" href="${U('artifacts.html')}">${PC.t('ws.dec.all')}<i data-lucide="arrow-right" class="icon-sm"></i></a>` : ''}</div>
          ${D.decisions.length ? `<div class="rows" style="padding:var(--space-2) var(--space-3)">${D.decisions.map(d => { const dt = new Date(d.date); return `<div class="dec ${d.pending ? 'is-pending' : ''}">
            <div class="dec-date"><b>${String(dt.getDate()).padStart(2, '0')}</b><span>${new Intl.DateTimeFormat(PC.lang === 'vi' ? 'vi-VN' : 'en-GB', { month: 'short' }).format(dt)}</span></div>
            <div><div class="ttl">${T(d.t)}</div><div class="sub">${T(d.note)}</div></div>
            ${d.pending ? `<span class="badge badge-warning">${PC.t('ws.dec.pending')}</span>` : `<a class="art-chip" href="${U('artifacts.html', '#' + d.art)}"><i data-lucide="link-2"></i>${T(d.chip)}</a>`}</div>`; }).join('')}</div>`
          : `<div class="empty"><div class="empty-icon"><i data-lucide="scale"></i></div><h4>${PC.t('ws.dec.empty.t')}</h4><div class="text-sm">${PC.t('ws.dec.empty.d')}</div>
              <a class="btn btn-secondary btn-sm" href="${U('initial.html', '#meetings')}" style="text-decoration:none"><i data-lucide="sparkles"></i>${T(DS['saigon-tms'].focus.cta.t)}</a></div>`}`;
        PC.refresh($('#ws-decisions'));
      }

      /* ---------- assistant bridge ---------- */
      function setAssistantContext() {
        PC.assistant.setContext([{ icon: 'folder', label: shortName() }, { icon: 'layout-dashboard', label: PC.t('nav.overview') }, { icon: 'flag', label: PC.L(S.label) }]);
        PC.assistant.setSuggestions(D.suggest[PC.lang === 'vi' ? 1 : 0]);
      }

      function renderAll() { renderHero(); renderFocus(); renderKpis(); renderTimeline(); renderMetrics(); renderRuns(); renderArts(); renderRisks(); renderDecisions(); setAssistantContext(); }

      /* ---------- simulated live progress (running agent runs only) ---------- */
      const LIVE = {};
      D.work.filter(w => w.live).forEach(w => { LIVE[w.id] = w.pct; });
      setInterval(() => {
        Object.keys(LIVE).forEach(id => {
          if (LIVE[id] < 96) LIVE[id] = Math.min(96, LIVE[id] + (Math.random() < .6 ? 1 : 2));
          document.querySelectorAll(`[data-run="${id}"]`).forEach(s => { s.style.width = LIVE[id] + '%'; });
          document.querySelectorAll(`[data-run-pct="${id}"]`).forEach(n => { n.textContent = n.tagName === 'B' ? LIVE[id] + '%' : LIVE[id]; });
        });
      }, 3500);

      PC.onReady(() => {
        renderAll();
        const copy = txt => { try { navigator.clipboard && navigator.clipboard.writeText(txt); } catch (err) { /* ignore */ } PC.toast(PC.t('ws.copied')); };
        $('#ws-copy').onclick = e => { e.preventDefault(); copy(p.dir); };
        $('#ws-copy-repo').onclick = e => { e.preventDefault(); copy(p.repo || ''); };
        $('#ws-reveal').onclick = () => PC.toast(PC.t('ws.reveal.toast', { path: `<span class="mono">${esc(p.dir)}</span>` }), { icon: 'folder-open' });
        $('#btn-vscode').onclick = () => PC.toast(PC.t('ws.vscode.toast', { path: `<span class="mono">${esc(p.repo || p.dir)}</span>` }), { icon: 'code-2' });
        $('#btn-ask').onclick = () => { PC.assistant.open(); setAssistantContext(); const ta = document.querySelector('#pc-composer textarea'); if (ta) ta.focus(); };
        $('#btn-export').onclick = e => {
          const a = e.currentTarget;
          PC.popover(a, [['pdf', 'file-text'], ['docx', 'file-type-2'], ['zip', 'file-archive']].map(x => `<button class="menu-item" data-v="${x[0]}"><i data-lucide="${x[1]}"></i><span>${PC.t('ws.export.' + x[0])}</span></button>`).join(''), () => {
            PC.toast(PC.t('ws.export.start', { n: S.counts.artifacts }), { icon: 'loader-circle', tone: 'info' });
            setTimeout(() => PC.toast(PC.t('ws.export.done'), { tone: 'success' }), 1500);
          });
        };
        const h0 = location.hash.slice(1);
        if (ORDER.includes(h0)) setTimeout(() => { const c = $('#phase-' + h0); c && c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
        else if (h0 === 'metrics') setTimeout(() => $('#metrics').scrollIntoView({ behavior: 'smooth', block: 'start' }), 120);
      });
      document.addEventListener('pc:lang', () => { renderAll(); });
    })();
  </script>
</body>
</html>
