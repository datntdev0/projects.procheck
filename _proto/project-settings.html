<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project settings · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script src="assets/workflow.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== Project settings — page-only styles, tokens only (enterprise, flat) ===== */
    .canvas { container-type: inline-size; scroll-behavior: smooth; }
    code { font-size: .92em; background: var(--code-bg); padding: 1px 5px; border-radius: var(--radius-xs); border: 1px solid var(--border-subtle); font-family: var(--font-mono); }

    /* ---------- Page head ---------- */
    .page-head, .set-wrap { max-width: 1120px; margin-left: auto; margin-right: auto; }
    .ps-main { display: flex; gap: var(--space-3); align-items: flex-start; min-width: 0; flex: 1 1 520px; }
    .ps-main .project-avatar { width: 40px; height: 40px; font-size: 14px; }
    .ps-main .kicker { display: block; margin-bottom: 2px; }
    .page-head .meta code { font-size: 12px; color: var(--fg-default); overflow-wrap: anywhere; }
    .page-head .meta .k { color: var(--fg-subtle); }

    /* ---------- Layout: flat sub-nav + one panel per settings group ---------- */
    .set-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-8); align-items: start; }
    .set-nav { position: sticky; top: var(--space-4); }
    .set-nav a { position: relative; display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 5px 10px; line-height: 1.35; border-radius: var(--radius-sm); color: var(--fg-muted); font-size: var(--text-sm); text-decoration: none !important; }
    .set-nav a svg { width: 15px; height: 15px; color: var(--fg-subtle); }
    .set-nav a:hover { background: var(--bg-hover); color: var(--fg-default); }
    .set-nav a.is-active { background: var(--bg-active); color: var(--fg-strong); font-weight: var(--weight-medium); }
    .set-nav a.is-active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--brand); }
    .set-nav a.is-active svg { color: var(--brand-fg); }
    .set-nav a.danger, .set-nav a.danger svg { color: var(--danger-fg); }
    .set-nav a.danger.is-active::before { background: var(--danger); }
    .set-nav .sp { height: 1px; background: var(--border-subtle); margin: 8px 6px; }
    .set-nav .ap-link { padding: 10px 10px 0; font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.5; }
    .set-nav .ap-link a { display: inline; height: auto; padding: 0; color: var(--fg-link); font-size: inherit; }
    .set-nav .ap-link a:hover { background: none; text-decoration: underline; }
    .sec { scroll-margin-top: var(--space-4); margin-bottom: var(--space-6); }
    .sec > .card { overflow: hidden; }
    .sec-t { min-width: 0; }
    .sec-t h2 { font-size: 13.5px; font-weight: var(--weight-semibold); line-height: 1.4; letter-spacing: 0; }
    .sec-t p { margin: 1px 0 0; color: var(--fg-subtle); font-size: var(--text-xs); line-height: 1.5; max-width: 680px; }
    .sec .panel-head { padding-top: 10px; padding-bottom: 10px; }
    /* Sub-group label inside a panel (ruled band, no box) */
    .sgroup { padding: 7px var(--space-4); background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); }

    /* Setting row: label + hint left, control right, ruled */
    .srow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: 10px var(--space-4); }
    .srow + .srow { border-top: 1px solid var(--border-subtle); }
    .srow.stack { flex-direction: column; align-items: stretch; gap: var(--space-2); }
    .sinfo { min-width: 0; }
    .slabel { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .sdesc { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; max-width: 520px; line-height: 1.5; }
    .sctl { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
    .sctl .input, .sctl .select { width: 300px; }
    .sctl .select.sm { width: 200px; }
    .sctl .input.sm { width: 90px; }
    .note-row { display: flex; align-items: flex-start; gap: var(--space-2); padding: 9px var(--space-4); background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.55; }
    .note-row:last-child { border-bottom: 0; }
    .note-row svg { margin-top: 1px; color: var(--fg-subtle); }
    /* Read-only path: plain mono text, no box */
    .ro { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--fg-default); min-width: 0; max-width: 380px; }
    .ro span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ro svg { color: var(--fg-faint); width: 13px; height: 13px; flex-shrink: 0; }
    .ro.wide { max-width: 100%; }
    input[type="range"] { accent-color: var(--brand); width: 180px; }
    .range-val { min-width: 24px; text-align: right; font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }

    /* Options: radio rows divided by rules (no cards) */
    .opts { display: flex; flex-direction: column; }
    .opt { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: var(--space-3); row-gap: 2px; align-items: start; padding: 10px var(--space-4); cursor: pointer; text-align: left; }
    .opt + .opt { border-top: 1px solid var(--border-subtle); }
    .opt:hover { background: var(--bg-hover); }
    .opt:focus-visible { box-shadow: inset var(--shadow-focus); border-radius: 0; }
    .opt .tick { grid-row: 1 / span 2; margin-top: 2px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; background: var(--bg-surface); color: transparent; }
    .opt .tick svg { display: none; }
    .opt.is-selected .tick { border-color: var(--brand); border-width: 5px; }
    .opt b { font-size: var(--text-sm); color: var(--fg-strong); font-weight: var(--weight-medium); }
    .opt .d { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.5; }
    .opt .d code { font-size: 11px; }
    .override { padding: 10px var(--space-4) 14px 44px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); border-top: 1px solid var(--border-subtle); }
    .override.is-off { display: none; }

    /* Phase picker: one row of columns divided by rules */
    .phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border-subtle); }
    .ph { position: relative; cursor: pointer; border: 0; padding: 10px var(--space-4); background: var(--bg-surface); display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .ph + .ph { border-left: 1px solid var(--border-subtle); }
    .ph:hover { background: var(--bg-hover); }
    .ph.is-selected { background: var(--bg-active); }
    .ph.is-selected::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--_c); }
    .ph .h { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .ph .h svg { color: var(--fg-subtle); width: 14px; height: 14px; }
    .ph .bar { height: 3px; border-radius: 2px; background: var(--border-default); overflow: hidden; }
    .ph .bar i { display: block; height: 100%; background: var(--_c); }
    .ph .m { font-size: var(--text-2xs); color: var(--fg-subtle); display: flex; justify-content: space-between; }

    /* ---------- Customization: one panel; each step is a ruled section ---------- */
    .cz-tabs { padding: 0 var(--space-3); }
    .cz-tabs .tab .count { margin-left: 2px; }
    .fl-bar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: 8px var(--space-4); border-bottom: 1px solid var(--border-subtle); background: var(--bg-surface-2); }
    .cz-prompt { display: flex; flex-direction: column; gap: var(--space-2); padding: 12px var(--space-4) 14px; }
    .cz-steps-h { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; padding: 8px var(--space-4); background: var(--bg-surface-2); border-top: 1px solid var(--border-default); border-bottom: 1px solid var(--border-default); }
    .cz-steps-h .slabel { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .06em; font-weight: var(--weight-semibold); color: var(--fg-muted); }
    .fstep + .fstep { border-top: 1px solid var(--border-default); }
    .fstep.is-off > summary .fs-t, .fstep.is-off > summary .fs-n { opacity: .5; }
    .fs-off { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-xs); color: var(--fg-muted); flex-shrink: 0; }
    .fs-skip { padding: 8px var(--space-4) 8px 52px; font-size: var(--text-xs); color: var(--fg-subtle); border-bottom: 1px solid var(--border-subtle); }
    .fstep > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px var(--space-4); cursor: pointer; }
    .fstep > summary::-webkit-details-marker { display: none; }
    .fstep > summary:hover { background: var(--bg-hover); }
    .fstep[open] > summary { border-bottom: 1px solid var(--border-subtle); }
    .fs-n { width: 24px; flex-shrink: 0; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
    .fs-t { flex: 1; min-width: 0; }
    .fs-t b { display: block; font-size: var(--text-sm); color: var(--fg-strong); font-weight: var(--weight-semibold); }
    .fs-t small { display: block; font-size: var(--text-xs); color: var(--fg-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fstep > summary .chev { color: var(--fg-subtle); transition: transform var(--dur-fast); }
    .fstep[open] > summary .chev { transform: rotate(180deg); }
    .fs-sec { padding: 12px var(--space-4) 12px 52px; }
    .fs-sec + .fs-sec { border-top: 1px solid var(--border-subtle); }
    .fs-sec-h { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); margin-bottom: 8px; }
    .textarea.instr { min-height: 120px; line-height: 1.6; font-size: var(--text-sm); }
    /* Artifact list: table-like rows */
    .fa-list { border-top: 1px solid var(--border-subtle); }
    .fa { display: grid; grid-template-columns: 18px minmax(0, 1fr) minmax(0, 1.1fr) auto; gap: 6px var(--space-3); align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
    .fa > svg { width: 16px; height: 16px; color: var(--fg-subtle); }
    .fa.is-over { background: var(--brand-soft); }
    .fa-file { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--text-xs); }
    .fa-file > svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--fg-subtle); }
    .fa-file .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-default); font-family: var(--font-mono); }
    .fa-file .sz { color: var(--fg-subtle); white-space: nowrap; margin-right: auto; }
    .fa-attach { justify-self: start; }
    .fa-none { padding: 10px 0; font-size: var(--text-xs); color: var(--fg-faint); border-bottom: 1px solid var(--border-subtle); }
    @container (max-width: 860px) { .fa { grid-template-columns: 18px minmax(0, 1fr) auto; } .fa .fa-file, .fa .fa-attach { grid-column: 2 / -1; grid-row: 2; } .fs-sec, .fs-skip { padding-left: var(--space-4); } }

    /* prompts */
    .textarea.prompt { font-family: var(--font-mono); font-size: 12px; line-height: 1.65; min-height: 170px; }

    /* ---------- Isolation ---------- */
    .iso-layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--border-default); }
    .iso-layer { padding: 12px var(--space-4); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .iso-layer + .iso-layer { border-left: 1px solid var(--border-subtle); }
    .iso-layer .h { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .iso-layer .h svg { width: 14px; height: 14px; color: var(--fg-subtle); }
    .iso-layer .h .badge { margin-left: auto; }
    .iso-layer p { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.55; margin: 0; }
    .home-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: 10px var(--space-4); }
    .home-row + .home-row { border-top: 1px solid var(--border-subtle); }
    .home-row > svg { color: var(--fg-muted); margin-top: 2px; }
    .prof-files { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
    .prof-files code { font-size: 11px; color: var(--fg-muted); }
    .signin { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 8px; border-radius: var(--radius-sm); background: var(--bg-surface-2); border: 1px solid var(--border-default); font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-default); }
    .chip button { border: 0; background: transparent; color: var(--fg-subtle); width: 18px; height: 18px; border-radius: var(--radius-xs); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
    .chip button:hover { background: var(--bg-hover); color: var(--danger-fg); }
    .inline-add { display: flex; gap: var(--space-2); max-width: 360px; }
    .env-wrap { padding: 0 var(--space-4) 14px; }
    .env-wrap .code { line-height: 1.75; }
    .env-wrap .c-k { color: var(--brand-fg); } .env-wrap .c-d { color: var(--fg-faint); } .env-wrap .c-ok { color: var(--success-fg); } .env-wrap .c-no { color: var(--danger-fg); }

    /* ---------- Storage ---------- */
    .st-total { display: flex; align-items: baseline; gap: 10px; padding: 12px var(--space-4) 0; }
    .st-bar { display: flex; height: 6px; border-radius: var(--radius-xs); overflow: hidden; background: var(--bg-surface-3); gap: 2px; margin: 10px var(--space-4) 0; }
    .st-bar i { display: block; height: 100%; }
    .st-tree { margin: 12px var(--space-4) 10px 22px; border-left: 1px solid var(--border-strong); }
    .st-tree + .srow { border-top: 1px solid var(--border-subtle); }
    .znode { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 6px 8px 6px 18px; }
    .znode::before { content: ""; position: absolute; left: 0; top: 15px; width: 10px; border-top: 1px solid var(--border-strong); }
    .znode > svg { width: 14px; height: 14px; color: var(--fg-subtle); margin-top: 1px; }
    .znode .zp { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-default); display: flex; align-items: center; gap: 8px; min-width: 0; }
    .znode .zp i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .znode .zd { grid-column: 2; font-size: var(--text-xs); color: var(--fg-subtle); }
    .znode .zs { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .znode:hover { background: var(--bg-hover); }

    /* ---------- Danger ---------- */
    .danger-card { border-color: color-mix(in srgb, var(--danger) 35%, var(--border-default)); }
    .danger-card .panel-head { border-bottom-color: color-mix(in srgb, var(--danger) 25%, var(--border-default)); }
    .danger-card .panel-head h2 { color: var(--danger-fg); }

    /* ---------- Save bar (floating layer) ---------- */
    .savebar { position: sticky; bottom: 16px; z-index: 15; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: var(--space-3); padding: 8px 10px 8px 14px; border-radius: var(--radius-md); background: var(--bg-inverse); color: var(--fg-inverse); box-shadow: var(--shadow-lg); font-size: var(--text-sm); transition: opacity var(--dur-base), transform var(--dur-base) var(--ease-out); }
    .savebar.is-off { opacity: 0; transform: translateY(12px); pointer-events: none; }
    .savebar .grow { display: flex; align-items: center; gap: 8px; }
    .savebar .btn-ghost { color: var(--fg-inverse); opacity: .8; } .savebar .btn-ghost:hover { background: rgba(127,127,127,.2); opacity: 1; }

    @container (max-width: 980px) {
      .override, .phases, .iso-layers { grid-template-columns: minmax(0, 1fr); }
      .ph + .ph { border-left: 0; border-top: 1px solid var(--border-subtle); }
      .iso-layer + .iso-layer { border-left: 0; border-top: 1px solid var(--border-subtle); }
      .override { padding-left: var(--space-4); }
    }
    @container (max-width: 860px) {
      .set-wrap { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
      .set-nav { position: static; display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--border-default); padding-bottom: var(--space-2); }
      .set-nav .sp, .set-nav .ap-link { display: none; }
      .set-nav a { white-space: nowrap; }
      .set-nav a.is-active::before { display: none; }
      .srow { flex-direction: column; align-items: stretch; gap: var(--space-2); }
      .sctl { flex-wrap: wrap; } .sctl .input, .sctl .select, .sctl .select.sm { width: 100%; }
    }
  </style>
</head>
<body data-page="project-settings" data-shell="project" data-crumb="nav.project_settings" data-assistant="closed">
  <main class="canvas" id="canvas"><div class="canvas-inner">

    <!-- ============ Page head ============ -->
    <header class="page-head" id="head"></header>

    <div class="set-wrap">
      <nav class="set-nav" aria-label="Project settings" id="setnav">
        <a href="#general" data-sec="general"><i data-lucide="sliders-horizontal"></i><span data-i18n="ps.n.general"></span></a>
        <a href="#workflow" data-sec="workflow"><i data-lucide="route"></i><span data-i18n="ps.n.workflow"></span></a>
        <a href="#customize" data-sec="customize"><i data-lucide="wand-sparkles"></i><span data-i18n="ps.n.cz"></span></a>
        <a href="#ai" data-sec="ai"><i data-lucide="sparkles"></i><span data-i18n="ps.n.ai"></span></a>
        <a href="#isolation" data-sec="isolation"><i data-lucide="shield-check"></i><span data-i18n="ps.n.isolation"></span></a>
        <a href="#harness" data-sec="harness"><i data-lucide="bot"></i><span data-i18n="ps.n.harness"></span></a>
        <a href="#export" data-sec="export"><i data-lucide="download"></i><span data-i18n="ps.n.export"></span></a>
        <a href="#storage" data-sec="storage"><i data-lucide="hard-drive"></i><span data-i18n="ps.n.storage"></span></a>
        <div class="sp"></div>
        <a href="#danger" data-sec="danger" class="danger"><i data-lucide="triangle-alert"></i><span data-i18n="ps.n.danger"></span></a>
        <div class="ap-link"><span data-i18n="ps.defaults"></span> <a href="settings.html" data-i18n="nav.app_settings"></a></div>
      </nav>

      <div id="content">

        <!-- General -->
        <section class="sec" id="general" data-sec="general">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ps.n.general"></h2><p data-i18n="ps.general.d"></p></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.name"></div></div><div class="sctl"><input class="input" id="f-name"></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.client"></div></div><div class="sctl"><input class="input" id="f-client"></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.code"></div><div class="sdesc" data-i18n="ps.g.code.d"></div></div><div class="sctl"><input class="input mono sm" id="f-code" maxlength="6" style="text-transform:uppercase"></div></div>
            <div class="srow stack"><div class="sinfo"><div class="slabel" data-i18n="ps.g.desc"></div><div class="sdesc" data-i18n="ps.g.desc.d"></div></div><textarea class="textarea" id="f-desc" data-i18n-placeholder="ps.g.desc.ph"></textarea></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.dir"></div><div class="sdesc" data-i18n="ps.g.dir.d"></div></div>
              <div class="sctl"><div class="ro"><i data-lucide="lock"></i><span data-bind="dir"></span></div><button class="btn btn-secondary btn-sm" data-act="move"><i data-lucide="folder-output"></i><span data-i18n="ps.g.move"></span></button></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.repo"></div><div class="sdesc" data-i18n="ps.g.repo.d"></div></div>
              <div class="sctl"><div class="ro"><i data-lucide="folder-git-2"></i><span data-bind="repo"></span></div><button class="btn btn-secondary btn-sm" data-act="repo"><i data-lucide="folder-open"></i><span data-i18n="ps.change"></span></button></div></div>
          </div>
        </section>

        <!-- Workflow -->
        <section class="sec" id="workflow" data-sec="workflow">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ps.n.workflow"></h2><p data-i18n="ps.workflow.d"></p></div></div>
            <div class="srow stack" style="padding-bottom:0"><div class="sinfo"><div class="slabel" data-i18n="ps.w.phase"></div><div class="sdesc" data-i18n="ps.w.phase.d"></div></div></div>
            <div class="phases" id="phases" style="margin-top:8px"></div>

          else if (act === 'fa-unfile') { flow().steps[a.dataset.s].arts[+a.dataset.n].file = null; flowDirty(a.dataset.s); }
          else if (act === 'fa-pick') { S.pickFor = [a.dataset.s, +a.dataset.n]; $('fl-file').click(); }

        $('flow').addEventListener('input', e => {
          const el = e.target;
          if (el.dataset.instr) { flow().steps[el.dataset.instr].instr = el.value; setDirty(true); }
          else if (el.dataset.aname) { const [sk, n] = el.dataset.aname.split('|'); flow().steps[sk].arts[+n].name = el.value; setDirty(true); }
        });
        $('fl-file').addEventListener('change', e => { const f = e.target.files[0]; if (f && S.pickFor) attach(S.pickFor[0], S.pickFor[1], f); e.target.value = ''; });
        $('flow').addEventListener('dragover', e => { const r = e.target.closest('.fa'); if (!r) return; e.preventDefault(); document.querySelectorAll('.fa.is-over').forEach(x => x !== r && x.classList.remove('is-over')); r.classList.add('is-over'); });
        $('flow').addEventListener('dragleave', e => { const r = e.target.closest('.fa'); if (r && !r.contains(e.relatedTarget)) r.classList.remove('is-over'); });
        $('flow').addEventListener('drop', e => { const r = e.target.closest('.fa'); if (!r) return; e.preventDefault(); r.classList.remove('is-over'); const [sk, n] = r.dataset.row.split('|'); attach(sk, +n, e.dataTransfer.files[0]); });
        $('flow').addEventListener('toggle', e => { if (e.target.open) S.openStep[S.cz] = e.target.dataset.step; }, true);
        $('flow').addEventListener('change', e => { const el = e.target; if (!el.dataset.off) return; flow().steps[el.dataset.off].off = !el.checked; flowDirty(); });
        $('phases').addEventListener('click', e => { const b = e.target.closest('[data-phase]'); if (!b) return; S.phase = b.dataset.phase; renderPhases(); PC.refresh($('phases')); setDirty(true); });
        const pick = (el, fn) => { el.addEventListener('click', e => { const o = e.target.closest('.opt'); if (o && el.contains(o)) fn(o); }); el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('opt')) { e.preventDefault(); fn(e.target); } }); };
        pick($('ai-mode'), o => { S.aiMode = o.dataset.v; renderOverride(); setDirty(true); });
        pick($('fmt'), o => { S.fmt = o.dataset.v; document.querySelectorAll('#fmt .opt').forEach(x => x.classList.toggle('is-selected', x === o)); setDirty(true); });
        $('ov-cli').addEventListener('change', () => { const cli = $('ov-cli').value; $('ov-model').innerHTML = (MODELS[cli] || []).map(m => `<option>${m}</option>`).join(''); });
        $('envchips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; S.env = S.env.filter(v => v !== b.dataset.rm); renderEnv(); setDirty(true); });
        $('env-cli').addEventListener('click', e => { const b = e.target.closest('[data-cli]'); if (!b) return; S.envCli = b.dataset.cli; renderEnv(); });
        $('iso-global').addEventListener('change', e => { S.isoGlobal = e.target.checked; renderEnv(); });
        $('iso-fs').addEventListener('change', e => { S.isoFs = e.target.checked; renderEnv(); });
        $('env-in').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-act="env-add"]').click(); } });
        $('par').addEventListener('input', e => { $('par-v').textContent = e.target.value; });
        $('sprint').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; document.querySelectorAll('#sprint button').forEach(x => x.classList.toggle('is-active', x === b)); setDirty(true); });
        $('branch').addEventListener('input', e => { const v = e.target.value.replace(/&lt;/g, '<').replace(/&gt;/g, '>'); $('branch-ex').textContent = v.replace('<id>', 'LP-142').replace('<slug>', 'merchant-kyc-upload'); });
        $('setnav').addEventListener('click', e => { const a = e.target.closest('a[data-sec]'); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.sec).scrollIntoView({ behavior: 'smooth', block: 'start' }); history.replaceState(null, '', '#' + a.dataset.sec); });
        $('canvas').addEventListener('scroll', spy, { passive: true });
      }

      PC.onReady(() => {
        S.openStep = { initial: 'discovery', release: 'structure', sdlc: 'plan' };
        const h = location.hash.slice(1), m = h.match(/^customize-(\w+)$/);
        if (h === 'initial-flow') history.replaceState(null, '', '#customize');
        if (m) { S.cz = m[1]; history.replaceState(null, '', '#customize'); }
        $('branch').value = 'agent/<id>-<slug>';
        fillForm(); wire(); renderAll(); spy();
        if (location.hash) { const el = document.getElementById(location.hash.slice(1) || 'general'); if (el && el.classList.contains('sec')) setTimeout(() => el.scrollIntoView(), 60); }
        PC.assistant.setContext([{ icon: 'sliders-horizontal', label: PC.t('nav.project_settings') }, { icon: 'folder', label: P().dir }]);
      });
      document.addEventListener('pc:lang', renderAll);
    })();
  </script>
</body>
</html>
