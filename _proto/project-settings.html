<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project settings · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    .canvas { container-type: inline-size; scroll-behavior: smooth; }
    code { font-size: .92em; background: var(--code-bg); padding: 1px 6px; border-radius: var(--radius-xs); border: 1px solid var(--border-subtle); font-family: var(--font-mono); }

    /* ---------- Header ---------- */
    .ps-head { max-width: 1120px; margin: 0 auto var(--space-6); padding: var(--space-5) var(--space-6); display: flex; align-items: center; gap: var(--space-5); flex-wrap: wrap; background: var(--gradient-hero), var(--bg-surface); }
    .ps-head .project-avatar { width: 56px; height: 56px; border-radius: 14px; font-size: 18px; }
    .ps-head .kicker { display: block; margin-bottom: 2px; }
    .ps-head h1 { font-size: var(--text-2xl); letter-spacing: -0.015em; }
    .ps-paths { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; font-size: var(--text-xs); color: var(--fg-muted); }
    .ps-path { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .ps-path .k { color: var(--fg-subtle); min-width: 130px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .ps-path code { overflow-wrap: anywhere; }
    .ps-path code { color: var(--fg-strong); }
    .ps-acts { display: flex; gap: var(--space-2); margin-left: auto; align-self: flex-start; }
    .ap-link { max-width: 1120px; margin: -8px auto var(--space-6); font-size: var(--text-xs); color: var(--fg-subtle); display: flex; align-items: center; gap: 6px; }

    /* ---------- Layout ---------- */
    .set-wrap { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: var(--space-8); align-items: start; max-width: 1120px; margin: 0 auto; }
    .set-nav { position: sticky; top: var(--space-4); }
    .set-nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--radius-md); color: var(--fg-muted); font-size: var(--text-sm); font-weight: var(--weight-medium); text-decoration: none !important; }
    .set-nav a svg { width: 15px; height: 15px; color: var(--fg-subtle); }
    .set-nav a:hover { background: var(--bg-hover); color: var(--fg-default); }
    .set-nav a.is-active { background: var(--bg-active); color: var(--brand-fg); }
    .set-nav a.is-active svg { color: var(--brand-fg); }
    .set-nav a.danger, .set-nav a.danger svg { color: var(--danger-fg); }
    .set-nav .sp { height: 1px; background: var(--border-subtle); margin: 8px 6px; }
    .sec { scroll-margin-top: var(--space-4); margin-bottom: var(--space-12); }
    .sec-head { margin-bottom: var(--space-4); }
    .sec-head h2 { font-size: var(--text-xl); font-weight: var(--weight-semibold); letter-spacing: -0.01em; }
    .sec-head p { margin: 4px 0 0; color: var(--fg-muted); font-size: var(--text-sm); max-width: 640px; }

    .srow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: 9px 20px; border-bottom: 1px solid var(--border-subtle); }
    .srow:last-child { border-bottom: 0; }
    .srow.stack { flex-direction: column; align-items: stretch; gap: var(--space-3); }
    .sinfo { min-width: 0; }
    .slabel { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .sdesc { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; max-width: 470px; line-height: 1.55; }
    .sctl { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
    .sctl .input, .sctl .select { width: 300px; }
    .sctl .select.sm { width: 200px; }
    .sctl .input.sm { width: 90px; }
    .note-row { display: flex; align-items: flex-start; gap: var(--space-3); padding: 12px 20px; background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.55; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .note-row svg { margin-top: 1px; color: var(--brand-fg); }
    .ro { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-surface-2); font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); min-width: 0; width: 360px; }
    .ro span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ro svg { color: var(--fg-faint); width: 14px; height: 14px; }
    .ro.wide { width: 100%; }
    input[type="range"] { accent-color: var(--brand); width: 180px; }
    .range-val { min-width: 24px; text-align: right; font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }

    /* radio cards */
    .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); padding: var(--space-4) 20px; }
    .opt { position: relative; display: flex; flex-direction: column; gap: 6px; padding: var(--space-4); border: 1.5px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); cursor: pointer; text-align: left; transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast); }
    .opt:hover { border-color: var(--border-strong); }
    .opt:focus-visible { box-shadow: var(--shadow-focus); border-radius: var(--radius-lg); }
    .opt.is-selected { border-color: var(--brand); background: var(--brand-soft); box-shadow: var(--shadow-focus); }
    .opt .tick { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: transparent; background: var(--bg-surface); }
    .opt .tick svg { width: 11px; height: 11px; stroke-width: 3; }
    .opt.is-selected .tick { background: var(--brand); border-color: var(--brand); color: var(--fg-on-brand); }
    .opt b { font-size: var(--text-sm); color: var(--fg-strong); font-weight: var(--weight-semibold); padding-right: 24px; }
    .opt .d { font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.5; }
    .opt .d code { font-size: 11px; }
    .override { padding: 0 20px var(--space-4); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .override.is-off { display: none; }

    /* phase picker */
    .phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); padding: var(--space-4) 20px; }
    .ph { cursor: pointer; border: 1.5px solid var(--border-default); border-radius: var(--radius-lg); padding: 14px; background: var(--bg-surface); display: flex; flex-direction: column; gap: 8px; text-align: left; transition: border-color var(--dur-fast), background var(--dur-fast); }
    .ph:hover { border-color: var(--border-strong); }
    .ph.is-selected { border-color: var(--_c); background: color-mix(in srgb, var(--_c) 8%, var(--bg-surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--_c) 20%, transparent); }
    .ph .h { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .ph .h svg { color: var(--_c); }
    .ph .bar { height: 4px; border-radius: 4px; background: var(--border-default); overflow: hidden; }
    .ph .bar i { display: block; height: 100%; background: var(--_c); }
    .ph .m { font-size: var(--text-2xs); color: var(--fg-subtle); display: flex; justify-content: space-between; }

    /* prompts */
    .ptabs { display: flex; gap: var(--space-1); padding: 0 20px; border-bottom: 1px solid var(--border-subtle); }
    .ptabs .tab { height: 40px; }
    .textarea.prompt { font-family: var(--font-mono); font-size: 12px; line-height: 1.65; min-height: 190px; }

    /* isolation */
    .home-row { display: flex; align-items: center; gap: var(--space-3); padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); }
    .home-row:last-of-type { border-bottom: 0; }
    .iso-layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-4); }
    .iso-layer { padding: 14px 16px; border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); display: flex; flex-direction: column; gap: 6px; }
    .iso-layer .h { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: 600; color: var(--fg-strong); }
    .iso-layer .h svg { width: 16px; height: 16px; color: var(--brand-fg); }
    .iso-layer .h .badge { margin-left: auto; }
    .iso-layer p { font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.55; margin: 0; }
    .prof-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .prof-files code { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--bg-surface-2); border: 1px solid var(--border-subtle); color: var(--fg-muted); }
    .signin { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }
    @media (max-width: 760px) { .iso-layers { grid-template-columns: 1fr; } }
    .cli-logo { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--bg-surface-3); color: var(--fg-default); flex-shrink: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 10px; border-radius: var(--radius-sm); background: var(--bg-surface-2); border: 1px solid var(--border-default); font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-default); }
    .chip button { border: 0; background: transparent; color: var(--fg-subtle); width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
    .chip button:hover { background: var(--bg-hover); color: var(--danger-fg); }
    .inline-add { display: flex; gap: var(--space-2); max-width: 360px; }
    .env-wrap { padding: 0 20px var(--space-4); }
    .env-wrap .code { line-height: 1.75; }
    .env-wrap .c-k { color: var(--brand-fg); } .env-wrap .c-d { color: var(--fg-faint); } .env-wrap .c-ok { color: var(--success-fg); } .env-wrap .c-no { color: var(--danger-fg); }

    /* export */
    .opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    /* storage */
    .st-total { display: flex; align-items: baseline; gap: 10px; padding: 18px 20px 0; }
    .st-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--bg-surface-3); gap: 2px; margin: 12px 20px 0; }
    .st-bar i { display: block; height: 100%; }
    .st-tree { margin: 14px 20px 8px 30px; border-left: 1px solid var(--border-strong); }
    .znode { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 7px 14px 7px 18px; }
    .znode::before { content: ""; position: absolute; left: 0; top: 17px; width: 10px; border-top: 1px solid var(--border-strong); }
    .znode > svg { width: 14px; height: 14px; color: var(--fg-subtle); margin-top: 2px; }
    .znode .zp { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-default); display: flex; align-items: center; gap: 8px; min-width: 0; }
    .znode .zp i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .znode .zd { grid-column: 2; font-size: var(--text-xs); color: var(--fg-subtle); }
    .znode .zs { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
    .znode:hover { background: var(--bg-hover); }

    /* danger */
    .danger-card { border-color: color-mix(in srgb, var(--danger) 35%, var(--border-default)); }
    .danger-card .srow { border-bottom-color: color-mix(in srgb, var(--danger) 15%, var(--border-subtle)); }

    /* save bar */
    .savebar { position: sticky; bottom: 16px; z-index: 15; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px 10px 16px; border-radius: var(--radius-lg); background: var(--bg-inverse); color: var(--fg-inverse); box-shadow: var(--shadow-lg); font-size: var(--text-sm); transition: opacity var(--dur-base), transform var(--dur-base) var(--ease-out); }
    .savebar.is-off { opacity: 0; transform: translateY(12px); pointer-events: none; }
    .savebar .grow { display: flex; align-items: center; gap: 8px; }
    .savebar .btn-ghost { color: var(--fg-inverse); opacity: .8; } .savebar .btn-ghost:hover { background: rgba(127,127,127,.2); opacity: 1; }

    @container (max-width: 980px) { .override, .opts, .opts.three, .phases { grid-template-columns: minmax(0, 1fr); } }
    @container (max-width: 860px) {
      .set-wrap { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
      .set-nav { position: static; display: flex; flex-wrap: wrap; gap: 2px; } .set-nav .sp { display: none; }
      .set-nav a { white-space: nowrap; }
      .srow { flex-direction: column; align-items: stretch; gap: var(--space-3); }
      .sctl { flex-wrap: wrap; } .sctl .input, .sctl .select, .sctl .select.sm, .ro { width: 100%; }
      .ps-acts { margin-left: 0; }
    }
  </style>
</head>
<body data-page="project-settings" data-shell="project" data-crumb="nav.project_settings" data-assistant="closed">
  <main class="canvas" id="canvas"><div class="canvas-inner">

    <!-- ============ Header ============ -->
    <header class="card ps-head" id="head"></header>
    <div class="ap-link"><i data-lucide="settings" class="icon-sm"></i><span data-i18n="ps.defaults"></span> <a href="settings.html" data-i18n="nav.app_settings"></a></div>

    <div class="set-wrap">
      <nav class="set-nav" aria-label="Project settings" id="setnav">
        <a href="#general" data-sec="general"><i data-lucide="sliders-horizontal"></i><span data-i18n="ps.n.general"></span></a>
        <a href="#workflow" data-sec="workflow"><i data-lucide="route"></i><span data-i18n="ps.n.workflow"></span></a>
        <a href="#ai" data-sec="ai"><i data-lucide="sparkles"></i><span data-i18n="ps.n.ai"></span></a>
        <a href="#isolation" data-sec="isolation"><i data-lucide="shield-check"></i><span data-i18n="ps.n.isolation"></span></a>
        <a href="#harness" data-sec="harness"><i data-lucide="bot"></i><span data-i18n="ps.n.harness"></span></a>
        <a href="#export" data-sec="export"><i data-lucide="download"></i><span data-i18n="ps.n.export"></span></a>
        <a href="#storage" data-sec="storage"><i data-lucide="hard-drive"></i><span data-i18n="ps.n.storage"></span></a>
        <div class="sp"></div>
        <a href="#danger" data-sec="danger" class="danger"><i data-lucide="triangle-alert"></i><span data-i18n="ps.n.danger"></span></a>
      </nav>

      <div id="content">

        <!-- General -->
        <section class="sec" id="general" data-sec="general">
          <div class="sec-head"><h2 data-i18n="ps.n.general"></h2><p data-i18n="ps.general.d"></p></div>
          <div class="card">
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.name"></div></div><div class="sctl"><input class="input" id="f-name"></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.client"></div></div><div class="sctl"><input class="input" id="f-client"></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.code"></div><div class="sdesc" data-i18n="ps.g.code.d"></div></div><div class="sctl"><input class="input mono sm" id="f-code" maxlength="6" style="text-transform:uppercase"></div></div>
            <div class="srow stack"><div class="sinfo"><div class="slabel" data-i18n="ps.g.desc"></div><div class="sdesc" data-i18n="ps.g.desc.d"></div></div><textarea class="textarea" id="f-desc" data-i18n-placeholder="ps.g.desc.ph"></textarea></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.dir"></div><div class="sdesc" data-i18n="ps.g.dir.d"></div></div>
              <div class="sctl"><div class="ro"><i data-lucide="lock"></i><span data-bind="dir"></span></div><button class="btn btn-secondary" data-act="move"><i data-lucide="folder-output"></i><span data-i18n="ps.g.move"></span></button></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.g.repo"></div><div class="sdesc" data-i18n="ps.g.repo.d"></div></div>
              <div class="sctl"><div class="ro"><i data-lucide="folder-git-2"></i><span data-bind="repo"></span></div><button class="btn btn-secondary" data-act="repo"><i data-lucide="folder-open"></i><span data-i18n="ps.change"></span></button></div></div>
          </div>
        </section>

        <!-- Workflow -->
        <section class="sec" id="workflow" data-sec="workflow">
          <div class="sec-head"><h2 data-i18n="ps.n.workflow"></h2><p data-i18n="ps.workflow.d"></p></div>
          <div class="card">
            <div class="srow stack" style="padding-bottom:0"><div class="sinfo"><div class="slabel" data-i18n="ps.w.phase"></div><div class="sdesc" data-i18n="ps.w.phase.d"></div></div></div>
            <div class="phases" id="phases"></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.w.method"></div><div class="sdesc" data-i18n="ps.w.method.d"></div></div>
              <div class="sctl"><select class="select sm"><option data-i18n="ps.m.scrum"></option><option data-i18n="ps.m.kanban"></option><option data-i18n="ps.m.hybrid"></option></select></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.w.sprint"></div><div class="sdesc" data-i18n="ps.w.sprint.d"></div></div>
              <div class="sctl"><div class="segmented" id="sprint"><button data-v="1" data-i18n="ps.w.1"></button><button data-v="2" class="is-active" data-i18n="ps.w.2"></button><button data-v="3" data-i18n="ps.w.3"></button><button data-v="4" data-i18n="ps.w.4"></button></div></div></div>
          </div>
          <div class="reg-t" style="margin:var(--space-5) 0 var(--space-2);font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle)" data-i18n="ps.gates"></div>
          <div class="card">
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.gate1"></div><div class="sdesc" data-i18n="ps.gate1.d"></div></div><div class="sctl"><label class="switch"><input type="checkbox" checked></label></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.gate2"></div><div class="sdesc" data-i18n="ps.gate2.d"></div></div><div class="sctl"><label class="switch"><input type="checkbox" checked></label></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ps.gate3"></div><div class="sdesc" data-i18n="ps.gate3.d"></div></div><div class="sctl"><label class="switch"><input type="checkbox" checked></label></div></div>
          </div>
        </section>

        <!-- AI overrides -->
        <section class="sec" id="ai" data-sec="ai">
          <div class="sec-head"><h2 data-i18n="ps.n.ai"></h2><p data-i18n="ps.ai.d"></p></div>
          <div class="card" style="overflow:hidden">
            <div class="opts" id="ai-mode" role="radiogroup">
              <div class="opt is-selected" role="radio" tabindex="0" aria-checked="true" data-v="default"><span class="tick"><i data-lucide="check"></i></span><b data-i18n="ps.ai.use"></b><span class="d" id="ai-default-d"></span></div>
              <div class="opt" role="radio" tabindex="0" aria-checked="false" data-v="override"><span class="tick"><i data-lucide="check"></i></span><b data-i18n="ps.ai.over"></b><span class="d" data-i18n="ps.ai.over.d"></span></div>
            </div>
            <div class="override is-off" id="ai-over">
              <div class="field"><label class="label" data-i18n="ps.ai.cli"></label><select class="select" id="ov-cli"></select></div>
              <div class="field"><label class="label" data-i18n="ps.ai.model"></label><select class="select" id="ov-model"></select></div>
            </div>
          </div>
          <div class="reg-t" style="margin:var(--space-5) 0 var(--space-2);font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle)" data-i18n="ps.prompts"></div>
          <div class="card" style="overflow:hidden">
            <div class="ptabs" id="ptabs"></div>
            <div style="padding:var(--space-4) 20px">
              <textarea class="textarea prompt" id="prompt" spellcheck="false"></textarea>
              <div class="row between" style="margin-top:10px"><span class="text-xs text-subtle" data-i18n-html="ps.prompts.h"></span><button class="btn btn-ghost btn-sm" data-act="reset-prompt"><i data-lucide="rotate-ccw"></i><span data-i18n="ps.reset"></span></button></div>
            </div>
          </div>
        </section>

        <!-- Isolation -->
        <section class="sec" id="isolation" data-sec="isolation">
          <div class="sec-head"><h2 data-i18n="ps.n.isolation"></h2><p data-i18n="ps.iso.d"></p></div>
          <div class="iso-layers">
            <div class="iso-layer"><div class="h"><i data-lucide="key-round"></i><span data-i18n="ps.iso.l1"></span><span class="badge badge-outline" data-i18n="ps.iso.shared"></span></div><p data-i18n-html="ps.iso.l1.d"></p></div>
            <div class="iso-layer"><div class="h"><i data-lucide="folder-lock"></i><span data-i18n="ps.iso.l2"></span><span class="badge badge-success" data-i18n="ps.iso.per"></span></div><p data-i18n-html="ps.iso.l2.d"></p></div>

        const p = P();
        PC.modal({ title: tx('ps.d.remove.t').replace('{n}', PC.esc(p.name.split(' — ')[0])), width: 480, body: `<p class="text-sm text-muted">${tx('ps.d.remove.td').replace('{p}', PC.esc(p.dir))}</p>`,
          actions: [{ label: tx('common.cancel'), kind: 'ghost' }, { label: tx('ps.d.remove.btn'), kind: 'danger', icon: 'list-x', onClick: () => { PC.toast(tx('ps.d.removed'), { icon: 'list-x' }); setTimeout(() => { location.href = 'index.html'; }, 900); } }] });
      }
      function dlgDelete() {
        const p = P();
        const m = PC.modal({ title: tx('ps.d.delete.t'), width: 500,
          body: `<div class="alert alert-danger" style="margin-bottom:12px"><i data-lucide="triangle-alert"></i><div class="text-sm">${tx('ps.d.delete.td').replace('{p}', PC.esc(p.dir)).replace('{id}', PC.esc(p.id))}</div></div><input class="input mono" id="del-in" autocomplete="off" placeholder="${PC.esc(p.id)}">`,
          actions: [{ label: tx('common.cancel'), kind: 'ghost' }, { label: tx('ps.d.delete.confirm'), kind: 'danger', icon: 'trash-2', onClick: ov => { if (ov.querySelector('#del-in').value.trim() !== p.id) return false; PC.toast(tx('ps.d.deleted'), { icon: 'trash-2', tone: 'danger' }); setTimeout(() => { location.href = 'index.html'; }, 900); } }] });
        const btn = m.el.querySelector('.modal-footer .btn-danger'), inp = m.el.querySelector('#del-in');
        btn.disabled = true; inp.addEventListener('input', () => { btn.disabled = inp.value.trim() !== p.id; }); inp.focus();
      }
      function dlgConfirm(title, body, label, icon, fn) {
        PC.modal({ title, width: 460, body: `<p class="text-sm text-muted">${body}</p>`, actions: [{ label: tx('common.cancel'), kind: 'ghost' }, { label, kind: 'danger', icon, onClick: fn }] });
      }

      function wire() {
        document.addEventListener('click', e => {
          const a = e.target.closest('[data-act]'); if (!a) return;
          const act = a.dataset.act, p = P();
          if (act === 'reveal') PC.toast(PC.esc(p.dir), { icon: 'folder-search' });
          else if (act === 'copy') { try { navigator.clipboard.writeText(p.dir); } catch (er) {} PC.toast(tx('ps.copied'), { icon: 'copy' }); }
          else if (act === 'move') dlgMove();
          else if (act === 'repo' || act === 'browse') { PC.toast(tx('ps.repo.picked'), { icon: 'folder-open' }); setDirty(true); }
          else if (act === 'remove') dlgRemove();
          else if (act === 'delete') dlgDelete();
          else if (act === 'reset-prompt') { S.prompts[S.promptTab] = PROMPTS[S.promptTab]; $('prompt').value = PROMPTS[S.promptTab]; PC.toast(tx('ps.prompt.reset')); }
          else if (act === 'reset-home') { const c = D.cli.find(x => x.id === a.dataset.id); dlgConfirm(tx('ps.home.reset.t'), tx('ps.home.reset.d').replace('{p}', PC.esc(PC.projectCli(c.id))), tx('ps.home.reset'), 'rotate-ccw', () => PC.toast(tx('ps.home.done'), { icon: 'rotate-ccw' })); }
          else if (act === 'env-add') { const v = $('env-in').value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, ''); if (v && !S.env.includes(v)) { S.env.push(v); renderEnv(); setDirty(true); } $('env-in').value = ''; }
          else if (act === 'clear-chats') dlgConfirm(tx('ps.st.chat.t'), tx('ps.st.chat.td'), tx('ps.st.chat.clear'), 'trash-2', () => { S.chatsCleared = true; renderStorage(); PC.refresh($('st-tree')); PC.toast(tx('ps.st.chat.done')); });
          else if (act === 'clear-runs') PC.toast(tx('ps.st.runs.done').replace('{n}', $('runs-days').value || 30), { icon: 'eraser' });
          else if (act === 'save') { setDirty(false); PC.toast(tx('ps.saved')); }
          else if (act === 'discard') { fillForm(); setDirty(false); PC.toast(tx('ps.discarded'), { icon: 'undo-2' }); }
        });
        $('content').addEventListener('input', e => { if (e.target.closest('.card')) setDirty(true); if (e.target.id === 'wt-root') bind(); });
        $('content').addEventListener('change', e => { if (e.target.closest('.card')) setDirty(true); });
        $('prompt').addEventListener('input', e => { S.prompts[S.promptTab] = e.target.value; });
        $('ptabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.promptTab = b.dataset.tab; renderPrompts(); PC.refresh($('ptabs')); });
        $('phases').addEventListener('click', e => { const b = e.target.closest('[data-phase]'); if (!b) return; S.phase = b.dataset.phase; renderPhases(); PC.refresh($('phases')); setDirty(true); });
        const pick = (el, fn) => { el.addEventListener('click', e => { const o = e.target.closest('.opt'); if (o && el.contains(o)) fn(o); }); el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('opt')) { e.preventDefault(); fn(e.target); } }); };
        pick($('ai-mode'), o => { S.aiMode = o.dataset.v; renderOverride(); setDirty(true); });
        pick($('fmt'), o => { S.fmt = o.dataset.v; document.querySelectorAll('#fmt .opt').forEach(x => x.classList.toggle('is-selected', x === o)); setDirty(true); });
        $('ov-cli').addEventListener('change', () => { const cli = $('ov-cli').value; $('ov-model').innerHTML = (MODELS[cli] || []).map(m => `<option>${m}</option>`).join(''); });
        $('envchips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; S.env = S.env.filter(v => v !== b.dataset.rm); renderEnv(); setDirty(true); });
        $('env-cli').addEventListener('click', e => { const b = e.target.closest('[data-cli]'); if (!b) return; S.envCli = b.dataset.cli; renderEnv(); });
        $('iso-global').addEventListener('change', e => { S.isoGlobal = e.target.checked; renderEnv(); });
        $('iso-fs').addEventListener('change', e => { S.isoFs = e.target.checked; renderEnv(); });
        $('env-in').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-act="env-add"]').click(); } });
        $('par').addEventListener('input', e => { $('par-v').textContent = e.target.value; });
        $('sprint').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; document.querySelectorAll('#sprint button').forEach(x => x.classList.toggle('is-active', x === b)); setDirty(true); });
        $('branch').addEventListener('input', e => { const v = e.target.value.replace(/&lt;/g, '<').replace(/&gt;/g, '>'); $('branch-ex').textContent = v.replace('<id>', 'LP-142').replace('<slug>', 'merchant-kyc-upload'); });
        $('setnav').addEventListener('click', e => { const a = e.target.closest('a[data-sec]'); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.sec).scrollIntoView({ behavior: 'smooth', block: 'start' }); history.replaceState(null, '', '#' + a.dataset.sec); });
        $('canvas').addEventListener('scroll', spy, { passive: true });
      }

      PC.onReady(() => {
        $('branch').value = 'agent/<id>-<slug>';
        fillForm(); wire(); renderAll(); spy();
        if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el && el.classList.contains('sec')) setTimeout(() => el.scrollIntoView(), 60); }
        PC.assistant.setContext([{ icon: 'sliders-horizontal', label: PC.t('nav.project_settings') }, { icon: 'folder', label: P().dir }]);
      });
      document.addEventListener('pc:lang', renderAll);
    })();
  </script>
</body>
</html>
