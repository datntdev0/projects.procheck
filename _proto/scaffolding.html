<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scaffolding · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ============ Locked phase state (identical block lives in scaffolding.html and board.html) ============
       Flat: page-head + one panel (what the phase does | prerequisites) + previous-phase progress in the panel foot. */
    .lk { max-width: 1280px; margin: 0 auto; padding: var(--space-6) var(--space-8) var(--space-12); }
    .lk .page-head h1 { margin: 6px 0 0; }
    .lk .page-head .meta .badge { height: 20px; }
    .lk-note { margin-bottom: var(--space-4); }
    .lk-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
    @media (max-width: 900px) { .lk-cols { grid-template-columns: minmax(0, 1fr); } .lk-col + .lk-col { border-left: 0 !important; border-top: 1px solid var(--border-default); } }
    .lk-col { min-width: 0; }
    .lk-col + .lk-col { border-left: 1px solid var(--border-default); }
    .lk-col .panel-head { min-height: 40px; border-bottom-color: var(--border-subtle); }
    .lk-col .panel-head h4 { font-size: 13.5px; }
    .lk-does { list-style: none; margin: 0; padding: 0; }
    .lk-does li { display: flex; gap: var(--space-3); padding: 10px var(--space-4); font-size: var(--text-sm); line-height: 1.45; color: var(--fg-default); }
    .lk-does li + li { border-top: 1px solid var(--border-subtle); }
    .lk-does .n { width: 16px; flex-shrink: 0; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-subtle); font-variant-numeric: tabular-nums; padding-top: 1px; }
    .lk-pre { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
    .lk-pre li { display: flex; gap: var(--space-3); align-items: flex-start; padding: 9px var(--space-4); font-size: var(--text-sm); }
    .lk-pre li + li { border-top: 1px solid var(--border-subtle); }
    .lk-pre li > svg, .lk-pre li > .spinner { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }
    .lk-pre .tx { flex: 1; min-width: 0; line-height: 1.35; }
    .lk-pre .tx small { display: block; color: var(--fg-subtle); font-size: var(--text-xs); margin-top: 1px; }
    .lk-pre .st { font-size: var(--text-xs); font-weight: var(--weight-medium); white-space: nowrap; padding-top: 1px; }
    .lk-pre .k-done > svg { color: var(--success-fg); } .lk-pre .k-done .st { color: var(--success-fg); }
    .lk-pre .k-review > svg, .lk-pre .k-wait > svg { color: var(--warning-fg); } .lk-pre .k-review .st, .lk-pre .k-wait .st { color: var(--warning-fg); }
    .lk-pre .k-wip > svg { color: var(--brand-fg); } .lk-pre .k-wip .st, .lk-pre .k-run .st { color: var(--brand-fg); }
    .lk-pre .k-todo > svg, .lk-pre .k-locked > svg { color: var(--fg-faint); } .lk-pre .k-todo .st, .lk-pre .k-locked .st { color: var(--fg-subtle); }
    .lk-foot { display: flex; align-items: center; gap: var(--space-3) var(--space-6); flex-wrap: wrap; padding: 12px var(--space-4); border-top: 1px solid var(--border-default); background: var(--bg-surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
    .lk-foot .cap { font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--fg-subtle); white-space: nowrap; }
    .lk-bar { flex: 1 1 260px; min-width: 0; max-width: 420px; }
    .lk-bar .row { font-size: var(--text-xs); color: var(--fg-muted); }
    .lk-bar .row b { font-variant-numeric: tabular-nums; color: var(--fg-strong); }
    .lk-bar .progress > span { background: var(--_b, var(--brand)); }

    /* ============ Scaffolding page (flat: page-head, notice bar + stat strip, single-level panels divided by rules) ============ */
    .page-head .subtitle { color: var(--fg-muted); font-size: var(--text-sm); margin-top: 4px; max-width: 760px; }
    .page-head h1 { margin: 6px 0 0; }
    .page-head > div:first-child { flex: 1 1 320px; min-width: 0; }
    /* status: one flat notice bar with a tone stripe, then the facts in one stat strip */
    .sc-status { --ft: var(--accent-purple); display: flex; align-items: center; gap: var(--space-3) var(--space-5); flex-wrap: wrap; padding: 12px var(--space-4);
      border: 1px solid var(--border-default); border-left: 3px solid var(--ft); border-radius: var(--radius-lg); background: var(--bg-surface); margin-bottom: var(--space-3); }
    .sc-status.is-done { --ft: var(--success); }
    .sc-status .s-ic { display: inline-flex; color: var(--ft); align-self: flex-start; margin-top: 2px; }
    .sc-status.is-done .s-ic { color: var(--success-fg); }
    .sc-status .s-ic svg { width: 18px; height: 18px; }
    .b-txt { flex: 1 1 320px; min-width: 0; }
    .b-txt h4 { font-size: var(--text-md); margin: 0; }
    .b-txt p { margin: 2px 0 0; font-size: var(--text-sm); color: var(--fg-muted); }
    .b-prog { flex: 0 1 240px; min-width: 160px; display: flex; flex-direction: column; gap: 4px; font-size: var(--text-xs); color: var(--fg-muted); }
    .b-prog .progress > span { background: var(--phase-release); }
    .facts { margin-bottom: var(--space-6); }
    .facts .stat-value { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.35; overflow-wrap: anywhere; }
    @media (max-width: 1100px) { .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } .facts > * { border-left: 0 !important; border-top: 1px solid var(--border-subtle); } }
    .alert b { color: var(--fg-strong); }
    .alert ul { margin: 4px 0 0; padding-left: 18px; color: var(--fg-muted); font-size: var(--text-xs); }
    .section-title .sub { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; }

    /* technical solution: one panel, ruled rows */
    .sol-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 1000px) { .sol-rows { grid-template-columns: minmax(0, 1fr); } }
    .sol-item { display: flex; align-items: center; gap: 10px; padding: 9px var(--space-4); color: var(--fg-default); text-decoration: none !important; min-width: 0; border-top: 1px solid var(--border-subtle); }
    .sol-rows .sol-item:nth-child(-n+2) { border-top: 0; }
    .sol-rows .sol-item:nth-child(even) { border-left: 1px solid var(--border-subtle); }
    @media (max-width: 1000px) { .sol-rows .sol-item:nth-child(2) { border-top: 1px solid var(--border-subtle); } .sol-rows .sol-item:nth-child(even) { border-left: 0; } }
    .sol-item:hover { background: var(--bg-hover); }
    .sol-item > svg { color: var(--fg-subtle); width: 16px; height: 16px; flex-shrink: 0; }
    .sol-item b { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); display: block; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adr-wait { display: flex; gap: var(--space-3) var(--space-4); align-items: flex-start; flex-wrap: wrap; padding: 12px var(--space-4); border-top: 1px solid var(--border-default); box-shadow: inset 3px 0 0 var(--warning); }
    .adr-wait > svg { color: var(--warning-fg); width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
    .adr-wait .tx { flex: 1 1 320px; min-width: 0; }
    .adr-wait .tx b { font-size: var(--text-sm); color: var(--fg-strong); }
    .adr-wait .tx small { font-size: var(--text-xs); color: var(--fg-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .adr-wait .tx small svg { width: 12px; height: 12px; color: var(--warning-fg); }
    .adr-opts { list-style: none; display: flex; flex-direction: column; gap: 2px; margin: 6px 0 0; padding: 0; font-size: var(--text-xs); color: var(--fg-muted); }
    .adr-opts li { display: flex; align-items: center; gap: 6px; }
    .adr-opts svg { width: 12px; height: 12px; color: var(--fg-subtle); }
    .sol-in { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; padding: 8px var(--space-4); border-top: 1px solid var(--border-default); background: var(--bg-surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); font-size: var(--text-xs); color: var(--fg-subtle); }

    .repo-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: var(--space-4); margin-bottom: var(--space-6); }
    @media (max-width: 1180px) { .repo-grid { grid-template-columns: minmax(0, 1fr); } }
    #repoCard { display: flex; flex-direction: column; }
    #repoCard .card-footer { margin-top: auto; justify-content: flex-start; flex-wrap: wrap; }
    .repo-head { display: flex; gap: var(--space-3); align-items: flex-start; }
    .repo-head > svg { color: var(--fg-subtle); width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
    .pathbox { display: flex; align-items: center; gap: var(--space-2); color: var(--fg-subtle); max-width: 100%; margin-top: 6px; }
    .pathbox code { font-size: 12px; color: var(--fg-default); background: none; padding: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pathbox .btn { --_h: 22px; height: 22px; width: 22px; }
    .repo-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: var(--space-4) calc(-1 * var(--space-4)) calc(-1 * var(--space-4)); border-top: 1px solid var(--border-subtle); }
    .repo-kv > div { min-width: 0; padding: 10px var(--space-4); }
    .repo-kv > div:nth-child(even) { border-left: 1px solid var(--border-subtle); }
    .repo-kv > div:nth-child(n+3) { border-top: 1px solid var(--border-subtle); }
    .repo-kv dt { font-size: var(--text-xs); color: var(--fg-subtle); font-weight: var(--weight-medium); margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .repo-kv dd { margin: 0; font-size: var(--text-sm); color: var(--fg-default); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
    .repo-kv dd code { font-size: 12px; }
    .sha { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); }
    .stack-list .row-item { padding: 8px var(--space-4); }
    .stack-list .row-item > svg { color: var(--fg-subtle); width: 15px; height: 15px; flex-shrink: 0; }
    .stack-list b { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .stack-list small { margin-left: auto; font-size: var(--text-xs); color: var(--fg-subtle); white-space: nowrap; }
    .stack-hint { padding: 8px var(--space-4); border-top: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-subtle); margin: 0; }

    /* brownfield analysis */
    .an { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1.25fr); }
    @media (max-width: 1180px) { .an { grid-template-columns: minmax(0, 1fr); } .an > div + div { border-left: 0 !important; border-top: 1px solid var(--border-subtle); } }
    .an > div { padding: var(--space-4) var(--space-5); min-width: 0; }
    .an > div + div { border-left: 1px solid var(--border-subtle); }
    .an h5 { display: flex; align-items: center; gap: 6px; margin-bottom: var(--space-3); }
    .an-mod { display: grid; grid-template-columns: minmax(0, 1fr) 90px 34px; gap: 10px; align-items: center; padding: 6px 0; font-size: var(--text-sm); }
    .an-mod b { font-weight: var(--weight-semibold); color: var(--fg-strong); display: block; line-height: 1.2; font-family: var(--font-mono); font-size: 12px; }
    .an-mod small { font-size: var(--text-2xs); color: var(--fg-subtle); }
    .an-mod .pct { font-size: var(--text-xs); font-variant-numeric: tabular-nums; text-align: right; font-weight: var(--weight-semibold); }
    .cov-big { display: flex; align-items: baseline; gap: 6px; margin-bottom: var(--space-3); }
    .cov-big b { font-size: var(--text-3xl); font-weight: var(--weight-semibold); color: var(--fg-strong); letter-spacing: -.02em; }
    .cov-leg { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-xs); color: var(--fg-muted); margin-top: var(--space-3); }
    .gap-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: var(--text-sm); border-bottom: 1px solid var(--border-subtle); line-height: 1.35; }
    .gap-row:last-child { border-bottom: 0; }
    .gap-row > svg { margin-top: 2px; color: var(--warning); }
    .gap-row small { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .gap-row small svg { width: 12px; height: 12px; }
    .gap-row.is-fixed > svg { color: var(--success); }

    /* steps + run: one panel; steps are ruled rows, the run pane sits beside them */
    .gen { display: grid; grid-template-columns: 340px minmax(0, 1fr); }
    @media (max-width: 1100px) { .gen { grid-template-columns: minmax(0, 1fr); } .steps { border-right: 0 !important; border-bottom: 1px solid var(--border-default); } }
    .steps { border-right: 1px solid var(--border-default); display: flex; flex-direction: column; }
    .gstep { display: flex; gap: 10px; padding: 10px var(--space-4); align-items: flex-start; }
    .gstep + .gstep { border-top: 1px solid var(--border-subtle); }
    .gstep.is-running { background: var(--bg-active); box-shadow: inset 3px 0 0 var(--brand); }
    .gstep.is-blocked { box-shadow: inset 3px 0 0 var(--warning); }
    .gstep .si { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--fg-faint); margin-top: 1px; }
    .gstep .si svg { width: 16px; height: 16px; }
    .gstep .si .spinner { width: 14px; height: 14px; }
    .gstep.is-done .si { color: var(--success-fg); }
    .gstep.is-blocked .si { color: var(--warning-fg); }
    .gstep b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); display: block; line-height: 1.3; }
    .gstep.is-pending b { font-weight: var(--weight-medium); color: var(--fg-default); }
    .gstep small { font-size: var(--text-xs); color: var(--fg-subtle); display: block; margin-top: 1px; line-height: 1.4; }
    .gstep .why { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: var(--text-xs); color: var(--warning-fg); font-weight: var(--weight-medium); }
    .gstep .why svg { width: 12px; height: 12px; }
    .gstep .meta { margin-left: auto; font-size: var(--text-xs); color: var(--fg-subtle); white-space: nowrap; padding-top: 1px; }
    .gstep.is-done .meta { color: var(--success-fg); } .gstep.is-running .meta { color: var(--brand-fg); font-weight: var(--weight-semibold); } .gstep.is-blocked .meta { color: var(--warning-fg); font-weight: var(--weight-medium); }
    .run-pane { display: flex; flex-direction: column; min-width: 0; padding: var(--space-4); gap: var(--space-3); }
    .run-cfg { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .run-term { height: 330px; white-space: pre-wrap; word-break: break-word; }
    .run-term .t-line { display: block; }
    .caret::after { content: "▍"; color: var(--kms-sky); animation: blink 1s steps(2) infinite; margin-left: 2px; }
    .gen-progress { display: flex; align-items: center; gap: var(--space-3); }
    .gen-progress .progress { flex: 1; }
    .gen-progress b { font-variant-numeric: tabular-nums; font-size: var(--text-sm); min-width: 40px; text-align: right; }
    .ag-ic { width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: var(--fg-on-brand); display: inline-flex; align-items: center; justify-content: center; font-size: 8px; font-weight: var(--weight-semibold); }
    .struct-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 0 var(--space-4); min-height: 40px; border-bottom: 1px solid var(--border-subtle); }
    .tree-code { font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre; padding: var(--space-4); margin: 0; overflow: auto; max-height: 440px; color: var(--fg-default); background: var(--code-bg); flex: 1; border-radius: 0 0 var(--radius-lg) 0; }
    .tree-code .d { color: var(--brand-fg); } .tree-code .c { color: var(--fg-faint); }

    /* gate: one panel, checklist rows | CTA column */
    .gate { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    @media (max-width: 1180px) { .gate { grid-template-columns: minmax(0, 1fr); } }
    .gate-list { display: flex; flex-direction: column; }
    .gk { display: flex; gap: 10px; align-items: flex-start; padding: 9px var(--space-4); font-size: var(--text-sm); }
    .gk + .gk { border-top: 1px solid var(--border-subtle); }
    .gk > svg, .gk > .spinner { margin-top: 1px; width: 16px; height: 16px; flex-shrink: 0; }
    .gk .tx { flex: 1; min-width: 0; line-height: 1.4; }
    .gk small { display: block; font-size: var(--text-xs); color: var(--fg-subtle); }
    .gk.ok > svg { color: var(--success-fg); } .gk.fail > svg { color: var(--fg-faint); } .gk.wip > svg { color: var(--brand-fg); } .gk.wait > svg { color: var(--warning-fg); }
    .gate-cta { padding: var(--space-4); border-left: 1px solid var(--border-default); background: var(--bg-surface-2); display: flex; flex-direction: column; gap: var(--space-3); justify-content: center; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
    @media (max-width: 1180px) { .gate-cta { border-left: 0; border-top: 1px solid var(--border-default); border-radius: 0 0 var(--radius-lg) var(--radius-lg); } }
    .gate-cta .btn { width: 100%; white-space: normal; height: auto; min-height: 36px; padding: 8px 16px; text-align: center; line-height: 1.3; }
    .gate-in { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-xs); color: var(--fg-muted); padding-top: var(--space-3); border-top: 1px solid var(--border-subtle); }
    .gate-in .cap { font-weight: var(--weight-medium); color: var(--fg-subtle); }
    .gate-in span { display: inline-flex; align-items: center; gap: 6px; }
    .gate-in svg { width: 13px; height: 13px; color: var(--fg-subtle); }

    #wtBody td, .table-wrap th { padding-left: var(--space-3); padding-right: var(--space-3); }
    .wt-path { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }
    .cm-msg { font-family: var(--font-mono); font-size: 12px; color: var(--fg-default); }
    .modal textarea.textarea { min-height: 96px; }
  </style>
</head>

    function render() {

      setAssistant();

    function setAssistant() {
      const vi = PC.lang === 'vi';
      if (STATUS === 'locked') { PC.assistant.setContext([{ icon: 'lock', label: vi ? 'Scaffolding đã khoá' : 'Scaffolding locked' }, { icon: 'compass', label: vi ? 'Cần SOW đã ký' : 'Needs signed SOW' }]);
        PC.assistant.setSuggestions(vi ? ['Còn thiếu gì để mở khoá?', 'Tóm tắt giai đoạn Khởi tạo'] : ['What is missing to unlock this?', 'Summarize Initial phase']); }
      else if (STATUS === 'in_progress') { PC.assistant.setContext([{ icon: 'blocks', label: vi ? 'Scaffolding · bước 4/6' : 'Scaffolding · step 4 of 6' }, { icon: 'folder-search', label: vi ? 'Repo có sẵn' : 'Existing repo' }, { icon: 'shield-question', label: 'ADR-004' }]);
        PC.assistant.setSuggestions(vi ? ['So sánh Service Bus và Kafka', 'Agent đang làm gì?', 'Rủi ro khi giữ nguyên mã hiện có?'] : ['Compare Service Bus and Kafka', 'What is the agent doing?', 'Risks of keeping existing code?']); }
      else { PC.assistant.setContext([{ icon: 'blocks', label: vi ? 'Scaffolding hoàn tất' : 'Scaffolding complete' }, { icon: 'git-branch', label: CFG.branch }]);
        PC.assistant.setSuggestions(vi ? ['Tóm tắt các commit scaffolding', 'Mở bảng SDLC'] : ['Summarize scaffolding commits', 'Open the SDLC board']); }
    }

    /* ===================================================== events */
    document.addEventListener('click', e => {
      const a = e.target.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act;
      if (act === 'terminal') PC.toast(t('sc.t.terminal', { p: '<span class="mono">' + esc(repoPath()) + '</span>' }), { icon: 'terminal' });
      else if (act === 'vscode') PC.toast(t('sc.t.vscode', { p: '<span class="mono">' + esc(repoPath()) + '</span>' }), { icon: 'code' });
      else if (act === 'explorer') PC.toast(t('sc.t.explorer'), { icon: 'folder-open' });
      else if (act === 'copy') { try { navigator.clipboard.writeText(repoPath()); } catch (err) {} PC.toast(t('sc.t.copied'), { icon: 'copy' }); }
      else if (act === 'change') PC.toast(t('sc.t.change'), { icon: 'info', tone: 'warning' });
      else if (act === 'stop') { S.paused = !S.paused; PC.toast(t(S.paused ? 'sc.t.stopped' : 'sc.t.resumed'), { icon: S.paused ? 'square' : 'play' }); render(); }
      else if (act === 'adr-approve') { const x = S.adr.find(i => i.id === a.dataset.id); x.status = 'approved'; PC.toast(t('sc.adr.t.approved', { id: '<b>' + x.id.toUpperCase() + '</b>' }), { tone: 'success', icon: 'shield-check' }); render(); }
      else if (act === 'adr-changes') {
        const x = S.adr.find(i => i.id === a.dataset.id);
        PC.modal({ title: t('sc.adr.m.title', { id: x.id.toUpperCase() }), width: 520, body: `<textarea class="textarea" id="adrNote" placeholder="${esc(t('sc.adr.m.ph'))}"></textarea>`,
          actions: [{ label: t('common.cancel'), kind: 'secondary' }, { label: t('sc.adr.m.send'), kind: 'primary', icon: 'send', onClick: () => { x.status = 'changes_requested'; PC.toast(t('sc.adr.t.changes', { id: '<b>' + x.id.toUpperCase() + '</b>' }), { icon: 'message-square-diff' }); render(); } }] });
      }
    });
    PC.onReady(() => { render(); setInterval(tickRun, 1400); });
    document.addEventListener('pc:lang', render);
  </script>
</body>
</html>
