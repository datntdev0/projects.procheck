<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App settings · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ===== App settings — page-only styles, tokens only (enterprise, flat) ===== */
    .canvas { container-type: inline-size; scroll-behavior: smooth; }
    code { font-size: .92em; background: var(--code-bg); padding: 1px 5px; border-radius: var(--radius-xs); border: 1px solid var(--border-subtle); }
    .page-head, .set-wrap { max-width: 1120px; margin-left: auto; margin-right: auto; }
    .page-head .meta code { font-size: 12px; color: var(--fg-default); }
    .page-head .meta a { font-weight: var(--weight-medium); }

    /* ---------- Layout: flat sub-nav + one panel per settings group ---------- */
    .set-wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--space-8); align-items: start; }
    .set-nav { position: sticky; top: var(--space-4); }
    .set-nav .grp + .grp { margin-top: var(--space-4); }
    .set-nav .grp-t { padding: 4px 10px; font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); }
    .set-nav a { position: relative; display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 5px 10px; line-height: 1.35; border-radius: var(--radius-sm); color: var(--fg-muted); font-size: var(--text-sm); text-decoration: none !important; }
    .set-nav a svg { width: 15px; height: 15px; color: var(--fg-subtle); }
    .set-nav a:hover { background: var(--bg-hover); color: var(--fg-default); }
    .set-nav a.is-active { background: var(--bg-active); color: var(--fg-strong); font-weight: var(--weight-medium); }
    .set-nav a.is-active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--brand); }
    .set-nav a.is-active svg { color: var(--brand-fg); }
    .sec { scroll-margin-top: var(--space-4); margin-bottom: var(--space-6); }
    .sec > .card { overflow: hidden; }
    .sec-t { min-width: 0; }
    .sec-t h2 { font-size: 13.5px; font-weight: var(--weight-semibold); line-height: 1.4; letter-spacing: 0; }
    .sec-t p { margin: 1px 0 0; color: var(--fg-subtle); font-size: var(--text-xs); line-height: 1.5; max-width: 680px; }
    .sec .panel-head { padding-top: 10px; padding-bottom: 10px; align-items: center; }

    /* Setting row: label + hint left, control right, ruled */
    .srow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding: 10px var(--space-4); }
    .srow + .srow { border-top: 1px solid var(--border-subtle); }
    .sinfo { min-width: 0; }
    .slabel { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); }
    .sdesc { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 2px; max-width: 520px; line-height: 1.5; }
    .sctl { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
    .sctl .input, .sctl .select { width: 280px; }
    .sctl .select.sm { width: 200px; }
    .note-row { display: flex; align-items: flex-start; gap: var(--space-2); padding: 9px var(--space-4); background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.55; }
    .note-row svg { margin-top: 1px; color: var(--fg-subtle); }

    /* ---------- Storage: one panel, two columns divided by a rule ---------- */
    .bound { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .zone { display: flex; flex-direction: column; min-width: 0; }
    .zone + .zone { border-left: 1px solid var(--border-default); }
    .zone-head { padding: 12px var(--space-4) 10px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--border-subtle); }
    .zone-top { display: flex; align-items: center; gap: var(--space-2); }
    .zone-top svg { color: var(--fg-subtle); }
    .zone-top h3 { font-size: var(--text-sm); font-weight: var(--weight-semibold); }
    .zone-top .badge { margin-left: auto; flex-shrink: 0; }
    .zone-cap { font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-faint); }
    .zone-root { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-strong); min-width: 0; }
    .zone-root .sz { margin-left: auto; color: var(--fg-subtle); font-family: var(--font-sans); font-size: 11px; white-space: nowrap; }
    .ztree { margin: 8px var(--space-4) 10px 22px; border-left: 1px solid var(--border-strong); }
    .znode { position: relative; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; padding: 6px 8px 6px 18px; }
    .znode::before { content: ""; position: absolute; left: 0; top: 15px; width: 10px; border-top: 1px solid var(--border-strong); }
    .znode > svg { width: 14px; height: 14px; color: var(--fg-subtle); margin-top: 1px; }
    .znode .zp { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-default); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .znode .zd { grid-column: 2; font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.45; }
    .znode .zs { font-size: 11px; color: var(--fg-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .znode:hover { background: var(--bg-hover); }
    .zone-foot { margin-top: auto; display: flex; align-items: flex-start; gap: var(--space-2); padding: 9px var(--space-4); border-top: 1px solid var(--border-subtle); background: var(--bg-surface-2); font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.5; }
    .zone-foot svg { margin-top: 1px; color: var(--fg-subtle); }

    /* ---------- Projects registry: table directly in the panel ---------- */
    .sec .table th:first-child, .sec .table td:first-child { padding-left: var(--space-4); }
    .sec .table th:last-child, .sec .table td:last-child { padding-right: var(--space-3); }
    .tbl-proj { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .tbl-proj .project-avatar { width: 24px; height: 24px; border-radius: var(--radius-sm); font-size: 10px; }
    .tbl-dir { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); }
    .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .table td { white-space: nowrap; } .table td:first-child { white-space: normal; } .tbl-dir { white-space: normal; word-break: break-all; }
    .row-acts { display: flex; justify-content: flex-end; gap: 2px; }
    .reg-foot { display: flex; align-items: center; gap: var(--space-2); padding: 9px var(--space-4); font-size: var(--text-xs); color: var(--fg-subtle); border-top: 1px solid var(--border-subtle); background: var(--bg-surface-2); }

    .segmented button svg { width: 13px; height: 13px; }

    /* ---------- CLI tools: one ruled section per CLI, properties as label/value rows ---------- */
    .cli-card + .cli-card { border-top: 1px solid var(--border-default); }
    .cli-head { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; padding: 12px var(--space-4) 8px; }
    .cli-head > svg { color: var(--fg-muted); }
    .cname { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .cli-stat { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-subtle); }
    .cli-kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); margin: 0 var(--space-4) 12px 44px; font-size: var(--text-sm); }
    .cli-kv > dt, .cli-kv > dd { margin: 0; padding: 7px 0; border-top: 1px solid var(--border-subtle); min-width: 0; }
    .cli-kv > dt { color: var(--fg-subtle); font-size: var(--text-xs); display: flex; align-items: flex-start; padding-top: 10px; }
    .cli-kv > dd .select { margin: -2px 0; }
    .cli-kv > dd { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .cli-kv .path { font-family: var(--font-mono); font-size: 12px; color: var(--fg-default); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
    .cli-kv .select { width: 240px; }
    .cli-hint { flex-basis: 100%; font-size: var(--text-xs); color: var(--fg-subtle); line-height: 1.5; }
    .cli-add { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 10px var(--space-4); background: var(--bg-surface-2); border-top: 1px solid var(--border-default); line-height: 1.55; }
    input[type="range"] { accent-color: var(--brand); width: 180px; }
    .range-val { min-width: 24px; text-align: right; font-weight: var(--weight-semibold); color: var(--fg-strong); font-variant-numeric: tabular-nums; }

    /* ---------- Integrations: rows with plain glyphs ---------- */
    .int-row { display: flex; align-items: center; gap: var(--space-3); padding: 10px var(--space-4); }
    .int-row + .int-row { border-top: 1px solid var(--border-subtle); }
    .int-row > svg { color: var(--fg-muted); }

    /* ---------- Cache ---------- */
    .cache-bar { display: flex; height: 6px; border-radius: var(--radius-xs); overflow: hidden; background: var(--bg-surface-3); gap: 2px; }
    .cache-bar i { display: block; height: 100%; }
    .cache-legend { display: flex; gap: var(--space-5); flex-wrap: wrap; margin-top: 8px; font-size: var(--text-xs); color: var(--fg-muted); }
    .cache-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .cache-legend .dot { border-radius: 2px; }
    .cache-legend b { color: var(--fg-default); font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }

    /* ---------- About ---------- */
    .logo-dark { display: none; }
    :root[data-theme="dark"] .logo-light { display: none; }
    :root[data-theme="dark"] .logo-dark { display: block; }
    .about-id { display: flex; align-items: center; gap: var(--space-3); padding: 12px var(--space-4); border-bottom: 1px solid var(--border-subtle); }
    .about-id .mark { width: 32px; height: 32px; flex-shrink: 0; }
    .about-id b { font-size: var(--text-md); color: var(--fg-strong); font-weight: var(--weight-semibold); }
    .about-kv { padding: 12px var(--space-4); }
    .about-kv dd { overflow-wrap: anywhere; }
    .brand-foot { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; padding: 9px var(--space-4); background: var(--bg-surface-2); border-top: 1px solid var(--border-subtle); }
    .brand-foot img { height: 18px; width: auto; }

    /* ---------- Save bar (floating layer) ---------- */
    .savebar { position: sticky; bottom: 16px; z-index: 15; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: var(--space-3); padding: 8px 10px 8px 14px; border-radius: var(--radius-md); background: var(--bg-inverse); color: var(--fg-inverse); box-shadow: var(--shadow-lg); font-size: var(--text-sm); transform: translateY(0); transition: opacity var(--dur-base), transform var(--dur-base) var(--ease-out); }
    .savebar.is-off { opacity: 0; transform: translateY(12px); pointer-events: none; }
    .savebar .grow { display: flex; align-items: center; gap: 8px; }
    .savebar .btn-ghost { color: var(--fg-inverse); opacity: .8; } .savebar .btn-ghost:hover { background: rgba(127,127,127,.2); opacity: 1; }

    @container (max-width: 980px) {
      .bound { grid-template-columns: minmax(0, 1fr); }
      .zone + .zone { border-left: 0; border-top: 1px solid var(--border-default); }
      .cli-kv { grid-template-columns: minmax(0, 1fr); margin-left: var(--space-4); }
      .cli-kv > dd { border-top: 0; padding-top: 0; }
    }
    @container (max-width: 860px) {
      .set-wrap { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
      .set-nav { position: static; display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--border-default); padding-bottom: var(--space-2); }
      .set-nav .grp { display: contents; } .set-nav .grp-t { display: none; }
      .set-nav a { white-space: nowrap; }
      .set-nav a.is-active::before { display: none; }
      .srow { flex-direction: column; align-items: stretch; gap: var(--space-2); }
      .sctl { flex-wrap: wrap; } .sctl .input, .sctl .select, .sctl .select.sm { width: 100%; }
      .int-row { flex-wrap: wrap; }
      .tbl-hide { display: none; }
    }
  </style>
</head>
<body data-page="settings" data-shell="home" data-crumb="nav.app_settings" data-assistant="closed">
  <main class="canvas" id="canvas"><div class="canvas-inner">

    <!-- ============ Page head ============ -->
    <header class="page-head">
      <div style="min-width:0">
        <h1 data-i18n="nav.app_settings"></h1>
        <div class="meta">
          <span><i data-lucide="file-json"></i><span data-i18n="ap.stored"></span><code>%LOCALAPPDATA%\Procheck\settings.json</code><span data-i18n="ap.applies"></span></span>
          <span><i data-lucide="folder-kanban"></i><span data-i18n="ap.looking"></span><a href="project-settings.html"><span data-i18n="ap.looking.link"></span></a></span>
        </div>
      </div>
      <div class="actions"><button class="btn btn-secondary" data-act="open-app-folder"><i data-lucide="folder-open"></i><span data-i18n="ap.openfolder"></span></button></div>
    </header>

    <div class="set-wrap">

      <!-- ============ In-page navigation ============ -->
      <nav class="set-nav" aria-label="App settings" id="setnav">
        <div class="grp"><div class="grp-t" data-i18n="ap.g.pref"></div>
          <a href="#about" data-sec="about"><i data-lucide="info"></i><span data-i18n="ap.n.about"></span></a>
          <a href="#general" data-sec="general"><i data-lucide="sliders-horizontal"></i><span data-i18n="ap.n.general"></span></a>
          <a href="#logs" data-sec="logs"><i data-lucide="scroll-text"></i><span data-i18n="ap.n.logs"></span></a></div>
        <div class="grp"><div class="grp-t" data-i18n="ap.g.data"></div>
          <a href="#storage" data-sec="storage"><i data-lucide="hard-drive"></i><span data-i18n="ap.n.storage"></span></a>
          <a href="#projects" data-sec="projects"><i data-lucide="folder-kanban"></i><span data-i18n="ap.n.projects"></span></a></div>
        <div class="grp"><div class="grp-t" data-i18n="ap.g.ai"></div>
          <a href="#ai" data-sec="ai"><i data-lucide="terminal-square"></i><span data-i18n="ap.n.ai"></span></a>
          <a href="#assistant" data-sec="assistant"><i data-lucide="sparkles"></i><span data-i18n="ap.n.assistant"></span></a>
          <a href="#harness" data-sec="harness"><i data-lucide="bot"></i><span data-i18n="ap.n.harness"></span></a></div>
        <div class="grp"><div class="grp-t" data-i18n="ap.g.sys"></div>
          <a href="#integrations" data-sec="integrations"><i data-lucide="plug-zap"></i><span data-i18n="ap.n.integrations"></span></a>
          <a href="#cache" data-sec="cache"><i data-lucide="database-zap"></i><span data-i18n="ap.n.cache"></span></a></div>
      </nav>

      <div id="content">

        <!-- ============ About ============ -->
        <section class="sec" id="about" data-sec="about">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ap.n.about"></h2></div>
              <button class="btn btn-secondary btn-sm" data-act="check-update"><i data-lucide="refresh-cw"></i><span data-i18n="ap.about.check"></span></button></div>
            <div class="about-id">
              <img class="mark" src="assets/kms-mark.svg" alt="">
              <div class="grow"><b>Procheck</b><div class="text-xs text-subtle" data-i18n="ap.about.tag"></div></div>
            </div>
            <dl class="kv about-kv">
              <dt data-i18n="ap.about.ver"></dt><dd>0.1.0 (prototype) · build 2026.11.23</dd>
              <dt data-i18n="ap.about.settings"></dt><dd><code>%LOCALAPPDATA%\Procheck\settings.json</code></dd>
              <dt data-i18n="ap.about.registry"></dt><dd><code>%LOCALAPPDATA%\Procheck\projects.json</code></dd>
              <dt data-i18n="ap.about.runtime"></dt><dd>Tauri 2 · Angular 20 (planned)</dd>
            </dl>
            <div class="brand-foot"><img class="logo-light" src="assets/kms-logo.svg" alt="KMS Technology"><img class="logo-dark" src="assets/kms-logo-white.svg" alt="KMS Technology"><span class="text-xs text-subtle" data-i18n="ap.about.foot"></span></div>
          </div>
        </section>

        <!-- ============ General ============ -->
        <section class="sec" id="general" data-sec="general">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ap.n.general"></h2><p data-i18n="ap.general.d"></p></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ap.gen.parent"></div><div class="sdesc" data-i18n="ap.gen.parent.d"></div></div>
              <div class="sctl"><input class="input mono" value="D:\Projects"><button class="btn btn-secondary" data-act="browse"><i data-lucide="folder-open"></i><span data-i18n="ap.browse"></span></button></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ap.gen.startup"></div><div class="sdesc" data-i18n="ap.gen.startup.d"></div></div>
              <div class="sctl"><select class="select sm"><option data-i18n="ap.gen.startup.last"></option><option data-i18n="ap.gen.startup.all"></option></select></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="shell.theme"></div><div class="sdesc" data-i18n="ap.theme.d"></div></div>
              <div class="sctl"><div class="segmented">
                <button data-theme-set="system"><i data-lucide="monitor"></i><span data-i18n="theme.system"></span></button>
                <button data-theme-set="light"><i data-lucide="sun"></i><span data-i18n="theme.light"></span></button>
                <button data-theme-set="dark"><i data-lucide="moon"></i><span data-i18n="theme.dark"></span></button></div></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="shell.lang"></div><div class="sdesc" data-i18n="ap.lang.d"></div></div>
              <div class="sctl"><div class="segmented">
                <button data-lang-set="en">English</button><button data-lang-set="vi">Tiếng Việt</button></div></div></div>
          </div>
        </section>

        <!-- ============ Diagnostics ============ -->
        <section class="sec" id="logs" data-sec="logs">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ap.n.logs"></h2><p data-i18n="ap.logs.d"></p></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ap.log.level"></div><div class="sdesc" data-i18n="ap.log.level.d"></div></div>
              <div class="sctl"><select class="select sm"><option>error</option><option>warn</option><option selected>info</option><option>debug</option></select></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ap.log.ret"></div><div class="sdesc" data-i18n="ap.log.ret.d"></div></div>
              <div class="sctl"><select class="select sm"><option data-i18n="ap.d.7"></option><option selected data-i18n="ap.d.14"></option><option data-i18n="ap.d.30"></option></select></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ap.log.folder"></div><div class="sdesc"><code>%LOCALAPPDATA%\Procheck\logs\</code> · 18 MB</div></div>
              <div class="sctl"><button class="btn btn-secondary btn-sm" data-act="open-logs"><i data-lucide="folder-open"></i><span data-i18n="ap.log.open"></span></button></div></div>
            <div class="srow"><div class="sinfo"><div class="slabel" data-i18n="ap.log.export"></div><div class="sdesc" data-i18n="ap.log.export.d"></div></div>
              <div class="sctl"><button class="btn btn-secondary btn-sm" data-act="export-diag"><i data-lucide="package-open"></i><span data-i18n="ap.log.export.btn"></span></button></div></div>
          </div>
        </section>

        <!-- ============ Storage (data directory structure) ============ -->
        <section class="sec" id="storage" data-sec="storage">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ap.n.storage"></h2><p data-i18n="ap.storage.d"></p></div></div>
            <div class="bound" id="bound"></div>
          </div>
        </section>

        <!-- ============ Projects (registry) ============ -->
        <section class="sec" id="projects" data-sec="projects">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ap.n.projects"></h2><p data-i18n-html="ap.projects.d"></p></div>
              <button class="btn btn-secondary btn-sm" data-act="add-existing"><i data-lucide="folder-plus"></i><span data-i18n="ap.reg.add"></span></button></div>
            <table class="table">
              <thead><tr><th data-i18n="ap.reg.c.name"></th><th class="tbl-hide" data-i18n="ap.reg.c.dir"></th><th class="num" data-i18n="ap.reg.c.size"></th><th class="tbl-hide" data-i18n="ap.reg.c.last"></th><th></th></tr></thead>
              <tbody id="reg-body"></tbody>
            </table>
            <div class="reg-foot"><i data-lucide="info" class="icon-sm"></i><span data-i18n-html="ap.reg.note"></span></div>
          </div>
        </section>

        <!-- ============ AI & CLI tools ============ -->
        <section class="sec" id="ai" data-sec="ai">
          <div class="card">
            <div class="panel-head"><div class="sec-t"><h2 data-i18n="ap.n.ai"></h2><p data-i18n="ap.ai.d"></p></div>
              <button class="btn btn-secondary btn-sm" data-act="add-cli"><i data-lucide="plus"></i><span data-i18n="ap.ai.add"></span></button></div>
            <div id="clis"></div>
            <div class="cli-add"><span class="text-xs text-subtle" data-i18n-html="ap.ai.note"></span></div>
          </div>
        </section>

        <!-- ============ Assistant defaults ============ -->

        'ap.assistant.d': 'Giá trị khởi đầu của Trợ lý trong mọi dự án.', 'ap.as.mode': 'Chế độ mặc định', 'ap.as.mode.d': 'Chế độ khi bắt đầu một cuộc chat mới.',

        'ap.cache.idx': 'Chỉ mục tài liệu', 'ap.cache.thumb': 'Ảnh thu nhỏ', 'ap.cache.tmp': 'Tệp tạm',
        'ap.cache.note': 'Xoá bộ nhớ đệm không ảnh hưởng dữ liệu dự án. Chỉ mục sẽ được dựng lại ở lần mở dự án kế tiếp.',
        'ap.cache.t': 'Xoá bộ nhớ đệm?', 'ap.cache.td': 'Xoá 248 MB trong <code>%LOCALAPPDATA%\\Procheck\\cache\\</code>. Dự án, chat và tài liệu của bạn không bị ảnh hưởng.', 'ap.cache.cleared': 'Đã xoá bộ nhớ đệm',
        'ap.about.tag': 'Triển khai phần mềm với AI, từ khảo sát đến pull request.', 'ap.about.check': 'Kiểm tra cập nhật', 'ap.about.upto': 'Bạn đang dùng bản mới nhất',
        'ap.about.ver': 'Phiên bản', 'ap.about.settings': 'Tệp cài đặt ứng dụng', 'ap.about.registry': 'Danh sách dự án', 'ap.about.runtime': 'Nền tảng', 'ap.about.foot': 'Procheck là sản phẩm của KMS Technology.',
        'ap.act.folder': 'Đã mở %LOCALAPPDATA%\\Procheck trong Explorer', 'ap.act.logs': 'Đã mở thư mục log', 'ap.act.picked': 'Đã chọn thư mục', 'ap.act.add': 'Chọn thư mục có chứa procheck.json',
        'ap.today': 'Hôm nay'
      }
    });

    (function () {
      const D = PC.data;
      const $ = id => document.getElementById(id);
      const SIZES = { 'lotus-pay': '412 MB', 'mekong': '186 MB', 'viethealth': '38 MB', 'saigon-tms': '9 MB', 'atlas-hr': '1.2 GB' };
      const UPD_VI = { '12 min ago': '12 phút trước', '2 h ago': '2 giờ trước', 'Yesterday': 'Hôm qua', '3 days ago': '3 ngày trước', 'Last week': 'Tuần trước' };
      const APP_SIZES = ['4 KB', '2 KB', '3.1 MB', '9 MB', '0 KB', '18 MB', '248 MB'];
      const PROJ_SIZES = ['3 KB', '86 MB', '41 MB', '12 MB', '236 MB', '18 MB', '6 MB', '148 MB', '22 MB', '94 MB', '1 KB'];
      const CLI_ICON = { claude: 'bot-message-square', codex: 'terminal-square' };
      const MODELS = { claude: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5', 'claude-fable-5-2'], codex: ['gpt-6-luna', 'gpt-5.6-terra', 'gpt-5.6-luna'] };
      const AUTH = { claude: 'sub', codex: 'key' };
      const INTS = [
        { id: 'gh', icon: 'github', name: 'GitHub', on: true }, { id: 'gl', icon: 'gitlab', name: 'GitLab', on: false }, { id: 'az', icon: 'cloud', name: 'Azure DevOps', on: false },
      ];
      const S = { reg: D.projects.map(p => p.id), defCli: 'claude', cacheCleared: false, dirty: false };
      const updText = p => PC.lang === 'vi' ? (UPD_VI[p.updated] || p.updated) : p.updated;
      const tx = s => PC.t(s);
      const treeRows = (items, sizes, kind) => items.map((it, i) => {
        return `<div class="znode"><i data-lucide="${PC.storageIcon(it.path)}"></i><span class="zp" title="${PC.esc(it.path)}">${PC.esc(it.path)}</span><span class="zs">${sizes[i]}</span><span class="zd">${tx('ap.' + kind + '.' + i)}</span></div>`;
      }).join('');

      function renderBound() {
        const A = D.storage.app, P = D.storage.project;
        const appSizes = APP_SIZES.slice(); if (S.cacheCleared) appSizes[appSizes.length - 1] = '0 KB';
        const total = S.cacheCleared ? '31 MB' : '279 MB';
        $('bound').innerHTML = `
          <div class="zone z-app">
            <div class="zone-head"><span class="zone-cap">${tx('ap.bound.l')}</span>
              <div class="zone-top"><i data-lucide="monitor-cog"></i><h3>${tx('ap.zone.app')}</h3><span class="badge badge-brand">${tx('ap.zone.app.badge')}</span></div>
              <div class="zone-root"><span class="truncate">${PC.esc(A.root)}\\</span><span class="sz">${total}</span></div></div>
            <div class="ztree">${treeRows(A.items, appSizes, 'a')}</div>
            <div class="zone-foot"><i data-lucide="shield-check" class="icon-sm"></i><span>${tx('ap.zone.app.foot')}</span></div>
          </div>
          <div class="zone proj">
            <div class="zone-head"><span class="zone-cap">${tx('ap.bound.r')}</span>
              <div class="zone-top"><i data-lucide="folder-kanban"></i><h3>${tx('ap.zone.proj')}</h3><span class="badge badge-teal">${tx('ap.zone.proj.badge')}</span></div>
              <div class="zone-root"><span class="truncate">${PC.esc(tx('ap.zone.proj.root'))}</span><span class="sz">e.g. D:\\Projects\\lotus-pay</span></div></div>
            <div class="ztree">${treeRows(P.items, PROJ_SIZES, 'p')}</div>
            <div class="zone-foot"><i data-lucide="package" class="icon-sm"></i><span>${tx('ap.zone.proj.foot')}</span></div>
          </div>`;
        PC.refresh($('bound'));
      }

      function renderReg() {
        const rows = S.reg.map(id => D.projects.find(p => p.id === id));
        $('reg-body').innerHTML = rows.length ? rows.map(p => `<tr data-id="${p.id}">
            <td><div class="tbl-proj"><span class="project-avatar" style="background:${p.color}">${PC.esc(p.short)}</span><div style="min-width:0"><div style="font-weight:500;color:var(--fg-strong)" class="truncate">${PC.esc(p.name)}</div><div class="text-xs text-subtle truncate">${PC.esc(p.client)}</div></div></div></td>
            <td class="tbl-hide"><span class="tbl-dir">${PC.esc(p.dir)}</span></td>
            <td class="num">${SIZES[p.id] || '—'}</td>
            <td class="tbl-hide text-muted">${PC.esc(updText(p))}</td>
            <td><div class="row-acts"><button class="btn btn-ghost btn-sm" data-act="reveal" data-id="${p.id}"><i data-lucide="folder-search"></i>${tx('ap.reg.reveal')}</button><button class="btn btn-ghost btn-sm btn-icon" data-act="unreg" data-id="${p.id}" data-tip="${PC.esc(tx('ap.reg.remove'))}" aria-label="${PC.esc(tx('ap.reg.remove'))}" style="color:var(--danger-fg)"><i data-lucide="list-x"></i></button></div></td></tr>`).join('')
          : `<tr><td colspan="5"><div class="empty" style="padding:var(--space-8)"><div class="text-sm">${tx('ap.reg.empty')}</div></div></td></tr>`;
        PC.refresh($('reg-body'));
      }

      function renderClis() {
        $('clis').innerHTML = D.cli.map(c => {
          const def = c.id === S.defCli;
          return `<div class="cli-card" data-cli="${c.id}">
            <div class="cli-head">
              <i data-lucide="${CLI_ICON[c.id] || 'terminal'}"></i>
              <div class="cname">${PC.esc(c.name)}${def ? `<span class="badge badge-brand">${tx('ap.ai.default')}</span>` : ''}</div>
              <div class="cli-stat grow"><span class="dot dot-success"></span><span>${tx('cli.connected')}</span><span>·</span><span>v${c.version}</span></div>
              ${def ? '' : `<button class="btn btn-ghost btn-sm" data-act="setdef" data-id="${c.id}"><i data-lucide="star"></i>${tx('ap.ai.setdefault')}</button>`}
              <button class="btn btn-ghost btn-sm" data-act="signout" data-id="${c.id}"><i data-lucide="log-out"></i>${tx('ap.ai.signout')}</button>
              <button class="btn btn-secondary btn-sm" data-act="test" data-id="${c.id}"><i data-lucide="plug-zap"></i><span>${tx('ap.ai.test')}</span></button>
            </div>
            <dl class="cli-kv">
              <dt>${tx('ap.ai.bin')}</dt><dd><span class="path" title="${PC.esc(c.bin)}">${PC.esc(c.bin)}</span><button class="btn btn-ghost btn-sm" data-act="browse">${tx('ap.ai.change')}</button></dd>
              <dt>${tx('ap.ai.auth')}</dt><dd><span class="badge badge-success"><i data-lucide="check"></i>${tx('ap.ai.signed')}</span><span class="text-xs text-subtle nowrap">${tx(AUTH[c.id] === 'key' ? 'ap.ai.key' : 'ap.ai.sub')}</span></dd>
              <dt>${tx('ap.ai.model')}</dt><dd><select class="select">${(MODELS[c.id] || [c.model]).map(m => `<option ${m === c.model ? 'selected' : ''}>${m}</option>`).join('')}</select></dd>
              <dt>${tx('ap.ai.home')}</dt><dd><span class="path" title="${PC.esc(PC.cliHome(c.id))}">${PC.esc(PC.cliHome(c.id))}</span>
                <span class="cli-hint">${tx('ap.ai.home.d').replace('{env}', PC.cliEnv(c.id))}</span></dd>
            </dl></div>`;
        }).join('');
        PC.refresh($('clis'));
      }

      function renderInts() {
        $('ints').innerHTML = INTS.map(x => `<div class="int-row ${x.on ? 'on' : ''}">
          <i data-lucide="${x.icon}"></i>
          <div class="grow"><div class="row gap-2"><b style="color:var(--fg-strong);font-size:var(--text-sm)">${x.name}</b>${x.on ? `<span class="badge badge-success"><i data-lucide="check"></i>${tx('ap.int.connected')}</span>` : `<span class="badge">${tx('ap.int.not')}</span>`}</div><div class="text-xs text-subtle" style="margin-top:2px">${tx('ap.int.' + x.id + '.d')}</div></div>
          <button class="btn ${x.on ? 'btn-ghost' : 'btn-secondary'} btn-sm" data-act="int" data-id="${x.id}">${tx(x.on ? 'ap.int.disconnect' : 'ap.int.connect')}</button></div>`).join('');
        PC.refresh($('ints'));
      }

      function renderCache() {
        const parts = S.cacheCleared ? [0, 0, 0] : [164, 61, 23];
        const col = ['var(--brand)', 'var(--accent-purple)', 'var(--accent-teal)'];
        const keys = ['ap.cache.idx', 'ap.cache.thumb', 'ap.cache.tmp'];
        $('cache-total').textContent = S.cacheCleared ? '0 MB' : '248 MB';
        $('cache-bar').innerHTML = parts.map((v, i) => `<i style="width:${(v / 248) * 100}%;background:${col[i]}"></i>`).join('');
        $('cache-legend').innerHTML = parts.map((v, i) => `<span><span class="dot" style="background:${col[i]}"></span>${tx(keys[i])} <b>${v} MB</b></span>`).join('');
      }

      function renderAll() { renderBound(); renderReg(); renderClis(); renderInts(); renderCache(); PC.refresh(document.querySelector('.canvas')); }

      /* ---- display prefs ---- */
      const LSget = (k, d) => { try { return localStorage.getItem('pc.' + k) || d; } catch (e) { return d; } };
      const LSset = (k, v) => { try { localStorage.setItem('pc.' + k, v); } catch (e) {} };

      /* ---- dirty / save bar ---- */
      function setDirty(v) { S.dirty = v; $('savebar').classList.toggle('is-off', !v); }

      /* ---- scroll spy ---- */
      function spy() {
        const cv = $('canvas'), top = cv.getBoundingClientRect().top + 90;
        const secs = [...document.querySelectorAll('.sec')];
        let cur = secs[0].id;
        secs.forEach(s => { if (s.getBoundingClientRect().top <= top) cur = s.id; });
        if (cv.scrollTop + cv.clientHeight >= cv.scrollHeight - 4) cur = secs[secs.length - 1].id;
        document.querySelectorAll('#setnav a').forEach(a => a.classList.toggle('is-active', a.dataset.sec === cur));
      }

      function modalConfirmRemove(id) {
        const p = D.projects.find(x => x.id === id);
        PC.modal({ title: tx('ap.reg.rm.t').replace('{n}', PC.esc(p.name.split(' — ')[0])), width: 480,
          body: `<p class="text-sm text-muted">${tx('ap.reg.rm.d').replace('{p}', PC.esc(p.dir))}</p>`,
          actions: [{ label: tx('common.cancel'), kind: 'ghost' }, { label: tx('ap.reg.rm.btn'), kind: 'danger', icon: 'list-x', onClick: () => { S.reg = S.reg.filter(x => x !== id); renderReg(); PC.toast(tx('ap.reg.removed'), { icon: 'list-x' }); } }] });
      }
      function modalAddCli() {
        const m = PC.modal({ title: tx('ap.ai.add.t'), width: 500,
          body: `<div class="col gap-4"><div class="field"><label class="label">${tx('ap.ai.add.name')}</label><input class="input" id="nc-name" placeholder="${PC.esc(tx('ap.ai.add.name.ph'))}"></div>
            <div class="field"><label class="label">${tx('ap.ai.add.bin')}</label><div class="row"><input class="input mono" id="nc-bin" placeholder="${PC.esc(tx('ap.ai.add.bin.ph'))}"><button class="btn btn-secondary" type="button"><i data-lucide="folder-open"></i>${tx('ap.browse')}</button></div></div></div>`,
          actions: [{ label: tx('common.cancel'), kind: 'ghost' }, { label: tx('ap.ai.add.btn'), kind: 'primary', icon: 'search-check', onClick: () => { const n = document.getElementById('nc-name').value.trim() || 'Gemini CLI'; PC.toast(tx('ap.ai.added').replace('{n}', PC.esc(n))); } }] });
      }
      function modalClearCache() {
        PC.modal({ title: tx('ap.cache.t'), width: 460, body: `<p class="text-sm text-muted">${tx('ap.cache.td')}</p>`,
          actions: [{ label: tx('common.cancel'), kind: 'ghost' }, { label: tx('ap.cache.clear'), kind: 'danger', icon: 'trash-2', onClick: () => { S.cacheCleared = true; renderBound(); renderCache(); PC.toast(tx('ap.cache.cleared')); } }] });
      }

      function wire() {
        document.addEventListener('click', e => {
          const a = e.target.closest('[data-act]'); if (!a) return;
          const act = a.dataset.act, id = a.dataset.id;
          if (act === 'open-app-folder') PC.toast(tx('ap.act.folder'), { icon: 'folder-open' });
          else if (act === 'open-logs') PC.toast(tx('ap.act.logs'), { icon: 'folder-open' });
          else if (act === 'browse') { PC.toast(tx('ap.act.picked'), { icon: 'folder-open' }); setDirty(true); }
          else if (act === 'add-existing') { location.href = 'new-project.html?mode=open'; }
          else if (act === 'reveal') { const p = D.projects.find(x => x.id === id); PC.toast(tx('ap.reg.revealed').replace('{p}', PC.esc(p.dir)), { icon: 'folder-search' }); }
          else if (act === 'unreg') modalConfirmRemove(id);
          else if (act === 'setdef') { S.defCli = id; renderClis(); setDirty(true); }
          else if (act === 'test') {
            const c = D.cli.find(x => x.id === id); const lab = a.querySelector('span'); a.disabled = true; lab.textContent = tx('ap.ai.testing');
            a.querySelector('svg, i').outerHTML = '<span class="spinner"></span>';
            setTimeout(() => { renderClis(); PC.toast(tx('ap.ai.testok').replace('{n}', PC.esc(c.name)), { tone: 'success' }); }, 1100);
          }
          else if (act === 'signout') { const c = D.cli.find(x => x.id === id); PC.toast(tx('ap.ai.signedout').replace('{n}', PC.esc(c.name)), { icon: 'log-out', tone: 'warning' }); }
          else if (act === 'add-cli') modalAddCli();
          else if (act === 'int') { const x = INTS.find(i => i.id === id); x.on = !x.on; renderInts(); PC.toast(tx(x.on ? 'ap.int.done' : 'ap.int.gone').replace('{n}', x.name), { icon: x.on ? 'plug-zap' : 'unplug' }); }
          else if (act === 'export-diag') PC.toast(tx('ap.log.exported'), { icon: 'package-open' });
          else if (act === 'clear-cache') modalClearCache();
          else if (act === 'check-update') PC.toast(tx('ap.about.upto'), { icon: 'badge-check' });
          else if (act === 'save') { setDirty(false); PC.toast(tx('ap.saved')); }
          else if (act === 'discard') { setDirty(false); PC.toast(tx('ap.discarded'), { icon: 'undo-2' }); }
        });
        $('content').addEventListener('input', e => { if (e.target.closest('.card')) setDirty(true); });
        $('content').addEventListener('change', e => { if (e.target.closest('.card')) setDirty(true); });
        $('par').addEventListener('input', e => { $('par-v').textContent = e.target.value; });
        $('as-mode').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; document.querySelectorAll('#as-mode button').forEach(x => x.classList.toggle('is-active', x === b)); setDirty(true); });
        $('setnav').addEventListener('click', e => { const a = e.target.closest('a[data-sec]'); if (!a) return; e.preventDefault(); const el = document.getElementById(a.dataset.sec); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); history.replaceState(null, '', '#' + a.dataset.sec); } });
        $('canvas').addEventListener('scroll', spy, { passive: true });
      }

      PC.onReady(() => {
        wire(); renderAll(); spy();
        if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el && el.classList.contains('sec')) setTimeout(() => el.scrollIntoView(), 50); }
        PC.assistant.setContext([{ icon: 'settings', label: PC.t('nav.app_settings') }, { icon: 'hard-drive', label: '%LOCALAPPDATA%\\Procheck' }]);
      });
      document.addEventListener('pc:lang', () => { renderAll(); });
    })();
  </script>
</body>
