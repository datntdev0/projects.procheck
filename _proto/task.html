<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task detail · Procheck</title>
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <link rel="stylesheet" href="assets/shell.css">
  <script src="assets/app.js"></script>
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    /* ---- Task page (tokens only; prefix tk-/lc-/pl-/rn-/rv- to avoid clashes) ---- */
    .canvas-inner.tk { max-width: 1320px; padding-top: var(--space-6); }
    .tk-crumbs { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--fg-subtle); margin-bottom: 10px; }
    .tk-crumbs a { color: var(--fg-subtle); }
    .tk-title { display: flex; align-items: flex-start; gap: var(--space-4); flex-wrap: wrap; }
    .tk-title h1 { font-size: 24px; }
    .tk-id { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 600; color: var(--brand-fg); background: var(--brand-soft); padding: 2px 8px; border-radius: var(--radius-sm); }
    .tk-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: var(--space-4) 0 var(--space-5); }
    .tk-meta > div { padding: 10px 16px; border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); min-width: 0; }
    .tk-meta > div:nth-child(4n) { border-right: 0; }
    .tk-meta > div.span2 { grid-column: span 2; }
    .tk-meta > div:nth-last-child(-n+2) { border-bottom: 0; }
    .tk-meta .k { font-size: var(--text-2xs); font-weight: var(--weight-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); margin-bottom: 4px; }
    .tk-meta .v { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); color: var(--fg-default); min-width: 0; }
    .tk-meta .v code { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    @media (max-width: 1100px) { .tk-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tk-meta > div:nth-child(4n) { border-right: 1px solid var(--border-subtle); } .tk-meta > div:nth-child(2n) { border-right: 0; } .tk-meta > div.span2 { grid-column: span 2; } .tk-meta > div { border-bottom: 1px solid var(--border-subtle) !important; } }
    .pri-high { color: var(--warning-fg); } .pri-urgent { color: var(--danger-fg); }

    /* lifecycle stepper */
    .lc { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: var(--space-4) var(--space-3) var(--space-3); margin-bottom: var(--space-5); }
    .lc-s { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 4px; background: none; border: 0; cursor: pointer; text-align: center; min-width: 0; }
    .lc-s::before { content: ""; position: absolute; top: 13px; right: 50%; left: -50%; height: 2px; background: var(--border-default); }
    .lc-s:first-child::before { display: none; }
    .lc-s.is-done::before, .lc-s.is-current::before { background: var(--brand); }
    .lc-dot { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--bg-surface); border: 1.5px solid var(--border-strong); color: var(--fg-faint); font-size: var(--text-xs); font-weight: var(--weight-semibold); transition: box-shadow var(--dur-fast); }
    .lc-dot svg { width: 14px; height: 14px; }
    .lc-s.is-done .lc-dot { background: var(--brand); border-color: var(--brand); color: var(--fg-on-brand); }
    .lc-s.is-current .lc-dot { border-color: var(--brand); color: var(--brand-fg); box-shadow: var(--shadow-focus); background: var(--bg-surface); }
    .lc-s.is-running .lc-dot { border-color: var(--accent-teal); box-shadow: 0 0 0 3px var(--accent-teal-soft); }
    .lc-s:hover .lc-dot { box-shadow: var(--shadow-focus); }
    .lc-l { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--fg-subtle); line-height: 1.2; }
    .lc-s.is-done .lc-l, .lc-s.is-current .lc-l { color: var(--fg-strong); }
    .lc-sub { font-size: 10.5px; color: var(--fg-faint); line-height: 1.2; }
    .lc-s.is-current .lc-sub { color: var(--warning-fg); font-weight: var(--weight-medium); }
    .lc-s.is-running .lc-sub { color: var(--accent-teal-fg); font-weight: var(--weight-medium); }
    @media (max-width: 900px) { .lc-sub { display: none; } .lc-l { font-size: 10px; } }

    /* layout */
    .tk-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--space-6); align-items: start; }
    .tk-layout.no-side { grid-template-columns: minmax(0, 1fr); }
    .tk-layout.no-side .tk-side { display: none; }
    @media (max-width: 1280px) { .tk-layout { grid-template-columns: minmax(0, 1fr); } .tk-side { position: static !important; max-height: none !important; } }
    .tk-main { min-width: 0; }
    .tk-panel { display: none; padding-top: var(--space-5); }
    .tk-panel.is-active { display: block; }
    .tk-side { position: sticky; top: 0; max-height: calc(100vh - var(--topbar-h) - 24px); overflow: auto; display: flex; flex-direction: column; }
    .tk-grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--space-4); }
    @media (max-width: 1100px) { .tk-grid2 { grid-template-columns: minmax(0, 1fr); } }
    .tk-h { font-size: var(--text-md); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .tk-prose p { font-size: var(--text-sm); color: var(--fg-muted); line-height: 1.7; margin-bottom: 10px; }
    .tk-prose ul { margin: 0 0 8px; padding-left: 18px; font-size: var(--text-sm); color: var(--fg-muted); line-height: 1.8; }
    .ac-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px var(--space-5); border-bottom: 1px solid var(--border-subtle); }
    .ac-item:last-child { border-bottom: 0; }
    .ac-item .checkbox { margin-top: 1px; }
    .ac-item p { margin: 0; font-size: var(--text-sm); color: var(--fg-default); line-height: 1.5; }
    .ac-item.is-checked p { color: var(--fg-muted); }
    .ac-tests { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .art-row { display: flex; align-items: center; gap: 12px; padding: 10px var(--space-4); border-bottom: 1px solid var(--border-subtle); color: inherit; text-decoration: none !important; }
    .art-row:last-child { border-bottom: 0; }
    .art-row:hover { background: var(--bg-hover); }
    .art-row b { font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--fg-strong); display: block; line-height: 1.3; }
    .art-row small { font-size: var(--text-xs); color: var(--fg-subtle); }

    /* plan */
    .pl-banner { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); flex-wrap: wrap; }
    .pl-banner .grow b { font-size: var(--text-sm); }
    .pl-sec { margin-top: var(--space-6); }
    .pl-sec > .tk-h { margin-bottom: var(--space-3); display: flex; align-items: center; gap: 8px; }
    .pl-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    @media (max-width: 1000px) { .pl-cards { grid-template-columns: minmax(0, 1fr); } }
    .pl-card { padding: var(--space-4); display: flex; gap: 12px; }
    .pl-card b { font-size: var(--text-sm); font-weight: var(--weight-semibold); display: block; color: var(--fg-strong); }
    .pl-card code { font-size: 11px; color: var(--brand-fg); }
    .pl-card p { font-size: var(--text-xs); color: var(--fg-muted); margin: 4px 0 0; line-height: 1.55; }
    .dg-box { fill: var(--bg-surface); stroke: var(--border-strong); stroke-width: 1; }
    .dg-brand { fill: var(--brand-soft); stroke: var(--brand); }
    .dg-teal { fill: var(--accent-teal-soft); stroke: var(--accent-teal); }
    .dg-purple { fill: var(--accent-purple-soft); stroke: var(--accent-purple); }
    .dg-t { fill: var(--fg-default); font: 600 11px var(--font-sans); }
    .dg-s { fill: var(--fg-subtle); font: 400 9.5px var(--font-mono); }
    .dg-line { stroke: var(--fg-faint); stroke-width: 1.4; fill: none; }
    .dg-dash { stroke-dasharray: 4 3; }
    .dg-lbl { fill: var(--fg-subtle); font: 500 9.5px var(--font-sans); }
    .m-pill { display: inline-block; min-width: 52px; text-align: center; font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: var(--radius-xs); }
    .m-post { background: var(--success-soft); color: var(--success-fg); } .m-get { background: var(--info-soft); color: var(--info-fg); } .m-del { background: var(--danger-soft); color: var(--danger-fg); }
    .table code { font-size: 11.5px; }
    .pl-step { display: flex; gap: var(--space-4); padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border-subtle); }
    .pl-step:last-child { border-bottom: 0; }
    .pl-n { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-fg); font-size: var(--text-xs); font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pl-step.is-done .pl-n { background: var(--success-soft); color: var(--success-fg); }
    .pl-title { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); }
    .pl-subs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    .pl-subs li { display: flex; gap: 8px; align-items: flex-start; font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.5; }
    .pl-subs svg { width: 13px; height: 13px; margin-top: 2px; color: var(--success); }
    .is-editing [contenteditable] { outline: 1px dashed var(--brand); outline-offset: 2px; border-radius: 3px; background: var(--brand-soft); }
    .is-editing [contenteditable]:focus { outline-style: solid; }

    /* agent run */
    .rn-meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .rn-meta > div { padding: 12px 16px; border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); min-width: 0; }
    .rn-meta > div:nth-child(4n) { border-right: 0; }
    .rn-meta > div.span2 { grid-column: span 2; }
    .rn-meta > div:nth-last-child(-n+4) { border-bottom: 0; }
    .rn-meta .k { font-size: var(--text-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-faint); margin-bottom: 3px; }
    .rn-meta .v { font-size: var(--text-sm); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .rn-meta .v code { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 1100px) { .rn-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rn-meta > div { border-right: 0 !important; border-bottom: 1px solid var(--border-subtle) !important; } }
    .rn-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--space-4); margin-top: var(--space-4); align-items: start; }
    @media (max-width: 1100px) { .rn-grid { grid-template-columns: minmax(0, 1fr); } }
    .tl { padding: var(--space-4) var(--space-4) var(--space-2); }
    .tl-i { position: relative; display: flex; gap: 12px; padding-bottom: 16px; }
    .tl-i::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--border-default); }
    .tl-i:last-child { padding-bottom: 6px; } .tl-i:last-child::before { display: none; }
    .tl-i.is-done::before { background: var(--success); opacity: .5; }
    .tl-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--bg-surface-3); color: var(--fg-faint); position: relative; z-index: 1; }
    .tl-dot svg { width: 13px; height: 13px; }
    .tl-i.is-done .tl-dot { background: var(--success); color: var(--fg-on-brand); }
    .tl-i.is-running .tl-dot { background: var(--accent-teal-soft); }
    .tl-b { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--fg-strong); line-height: 1.3; }
    .tl-d { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 1px; line-height: 1.45; }
    .tl-t { margin-left: auto; font-size: var(--text-2xs); color: var(--fg-faint); font-family: var(--font-mono); white-space: nowrap; padding-top: 3px; }
    .term-card { background: var(--gray-950); border: 1px solid var(--gray-800); border-radius: var(--radius-lg); overflow: hidden; }
    .term-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--gray-800); color: var(--gray-400); font-size: var(--text-xs); flex-wrap: wrap; }
    .term-bar .mono { color: var(--gray-200); font-size: 11.5px; }
    .term-bar .btn { background: rgba(255,255,255,.06); color: var(--gray-200); border: 1px solid rgba(255,255,255,.1); }
    .term-bar .btn:hover { background: rgba(255,255,255,.12); }
    .term-body { height: 440px; border: 0; border-radius: 0; white-space: pre-wrap; word-break: break-word; }
    .term-body .t-line { display: block; }
    .term-foot { padding: 6px 12px; border-top: 1px solid var(--gray-800); color: var(--gray-500); font-size: 11px; font-family: var(--font-mono); }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }
    .live-dot.is-live { animation: blink 1s infinite; }
    .caret::after { content: "▍"; color: var(--kms-sky); animation: blink 1s steps(2) infinite; margin-left: 2px; }

    /* review */
    .rv-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-3); }
    @media (max-width: 1100px) { .rv-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .rv-tile { padding: var(--space-3) var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-lg); background: var(--bg-surface); }
    .rv-tile .stat-value { font-size: var(--text-xl); display: flex; align-items: center; gap: 6px; }
    .rv-tile .stat-value svg { color: var(--success); width: 18px; height: 18px; }
    .rv-tile .stat-delta { color: var(--fg-subtle); font-weight: var(--weight-regular); }
    .rv-split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: var(--space-4); margin-top: var(--space-4); align-items: start; }
    @media (max-width: 1100px) { .rv-split { grid-template-columns: minmax(0, 1fr); } }
    .dur { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); }
    .dur i { display: block; height: 4px; border-radius: 3px; background: var(--brand-soft-2); }
    .dur.is-slow i { background: var(--warning); } .dur.is-slow { color: var(--warning-fg); font-weight: 600; }
    .table tr.is-slow td { background: var(--warning-soft); }
    .shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); padding: var(--space-4); }
    .shot { border: 1px solid var(--border-default); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-surface); cursor: zoom-in; transition: box-shadow var(--dur-fast), border-color var(--dur-fast); }
    .shot:hover { box-shadow: var(--shadow-md); border-color: var(--brand); }
    .shot svg { width: 100%; height: auto; }
    .shot figcaption { padding: 6px 10px; font-size: var(--text-xs); color: var(--fg-muted); border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; gap: 6px; }
    .sh-win { fill: var(--bg-surface); stroke: var(--border-default); } .sh-bar { fill: var(--bg-surface-3); } .sh-side { fill: var(--bg-surface-2); }
    .sh-ln { fill: var(--border-default); } .sh-ln2 { fill: var(--fg-faint); opacity: .5; } .sh-brand { fill: var(--brand); } .sh-brand-s { fill: var(--brand-soft); }
    .sh-slot { fill: var(--bg-surface-2); stroke: var(--border-strong); stroke-dasharray: 3 2; } .sh-slot.solid { stroke-dasharray: none; fill: var(--bg-surface); }
    .sh-err { stroke: var(--danger); stroke-dasharray: none; fill: var(--danger-soft); } .sh-errt { fill: var(--danger-fg); font: 500 6.5px var(--font-sans); }
    .sh-ok { fill: var(--success-soft); } .sh-okt { fill: var(--success-fg); font: 600 6px var(--font-sans); } .sh-warn { fill: var(--warning-soft); } .sh-warnt { fill: var(--warning-fg); font: 600 6px var(--font-sans); }
    .sh-t { fill: var(--fg-default); font: 500 7px var(--font-sans); } .sh-h { fill: var(--fg-strong); font: 600 9px var(--font-sans); } .sh-m { fill: var(--fg-subtle); font: 400 6px var(--font-sans); } .sh-bt { fill: var(--fg-on-brand); font: 600 7px var(--font-sans); }
    .sh-track { fill: var(--bg-surface-3); }
    .media-row { display: flex; align-items: center; gap: 12px; padding: 10px var(--space-4); border-top: 1px solid var(--border-subtle); }
    .media-row b { font-size: var(--text-sm); font-weight: var(--weight-medium); display: block; color: var(--fg-strong); line-height: 1.3; }
    .media-row small { color: var(--fg-subtle); font-size: var(--text-xs); }
    .fv { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 420px; }
    @media (max-width: 1100px) { .fv { grid-template-columns: minmax(0, 1fr); } }
    .fv-tree { border-right: 1px solid var(--border-subtle); padding: 6px; overflow: auto; max-height: 640px; }
    .fv-dir { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-subtle); padding: 8px 8px 3px; display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .fv-dir svg { width: 12px; height: 12px; flex-shrink: 0; }
    .fv-f { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 20px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px; font-family: var(--font-mono); color: var(--fg-default); }
    .fv-f:hover { background: var(--bg-hover); } .fv-f.is-active { background: var(--bg-active); color: var(--brand-fg); }
    .fv-f .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fv-f.is-viewed .nm { color: var(--fg-faint); text-decoration: line-through; text-decoration-color: var(--border-strong); }
    .fv-f .st { width: 14px; height: 14px; border-radius: 3px; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .st-A { background: var(--success-soft); color: var(--success-fg); } .st-M { background: var(--warning-soft); color: var(--warning-fg); }
    .fv-f .pm { font-size: 10px; color: var(--success-fg); } .fv-f .pm b { color: var(--danger-fg); font-weight: 500; }
    .fv-diff { padding: var(--space-4); min-width: 0; overflow: auto; }
    .fv-diff .diff { min-width: 560px; }
    .diff-line.hunk { background: var(--brand-soft); } .diff-line.hunk > span:last-child { color: var(--brand-fg); }
    .diff-line > span:last-child { padding-left: 8px; }
    .diff-more { padding: 8px 12px; text-align: center; font-family: var(--font-sans); font-size: var(--text-xs); color: var(--brand-fg); background: var(--bg-surface-2); border-top: 1px solid var(--border-default); cursor: pointer; }
    .diff-more:hover { background: var(--brand-soft); }
    .add-n { color: var(--success-fg); font-family: var(--font-mono); font-size: 11.5px; } .del-n { color: var(--danger-fg); font-family: var(--font-mono); font-size: 11.5px; }
    .rv-bar { position: sticky; bottom: 12px; z-index: 5; margin-top: var(--space-6); display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px 10px 16px; background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); flex-wrap: wrap; }
    .rv-bar .input { flex: 1; min-width: 160px; }
    .summary-card { padding: var(--space-5); }
    .summary-card h5 { margin-bottom: 6px; }

    /* activity */
    .ac-head { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; }
    .ev { position: relative; display: flex; gap: 10px; padding: 0 var(--space-4) var(--space-4); }
    .ev::before { content: ""; position: absolute; left: calc(var(--space-4) + 11px); top: 24px; bottom: 0; width: 1px; background: var(--border-default); }
    .ev:last-child::before { display: none; }
    .ev .avatar { width: 24px; height: 24px; font-size: 9px; border-width: 0; z-index: 1; }
    .ev-ic { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-surface-3); color: var(--fg-subtle); display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1; }
    .ev-ic svg { width: 12px; height: 12px; }
    .ev-b { min-width: 0; font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.5; }
    .ev-b b { color: var(--fg-default); font-weight: var(--weight-semibold); }

    function ask(i) {
      asked = true; const lang = PC.lang;
      const d = new Date(); const time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

    /* ===================================================== events */
    function renderAll() { renderHeader(); renderStepper(); renderTabs(); renderOverview(); renderPlan(); renderRun(); renderReview(); renderActivity(); }
    document.addEventListener('click', e => {
      const sg = e.target.closest('#pc-as-suggest button');
      if (sg) { e.stopPropagation(); e.preventDefault(); const i = [...sg.parentElement.children].indexOf(sg); askRoute(i); return; }
    }, true);
    document.addEventListener('click', e => {
      const tab = e.target.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab, false); return; }
      const lc = e.target.closest('[data-lc]');
      if (lc) { const id = lc.dataset.lc; if (id === 'pr') { S.stage === 'review' && S.plan.approved ? modalApprove() : S.stage === 'pr' ? PC.toast(T('task.status.pr', { n: PR_NUM }), { icon: 'git-pull-request' }) : setTab('review'); } else setTab({ spec: 'overview', solution: 'plan', plan: 'plan', implement: 'run', verify: 'review', review: 'review' }[id]); return; }
      const fl = e.target.closest('[data-file]'); if (fl) { S.sel = +fl.dataset.file; updateDiffPane(); return; }
      const shotEl = e.target.closest('[data-shot]');
      if (shotEl) { const n = +shotEl.dataset.shot; PC.modal({ title: T('task.rv.shot.' + n) + ' · #' + n, width: 760, body: `<div class="shot-lg">${shot(n)}</div>`, actions: [{ label: T('common.close'), kind: 'secondary' }] }); return; }
      const gt = e.target.closest('[data-goto-test]'); if (gt) { setTab('review'); setTimeout(() => { const r = document.getElementById('t' + gt.dataset.gotoTest); r && r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); return; }
      const a = e.target.closest('[data-act]'); if (!a) return;
      switch (a.dataset.act) {
        case 'side': S.side = !S.side; $('layout').classList.toggle('no-side', !S.side); break;
        case 'vscode': PC.toast(T('task.t.vscode'), { icon: 'code' }); break;
        case 'copy': try { navigator.clipboard && navigator.clipboard.writeText(a.dataset.v); } catch (err) {} PC.toast(T('task.t.copied'), { icon: 'copy' }); break;
        case 'changes': modalChanges(); break;
        case 'approve': modalApprove(); break;
        case 'viewpr': PC.toast('github.com/lotus-fin/lotus-pay-portal/pull/' + PR_NUM, { icon: 'external-link' }); break;
        case 'regen': regen(); break;
        case 'editplan': S.plan.editing = !S.plan.editing; if (!S.plan.editing && S.plan.approved) { S.plan.approved = false; renderAll(); PC.toast(T('task.t.edited'), { tone: 'warning', icon: 'pencil' }); } else renderPlan(); break;
        case 'approveplan': S.plan.approved = true; renderAll(); PC.toast(T('task.t.approved', { v: S.plan.v }), { tone: 'success' }); break;
        case 'replay': PC.toast(T('task.t.replay'), { icon: 'rotate-ccw' }); stream(FULL_LOG, () => {}, true); break;
        case 'pause': if (RUN.streaming) { RUN.paused = !RUN.paused; renderRunControls(); if (RUN.paused) PC.toast(T('task.t.paused'), { icon: 'pause' }); else { PC.toast(T('task.t.resumed'), { icon: 'play' }); pump(); } } break;
        case 'stop': if (RUN.streaming) { const wasRerun = S.stage === 'rerun'; endStream('task.t.stopped'); if (wasRerun) { S.stage = 'review'; renderAll(); } } break;
        case 'why': ask(1); break;
        case 'trace': PC.toast(T('task.t.trace'), { icon: 'activity' }); break;
        case 'video': PC.toast(T('task.t.video'), { icon: 'video' }); break;
        case 'fullfile': PC.toast(T('task.t.full'), { icon: 'file-code-2' }); break;
        case 'rvcomment': { const i = $('rvInput'); const v = i.value.trim(); if (!v) { PC.toast(T('task.t.empty'), { tone: 'warning', icon: 'circle-alert' }); i.focus(); } else { addComment(v); i.value = ''; } break; }
        case 'acsend': { const i = $('acText'); const v = i.value.trim(); if (!v) { PC.toast(T('task.t.empty'), { tone: 'warning', icon: 'circle-alert' }); i.focus(); } else { i.value = ''; addComment(v); } break; }
      }
    });
    document.addEventListener('change', e => {
      const ac = e.target.closest('[data-ac]'); if (ac) { S.ac[+ac.dataset.ac] = ac.checked; renderOverview(); return; }
      const v = e.target.closest('[data-viewed]'); if (v) { const i = +v.dataset.viewed; v.checked ? S.viewed.add(i) : S.viewed.delete(i); updateDiffPane(); }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'acText') { const v = e.target.value.trim(); if (v) { e.target.value = ''; addComment(v); } }
      if (e.key === 'Enter' && e.target.id === 'rvInput') { const v = e.target.value.trim(); if (v) { e.target.value = ''; addComment(v); } }
    });

/* streaming engine - one timer, only for the selected run */
function gStopStream() { clearTimeout(GS.timer); GS.streaming = false; GS.paused = false; }
function gInitLog(r) {
  if (r._log) return;
  const full = gMkLog(r);
  if (gLive(r)) {
    const ri = Math.max(0, r.steps.findIndex(s => s.st === 'running'));
    const inPre = l => l.step < ri || (l.step === ri && (l.t.indexOf('▸') === 0 || gFiles(r).some(f => l.t.endsWith(f.p) && gFileState(r, f) === 'done')));
    r._log = full.filter(l => !l.fin && inPre(l)); r._q = full.filter(l => !l.fin && !inPre(l));
  } else { r._log = full.slice(); r._q = []; }
  r._beats = 0;
}
function gStartStream(r) {
  gStopStream(); gInitLog(r);
  if (gLive(r)) { GS.streaming = true; GS.timer = setTimeout(gPump, 900); }
}
function gPump() {
  const r = gCur(); if (!r || !GS.streaming || GS.paused) return;
  let l = r._q.shift(), delay;
  if (!l) {
    if (r._onDone) { const cb = r._onDone; r._onDone = null; GS.streaming = false; gRunCtl(); cb(); return; }
    if (!gLive(r) || r._beats >= 60) { GS.streaming = false; gRunCtl(); return; }
    l = { c: 't-dim', t: GHB[r._beats % GHB.length], d: 3800 }; r._beats++;
  }
  r._log.push(l);
  const term = $('gTerm');
  if (term) { term.querySelectorAll('.caret').forEach(c => c.classList.remove('caret')); const d = document.createElement('div'); d.className = 't-line caret ' + l.c; d.textContent = l.t; term.appendChild(d); term.scrollTop = term.scrollHeight; }
  if (gLive(r) && l.step !== undefined && l.step >= 0) gBump(r, l);
  const last = $('gLast'); if (last) last.textContent = l.t.trim();
  delay = Math.min(l.d || 90, l.d > 1000 ? l.d : 420);
  GS.timer = setTimeout(gPump, delay);
}
function gBump(r, l) {
  r.progress = Math.min(92, r.progress + 0.8);
  const w = $('gProg'); if (w) w.style.width = r.progress + '%';
  const t = $('gProgTxt'); if (t) t.textContent = Math.round(r.progress) + '%';
  const t2 = $('gProgTxt2'); if (t2) t2.textContent = Math.round(r.progress) + '%';
  if (Math.round(r.progress) !== r._lp) { r._lp = Math.round(r.progress); gRenderList(); }
}
function gEnd(msgKey, tone) {
  clearTimeout(GS.timer); GS.streaming = false; GS.paused = false;
  const term = $('gTerm'); if (term) term.querySelectorAll('.caret').forEach(c => c.classList.remove('caret'));
  gRunCtl(); if (msgKey) PC.toast(msgKey, { tone: tone || 'warning', icon: 'square' });
}

  const rf = r.retryFiles || [['M', first.p, 14, 3]];
  r.steps.forEach(s => { if (s.st === 'failed') { s.st = 'pending'; s.d = ll('Re-running after your guidance', 'Chạy lại sau hướng dẫn của bạn'); } });
  const n = r.steps.length + 1;
  r.steps.push({ n: ll('Apply your ' + (kind === 'retry' ? 'guidance' : 'feedback'), 'Áp dụng ' + (kind === 'retry' ? 'hướng dẫn' : 'phản hồi') + ' của bạn'), d: '', t: '…', st: 'running' });
  const rAgent = r.agent === 'codex' ? 'codex' : 'claude';
  const lines = [{ c: 't-dim', t: '', d: 300, step: -1 }, { c: 't-cmd', t: '$ claude --resume run-' + r.sess + ' -p "Apply ' + (kind === 'retry' ? 'guidance and retry' : 'review feedback') + '" ' + PC.cliFlags(rAgent, GP), d: 400, step: -1 }, { c: 't-info', t: '● ' + (kind === 'retry' ? 'Guidance' : 'Feedback') + ' received from you', d: 350, step: -1 }]
    .concat(fb.split('\n').filter(Boolean).slice(0, 3).map(x => ({ c: 't-dim', t: '  ' + x.replace(/^[-•]\s*/, '• ').slice(0, 100), d: 200, step: -1 })))
    .concat([{ c: 't-info', t: '▸ Step ' + n + '/' + n + '  Applying your ' + (kind === 'retry' ? 'guidance' : 'feedback'), d: 350, step: 8 }])
    .concat(rf.map(f => ({ c: f[0] === 'A' ? 't-ok' : 't-warn', t: '  ' + (f[0] === 'A' ? '+ ' : '~ ') + f[1], d: 320, step: 8 })))
    .concat(r.e2eApp ? [{ c: 't-cmd', t: '$ npx nx e2e ' + r.e2eApp + ' --grep ' + r.tag, d: 900, step: 8 }, { c: 't-ok', t: '  ✓ ' + (r.e2e ? r.e2e.length : 'all') + ' passed', d: 500, step: 8 }] : [])
    .concat([{ c: 't-ok', t: '✓ Run #2 complete - evidence updated, ready for human review', d: 200, step: 8 }, { c: 't-dim', t: '[harness] run saved', d: 100, step: 8 }]);
  r._log = (r._log || []).concat([{ c: 't-dim', t: '── run #1 ' + (r.prevStatus === 'failed' ? 'failed at Verify' : 'sent to your review') + ' · run #2 started ──', d: 100 }]);
  r._q = lines;
  r._onDone = () => {
    r.status = 'review'; r.rerun = false; r.progress = 100; r.dur = r.dur2 || '26m 14s'; if (r.sumDone) r.sum = r.sumDone;
    r.steps.forEach(s => { if (s.st === 'pending' || s.st === 'running') { s.st = 'done'; s.t = s.k === 7 ? '0:41' : s.k === 6 ? '3:22' : '2:38'; if (s.k === 6 && r.e2e) s.d = ll(r.e2e.length + ' / ' + r.e2e.length + ' passed', 'Đạt ' + r.e2e.length + '/' + r.e2e.length); if (s.k === 7) s.d = ll('evidence collected', 'đã thu thập bằng chứng'); } });
    if (r.e2e) r.e2e = r.e2e.map(x => [x[0], x[1], 'pass']);
    if (r.retryFiles && r._files) { r.retryFiles.forEach(f => { const ex = r._files.find(x => x.p === f[1]); if (ex) { ex.a += f[2]; ex.d += f[3]; } else r._files.push(gF(f[1], f[0], f[2], f[3], r.steps.length - 1)); }); }
    gRoute(false); PC.toast(T('rl.t.retry.done', { id: r.id }), { tone: 'success', icon: 'eye' });
  };
  PC.toast(T(kind === 'retry' ? 'rl.t.retry' : 'rl.t.changes'), { icon: 'bot' });
  G.tab = 'run'; gRoute(false); r._lp = 8;
  gStartStream(r);
}
function gModalDiscard(r) {
  PC.modal({ title: T('rl.m.discard.title'), width: 480, body: `<p class="text-sm text-muted" style="line-height:1.6">${T('rl.m.discard.body', { p: '<code>' + esc(gWt(r.id)) + '</code>', r: '<code>' + esc(gRd(r.id)) + '</code>' })}</p>`,
    actions: [{ label: T('common.cancel'), kind: 'secondary' }, { label: T('rl.m.discard.go'), kind: 'danger', icon: 'trash-2', onClick: () => { r.status = 'discarded'; gStopStream(); const nx = gVisible().find(x => x.def) || gVisible()[0]; G.sel = nx ? nx.id : null; G.tab = null; PC.toast(T('rl.t.discard', { id: r.id }), { icon: 'trash-2' }); gRoute(false); } }] });
}
function gModalStop(r) {
  PC.modal({ title: T('rl.m.stop.title'), width: 480, body: `<p class="text-sm text-muted" style="line-height:1.6">${T('rl.m.stop.body', { p: '<code>' + esc(gWt(r.id)) + '</code>' })}</p>`,
    actions: [{ label: T('common.cancel'), kind: 'secondary' }, { label: T('rl.m.stop.go'), kind: 'danger', icon: 'square', onClick: () => { r.status = 'stopped'; r.rerun = false; r._onDone = null; r.steps.forEach(s => { if (s.st === 'running') s.st = 'pending'; }); r._log.push({ c: 't-warn', t: '■ Stopped by you', d: 0 }); gEnd(T('rl.t.stop', { id: r.id }), 'warning'); gRoute(false); } }] });
}
function gModalApprove(r) {
  PC.modal({ title: T('rl.m.approve.title'), width: 520, body: `<p class="text-sm text-muted" style="line-height:1.6">${T('rl.m.approve.body', { b: '<code>' + esc(r.branch) + '</code>', base: '<code>develop</code>' })}</p>`,
    actions: [{ label: T('common.cancel'), kind: 'secondary' }, { label: T('rl.m.approve.go'), kind: 'primary', icon: 'git-pull-request-create', onClick: () => { r.pr = { n: 321 + Math.floor(Math.random() * 6), base: 'develop' }; PC.toast(T('rl.t.approved', { id: r.id }), { tone: 'success', icon: 'git-pull-request' }); gRoute(false); } }] });
}
document.addEventListener('click', e => {
  const run = e.target.closest('[data-grun]'); if (run) { e.preventDefault(); gSelect(run.dataset.grun); return; }
  const tab = e.target.closest('[data-gtab]'); if (tab && G.sel && !gCur().lp) { e.preventDefault(); gSetTab(tab.dataset.gtab); return; }
  const shotEl = e.target.closest('[data-gshot]'); if (shotEl) { PC.modal({ title: T('rl.vf.shot') + ' · E102', width: 760, body: `<div class="shot-lg">${gBankShot()}</div>`, actions: [{ label: T('common.close'), kind: 'secondary' }] }); return; }
  const a = e.target.closest('[data-gact]'); if (!a) return;
  const r = gCur(); if (!r) return;
  switch (a.dataset.gact) {
    case 'copy': try { navigator.clipboard && navigator.clipboard.writeText(a.dataset.v); } catch (err) {} PC.toast(T('task.t.copied'), { icon: 'copy' }); break;
    case 'vscode': PC.toast(T('rl.t.vscode', { p: esc(gWt(r.id)) }), { icon: 'code' }); break;
    case 'retry': gModalRetry(r); break;
    case 'discard': gModalDiscard(r); break;
    case 'stop': gModalStop(r); break;
    case 'approve': gModalApprove(r); break;
    case 'changes': gModalChanges(r); break;
    case 'viewpr': PC.toast('PR #' + (r.pr ? r.pr.n : ''), { icon: 'external-link' }); break;
    case 'trace': PC.toast(T('task.t.trace'), { icon: 'activity' }); break;
    case 'video': PC.toast(T('task.t.video'), { icon: 'video' }); break;
    case 'replay': if (!gLive(r)) { r._log = []; r._q = gMkLog(r).map(l => Object.assign({}, l, { step: undefined })); r._onDone = () => {}; GS.streaming = true; GS.paused = false; const t = $('gTerm'); if (t) t.innerHTML = ''; gRunCtl(); PC.toast(T('task.t.replay'), { icon: 'rotate-ccw' }); GS.timer = setTimeout(gPump, 120); } break;
    case 'pause': if (GS.streaming) { GS.paused = !GS.paused; gRunCtl(); if (GS.paused) PC.toast(T('task.t.paused'), { icon: 'pause' }); else { PC.toast(T('task.t.resumed'), { icon: 'play' }); gPump(); } } break;
  }
});

/* ===================================================== assistant */
function gIntro(r) {
  if (r.ai && r.ai.intro) return L(r.ai.intro);
  const st = gStatusOf(r), t = esc(L(r.title));
  return X(`<p>I loaded <b>${r.id}</b> · ${t}. Status: <b>${T(GST[st].k)}</b>${r.pr ? ' · PR #' + r.pr.n : ''}. What would you like to know?</p>`, `<p>Mình đã nạp <b>${r.id}</b> · ${t}. Trạng thái: <b>${T(GST[st].k)}</b>${r.pr ? ' · PR #' + r.pr.n : ''}. Bạn muốn biết điều gì?</p>`);
}
const gSugg = r => (r.ai && r.ai.sugg ? r.ai.sugg.map(L) : [T('rl.ai.s1'), T('rl.ai.s2'), T('rl.ai.s3')]);
function gAnswer(r, i) {
  if (r.ai && r.ai.ans && r.ai.ans[i]) return L(r.ai.ans[i]);
  const st = gStatusOf(r);
  if (i === 0) return L(r.sum);
  if (i === 1) return st === 'merged' ? X('<p>Nothing - this run was reviewed and merged. Evidence is still stored in the run folder.</p>', '<p>Không cần gì - lượt chạy này đã được review và merge. Bằng chứng vẫn nằm trong thư mục lượt chạy.</p>')
    : st === 'review' ? X('<p>Open <b>Verification</b> first (all tests pass), then skim <b>Changed files</b>. Pay attention to the notes the agent flagged in the Overview.</p>', '<p>Mở <b>Kiểm chứng</b> trước (mọi test đều đạt), sau đó lướt <b>File thay đổi</b>. Chú ý các lưu ý agent nêu trong Tổng quan.</p>')
      : X('<p>Nothing to review yet - the agent is still working. I will point out anything unusual in the log as it appears.</p>', '<p>Chưa có gì để review - agent vẫn đang làm. Mình sẽ chỉ ra mọi điểm bất thường trong log khi nó xuất hiện.</p>');
  return st === 'merged' ? X('<p>This run is finished. Pick the next task from the board.</p>', '<p>Lượt chạy này đã xong. Hãy chọn task tiếp theo trên bảng.</p>')
    : st === 'review' ? X('<p>Approve to open a pull request with the evidence attached, or request changes to send feedback to the agent.</p>', '<p>Duyệt để mở pull request kèm bằng chứng, hoặc yêu cầu chỉnh sửa để gửi phản hồi cho agent.</p>')
      : X('<p>Wait for the run to finish; you will be asked to review when it does.</p>', '<p>Chờ lượt chạy kết thúc; bạn sẽ được mời review khi nó xong.</p>');
}
function gSetAssistant(r) {
  PC.assistant.setContext([{ icon: 'bot', label: r.id }, { icon: 'git-branch', label: r.branch }, { icon: 'file-diff', label: gFilesSummary(r) }]);
  PC.assistant.setSuggestions(gSugg(r));
  PC.assistant.seed([{ role: 'ai', time: '11:41', tool: 'run.read ' + r.id, text: gIntro(r), card: { icon: 'bot', title: r.id + ' · ' + L(r.title), sub: T(GST[gStatusOf(r)].k), href: 'task.html?p=' + GP.id + '&run=' + r.id } }]);
}
const gEmptySugg = () => [X('What happens in Scaffolding?', 'Scaffolding làm những gì?'), X('What do I need before the first run?', 'Cần gì trước lượt chạy đầu tiên?')];
function gSetEmptyAssistant() {
  PC.assistant.setContext([{ icon: 'folder', label: GP.name.split(' — ')[0] }, { icon: 'bot', label: X('No agent runs yet', 'Chưa có lượt chạy agent') }]);
  PC.assistant.setSuggestions(gEmptySugg());
  PC.assistant.seed([{ role: 'ai', time: '11:41', text: X('<p>There are no agent runs for this project yet - it is still in the <b>Initial</b> phase. Agents start working in <b>Scaffolding</b> and <b>SDLC</b>. Chats like this one are not runs.</p>', '<p>Dự án này chưa có lượt chạy agent nào - vẫn đang ở giai đoạn <b>Khởi tạo</b>. Agent bắt đầu làm việc ở <b>Scaffolding</b> và <b>SDLC</b>. Các cuộc chat như thế này không phải lượt chạy.</p>') }]);
}
function gAsk(i) {
  const r = gCur(), d = new Date(), time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const q = r ? gSugg(r)[i] : gEmptySugg()[i];
  let ans;
  if (r) ans = gAnswer(r, i);
  else ans = i === 0 ? X('<p><b>Scaffolding</b> turns the signed-off Initial phase into a working repo foundation: repository structure, project skeleton, infrastructure as code, CI/CD pipelines, a dev container and lint &amp; test setup. Each step is an agent run (SC-01 to SC-06) you can follow here.</p>', '<p><b>Scaffolding</b> biến giai đoạn Khởi tạo đã chốt thành nền tảng repo chạy được: cấu trúc repo, project skeleton, hạ tầng dạng code, CI/CD pipeline, dev container và thiết lập lint &amp; test. Mỗi bước là một lượt chạy agent (SC-01 đến SC-06) mà bạn theo dõi được ở đây.</p>')
    : '<p>' + esc(PC.L(GP.state.scaffolding.gate)) + '. ' + esc(X('Finish the Initial phase first, then Scaffolding unlocks.', 'Hãy hoàn tất giai đoạn Khởi tạo trước, khi đó Scaffolding được mở khoá.')) + '</p>';
  PC.assistant.open(); PC.assistant.push({ role: 'user', time, text: esc(q) }); PC.assistant.reply(ans, { time });
}
function askRoute(i) { const r = gCur(); if (r && r.lp) ask(i); else gAsk(i); }

/* ===================================================== router */
function gSelect(id) {
  G.sel = id; G.tab = null;
  try { const u = new URL(location.href); u.searchParams.set('p', GP.id); u.searchParams.set('run', id); u.hash = ''; history.replaceState(null, '', u.toString()); } catch (e) { /* file:// */ }
  gRoute(true);
  const c = document.querySelector('.canvas'); if (c) c.scrollTo({ top: 0 });
}
function gRoute(fresh) {
  clearTimeout(GS.timer);
  const none = !G.runs.length;
  $('lpRoot').hidden = true; $('gRoot').hidden = true; $('emptyRoot').hidden = true;
  gRenderHead();
  if (none) { $('rlList').hidden = true; $('emptyRoot').hidden = false; gRenderEmpty(); gSetEmptyAssistant(); return; }
  $('rlList').hidden = false; gRenderList();
  const r = gCur(); if (!r) return;
  if (r.lp) { $('lpRoot').hidden = false; gStopStream(); renderAll(); setAssistant(); return; }
  $('gRoot').hidden = false;
  gInitLog(r);
  if (fresh) gStartStream(r); else if (gLive(r)) { GS.streaming = true; if (!GS.paused) GS.timer = setTimeout(gPump, 600); }
  gRenderHeader(r); gRenderLc(r); gRenderTabs(r); gRenderPanel(r);
  if (fresh || r._seed !== PC.lang) { gSetAssistant(r); r._seed = PC.lang; }
}
PC.i18n.extend({ en: { 'nav.task': 'Agent runs' }, vi: { 'nav.task': 'Lượt chạy agent' } });
PC.onReady(() => {
  G.runs = (GR[GP.id] || []).slice();
  let q = null; try { q = new URLSearchParams(location.search).get('run'); } catch (e) {}
  const hit = G.runs.find(r => r.id === q);
  G.sel = hit ? hit.id : ((G.runs.find(r => r.def) || G.runs[0] || {}).id || null);
  const h = (location.hash || '').replace('#', ''); if (['overview', 'plan', 'run', 'review'].includes(h)) S.tab = h;
  gRoute(true);
});
document.addEventListener('pc:lang', () => { const r = gCur(); gRoute(false); if (r && r.lp) return; });
  </script>
