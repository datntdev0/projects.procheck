<div class="sidebar-inner">
  <a class="sb-brand" routerLink="/projects">
    <span class="brand-mark"><img src="assets/brand/kms-mark.svg" alt="" /></span>
    <span class="brand-name" data-testid="app-name">{{ appName }}</span>
    <span class="brand-by">{{ 'app.by' | t }}</span>
  </a>

  @if (project(); as current) {
    <pc-sidebar-project-nav [id]="current.id" [dir]="current.dir" [manifest]="current.manifest" />
  } @else {
    <nav class="nav" [attr.aria-label]="'nav.main' | t">
      <div class="nav-group">
        @for (item of mainNav; track item.id) {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: !item.matchChildren }"
            [attr.data-testid]="'nav-' + item.id"
          >
            <pc-icon [name]="item.icon" />
            <span class="truncate">{{ item.label | t }}</span>
          </a>
        }
      </div>
      <pc-sidebar-project-list />
    </nav>
  }

  <div class="sidebar-footer">
    <a
      class="nav-item"
      [routerLink]="settingsNav.route"
      routerLinkActive="is-active"
      [attr.data-testid]="'nav-' + settingsNav.id"
    >
      <pc-icon [name]="settingsNav.icon" />
      <span class="truncate">{{ settingsNav.label | t }}</span>
    </a>
    <div class="sb-version">
      {{ 'app.version' | t }} <span data-testid="app-version">{{ appVersion }}</span>
    </div>
  </div>
</div>
