<nav class="crumbs" [attr.aria-label]="'shell.breadcrumb' | t">
  <a class="crumb" routerLink="/projects">
    <pc-icon name="layout-grid" [size]="14" />
    <span>{{ 'shell.home' | t }}</span>
  </a>
  @if (crumb(); as current) {
    <span class="crumb-sep">/</span>
    <span class="crumb current" aria-current="page">{{ current | t }}</span>
  }
</nav>

<button type="button" class="search-btn" data-testid="search-button" (click)="layout.openSearch()">
  <pc-icon name="search" [size]="14" />
  <span class="truncate">{{ 'shell.search' | t }}</span>
  <pc-kbd>Ctrl K</pc-kbd>
</button>

<div class="tb-actions">
  <button
    type="button"
    class="tb-btn"
    [pcTooltip]="'shell.lang' | t"
    tooltipPosition="bottom"
    data-testid="language-button"
    (click)="i18n.toggle()"
  >
    <pc-icon name="languages" [size]="14" />
    <span data-testid="language-code">{{ i18n.lang().toUpperCase() }}</span>
  </button>

  <pc-dropdown placement="bottom-end">
    <button type="button" class="tb-btn" pcDropdownTrigger [pcTooltip]="'shell.theme' | t" tooltipPosition="bottom" data-testid="theme-button">
      <pc-icon [name]="themeIcon(theme.preference())" [size]="14" />
    </button>
    <pc-menu style="width: 200px">
      <pc-menu-label>{{ 'shell.theme' | t }}</pc-menu-label>
      @for (pref of themes; track pref) {
        <button
          type="button"
          pcMenuItem
          [active]="pref === theme.preference()"
          [attr.data-testid]="'theme-' + pref"
          (click)="theme.setPreference(pref)"
        >
          <pc-icon [name]="themeIcon(pref)" />
          <span class="grow">{{ 'theme.' + pref | t }}</span>
          @if (pref === theme.preference()) {
            <pc-icon name="check" />
          }
        </button>
      }
    </pc-menu>
  </pc-dropdown>

  <div class="tb-sep"></div>

  <button
    type="button"
    class="tb-btn"
    data-testid="assistant-toggle"
    [class.is-on]="layout.assistantOpen()"
    [attr.aria-pressed]="layout.assistantOpen()"
    (click)="layout.toggleAssistant()"
  >
    <pc-icon name="sparkles" [size]="14" />
    <span>{{ 'shell.assistant' | t }}</span>
  </button>
</div>
