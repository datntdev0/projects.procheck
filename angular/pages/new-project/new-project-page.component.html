<div class="canvas-inner new-project-page" data-testid="new-project-page">
  <div class="wrap-np">
    <div class="page-header">
      <div>
        <h1>{{ 'np.h1' | t }}</h1>
        <div class="subtitle">{{ 'np.sub' | t }}</div>
      </div>
      <a pcButton variant="ghost" routerLink="/projects"><pc-icon name="x" /> {{ 'common.cancel' | t }}</a>
    </div>

    <div class="card stepper-bar">
      <pc-stepper [steps]="stepLabels()" [current]="form.step()" />
    </div>

    <div class="wiz">
      <div class="card">
        @switch (form.step()) {
          @case (0) {
            <pc-np-basics-step />
          }
          @case (1) {
            <pc-np-phase-step />
          }
          @case (2) {
            <pc-np-sources-step />
          }
          @case (3) {
            <pc-np-ai-step />
          }
        }

        <div class="wiz-foot">
          <button pcButton variant="ghost" type="button" [disabled]="form.step() === 0" (click)="form.back()">
            <pc-icon name="arrow-left" /> {{ 'np.back' | t }}
          </button>
          <div class="row">
            <span class="text-xs text-subtle">{{ 'np.step.of' | t: { a: form.step() + 1, b: stepCount } }}</span>
            @if (isLast()) {
              <button pcButton variant="ai" type="button" data-testid="np-create" [disabled]="creating()" (click)="create()">
                <pc-icon name="sparkles" /> {{ 'np.create' | t }}
              </button>
            } @else {
              <button pcButton variant="primary" type="button" data-testid="np-next" (click)="next()">
                {{ 'np.next' | t }} <pc-icon name="arrow-right" />
              </button>
            }
          </div>
        </div>
      </div>

      <pc-np-summary />
    </div>
  </div>

  <pc-np-create-dialog
    [open]="creating()"
    [progress]="progress()"
    [sourceCount]="form.sources().length"
    [error]="createError()"
    (openChange)="!$event && closeDialog()"
    (closed)="closeDialog()"
  />
</div>
