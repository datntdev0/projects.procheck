<div class="canvas-inner projects-page" data-testid="projects-page">
  <pc-page-header data-testid="projects-hero" [title]="greeting() | t" [subtitle]="'home.hero.sub' | t">
    <button pcButton pcPageActions type="button" [title]="'home.qa.recent.d' | t">
      <pc-icon name="history" /> {{ 'home.qa.recent' | t }} <pc-icon name="chevron-down" [size]="14" />
    </button>
    <a pcButton pcPageActions routerLink="/projects/open" [title]="'home.qa.import.d' | t">
      <pc-icon name="folder-open" /> {{ 'home.qa.import' | t }}
    </a>
    <a pcButton pcPageActions variant="primary" routerLink="/projects/new" [title]="'home.qa.new.d' | t">
      <pc-icon name="plus" /> {{ 'home.qa.new' | t }}
    </a>
  </pc-page-header>
</div>
