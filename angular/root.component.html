<main class="welcome-page" data-testid="welcome-page">
  <section class="welcome-card">
    <div class="welcome-logo" aria-hidden="true">P</div>
    <h1 class="welcome-title" data-testid="welcome-title">{{ appInfo()?.name ?? fallbackName }}</h1>
    <p class="welcome-tagline">Welcome! Your workspace is ready.</p>
    <p class="welcome-meta">
      Version
      <span class="welcome-version" data-testid="welcome-version">{{ appInfo()?.version ?? '—' }}</span>
    </p>
  </section>
</main>
