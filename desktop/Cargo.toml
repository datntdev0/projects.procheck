[package]
name = "procheck"
version = "0.0.0"
description = "Procheck desktop app"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
